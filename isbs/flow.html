<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>상담 스크립트 흐름</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F4F8;--sf:#fff;--ink:#1A2233;--mute:#5B6579;--ln:#DCE2EC;--ac:#2456E6;--acbg:#E6EDFD;--tg:#8A4B0F;--tgbg:#FBEBD5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151D;--sf:#1A2030;--ink:#E8ECF4;--mute:#9AA5BB;--ln:#2C3448;--ac:#7FA1FF;--acbg:#22315E;--tg:#F2C58A;--tgbg:#3A2C18}}
:root[data-theme="dark"]{--bg:#11151D;--sf:#1A2030;--ink:#E8ECF4;--mute:#9AA5BB;--ln:#2C3448;--ac:#7FA1FF;--acbg:#22315E;--tg:#F2C58A;--tgbg:#3A2C18}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 16px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Noto Sans KR",system-ui,sans-serif}
.wrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px;max-width:1080px;margin:0 auto;padding:24px 20px 80px}
nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 24px);align-self:start}
nav h1{font-size:17px;margin:0 0 4px}
nav p{margin:0 0 16px;font-size:13px;color:var(--mute);line-height:1.5}
nav a{display:flex;gap:10px;padding:9px 12px;border-radius:8px;color:var(--mute);text-decoration:none;font-size:15px;border-left:3px solid transparent}
nav a b{font-weight:500;min-width:1.2em}
nav a:hover{background:var(--sf)}
nav a.on{background:var(--sf);color:var(--ink);border-left-color:var(--ac);font-weight:700}
nav a:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
section{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:24px;margin-bottom:20px}
section h2{margin:0;font-size:21px}
.goal{margin:4px 0 16px;color:var(--mute);font-size:14px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tabs button{font:inherit;font-size:14px;padding:6px 14px;border:1px solid var(--ln);background:transparent;color:var(--ink);border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:#fff}
.say{margin:0;padding:14px 18px;border-left:4px solid var(--ac);background:var(--acbg);border-radius:0 8px 8px 0;font-size:17px;line-height:1.85}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px;font-size:14px}
.tag{background:var(--tgbg);color:var(--tg);padding:2px 10px;border-radius:6px;font-weight:500}
.tip{color:var(--mute);flex:1 1 200px}
.cp{font:inherit;font-size:13px;border:1px solid var(--ln);background:transparent;color:var(--mute);padding:3px 12px;border-radius:6px;cursor:pointer;margin-left:auto}
@media(max-width:760px){
.wrap{grid-template-columns:1fr;gap:12px;padding:12px 12px 60px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0;margin:0 -12px;padding-left:12px;padding-right:12px;overflow-x:auto;white-space:nowrap}
nav h1,nav p{display:none}nav a{display:inline-flex;border-left:0;border-bottom:3px solid transparent;border-radius:6px;padding:6px 10px}
nav a.on{border-bottom-color:var(--ac)}section{padding:18px}.say{font-size:16px}}
.btn{display:block;margin-top:12px;font:inherit;font-size:14px;border:1px solid var(--ac);background:var(--ac);color:#fff;border-radius:8px;padding:7px 14px;cursor:pointer}
.btn.g{background:transparent;color:var(--ac)}
.st{display:block;font-size:12px;color:var(--mute);margin-top:8px;line-height:1.4}
.tabs .add{border-style:dashed;color:var(--ac)}
.ed{display:grid;gap:12px}.ed label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.ed input,.ed textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;width:100%;resize:vertical}
.ed .dl{justify-self:start;font:inherit;font-size:13px;color:#C0362C;border:1px solid var(--ln);background:transparent;border-radius:6px;padding:4px 12px;cursor:pointer}
.tag:empty,.tip:empty{display:none}
@media(max-width:760px){#links,#ctl{display:contents}nav .btn{display:inline-block;margin:0 0 0 6px;padding:5px 10px}.st{display:inline;margin-left:6px}}
nav{max-height:calc(100vh - 48px);overflow-y:auto}
.n1{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font:inherit;font-weight:700;font-size:14px;color:var(--ink);background:none;border:0;padding:8px 10px 4px;margin-top:6px;cursor:pointer}
.g.cur .n1{color:var(--ac)}
.n1 b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--acbg);color:var(--ac);font-size:12px;flex:none}
nav a.n2{padding:4px 10px 4px 38px;font-size:14px;line-height:1.5}
.l3{display:none;padding:2px 0 6px 50px}.n2.on+.l3{display:block}
.n3{display:block;width:100%;text-align:left;font:inherit;font-size:12.5px;line-height:1.5;color:var(--mute);background:none;border:0;padding:2px 0;cursor:pointer}
.n3:hover{color:var(--ac)}.n3.cur{color:var(--ac);font-weight:700}
.ph{display:flex;align-items:baseline;gap:12px;margin:0 0 16px}.ph b{font-size:30px;color:var(--ac);line-height:1}
.ph h1{margin:0;font-size:24px}.ph p{margin:0;color:var(--mute);font-size:14px}
.pg{display:flex;justify-content:space-between;gap:8px}.pg .btn{display:inline-block;margin:0}
@media(max-width:760px){nav{max-height:none;overflow-x:auto}.g{display:contents}.l2{display:none}.g.cur .l2{display:contents}.l3{display:none!important}
.n1{display:inline-flex;width:auto;margin:0;padding:6px 8px}nav a.n2{padding:6px 10px;font-size:13px}html{scroll-padding-top:120px}.ph b{font-size:24px}.ph h1{font-size:20px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap">
<nav id="nav"><h1>상담 흐름</h1><p>단계를 누르면 해당 스크립트로 이동합니다. 상황에 맞는 스크립트를 골라 쓰세요.</p><div id="links"></div><div id="ctl"></div></nav>
<main id="main"></main>
</div>
<script>
// [id, 제목, 목적, [[이름, 기법, 스크립트, 팁], ...]]
var D=[
["open","오프닝 인사","회사·목적을 밝히고 통화 허락은 한 번만 구함",[
["기본","투명한 시작 + 작은 예스","안녕하세요 고객님, OO 상담사 OO입니다. 통화 내용은 정확한 안내를 위해 녹취됩니다. 인터넷·TV 가입 상품 안내드리려고 연락드렸는데, 지금 통화 괜찮으실까요?","회사명·통화 목적·녹취 고지는 회사 컴플라이언스 기준에 맞춰 확인하세요."],
["문의 고객","상호성 · 전문가 포지셔닝","문의 남겨주셔서 감사합니다. OO 상담사 OO입니다. 통화는 녹취됩니다. 문의하신 내용에 맞는 상품을 안내드리려는데, 지금 통화 괜찮으실까요?","문의 내용을 먼저 언급해 맥락을 이어갑니다."],
["바쁘다고 할 때","시간 특정","그럼 언제 다시 연락드리면 편하실까요? 짧게 끝내겠습니다.","재통화 시각은 고객이 정하게 하고, 동의 없이 반복 연락하지 마세요."]]],
["preview","질문 예고","질문 개수와 시간을 알려 부담을 낮춤",[
["기본","구조 예고","저희가 무료로 컨설팅해드리고 있는데요, 고객님께 맞는 상품을 찾으려면 세 가지만 여쭤볼게요. 1분이면 됩니다.","허락은 오프닝에서 받았으니 다시 묻지 않고 개수만 알립니다. 예고한 세 개를 넘기지 마세요."]]],
["q1","질문1 · 신규 / 변경","가입 유형 파악",[
["기본","정보 수집","첫 번째 질문이에요. 신규로 가입하시는 건지, 지금 쓰시는 통신사에서 바꾸시는 건지 여쭤봐도 될까요?","변경이면 기존 통신사와 약정 확인이 필요하지만, 세 가지 질문과 분리해 확인 사항 단계에서 묻습니다."]]],
["q2","질문2 · 무엇이 중요한가","큰 방향을 먼저 고르게 함 (돈 이야기는 나중)",[
["기본","선택 설계","두 번째 질문이에요. 제일 중요하게 보시는 게 제공되는 서비스, 즉 상품이세요? 통신사세요? 아니면 요금이나 사은품이세요?","상품은 품질 중시형, 통신사는 브랜드·결합 중시형, 요금·사은품은 비용 민감형으로 봅니다."],
["다 중요하다고 할 때","우선순위 좁히기","그럼 그중에 딱 하나만 꼽으신다면 어떤 쪽이세요?","하나만 고르게 해야 뒤의 세부 질문이 정확해집니다."]]],
["q3","질문3 · 세부 기준","선택한 방향의 세부 기준 파악 (하나만 질문)",[
["상품을 골랐을 때","니즈 구체화","안정적인 품질, 빠른 속도, TV 채널 수, 셋탑박스 기능 중에서 어떤 게 제일 중요하세요?","고른 항목을 메모해 두고 뒤에서 아까 이게 제일 중요하다고 하셨죠 하고 다시 꺼내 쓰세요."],
["통신사를 골랐을 때","사회적 증거 · 결합","가입자가 많은 통신사가 마음이 놓이세요, 아니면 지금 쓰시는 휴대폰과 결합할인이 되는 쪽이 더 중요하세요?","결합할인은 휴대폰 통신사 기준으로 확인합니다. 가입자 수는 공식 수치가 있을 때만 언급하세요."],
["요금·사은품을 골랐을 때","선택 설계","요금 절약, 요금과 혜택 균형을 맞춘 가성비, 사은품 최대 중에 어느 쪽이세요?","요금절약은 분석형, 가성비는 균형형, 최대사은품은 사은품 민감형으로 봅니다."],
["최고사은품 선택 시","앵커 재설정","좋아요, 사은품 최대로 가는 조건으로 찾아볼게요. 다만 이 경우엔 높은 요금제를 유지하는 조건이 같이 붙는 경우가 많아서, 3년 총액으로 같이 보시면 좋겠어요.","선택을 거부하지 말고 조건을 함께 풀어줍니다."]]],
["confirm","확인 사항 · 요약","정확한 안내에 필요한 정보 확인 후 요약 동의 받기",[
["변경 고객","정보 수집","정확한 안내를 위해 두 가지만 더 확인할게요. 지금 어느 통신사 쓰고 계세요? 약정은 언제쯤 끝나고, 휴대폰이랑 결합해서 쓰고 계세요?","위약금과 결합할인 계산에 필요합니다. 세 가지 질문과 별도의 확인이라고 먼저 말해두세요."],
["이용 경험","페인포인트 발굴","쓰시면서 좋았던 점이나 불편했던 점 있으셨어요?","좋았던 점도 함께 묻고, 불편은 선택 기준으로 삼습니다. 특정 통신사를 단정적으로 비하하지 마세요."],
["신규 고객","정보 수집","정확한 안내를 위해 하나만 더 확인할게요. 설치를 희망하시는 날짜나 이사 일정이 있으세요?","클로징 때 일정 선택지로 다시 씁니다."],
["질문 마무리 요약","요약 확인 (일관성)","말씀해주신 걸 정리하면 OO이 제일 중요하시고 OO도 신경 쓰신다는 거죠? 그 기준으로 골라드릴게요.","고객이 한 말을 그대로 요약해 동의를 받습니다."]]],
["offer","제안","고객 기준과 상품을 연결하고 핵심 조건을 미리 공개",[
["추천 1안 + 비교 1안","기준 연결 + 선택지 제한","아까 OO이 제일 중요하다고 하셨으니, 그 기준에 맞는 OO 상품을 먼저 추천드릴게요. 이유는 두 가지예요. 하나는 OO, 다른 하나는 OO입니다. 비교해보시라고 요금을 조금 낮춘 안도 하나 준비했어요.","안은 두 개 이내로 제한하고, 고객이 고른 기준을 첫 문장으로 씁니다."],
["핵심 조건 먼저 공개","투명성","가입 전에 조건부터 정확히 말씀드릴게요. 약정 기간은 OO, 위약금은 OO, 요금제 유지 조건은 OO, 사은품은 OO에 지급되고 환수 조건은 OO입니다.","실제 조건으로 바꿔 쓰고, 클로징 뒤에 처음 말하는 일이 없게 합니다."],
["3년 총액 제시","앵커링(총액)","월 요금은 OO원이고 3년 동안 쓰시면 총 OO원이에요. 사은품 OO원을 반영하면 실제 부담은 OO원입니다.","사은품과 요금 모두 3년 총액으로 통일합니다."]]],
["type","유형별 트랙","즉흥형·분석형·고민형 분기",[
["즉흥형","희소성(사실 기반)","이번 달 접수분에 적용되는 혜택이 있어서, 오늘 결정하시면 그 조건으로 안내드릴 수 있어요.","실제 기한·물량이 있는 혜택만 말하세요. 사실이 아니면 허위·과장 안내가 됩니다. 사은품 추가는 마지막 카드로 아껴둡니다."],
["분석형","전문가 포지셔닝","비교해보시는 게 맞아요. 표면 가격 말고 요금 유지 조건, 위약금까지 같이 보셔야 정확해서 조건 정리해서 문자로 보내드릴게요.","자료 전송과 재통화 약속을 함께 확정합니다."],
["고민형","우려 구체화","어떤 부분이 걸리세요? 가격이신지, 바꿨다가 불편할까 봐 그러신지요.","급박함을 강조하면 신뢰가 깨집니다. 비슷한 고객 사례를 들려주세요."]]],
["gift","사은품 비교 대응","사은품 대화를 총액·상품 대화로 전환",[
["기본 (3년 총지출)","앵커링(총액)","사은품 중요하죠. 그런데 더 중요한 건 3년 동안 지갑에서 실제로 나가는 총 금액이에요. 사은품을 많이 받아도 높은 요금제를 유지해야 하면 결국 더 내시게 돼요.","예: 사은품 +5만원, 6개월간 월 +2만원이면 7만원 손해."],
["타사 금액 제시","조건 확인 + 총액 통일","네, 그 정도 금액은 나올 수 있어요. 혹시 어떤 조건이었는지 여쭤봐도 될까요? 요금제 유지 기간이나 부가서비스 조건이 있었는지가 중요해서요. 저희도 조건이 있으면 먼저 말씀드릴게요. 사은품 차이가 5만원이고 월 요금이 1만원만 달라도 3년이면 36만원이라, 총액으로 같이 비교해보시면 좋겠어요.","사은품과 요금 모두 3년 총액 기준으로 말합니다. 우리 조건도 실제 기준으로 먼저 공개하세요."],
["타사 확인 질문","같은 기준 비교","다른 곳 알아보실 때 요금제 유지 기간, 부가서비스 조건, 지급 시기, 환수 조건 이 네 가지는 꼭 확인해보세요. 저희 조건도 같은 네 가지로 먼저 말씀드릴게요.","비방하지 않고 같은 기준으로 비교하게 만듭니다. 우리 조건을 먼저 공개해야 설득력이 생깁니다."],
["품질은 지역 기준으로","기준 재확인","끊김 없는 품질이 제일 중요하다고 하셨으니, 사시는 지역과 건물 기준으로 어디가 안정적인지 먼저 확인해드릴게요. 사은품은 그다음에 그 안에서 챙겨드릴게요.","통신사 우열을 단정하지 말고, 공식 수치가 있을 때만 근거로 쓰세요. 어느 통신사를 안내할 때도 쓸 수 있는 화법입니다."],
["시간 비용","손실 회피","금액 차이 때문에 여러 곳을 다시 상담받으시는 시간이 더 부담되실 수 있어요. 고객님이 말씀하신 기준에 맞는 상품으로 먼저 정리해드릴게요.","단정하지 말고 고객이 말한 기준을 다시 언급하세요."]]],
["price","가격 부담 응대","새 지출을 익숙한 지출 옆에 놓기",[
["부담 지점 확인","우려 구체화","어느 부분이 부담되세요? 월 요금이신지, 3년 총액이신지, 설치 관련 비용이신지요.","막연한 부담을 구체화해야 맞는 응대를 고를 수 있습니다."],
["기준 다시 상기","일관성 원칙","아까 OO이 제일 중요하다고 하셨잖아요. 그 부분이 해결되는 상품이라, 그 정도 차이는 감안할 만한지 같이 봐드릴게요.","질문 단계에서 고객이 고른 기준을 그대로 다시 꺼내세요."],
["공과금","멘탈 어카운팅","전기세나 가스비는 한 달에 얼마쯤 나오세요? 인터넷·TV도 온 가족이 매일 쓰는 생활 필수 요금이에요.","고객이 금액을 직접 말하게 하세요. 계절별 편차는 감안합니다."],
["휴대폰 요금","비교 앵커","휴대폰 요금은 한 달에 얼마 나오세요? 그 절반 수준으로 온 가족이 매일 쓰는 걸 해결하시는 거예요.","추가로 늘어나는 금액 기준으로 비교하면 효과적입니다."],
["배달음식","일상 소비 비교","배달 한 번에 2만원 넘잖아요. 한 달에 한 번만 덜 시키셔도 인터넷과 TV 전체가 해결되는 셈이에요.","고객이 반응하는 비교를 골라 쓰세요."],
["대안 요금제","선택권 부여","조금 낮춰드릴 수도 있는데, 그 경우엔 이런 부분이 달라져요. 어느 쪽이 더 편하세요?","달라지는 점을 숨기지 말고 함께 안내합니다."]]],
["reject","거절 응대","거절 이유를 구체화하고 다음 접점을 확보",[
["생각해볼게요","우려 구체화","네, 충분히 생각해보세요. 혹시 가장 마음에 걸리는 부분이 하나 있다면 어떤 걸까요? 그 부분만 정확히 정리해서 알려드릴게요.","막연한 불안을 구체적 반론으로 바꿉니다. 급박함을 강조하지 마세요."],
["가족과 상의","자료 전송","그럼요. 상의하실 때 보시기 편하게 조건을 문자로 정리해서 보내드릴게요. 고객님이 중요하다고 하신 기준도 같이 적을게요. 문자 보내드려도 될까요?","문자 발송 동의를 받고, 재통화 시점은 고객과 함께 정합니다."],
["지금은 필요 없어요","관계 유지","네, 알겠습니다. 약정이 끝나는 시점에 조건을 다시 비교해보시면 좋아서, 그때쯤 안내 연락드려도 될까요?","동의를 받은 경우에만 재연락합니다."]]],
["close","클로징","가입 여부가 아닌 일정·시점을 묻기",[
["가정형","가정형 클로징","그럼 설치는 이번 주 목요일이랑 금요일 중에 언제가 편하세요?","즉흥형에 적합합니다."],
["양자택일","선택지 프레이밍","이번 달부터 시작하실까요, 아니면 다음 달 초부터가 편하실까요?","고민형에 적합합니다. 강하게 밀지 않습니다."],
["재통화 약속","다음 접점 확보","조건은 문자로 정리해서 보내드릴게요. 목요일 오후에 한 번 더 연락드려도 될까요?","분석형에 적합합니다."],
["사은품 마지막 카드","양보의 단계화","제가 드릴 수 있는 범위에서 확인해볼게요.","한 번에 하나씩 제시하고, 앞 단계에서 미리 쓰지 마세요."]]],
["notice","최종 확인 · 사후 안내","조건 재확인과 접수 후 안내로 취소·환수를 예방",[
["최종 확인","투명성","접수 전에 한 번만 확인할게요. 월 요금 OO원, 약정 OO, 위약금 OO, 요금제 유지 조건 OO, 사은품 OO을 OO에 지급, 환수 조건 OO, 청약철회 안내까지 이해하신 내용과 같으실까요?","핵심 조건은 제안 단계에서 이미 말했고, 여기서는 짧게 재확인합니다."],
["사후 안내","기대 관리","접수 완료됐어요. 설치는 OO일에 기사님이 연락드리고, 사은품은 OO에 지급돼요. 궁금하신 점은 이 번호로 문의하시면 됩니다.","설치·사은품 일정을 알려주면 취소와 문의가 줄어듭니다."]]]
];
var DEF=JSON.stringify(D),K='scriptflow.v2',P='script-flow/data-v2',db=null,edit=false,sel={},tmr=0,io=null;
var links=document.getElementById('links'),ctl=document.getElementById('ctl'),main=document.getElementById('main'),stEl=document.createElement('span');
stEl.className='st';
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function ok(d){return Array.isArray(d)&&d.length>0&&d.every(function(s){return Array.isArray(s)&&s.length===4&&Array.isArray(s[3])&&s[3].length>0})}
function st(t){stEl.textContent=t}
try{var ls=JSON.parse(localStorage.getItem(K));if(ok(ls))D=ls}catch(e){}
function persist(){clearTimeout(tmr);st('저장 중…');tmr=setTimeout(async function(){
  var j=JSON.stringify(D);try{localStorage.setItem(K,j)}catch(e){}
  if(!db){st('이 브라우저에만 저장됨');return}
  try{await db.doc(P).set({json:j});st('저장됨 (공유)')}catch(e){st('이 브라우저에만 저장됨 (공유 저장 권한 없음)')}
},700)}
function rerender(){var y=window.scrollY;render();window.scrollTo({top:y,behavior:'instant'})}
async function reset(){
  if(!confirm('모든 수정 내용을 지우고 기본 스크립트로 되돌릴까요?'))return;
  D=JSON.parse(DEF);sel={};try{localStorage.removeItem(K)}catch(e){}
  if(db){try{await db.doc(P).delete()}catch(e){}}
  st('기본값으로 되돌림');rerender();
}
var P=[['도입','오프닝과 질문 예고',['open','preview']],['진단','고객 기준 파악',['q1','q2','q3','confirm']],['제안','기준에 맞는 상품 제시',['offer']],['설득·대응','고객 반응별 대응',['type','gift','price','reject']],['마무리','클로징과 확인',['close','notice']]];
var ph=0,fns={};
function byId(id){for(var i=0;i<D.length;i++)if(D[i][0]===id)return D[i]}
function secList(p){return P[p][2].map(byId).filter(Boolean)}
function mark(id){Array.prototype.forEach.call(links.querySelectorAll('.n2'),function(l){l.classList.toggle('on',l.dataset.id===id)})}
function markVar(id,k){var a=links.querySelector('.n2[data-id="'+id+'"]');if(a&&a.nextSibling)Array.prototype.forEach.call(a.nextSibling.children,function(b,j){b.classList.toggle('cur',j===k)})}
function go(p,id,k){
  if(p!==ph){ph=p;render()}
  if(id){if(k!=null&&fns[id])fns[id](k);var e=document.getElementById(id);if(e)e.scrollIntoView({block:'start'});mark(id)}
  else window.scrollTo({top:0})
}
function buildSec(s){
  var sec=el('section');sec.id=s[0];sec.appendChild(el('h2','',s[1]));sec.appendChild(el('p','goal',s[2]));
  var tabs=el('div','tabs'),body=el('div');sec.appendChild(tabs);sec.appendChild(body);
  var k=Math.min(sel[s[0]]||0,s[3].length-1);
  function show(){
    sel[s[0]]=k;var v=s[3][k];body.textContent='';markVar(s[0],k);
    Array.prototype.forEach.call(tabs.querySelectorAll('.t'),function(b,j){b.setAttribute('aria-pressed',j===k)});
    if(!edit){
      var say=el('p','say',v[2]),m=el('div','meta'),cp=el('button','cp','복사');cp.type='button';
      cp.onclick=function(){try{navigator.clipboard.writeText(say.textContent).then(function(){cp.textContent='복사됨';setTimeout(function(){cp.textContent='복사'},1200)})}catch(e){cp.textContent='복사 불가'}};
      m.appendChild(el('span','tag',v[1]));m.appendChild(el('span','tip',v[3]));m.appendChild(cp);body.appendChild(say);body.appendChild(m);return;
    }
    var f=el('div','ed');
    [['버튼 이름',0],['적용 기법',1],['스크립트',2,4],['사용 팁',3,2]].forEach(function(d){
      var l=el('label');l.appendChild(el('span','',d[0]));var x=el(d[2]?'textarea':'input');x.value=v[d[1]];if(d[2])x.rows=d[2];
      x.oninput=function(){v[d[1]]=x.value;if(d[1]===0){tabs.querySelectorAll('.t')[k].textContent=x.value||'(이름 없음)';var a=links.querySelector('.n2[data-id="'+s[0]+'"]');if(a&&a.nextSibling&&a.nextSibling.children[k])a.nextSibling.children[k].textContent=x.value||'(이름 없음)'}persist()};
      l.appendChild(x);f.appendChild(l);
    });
    if(s[3].length>1){var dl=el('button','dl','이 스크립트 삭제');dl.type='button';dl.onclick=function(){if(!confirm('이 스크립트를 삭제할까요?'))return;s[3].splice(k,1);sel[s[0]]=Math.max(0,k-1);persist();rerender()};f.appendChild(dl)}
    body.appendChild(f);
  }
  s[3].forEach(function(v,j){var b=el('button','t',v[0]||'(이름 없음)');b.type='button';b.onclick=function(){k=j;show()};tabs.appendChild(b)});
  if(edit){var ad=el('button','add','+ 스크립트 추가');ad.type='button';ad.onclick=function(){s[3].push(['새 스크립트','','','']);sel[s[0]]=s[3].length-1;persist();rerender()};tabs.appendChild(ad)}
  tabs.style.display=(s[3].length<2&&!edit)?'none':'';
  fns[s[0]]=function(k2){k=k2;show()};
  show();return sec;
}
function render(){
  links.textContent='';main.textContent='';ctl.textContent='';fns={};
  P.forEach(function(g,pi){
    var box=el('div','g'+(pi===ph?' cur':'')),h=el('button','n1');h.type='button';h.appendChild(el('b','',pi+1));h.appendChild(el('span','',g[0]));h.onclick=function(){go(pi)};box.appendChild(h);
    var ul=el('div','l2');
    secList(pi).forEach(function(s){
      var a=el('a','n2',s[1]);a.href='#'+s[0];a.dataset.id=s[0];a.onclick=function(e){e.preventDefault();go(pi,s[0])};ul.appendChild(a);
      var sub=el('div','l3');s[3].forEach(function(v,k){var b=el('button','n3',v[0]||'(이름 없음)');b.type='button';b.onclick=function(){go(pi,s[0],k)};sub.appendChild(b)});ul.appendChild(sub);
    });
    box.appendChild(ul);links.appendChild(box);
  });
  var g=P[ph],hd=el('div','ph');hd.appendChild(el('b','',ph+1));var hw=el('div');hw.appendChild(el('h1','',g[0]));hw.appendChild(el('p','',g[1]));hd.appendChild(hw);main.appendChild(hd);
  var list=secList(ph);list.forEach(function(s){main.appendChild(buildSec(s))});
  var pg=el('div','pg');
  if(ph>0){var pv=el('button','btn g','← '+P[ph-1][0]);pv.type='button';pv.onclick=function(){go(ph-1)};pg.appendChild(pv)}else pg.appendChild(el('span'));
  if(ph<P.length-1){var nx=el('button','btn',P[ph+1][0]+' →');nx.type='button';nx.onclick=function(){go(ph+1)};pg.appendChild(nx)}
  main.appendChild(pg);
  var t=el('button','btn',edit?'편집 끝내기':'스크립트 편집');t.type='button';t.onclick=function(){edit=!edit;rerender()};ctl.appendChild(t);
  if(edit){var r=el('button','btn g','기본값으로 되돌리기');r.type='button';r.onclick=reset;ctl.appendChild(r)}
  ctl.appendChild(stEl);
  if(list[0]){mark(list[0][0]);list.forEach(function(s){markVar(s[0],sel[s[0]]||0)})}
  try{if(io)io.disconnect();io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)mark(e.target.id)})},{rootMargin:'-20% 0px -70% 0px'});
    document.querySelectorAll('section').forEach(function(x){io.observe(x)})}catch(e){}
}
render();
try{if(window.claude&&claude.use){claude.use('db').then(async function(d){
  if(!d)return;db=d;
  try{var sn=await db.doc(P).get();if(sn.exists){var x=JSON.parse(sn.data().json);if(ok(x)&&!edit){D=x;rerender()}}}catch(e){}
}).catch(function(){})}}catch(e){}
</script>
</body>
</html>
