<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인생비서 CRM - 고객 상세 (MVP)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 부드러운 모달 전환을 위한 애니메이션 */
        .modal-enter { opacity: 0; transform: scale(0.95); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: all 0.2s ease-out; }
    </style>
</head>
<body class="bg-gray-100 font-sans p-6 text-gray-800">

    <div class="max-w-5xl mx-auto space-y-6">
        
        <!-- 1. 고객 헤더 영역 -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <div class="flex justify-between items-start">
                <div>
                    <div class="flex items-center gap-3 mb-2">
                        <h1 class="text-2xl font-bold text-gray-900" id="customer-name">홍길동</h1>
                        <span class="bg-yellow-100 text-yellow-800 text-xs px-2.5 py-0.5 rounded-full font-semibold border border-yellow-200">가족 대표 (F-100)</span>
                        <span id="derived-status" class="bg-blue-100 text-blue-800 text-xs px-2.5 py-0.5 rounded-full font-semibold border border-blue-200 transition-colors">유치 (파생상태)</span>
                    </div>
                    <div class="text-gray-600 text-sm space-y-1">
                        <p id="customer-phone">연락처: 010-1234-5678</p>
                        <p>고객 ID: C-001</p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button class="bg-gray-800 text-white px-4 py-2 rounded-lg text-sm hover:bg-gray-700 transition" onclick="alert('정보 수정 페이지로 이동합니다.')">정보 수정</button>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- 왼쪽 컬럼: 가족 그룹 관리 -->
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold text-gray-800">가족 구성원</h2>
                        <button onclick="openFamilyModal()" class="text-blue-600 text-sm font-semibold hover:underline">+ 가족 추가</button>
                    </div>
                    <!-- 가족 리스트 렌더링 영역 -->
                    <ul id="family-list" class="space-y-3">
                        <!-- JS에서 동적 생성됨 -->
                    </ul>
                </div>
            </div>

            <!-- 오른쪽 컬럼: 계약 및 상품 관리 -->
            <div class="lg:col-span-2 space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-xl font-bold text-gray-800">계약 내역</h2>
                    <button onclick="openContractModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-700 transition shadow-sm">+ 신규 계약 접수</button>
                </div>
                <!-- 계약 리스트 렌더링 영역 -->
                <div id="contract-list" class="space-y-6">
                    <!-- JS에서 동적 생성됨 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 모달: 가족 추가 -->
    <div id="family-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white p-6 rounded-xl shadow-lg w-96 transform transition-all">
            <h3 class="text-lg font-bold mb-4">가족 구성원 추가</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">이름</label>
                    <input type="text" id="new-fam-name" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="예: 홍철수">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">관계</label>
                    <select id="new-fam-relation" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="자녀">자녀</option>
                        <option value="배우자">배우자</option>
                        <option value="부모">부모</option>
                        <option value="형제/자매">형제/자매</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">연락처</label>
                    <input type="text" id="new-fam-phone" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="010-0000-0000">
                </div>
            </div>
            <div class="mt-6 flex justify-end gap-2">
                <button onclick="closeFamilyModal()" class="px-4 py-2 text-sm text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200">취소</button>
                <button onclick="addFamily()" class="px-4 py-2 text-sm text-white bg-blue-600 rounded-lg hover:bg-blue-700">등록하기</button>
            </div>
        </div>
    </div>

    <!-- 모달: 신규 계약 접수 -->
    <div id="contract-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white p-6 rounded-xl shadow-lg w-[32rem] transform transition-all">
            <h3 class="text-lg font-bold mb-4">신규 계약 접수</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">통신사 (Carrier)</label>
                    <select id="new-contract-carrier" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="LG U+">LG U+</option>
                        <option value="SKT">SKT</option>
                        <option value="KT">KT</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">가입 상품 (다중 선택 가능)</label>
                    <div class="flex gap-4 mt-2">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" id="chk-internet" class="w-4 h-4 text-blue-600" checked>
                            <span class="text-sm">인터넷</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" id="chk-tv" class="w-4 h-4 text-blue-600" checked>
                            <span class="text-sm">TV</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" id="chk-mobile" class="w-4 h-4 text-blue-600">
                            <span class="text-sm">모바일(유심)</span>
                        </label>
                    </div>
                </div>
            </div>
            <div class="mt-6 flex justify-end gap-2">
                <button onclick="closeContractModal()" class="px-4 py-2 text-sm text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200">취소</button>
                <button onclick="addContract()" class="px-4 py-2 text-sm text-white bg-blue-600 rounded-lg hover:bg-blue-700">접수하기</button>
            </div>
        </div>
    </div>

    <!-- 애플리케이션 상태 및 로직 (MVP용 Vanilla JS) -->
    <script>
        // --- 1. 초기 데이터 상태 (State) ---
        const state = {
            family: [
                { id: 'C-001', name: '홍길동', relation: '대표', phone: '010-1234-5678', isRep: true },
                { id: 'C-002', name: '김영희', relation: '배우자', phone: '010-8765-4321', isRep: false }
            ],
            contracts: [
                {
                    id: 'CT-8812', carrier: 'KT', receivedAt: '2026-09-15 14:30',
                    items: [
                        { id: 'IT-9901', name: '인터넷 (500M)', proceeding: '설치완료', payment: '지급완료', recovery: '없음' },
                        { id: 'IT-9902', name: 'TV (베이직)', proceeding: '설치완료', payment: '지급보류', recovery: '없음' }
                    ]
                },
                {
                    id: 'CT-8813', carrier: 'SKT', receivedAt: '2026-08-10 10:00',
                    items: [
                        { id: 'IT-9903', name: '인터넷 (100M)', proceeding: '접수취소', payment: '-', recovery: '-', cancelReason: '설치불가' }
                    ]
                }
            ]
        };

        // --- 2. 렌더링 함수 ---
        
        // 가족 목록 렌더링
        function renderFamily() {
            const list = document.getElementById('family-list');
            list.innerHTML = state.family.map(member => `
                <li class="${member.isRep ? 'bg-blue-50 border-blue-100' : 'border-gray-100 hover:bg-gray-50'} flex justify-between items-center p-3 border rounded-lg cursor-pointer transition">
                    <div class="flex items-center gap-2">
                        <span class="font-semibold text-gray-900">${member.name}</span>
                        ${member.isRep 
                            ? `<span class="text-xs text-gray-500">(대표)</span>` 
                            : `<span class="text-xs bg-gray-200 text-gray-700 px-2 py-0.5 rounded">${member.relation}</span>`
                        }
                    </div>
                    <span class="text-sm text-gray-600">${member.phone}</span>
                </li>
            `).join('');
        }

        // 뱃지 색상 유틸리티 함수
        function getBadgeColors(type, status) {
            if(status === '설치완료' || status === '지급완료') return 'bg-green-50 border-green-200 text-green-700 label-green';
            if(status === '접수취소') return 'bg-red-50 border-red-200 text-red-700 label-red';
            if(status === '지급보류') return 'bg-yellow-50 border-yellow-200 text-yellow-700 label-yellow';
            if(status === '없음' || status === '-') return 'bg-gray-50 border-gray-200 text-gray-500 label-gray';
            return 'bg-blue-50 border-blue-200 text-blue-700 label-blue'; // 기본 (대기 등)
        }
        
        // 라벨 색상 보정용 (Tailwind 클래스 매핑 대신 직관적인 처리를 위해 추가 클래스 활용)
        function getLabelColorClass(status) {
            if(status === '설치완료' || status === '지급완료') return 'text-green-600';
            if(status === '접수취소') return 'text-red-600';
            if(status === '지급보류') return 'text-yellow-600';
            if(status === '없음' || status === '-') return 'text-gray-400';
            return 'text-blue-600';
        }

        // 계약 및 상품 목록 렌더링
        function renderContracts() {
            const list = document.getElementById('contract-list');
            
            list.innerHTML = state.contracts.map((contract, cIdx) => {
                // 파생 상태 계산: 모든 아이템이 '접수취소'인가?
                const isAllCancelled = contract.items.length > 0 && contract.items.every(item => item.proceeding === '접수취소');
                
                return `
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden ${isAllCancelled ? 'opacity-75' : ''} transition-all">
                    <div class="bg-gray-50 p-4 border-b border-gray-200 flex justify-between items-center">
                        <div>
                            <div class="flex items-center gap-2">
                                <h3 class="font-bold text-gray-900">계약 #${contract.id}</h3>
                                ${isAllCancelled 
                                    ? `<span class="bg-red-100 text-red-800 text-xs px-2 py-0.5 rounded font-semibold">계약취소 (파생상태)</span>` 
                                    : `<span class="bg-indigo-100 text-indigo-800 text-xs px-2 py-0.5 rounded font-semibold">접수완료</span>`
                                }
                            </div>
                            <p class="text-xs text-gray-500 mt-1">접수완료일: ${contract.receivedAt}</p>
                        </div>
                        <span class="text-sm font-bold text-gray-700">${contract.carrier}</span>
                    </div>
                    
                    <div class="p-4 space-y-4">
                        ${contract.items.map((item, iIdx) => `
                            <div class="flex items-center justify-between ${iIdx !== contract.items.length - 1 ? 'border-b border-gray-100 pb-4' : ''}">
                                <div>
                                    <p class="font-semibold text-gray-800 ${item.proceeding === '접수취소' ? 'line-through text-gray-400' : ''}">${item.name}</p>
                                    ${item.cancelReason 
                                        ? `<p class="text-xs text-red-500 mt-0.5">취소사유: ${item.cancelReason}</p>` 
                                        : `<p class="text-xs text-gray-500 mt-0.5">Item ID: ${item.id}</p>`
                                    }
                                </div>
                                <div class="flex gap-2 text-sm text-center">
                                    <div class="px-3 py-1 rounded border ${getBadgeColors('진행', item.proceeding)}">
                                        <p class="text-[10px] mb-0.5 ${getLabelColorClass(item.proceeding)}">진행 축</p>
                                        <span class="font-bold">${item.proceeding}</span>
                                    </div>
                                    <div class="px-3 py-1 rounded border ${getBadgeColors('지급', item.payment)} ${item.payment === '지급보류' ? 'cursor-pointer hover:bg-yellow-100' : ''}" 
                                         ${item.payment === '지급보류' ? `onclick="completePayment(${cIdx}, ${iIdx})"` : ''}
                                         title="${item.payment === '지급보류' ? '클릭하여 지급완료 처리' : ''}">
                                        <p class="text-[10px] mb-0.5 ${getLabelColorClass(item.payment)}">지급 축</p>
                                        <span class="font-bold">${item.payment}</span>
                                    </div>
                                    <div class="px-3 py-1 rounded border ${getBadgeColors('환수', item.recovery)}">
                                        <p class="text-[10px] mb-0.5 ${getLabelColorClass(item.recovery)}">환수 축</p>
                                        <span class="font-bold">${item.recovery}</span>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                `;
            }).join('');
            
            updateDerivedCustomerStatus();
        }

        // 고객 상태 파생 (유치 여부 계산)
        function updateDerivedCustomerStatus() {
            // receivedAt 이 존재하는 계약이 하나라도 있으면서, 계약취소가 아닌 건이 있는지 확인 (또는 이력 자체로 판정)
            // 기획안에 따르면: "하위 계약 중 received_at이 null이 아닌 계약이 하나라도 있으면 유치"
            const hasReceivedContract = state.contracts.some(c => c.receivedAt !== null);
            const statusBadge = document.getElementById('derived-status');
            
            if (hasReceivedContract) {
                statusBadge.textContent = '유치 (파생상태)';
                statusBadge.className = 'bg-blue-100 text-blue-800 text-xs px-2.5 py-0.5 rounded-full font-semibold border border-blue-200 transition-colors';
            } else {
                statusBadge.textContent = '상담중';
                statusBadge.className = 'bg-gray-100 text-gray-800 text-xs px-2.5 py-0.5 rounded-full font-semibold border border-gray-200 transition-colors';
            }
        }

        // --- 3. 인터랙션 액션 함수 ---

        // 가족 추가 모달 제어
        function openFamilyModal() {
            document.getElementById('family-modal').classList.remove('hidden');
        }
        function closeFamilyModal() {
            document.getElementById('family-modal').classList.add('hidden');
            document.getElementById('new-fam-name').value = '';
            document.getElementById('new-fam-phone').value = '';
        }
        function addFamily() {
            const name = document.getElementById('new-fam-name').value;
            const relation = document.getElementById('new-fam-relation').value;
            const phone = document.getElementById('new-fam-phone').value;

            if(!name || !phone) return alert('이름과 연락처를 입력해주세요.');

            // 상태 업데이트
            state.family.push({
                id: 'C-' + Math.floor(Math.random() * 1000).toString().padStart(3, '0'),
                name, relation, phone, isRep: false
            });
            
            renderFamily(); // 리렌더링
            closeFamilyModal();
        }

        // 계약 접수 모달 제어
        function openContractModal() {
            document.getElementById('contract-modal').classList.remove('hidden');
        }
        function closeContractModal() {
            document.getElementById('contract-modal').classList.add('hidden');
        }
        function addContract() {
            const carrier = document.getElementById('new-contract-carrier').value;
            const chkInt = document.getElementById('chk-internet').checked;
            const chkTv = document.getElementById('chk-tv').checked;
            const chkMob = document.getElementById('chk-mobile').checked;

            if(!chkInt && !chkTv && !chkMob) return alert('가입 상품을 1개 이상 선택해주세요.');

            const newItems = [];
            if(chkInt) newItems.push({ id: 'IT-'+Math.floor(Math.random()*10000), name: '인터넷 (1G)', proceeding: '대기', payment: '지급요청', recovery: '없음' });
            if(chkTv) newItems.push({ id: 'IT-'+Math.floor(Math.random()*10000), name: 'TV (프리미엄)', proceeding: '대기', payment: '대기', recovery: '없음' });
            if(chkMob) newItems.push({ id: 'IT-'+Math.floor(Math.random()*10000), name: '모바일 (5G)', proceeding: '대기', payment: '대기', recovery: '없음' });

            // 오늘 날짜 포맷팅
            const now = new Date();
            const timeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

            state.contracts.unshift({
                id: 'CT-' + Math.floor(Math.random() * 10000),
                carrier: carrier,
                receivedAt: timeStr,
                items: newItems
            });

            renderContracts();
            closeContractModal();
        }

        // 상태값 동적 변경 (지급보류 -> 지급완료 처리 시뮬레이션)
        function completePayment(contractIndex, itemIndex) {
            if(confirm('해당 상품의 지급을 완료 처리하시겠습니까?')) {
                state.contracts[contractIndex].items[itemIndex].payment = '지급완료';
                renderContracts(); // 변경 후 리렌더링
            }
        }

        // --- 4. 초기화 ---
        renderFamily();
        renderContracts();

    </script>
</body>
</html>
