<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인생비서 CRM - 고객 상세 MVP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 버튼 클릭 시 반응(애니메이션)을 위한 CSS */
        .status-btn { cursor: pointer; transition: all 0.2s; user-select: none; }
        .status-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); opacity: 0.9; }
        .status-btn:active { transform: translateY(0); }
    </style>
</head>
<body class="bg-gray-100 font-sans p-6">
    <div class="max-w-5xl mx-auto space-y-6">
        
        <!-- 1. 고객 헤더 -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <div class="flex justify-between items-start">
                <div>
                    <div class="flex items-center gap-3 mb-2">
                        <h1 class="text-2xl font-bold text-gray-900">홍길동</h1>
                        <span class="bg-yellow-100 text-yellow-800 text-xs px-2.5 py-0.5 rounded-full font-semibold border border-yellow-200">가족 대표 (F-100)</span>
                        <span class="bg-blue-100 text-blue-800 text-xs px-2.5 py-0.5 rounded-full font-semibold border border-blue-200">유치 (파생상태)</span>
                    </div>
                    <div class="text-gray-600 text-sm space-y-1">
                        <p>연락처: 010-1234-5678</p>
                        <p>고객 ID: C-001</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- 2. 왼쪽: 가족 구성원 영역 -->
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold text-gray-800">가족 구성원</h2>
                        <button onclick="addFamilyMember()" class="text-blue-600 text-sm font-semibold hover:underline">+ 가족 추가</button>
                    </div>
                    <ul id="familyList" class="space-y-3">
                        <li class="flex justify-between items-center p-3 bg-blue-50 border border-blue-100 rounded-lg">
                            <div class="flex items-center gap-2">
                                <span class="font-semibold text-gray-900">홍길동</span>
                                <span class="text-xs text-gray-500">(대표)</span>
                            </div>
                            <span class="text-sm text-gray-600">010-1234-5678</span>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- 3. 오른쪽: 계약 및 상품 관리 영역 -->
            <div class="lg:col-span-2 space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-xl font-bold text-gray-800">계약 내역</h2>
                    <button onclick="openContractModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-700 transition">+ 신규 계약 접수</button>
                </div>
                
                <!-- 계약 목록이 추가되는 컨테이너 -->
                <div id="contractList" class="space-y-6"></div>
            </div>
        </div>
    </div>

    <!-- 신규 계약 접수 모달 (상품 세부 선택 기능 추가) -->
    <div id="contractModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-xl w-96 shadow-lg">
            <h3 class="text-lg font-bold mb-4">신규 계약 접수</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">통신사</label>
                    <select id="newCarrier" class="w-full border-gray-300 rounded-lg border p-2">
                        <option value="KT">KT</option>
                        <option value="SKT">SKT</option>
                        <option value="LG U+">LG U+</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">인터넷 상품</label>
                    <select id="newInternet" class="w-full border-gray-300 rounded-lg border p-2">
                        <option value="none">선택안함</option>
                        <option value="인터넷 (100M)">인터넷 (100M)</option>
                        <option value="인터넷 (500M)">인터넷 (500M)</option>
                        <option value="인터넷 (1G)">인터넷 (1기가)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">TV 상품</label>
                    <select id="newTv" class="w-full border-gray-300 rounded-lg border p-2">
                        <option value="none">선택안함</option>
                        <option value="TV (베이직)">TV (베이직)</option>
                        <option value="TV (라이트)">TV (라이트)</option>
                        <option value="TV (프리미엄)">TV (프리미엄)</option>
                    </select>
                </div>
            </div>
            <div class="mt-6 flex justify-end gap-2">
                <button onclick="closeContractModal()" class="px-4 py-2 text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200">취소</button>
                <button onclick="submitContract()" class="px-4 py-2 text-white bg-blue-600 rounded-lg hover:bg-blue-700">접수완료</button>
            </div>
        </div>
    </div>

    <script>
        // 상태값 순환 로직 정의
        const STATUS_FLOW = {
            'proceeding': ['대기', '설치완료', '접수취소'],
            'payment': ['대기', '지급요청', '지급보류', '지급완료'],
            'recovery': ['없음', '환수요청', '환수보류', '환수진행', '환수완료']
        };

        // 상태별 꼬리표 색상 매핑
        const STATUS_COLORS = {
            '대기': 'bg-gray-50 border-gray-200 text-gray-600',
            '설치완료': 'bg-green-50 border-green-200 text-green-700',
            '접수취소': 'bg-red-50 border-red-200 text-red-700',
            '지급요청': 'bg-blue-50 border-blue-200 text-blue-700',
            '지급보류': 'bg-yellow-50 border-yellow-200 text-yellow-700',
            '지급완료': 'bg-green-50 border-green-200 text-green-700',
            '없음': 'bg-gray-50 border-gray-200 text-gray-400',
            '환수요청': 'bg-orange-50 border-orange-200 text-orange-700',
            '환수보류': 'bg-red-50 border-red-200 text-red-700',
            '환수진행': 'bg-purple-50 border-purple-200 text-purple-700',
            '환수완료': 'bg-gray-200 border-gray-300 text-gray-800'
        };

        let contractCount = 8812;
        let itemCount = 9901;

        // 버튼 클릭 시 상태 변경을 처리하는 함수
        function cycleStatus(btn, type) {
            const currentStatus = btn.getAttribute('data-status');
            const flow = STATUS_FLOW[type];
            let nextIndex = (flow.indexOf(currentStatus) + 1) % flow.length;
            const nextStatus = flow[nextIndex];
            
            btn.setAttribute('data-status', nextStatus);
            btn.querySelector('.status-val').innerText = nextStatus;
            
            // Tailwind 클래스 교체로 색상 실시간 업데이트
            btn.className = `status-btn border px-3 py-1 rounded text-center min-w-[70px] ${STATUS_COLORS[nextStatus]}`;
        }

        // 가족 추가 프롬프트
        function addFamilyMember() {
            const name = prompt("가족 이름을 입력하세요 (예: 김영희)");
            if(!name) return;
            const phone = prompt("연락처를 입력하세요 (예: 010-8765-4321)");
            
            const li = document.createElement('li');
            li.className = "flex justify-between items-center p-3 border border-gray-100 rounded-lg hover:bg-gray-50";
            li.innerHTML = `
                <div class="flex items-center gap-2">
                    <span class="font-semibold text-gray-900">${name}</span>
                    <span class="text-xs bg-gray-200 text-gray-700 px-2 py-0.5 rounded">구성원</span>
                </div>
                <span class="text-sm text-gray-600">${phone || '번호없음'}</span>
            `;
            document.getElementById('familyList').appendChild(li);
        }

        function openContractModal() { document.getElementById('contractModal').classList.remove('hidden'); }
        function closeContractModal() { document.getElementById('contractModal').classList.add('hidden'); }

        // 신규 계약 데이터 UI에 추가
        function submitContract() {
            const carrier = document.getElementById('newCarrier').value;
            const internet = document.getElementById('newInternet').value;
            const tv = document.getElementById('newTv').value;

            if (internet === 'none' && tv === 'none') {
                alert('최소 1개의 상품을 선택해야 합니다.');
                return;
            }

            contractCount++;
            const dateStr = new Date().toLocaleString('ko-KR', {
                year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute:'2-digit'
            });

            let productsHTML = '';
            if (internet !== 'none') productsHTML += createProductHTML(internet);
            if (tv !== 'none') productsHTML += createProductHTML(tv);

            const contractHTML = `
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="bg-gray-50 p-4 border-b border-gray-200 flex justify-between items-center">
                        <div>
                            <div class="flex items-center gap-2">
                                <h3 class="font-bold text-gray-900">계약 #CT-${contractCount}</h3>
                                <span class="bg-indigo-100 text-indigo-800 text-xs px-2 py-0.5 rounded font-semibold">접수완료</span>
                            </div>
                            <p class="text-xs text-gray-500 mt-1">접수완료일: ${dateStr}</p>
                        </div>
                        <span class="text-sm font-bold text-gray-700">${carrier}</span>
                    </div>
                    <div class="p-4 space-y-4">
                        ${productsHTML}
                    </div>
                </div>
            `;

            document.getElementById('contractList').insertAdjacentHTML('afterbegin', contractHTML);
            closeContractModal();
        }

        // 개별 상품 카드 생성 (클릭 가능한 상태 버튼 포함)
        function createProductHTML(name) {
            itemCount++;
            return `
                <div class="flex items-center justify-between border-b border-gray-100 pb-4 last:border-0 last:pb-0">
                    <div>
                        <p class="font-semibold text-gray-800">${name}</p>
                        <p class="text-xs text-gray-500">Item ID: IT-${itemCount}</p>
                    </div>
                    <div class="flex gap-2 text-sm">
                        <!-- '축' 단어 삭제 및 클릭 이벤트(cycleStatus) 바인딩 -->
                        <div onclick="cycleStatus(this, 'proceeding')" data-status="대기" class="status-btn border px-3 py-1 rounded text-center min-w-[70px] ${STATUS_COLORS['대기']}">
                            <p class="text-[10px] opacity-70 mb-0.5">진행</p>
                            <span class="font-bold status-val">대기</span>
                        </div>
                        <div onclick="cycleStatus(this, 'payment')" data-status="대기" class="status-btn border px-3 py-1 rounded text-center min-w-[70px] ${STATUS_COLORS['대기']}">
                            <p class="text-[10px] opacity-70 mb-0.5">지급</p>
                            <span class="font-bold status-val">대기</span>
                        </div>
                        <div onclick="cycleStatus(this, 'recovery')" data-status="없음" class="status-btn border px-3 py-1 rounded text-center min-w-[70px] ${STATUS_COLORS['없음']}">
                            <p class="text-[10px] opacity-70 mb-0.5">환수</p>
                            <span class="font-bold status-val">없음</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // 초기 테스트 데이터 렌더링
        window.onload = () => {
            document.getElementById('newInternet').value = '인터넷 (500M)';
            document.getElementById('newTv').value = 'TV (베이직)';
            submitContract();
            
            // 첫 번째 렌더링된 아이템의 상태를 시각적 데모를 위해 임의로 변경
            const btns = document.querySelectorAll('.status-btn');
            if(btns.length >= 3) {
                cycleStatus(btns[0], 'proceeding'); // 대기 -> 설치완료
                cycleStatus(btns[1], 'payment');    // 대기 -> 지급요청
                cycleStatus(btns[1], 'payment');    // 지급요청 -> 지급보류
            }
        };
    </script>
</body>
</html>
