<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>휴대폰 요금제 페이백 및 가성비 자동 계산기</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 20px; background-color: #f8f9fa; color: #333; }
        h2 { color: #2c3e50; }
        table { width: 100%; border-collapse: collapse; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; font-size: 14px; }
        th { background-color: #34495e; color: white; }
        input { width: 90%; padding: 6px; text-align: right; box-sizing: border-box; font-size: 14px; }
        .input-text { text-align: left; }
        .result-good { background-color: #e8f8f5; color: #117a65; font-weight: bold; }
        .result-bad { background-color: #ffdede; color: #c0392b; font-weight: bold; }
        .btn-container { margin-top: 15px; }
        button { background-color: #3498db; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-size: 14px; }
        button:hover { background-color: #2980b9; }
        .desc { font-size: 13px; color: #666; margin-top: 5px; }
    </style>
</head>
<body>

    <h2>📱 휴대폰 요금제 페이백 및 가성비 자동 계산기</h2>
    <p class="desc">요금과 수수료를 입력하면 6개월 추가 요금과 회사의 최소 마진을 고려하여 추천 여부를 자동으로 판단합니다.</p>
    
    <div class="btn-container">
        <button onclick="addRow()">+ 요금제 행 추가하기</button>
        <button onclick="calculate()" style="background-color: #2ecc71;">계산하기 새로고침</button>
    </div>

    <table id="calcTable">
        <thead>
            <tr>
                <th>요금제명</th>
                <th>월요금 (원)</th>
                <th>총 수수료 (원)</th>
                <th>원래 쓰던 요금 (원)</th>
                <th>6개월 추가 요금 (원)</th>
                <th>회사 최소 목표 마진 (원)</th>
                <th>추천 최대 페이백 (상한선)</th>
                <th>최종 판단 및 가성비</th>
                <th>삭제</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- 기본 예시 행 -->
            <tr>
                <td><input type="text" class="input-text" value="베이직 100"></td>
                <td><input type="number" class="monthly-fee" value="100000" oninput="calculate()"></td>
                <td><input type="number" class="commission" value="460000" oninput="calculate()"></td>
                <td><input type="number" class="base-fee" value="45000" oninput="calculate()"></td>
                <td class="extra-fee">0</td>
                <td><input type="number" class="target-margin" value="150000" oninput="calculate()"></td>
                <td class="max-payback">0</td>
                <td class="judgement">-</td>
                <td><button onclick="removeRow(this)" style="background-color:#e74c3c; padding:4px 8px;">삭제</button></td>
            </tr>
            <tr>
                <td><input type="text" class="input-text" value="라이트 59"></td>
                <td><input type="number" class="monthly-fee" value="59000" oninput="calculate()"></td>
                <td><input type="number" class="commission" value="410000" oninput="calculate()"></td>
                <td><input type="number" class="base-fee" value="45000" oninput="calculate()"></td>
                <td class="extra-fee">0</td>
                <td><input type="number" class="target-margin" value="150000" oninput="calculate()"></td>
                <td class="max-payback">0</td>
                <td class="judgement">-</td>
                <td><button onclick="removeRow(this)" style="background-color:#e74c3c; padding:4px 8px;">삭제</button></td>
            </tr>
            <tr>
                <td><input type="text" class="input-text" value="초이스 130"></td>
                <td><input type="number" class="monthly-fee" value="130000" oninput="calculate()"></td>
                <td><input type="number" class="commission" value="490000" oninput="calculate()"></td>
                <td><input type="number" class="base-fee" value="45000" oninput="calculate()"></td>
                <td class="extra-fee">0</td>
                <td><input type="number" class="target-margin" value="150000" oninput="calculate()"></td>
                <td class="max-payback">0</td>
                <td class="judgement">-</td>
                <td><button onclick="removeRow(this)" style="background-color:#e74c3c; padding:4px 8px;">삭제</button></td>
            </tr>
        </tbody>
    </table>

    <script>
        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",") + "원";
        }

        function calculate() {
            const rows = document.querySelectorAll("#tableBody tr");
            
            rows.forEach(row => {
                const monthlyFee = parseFloat(row.querySelector(".monthly-fee").value) || 0;
                const commission = parseFloat(row.querySelector(".commission").value) || 0;
                const baseFee = parseFloat(row.querySelector(".base-fee").value) || 0;
                const targetMargin = parseFloat(row.querySelector(".target-margin").value) || 0;

                // 6개월 추가 요금 = (월요금 - 원래쓰던요금) * 6
                const extraFee = Math.max(0, (monthlyFee - baseFee) * 6);
                
                // 추천 최대 페이백 = 총 수수료 - 회사 최소 목표 마진
                const maxPayback = commission - targetMargin;

                // 결과 출력
                row.querySelector(".extra-fee").innerText = formatNumber(extraFee);
                row.querySelector(".max-payback").innerText = formatNumber(maxPayback);

                const judgementTd = row.querySelector(".judgement");
                
                // 판단 로직: 최대 페이백이 추가 요금보다 많으면 추천, 아니면 비추천
                if (maxPayback >= extraFee && maxPayback > 0) {
                    judgementTd.innerText = "추천 (이득 🟢)";
                    judgementTd.className = "judgement result-good";
                } else {
                    judgementTd.innerText = "비추천 (손해 🔴)";
                    judgementTd.className = "judgement result-bad";
                }
            });
        }

        function addRow() {
            const tableBody = document.getElementById("tableBody");
            const newRow = document.createElement("tr");
            newRow.innerHTML = `
                <td><input type="text" class="input-text" value="새 요금제"></td>
                <td><input type="number" class="monthly-fee" value="50000" oninput="calculate()"></td>
                <td><input type="number" class="commission" value="300000" oninput="calculate()"></td>
                <td><input type="number" class="base-fee" value="45000" oninput="calculate()"></td>
                <td class="extra-fee">0</td>
                <td><input type="number" class="target-margin" value="150000" oninput="calculate()"></td>
                <td class="max-payback">0</td>
                <td class="judgement">-</td>
                <td><button onclick="removeRow(this)" style="background-color:#e74c3c; padding:4px 8px;">삭제</button></td>
            `;
            tableBody.appendChild(newRow);
            calculate();
        }

        function removeRow(button) {
            const row = button.closest("tr");
            row.remove();
        }

        // 페이지 로드 시 초기 계산 실행
        window.onload = calculate;
    </script>

</body>
</html>
