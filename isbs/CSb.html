<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>통신사별 요금 및 가입 혜택 비교 설계 (홈)</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: #f7f5f0;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        /* 상단 네비게이션 */
        .top-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
            align-items: center;
        }
        .nav-btn {
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid #ccc;
            background-color: #e9e5dc;
            color: #555;
        }
        .nav-btn.active {
            background-color: #333;
            color: #fff;
            border-color: #333;
        }
        .user-info-area {
            margin-left: auto;
            font-size: 13px;
            color: #666;
        }
        .logout-btn {
            padding: 5px 12px;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 8px;
        }

        /* 메인 레이아웃 컨테이너 */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            background: #fdfbf7;
            border: 1px solid #e3decb;
            border-radius: 8px;
            padding: 30px;
        }

        /* 헤더 타이틀 */
        .header-title-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 25px;
            border-bottom: 1px solid #e3decb;
            padding-bottom: 20px;
        }
        .subtitle {
            font-size: 11px;
            color: #888;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .main-title {
            font-size: 24px;
            font-weight: bold;
            color: #222;
            margin-bottom: 8px;
        }
        .desc {
            font-size: 13px;
            color: #666;
        }
        .reflect-btn {
            background-color: #2e8b57;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }

        /* 상단 설정 영역 전체 컨테이너 (고객정보 패널 스타일과 통일) */
        .settings-main-panel {
            background: #fff;
            border: 1px solid #e3decb;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .settings-main-title {
            font-size: 17px;
            font-weight: bold;
            color: #222;
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 2px solid #333;
        }

        /* 인터넷 / TV 2분할 그리드 */
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        /* 개별 패널 ([인터넷], [TV]) 스타일 */
        .setting-group-box {
            background: #fff;
            border: 1px solid #e3decb;
            border-radius: 6px;
            padding: 20px;
            position: relative;
        }
        
        /* 패널 타이틀 영역 */
        .box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #333;
        }
        .setting-group-title {
            font-size: 17px;
            font-weight: bold;
            color: #222;
            margin: 0;
        }

        /* On/Off 토글 스위치 스타일 */
        .toggle-switch {
            display: flex;
            background: #ddd;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #ccc;
        }
        .toggle-btn {
            background: #eee;
            border: none;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            color: #666;
        }
        .toggle-btn.active {
            background: #333;
            color: #fff;
        }

        /* 옵션 버튼 그룹 스타일 */
        .option-group {
            margin-bottom: 15px;
        }
        .option-group:last-child {
            margin-bottom: 0;
        }
        .option-label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #555;
            margin-bottom: 5px;
        }
        .btn-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .opt-btn {
            padding: 8px 16px;
            font-size: 13px;
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 4px;
            cursor: pointer;
            color: #444;
        }
        .opt-btn.active {
            background-color: #d9822b;
            color: #fff;
            border-color: #c07020;
            font-weight: bold;
        }

        /* 비활성화 상태 스타일 */
        .disabled-box {
            opacity: 0.4;
            pointer-events: none;
        }

        /* 카드 비교 영역 (예시) */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        .card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
        }
        .card-header {
            background: #334155;
            color: white;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-body {
            padding: 15px;
            font-size: 12px;
        }
        .price-text {
            font-size: 18px;
            font-weight: bold;
            color: #111;
            margin-bottom: 15px;
            border-bottom: 1px dashed #ddd;
            padding-bottom: 10px;
        }
        .spec-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            color: #555;
        }
    </style>
</head>
<body>

    <!-- 상단 네비게이션 -->
    <div class="top-nav">
        <button class="nav-btn">고객상담</button>
        <button class="nav-btn active">상품설계(홈)</button>
        <button class="nav-btn">상품설계(모바일)</button>
        <button class="nav-btn">가입진행</button>
        <div class="user-info-area">
            meo0623@naver.com <button class="logout-btn">로그아웃</button>
        </div>
    </div>

    <!-- 메인 컨테이너 -->
    <div class="main-container">
        
        <!-- 타이틀 영역 -->
        <div class="header-title-area">
            <div>
                <div class="subtitle">Product Design & Comparison</div>
                <div class="main-title">통신사별 요금 및 가입 혜택 비교 설계 (홈)</div>
                <div class="desc">속도와 TV 요금제 옵션을 선택하고, 각 통신사 카드를 다중 선택하여 CS 상담 화면으로 반영하세요.</div>
            </div>
            <button class="reflect-btn">✨ 상품 반영</button>
        </div>

        <!-- 상단 설정 영역 (인터넷, TV 2분할 패널) -->
        <div class="settings-main-panel">
            <div class="settings-main-title">인터넷 · TV 설정</div>
            
            <div class="settings-grid">
                <!-- 왼쪽 패널: 인터넷 -->
                <div class="setting-group-box">
                    <div class="box-header">
                        <div class="setting-group-title">인터넷</div>
                    </div>
                    
                    <div class="option-group">
                        <span class="option-label">인터넷 속도</span>
                        <div class="btn-row">
                            <button class="opt-btn">100M</button>
                            <button class="opt-btn active">500M</button>
                            <button class="opt-btn">1기가</button>
                        </div>
                    </div>

                    <div class="option-group" style="margin-top: 20px;">
                        <span class="option-label">공유기 (Wi-Fi)</span>
                        <div class="btn-row">
                            <button class="opt-btn">미포함</button>
                            <button class="opt-btn active">포함</button>
                        </div>
                    </div>
                </div>

                <!-- 오른쪽 패널: TV -->
                <div class="setting-group-box" id="tvSettingBox">
                    <div class="box-header">
                        <div class="setting-group-title">TV</div>
                        <div class="toggle-switch">
                            <button class="toggle-btn active" id="tvOnBtn" onclick="setTvToggle(true)">On</button>
                            <button class="toggle-btn" id="tvOffBtn" onclick="setTvToggle(false)">Off</button>
                        </div>
                    </div>
                    
                    <div id="tvContentGroup">
                        <div class="option-group">
                            <span class="option-label">TV 요금제</span>
                            <div class="btn-row">
                                <button class="opt-btn">저가형</button>
                                <button class="opt-btn active">기본형</button>
                                <button class="opt-btn">고급형</button>
                            </div>
                        </div>

                        <div class="option-group" style="margin-top: 20px;">
                            <span class="option-label">TV 셋탑박스</span>
                            <div class="btn-row">
                                <button class="opt-btn active">기본형</button>
                                <button class="opt-btn">고급형/AI</button>
                                <button class="opt-btn">사운드바</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 하단 통신사 카드 비교 영역 (예시) -->
        <div class="cards-grid">
            <div class="card">
                <div class="card-header">KT / 에센스 <input type="checkbox"></div>
                <div class="card-body">
                    <div class="price-text">48,400 원 <span style="font-size:11px; font-weight:normal; color:#666;">/ 월</span></div>
                    <div class="spec-row"><span>인터넷</span> <span>500M (33,000원)</span></div>
                    <div class="spec-row"><span>└ 공유기</span> <span>포함 (1,100원)</span></div>
                    <div class="spec-row"><span>TV요금제</span> <span>에센스 (19,140원)</span></div>
                    <div class="spec-row"><span>└ 셋탑박스</span> <span>기가지니A (3,300원)</span></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // TV 설정 On/Off 토글 기능
        function setTvToggle(isOn) {
            const onBtn = document.getElementById('tvOnBtn');
            const offBtn = document.getElementById('tvOffBtn');
            const tvContent = document.getElementById('tvContentGroup');

            if (isOn) {
                onBtn.classList.add('active');
                offBtn.classList.remove('active');
                tvContent.classList.remove('disabled-box');
            } else {
                offBtn.classList.add('active');
                onBtn.classList.remove('active');
                tvContent.classList.add('disabled-box');
            }
        }
    </script>
</body>
</html>
