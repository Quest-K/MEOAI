<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인생비서 - 고객 컨택 현황 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex h-screen overflow-hidden">

    <!-- 사이드바 -->
    <aside class="w-72 bg-white border-r border-slate-200 flex flex-col justify-between z-10 shrink-0">
        <div>
            <div class="p-5 border-b border-slate-100 flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2.5 rounded-xl shadow-md shadow-blue-200">
                    <i class="fa-solid fa-headset text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight text-slate-900">인생비서 CS</h1>
                    <p class="text-xs text-slate-400 font-medium">고객 컨택 및 상담 관리</p>
                </div>
            </div>

            <nav class="p-4 space-y-2">
                <a href="#" class="flex items-center px-3.5 py-2.5 rounded-xl text-sm font-semibold bg-blue-50 text-blue-600 border border-blue-100 shadow-sm">
                    <i class="fa-solid fa-address-book mr-2.5 text-blue-500"></i> 고객 컨택 현황
                </a>
                <a href="https://quest-k.github.io/MEOAI/isbs/CS1.html" target="_blank" class="flex items-center px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100 transition-all">
                    <i class="fa-solid fa-desktop mr-2.5 text-slate-400"></i> CS 메인 프로그램 <i class="fa-solid fa-arrow-up-right-from-square ml-auto text-[10px] text-slate-400"></i>
                </a>
            </nav>
        </div>
        <div class="p-4 border-t border-slate-100 bg-slate-50/50 text-xs text-slate-500 flex justify-between items-center">
            <span>CS 연동 모듈</span>
            <span class="font-mono text-[10px] text-slate-400">v1.2.0</span>
        </div>
    </aside>

    <!-- 메인 콘텐츠 영역 -->
    <main class="flex-1 flex flex-col min-w-0 overflow-hidden bg-slate-50">
        
        <!-- 상단 헤더 -->
        <header class="bg-white border-b border-slate-200 px-8 py-5 flex flex-wrap items-center justify-between gap-4 shrink-0">
            <div>
                <h2 class="text-xl font-bold text-slate-800">고객 컨택 현황 관리</h2>
                <p class="text-xs text-slate-500 mt-1">CS1.html 연동 데이터 기반 실시간 고객 상태 및 상담예약 관리</p>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openModal('add')" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-semibold shadow-sm transition-all flex items-center">
                    <i class="fa-solid fa-plus mr-1.5"></i> 신규 컨택 등록
                </button>
            </div>
        </header>

        <!-- 대시보드 본문 -->
        <div class="flex-1 overflow-y-auto p-8 custom-scrollbar space-y-6">

            <!-- 상태별 필터 탭 & 검색바 -->
            <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm flex flex-wrap items-center justify-between gap-4">
                <!-- 상태별 조회 버튼 탭 -->
                <div class="flex items-center space-x-1 bg-slate-100 p-1 rounded-xl text-xs font-medium overflow-x-auto">
                    <button onclick="filterStatus('all')" id="tab-all" class="filter-tab px-3.5 py-2 rounded-lg bg-blue-600 text-white font-semibold shadow-sm transition-all">전체보기</button>
                    <button onclick="filterStatus('신규접수')" id="tab-신규접수" class="filter-tab px-3.5 py-2 rounded-lg text-slate-600 hover:bg-white transition-all">신규접수</button>
                    <button onclick="filterStatus('부재중')" id="tab-부재중" class="filter-tab px-3.5 py-2 rounded-lg text-slate-600 hover:bg-white transition-all">부재중</button>
                    <button onclick="filterStatus('상담예약')" id="tab-상담예약" class="filter-tab px-3.5 py-2 rounded-lg text-slate-600 hover:bg-white transition-all">상담예약</button>
                    <button onclick="filterStatus('가입완료')" id="tab-가입완료" class="filter-tab px-3.5 py-2 rounded-lg text-slate-600 hover:bg-white transition-all">가입완료</button>
                    <button onclick="filterStatus('보류취소')" id="tab-보류취소" class="filter-tab px-3.5 py-2 rounded-lg text-slate-600 hover:bg-white transition-all">보류/취소</button>
                </div>

                <!-- 검색창 -->
                <div class="relative w-64">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                        <i class="fa-solid fa-magnifying-glass text-xs"></i>
                    </span>
                    <input type="text" id="search-input" oninput="handleSearch()" placeholder="연락처, 상품명 검색..." class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-blue-500">
                </div>
            </div>

            <!-- 고객 컨택 테이블 카드 -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 text-[11px] uppercase tracking-wider font-bold">
                                <th class="py-3.5 px-6">고객명 / 연락처</th>
                                <th class="py-3.5 px-4">상태값</th>
                                <th class="py-3.5 px-4">안내상품</th>
                                <th class="py-3.5 px-4">상담예약일시</th>
                                <th class="py-3.5 px-4">최종수정 값</th>
                                <th class="py-3.5 px-6 text-right">관리</th>
                            </tr>
                        </thead>
                        <tbody id="contact-table-body" class="divide-y divide-slate-100 text-xs text-slate-700">
                            <!-- JS 렌더링 -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <!-- 등록/수정 모달 -->
    <div id="contact-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
            <div class="flex justify-between items-center pb-4 mb-4 border-b border-slate-100">
                <h3 id="modal-title" class="font-bold text-slate-800 text-base">신규 컨택 정보 등록</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="contact-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="modal-index">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">고객명</label>
                        <input type="text" id="modal-name" required placeholder="홍길동" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">연락처</label>
                        <input type="text" id="modal-phone" required placeholder="010-0000-0000" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">상태값</label>
                        <select id="modal-status" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 bg-white">
                            <option value="신규접수">신규접수</option>
                            <option value="부재중">부재중</option>
                            <option value="상담예약">상담예약</option>
                            <option value="가입완료">가입완료</option>
                            <option value="보류취소">보류/취소</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">안내상품</label>
                        <input type="text" id="modal-product" required placeholder="SKT 인터넷 + 베이직 TV" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">상담예약일시</label>
                    <input type="datetime-local" id="modal-reservation" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 bg-white">
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-semibold rounded-xl transition-all">취소</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-xl shadow-sm transition-all">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 초기 샘플 데이터 (CS1.html 연동 기준 구조)
        const defaultContacts = [
            { name: "김민수", phone: "010-1234-5678", status: "상담예약", product: "KT 기가인터넷 (500M) + TV베이직", reservation: "2026-09-29T14:00", updated: "2026-09-28 11:30" },
            { name: "박지영", phone: "010-9876-5432", status: "신규접수", product: "LG U+ 와이파이 기본형", reservation: "", updated: "2026-09-28 12:15" },
            { name: "이준호", phone: "010-5555-4444", status: "가입완료", product: "SKT 브로드밴드 1G + 올인원TV", reservation: "2026-09-27T10:00", updated: "2026-09-27 16:40" },
            { name: "정서연", phone: "010-7777-8888", status: "부재중", product: "KT 에센스 인터넷", reservation: "2026-09-29T10:30", updated: "2026-09-28 09:10" },
            { name: "한민우", phone: "010-3333-2222", status: "보류취소", product: "LG헬로비전 알뜰결합", reservation: "", updated: "2026-09-26 15:20" }
        ];

        let contacts = JSON.parse(localStorage.getItem('isbs_contact_list_v1')) || defaultContacts;
        let currentFilter = 'all';
        let searchQuery = '';

        function saveData() {
            localStorage.setItem('isbs_contact_list_v1', JSON.stringify(contacts));
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('contact-table-body');
            tbody.innerHTML = '';

            let filtered = contacts.filter(item => {
                const matchesStatus = (currentFilter === 'all' || item.status === currentFilter);
                const matchesSearch = item.phone.includes(searchQuery) || item.name.includes(searchQuery) || item.product.includes(searchQuery);
                return matchesStatus && matchesSearch;
            });

            if(filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-slate-400">조건에 일치하는 고객 컨택 내역이 없습니다.</td></tr>`;
                return;
            }

            filtered.forEach((item) => {
                // 원래 인덱스 찾기
                const originalIndex = contacts.findIndex(c => c.phone === item.phone);

                let statusBadge = '';
                if(item.status === '가입완료') statusBadge = '<span class="px-2.5 py-1 bg-emerald-50 text-emerald-600 border border-emerald-200 rounded-md font-semibold text-[11px]">가입완료</span>';
                else if(item.status === '상담예약') statusBadge = '<span class="px-2.5 py-1 bg-blue-50 text-blue-600 border border-blue-200 rounded-md font-semibold text-[11px]">상담예약</span>';
                else if(item.status === '부재중') statusBadge = '<span class="px-2.5 py-1 bg-amber-50 text-amber-600 border border-amber-200 rounded-md font-semibold text-[11px]">부재중</span>';
                else if(item.status === '신규접수') statusBadge = '<span class="px-2.5 py-1 bg-indigo-50 text-indigo-600 border border-indigo-200 rounded-md font-semibold text-[11px]">신규접수</span>';
                else statusBadge = '<span class="px-2.5 py-1 bg-slate-100 text-slate-500 border border-slate-200 rounded-md font-semibold text-[11px]">보류/취소</span>';

                const row = `
                    <tr class="hover:bg-slate-50/80 transition-all">
                        <td class="py-3.5 px-6 font-medium text-slate-900">
                            <div>${item.name}</div>
                            <div class="text-[11px] text-slate-400 font-mono">${item.phone}</div>
                        </td>
                        <td class="py-3.5 px-4">${statusBadge}</td>
                        <td class="py-3.5 px-4 text-slate-600">${item.product}</td>
                        <td class="py-3.5 px-4 text-slate-600 font-mono text-[11px]">${item.reservation ? item.reservation.replace('T', ' ') : '<span class="text-slate-300">미예약</span>'}</td>
                        <td class="py-3.5 px-4 text-slate-400 font-mono text-[11px]">${item.updated}</td>
                        <td class="py-3.5 px-6 text-right space-x-1">
                            <button onclick="openModal('edit', ${originalIndex})" class="p-1.5 text-slate-400 hover:text-blue-600 rounded transition-all" title="수정"><i class="fa-solid fa-pen text-xs"></i></button>
                            <button onclick="deleteContact(${originalIndex})" class="p-1.5 text-slate-400 hover:text-rose-600 rounded transition-all" title="삭제"><i class="fa-solid fa-trash text-xs"></i></button>
                        </td>
                    </tr>
                `;
                tbody.insertAdjacentHTML('beforeend', row);
            });
        }

        function filterStatus(status) {
            currentFilter = status;
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.remove('bg-blue-600', 'text-white', 'font-semibold', 'shadow-sm');
                tab.classList.add('text-slate-600');
            });
            document.getElementById(`tab-${status}`).classList.add('bg-blue-600', 'text-white', 'font-semibold', 'shadow-sm');
            document.getElementById(`tab-${status}`).classList.remove('text-slate-600');
            renderTable();
        }

        function handleSearch() {
            searchQuery = document.getElementById('search-input').value.trim();
            renderTable();
        }

        let modalMode = 'add';
        let editingIdx = null;

        function openModal(mode, index = null) {
            modalMode = mode;
            editingIdx = index;
            const modal = document.getElementById('contact-modal');
            const title = document.getElementById('modal-title');

            if(mode === 'add') {
                title.innerText = "신규 컨택 정보 등록";
                document.getElementById('modal-name').value = '';
                document.getElementById('modal-phone').value = '';
                document.getElementById('modal-status').value = '신규접수';
                document.getElementById('modal-product').value = '';
                document.getElementById('modal-reservation').value = '';
            } else {
                title.innerText = "컨택 정보 수정";
                const item = contacts[index];
                document.getElementById('modal-name').value = item.name;
                document.getElementById('modal-phone').value = item.phone;
                document.getElementById('modal-status').value = item.status;
                document.getElementById('modal-product').value = item.product;
                document.getElementById('modal-reservation').value = item.reservation || '';
            }
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('contact-modal').classList.add('hidden');
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('modal-name').value;
            const phone = document.getElementById('modal-phone').value;
            const status = document.getElementById('modal-status').value;
            const product = document.getElementById('modal-product').value;
            const reservation = document.getElementById('modal-reservation').value;

            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            const updated = `${yyyy}-${mm}-${dd} ${hh}:${min}`;

            const newItem = { name, phone, status, product, reservation, updated };

            if(modalMode === 'add') {
                contacts.unshift(newItem);
            } else {
                contacts[editingIdx] = newItem;
            }

            closeModal();
            saveData();
        }

        function deleteContact(index) {
            if(confirm("정말 해당 컨택 내역을 삭제하시겠습니까?")) {
                contacts.splice(index, 1);
                saveData();
            }
        }

        window.onload = function() {
            renderTable();
        };
    </script>
</body>
</html>
