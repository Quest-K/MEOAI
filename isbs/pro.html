<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고객 컨택 리스트</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e1e8ed;
        }
        th {
            background-color: #3498db;
            color: white;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f8fafc;
        }
        .status-badge {
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-ing { background-color: #fff3cd; color: #856404; }
        .status-done { background-color: #d4edda; color: #155724; }
        .status-hold { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="container">
    <h2>📞 고객 컨택 리스트</h2>
    <table>
        <thead>
            <tr>
                <th>고객명</th>
                <th>회사명</th>
                <th>연락처</th>
                <th>이메일</th>
                <th>최근 컨택일</th>
                <th>상태</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>김철수</td>
                <td>(주)가나다상사</td>
                <td>010-1234-5678</td>
                <td>chulsoo@ganada.com</td>
                <td>2026-09-20</td>
                <td><span class="status-badge status-ing">진행중</span></td>
            </tr>
            <tr>
                <td>영희</td>
                <td>(주)미래테크</td>
                <td>010-9876-5432</td>
                <td>younghee@mirae.com</td>
                <td>2026-09-18</td>
                <td><span class="status-badge status-done">완료</span></td>
            </tr>
            <tr>
                <td>박민수</td>
                <td>한국글로벌</td>
                <td>010-5555-4444</td>
                <td>minsoo@korea.com</td>
                <td>2026-09-15</td>
                <td><span class="status-badge status-hold">보류</span></td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
