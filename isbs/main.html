<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사업 진행 현황</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<!-- Supabase JS SDK 라이브러리 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#F1F4F8;--sf:#fff;--ink:#1A2233;--mute:#5B6579;--ln:#DCE2EC;--ac:#2456E6;--acbg:#E6EDFD;
--s0:#8792A6;--s1:#2456E6;--s2:#1F8A5B;--s3:#B7791F;--red:#C0362C;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151D;--sf:#1A2030;--ink:#E8ECF4;--mute:#9AA5BB;--ln:#2C3448;--ac:#7FA1FF;--acbg:#22315E;--s0:#8B96AB;--s1:#7FA1FF;--s2:#4CC28E;--s3:#E2B45F;--red:#FF8A80}}
:root[data-theme="dark"]{--bg:#11151D;--sf:#1A2030;--ink:#E8ECF4;--mute:#9AA5BB;--ln:#2C3448;--ac:#7FA1FF;--acbg:#22315E;--s0:#8B96AB;--s1:#7FA1FF;--s2:#4CC28E;--s3:#E2B45F;--red:#FF8A80}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 16px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans KR",system-ui,sans-serif}
main{max-width:1080px;margin:0 auto;padding:24px 20px 80px}
h1{margin:0;font-size:24px}.sub{margin:2px 0 0;color:var(--mute);font-size:14px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}
.info-group{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.st{font-size:12px;color:var(--mute)}
.last-update{font-size:12px;color:var(--ac);font-weight:500}
.ov{display:flex;align-items:center;gap:16px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:16px 20px;margin-bottom:14px}
.ov b{font-size:34px;line-height:1;color:var(--ac);min-width:88px}
.bar{height:8px;border-radius:99px;background:var(--ln);overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--s2)}
.ov small{display:block;color:var(--mute);font-size:13px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chips button{font:inherit;font-size:14px;padding:5px 14px;border:1px solid var(--ln);background:transparent;color:var(--ink);border-radius:999px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:20px}
.tile{text-align:left;font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px 14px;cursor:pointer}
.tile:hover{border-color:var(--ac)}
.tile .n{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}
.tile .bar{margin:8px 0 4px;display:block;flex:none}.tile small{color:var(--mute);font-size:12px}
.pr{font-size:11px;font-weight:500;padding:1px 8px;border-radius:6px;background:var(--acbg);color:var(--ac);white-space:nowrap;align-self:center}
.pr.p0{background:#FBE3E0;color:var(--red)}
details{background:var(--sf);border:1px solid var(--ln);border-radius:12px;margin-bottom:10px}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 18px;font-weight:700;flex-wrap:wrap}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";color:var(--mute);width:1em}details[open]>summary::before{content:"▾"}
summary .bar{max-width:160px;flex:1 1 90px}summary small{color:var(--mute);font-weight:400;font-size:13px}
.bd{padding:0 18px 16px}.bd>p{margin:0 0 10px;color:var(--mute);font-size:13px}
.r{display:grid;grid-template-columns:minmax(0,1fr) 92px 76px 110px 140px 32px;gap:8px;padding:8px 0 8px 10px;border-top:1px solid var(--ln);border-left:4px solid var(--s0)}
.r.s1{border-left-color:var(--s1)}.r.s2{border-left-color:var(--s2)}.r.s3{border-left-color:var(--s3)}
.r input,.r select{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:5px 8px;min-width:0;width:100%}
.r.s2 .t{text-decoration:line-through;color:var(--mute)}
.r .nt{grid-column:1/-1;font-size:13px}
.r .late{color:var(--red);border-color:var(--red)}
.r .x{font:inherit;border:0;background:none;color:var(--mute);cursor:pointer;font-size:16px}
.add,.rs{font:inherit;font-size:13px;border:1px dashed var(--ac);color:var(--ac);background:transparent;border-radius:8px;padding:5px 14px;cursor:pointer;margin-top:10px}
.rs{border:1px solid var(--ln);color:var(--mute);margin-top:20px}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media(max-width:760px){main{padding:14px 12px 60px}.r{grid-template-columns:1fr 1fr 32px}.r .t{grid-column:1/-1}.ov b{font-size:26px;min-width:64px}.info-group{align-items:flex-start}}
</style>
</head>
<body>
<main>
<div class="top">
  <div>
    <h1>사업 진행 현황</h1>
    <p class="sub">카테고리별 할 일의 상태, 우선순위, 담당, 기한을 관리합니다. 수정하면 Supabase DB로 실시간 저장됩니다.</p>
  </div>
  <div class="info-group">
    <span class="st" id="st"></span>
    <span class="last-update" id="lastUpdate"></span>
  </div>
</div>
<div id="app"></div>
</main>
<script>
// Supabase 프로젝트 연결 정보
var SUPABASE_URL = 'https://jhfhpumhifyhauuoinxc.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpoZmhwdW1oaWZ5aGF1dW9pbnhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MDE2NTMsImV4cCI6MjEwMzk3NzY1M30.euXk3eXtUVvEQRDGgcLhvX3JhVlpv9D7fZUEDr0i8yA';
var _supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

var SN=['미착수','진행중','완료','보류'],PN=['높음','중간','낮음'];

var RAW=[
["고객 흐름 (퍼널·상태값)",0,"상태값 정의, 단계 전환 규칙, 이탈 사유",[["퍼널 상태값 5개 그룹으로 개편",2,0],["상태 간 이동 규칙표 작성",2,0],["이탈·종결 사유 분류 확정",2,1],["재접촉 규칙(고객부재 횟수·기한) 정리",2,1],["구/신 상태값 매핑표 작성",2,2]]],
["상담 지원 프로그램",0,"상품 추천, 고객 이력 작성, 3년 총액 비교",[["적정사은품 계산기 (기본 60% + 가산, 만원 절사)",2,0],["추천상품 화면 개선 (4분할 그리드, +유심 통합, 버튼 개선)",2,1],["경품고시제 항목(읽기 전용) 반영",2,1],["고객 이력 입력 및 4단계 위저드 구축",2,0],["3년 총액 비교 기능 및 요금 산출",2,1]]],
["고객 안내 스크립트",1,"단계별 멘트, 반론·거절 응대, 버전 관리",[["스크립트 흐름 HTML 1차 (진단/제안/대응/마무리)",2,0],["상담 시나리오별 조건 및 상품 파라미터 매핑",1,0],["수정 승인·이력 관리 방식 정하기",0,1],["스크립트별 성과 태깅",0,2],["상담원 현장 테스트와 피드백 반영",0,1]]],
["사은품·수수료·정산",0,"사은품 정책, 경품고시제, 지급·환수 관리",[["적정사은품 정책 변경 이력 관리",0,1],["경품고시제 한도 관리",1,0],["지급·환수 담당자·기한·금액 관리 (자동감지)",2,0],["수수료 정산과 권한별 노출 범위",1,1]]],
["상품·정책 데이터",0,"요금·결합할인, 유지 조건, 프로모션 기한",[["통신사별 요금·결합할인표",1,0],["약정·위약금·요금제 유지 조건표",0,0],["프로모션 시작·종료일 관리",0,1],["계산기·추천상품·스크립트 데이터 동기화",1,0]]],
["상담원 운영·품질",1,"교육, 롤플레이, 녹취 점검, 성과 관리",[["신규 상담원 교육 자료",0,1],["롤플레이 시나리오 (즉흥/분석/고민형)",2,1],["녹취 점검표",0,1],["성과 지표와 코칭 주기",0,2]]],
["컴플라이언스·고객 보호",0,"녹취·개인정보, 문구 점검, 청약철회, 민원",[["녹취·회사 고지 문구 컴플라이언스 확인",0,0],["개인정보 보관·파기·접근 권한 기준",0,0],["문자·재통화 동의 기록 방식 및 알림톡 연동",2,1],["광고·안내 문구 점검 목록",0,1],["청약철회·민원 처리 절차",0,1]]],
["성과 분석·사후관리",1,"전환율, 유형별 성공률, 설치·재접촉 관리",[["퍼널 단계별 전환율 대시보드 구축",2,1],["유형별·스크립트별 성공률 분석",0,2],["설치·사은품 지급 사후 안내 알림",2,1],["약정 만료 재접촉 일정 관리",0,2]]]
];

var C=RAW.map(function(c){return{n:c[0],p:c[1],d:c[2],t:c[3].map(function(x){return{t:x[0],s:x[1],p:x[2],o:'',u:'',m:''}})}});
var DEF=JSON.stringify(C),K='progress.v2',filt=-1,openMap={},tmr=0;
var app=document.getElementById('app'),stEl=document.getElementById('st'),upEl=document.getElementById('lastUpdate');
var d0=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);

function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function ok(d){return Array.isArray(d)&&d.length>0&&d.every(function(c){return c&&typeof c.n==='string'&&Array.isArray(c.t)})}
function st(t){stEl.textContent=t}

// 날짜 포맷 함수 (YYYY. MM. DD. HH:mm)
function formatDate(isoStr){
  var d = isoStr ? new Date(isoStr) : new Date();
  if(isNaN(d.getTime())) return '';
  var pad = function(n){ return n < 10 ? '0' + n : n; };
  return d.getFullYear() + '. ' + pad(d.getMonth() + 1) + '. ' + pad(d.getDate()) + '. ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function setUpdateText(isoStr){
  var formatted = formatDate(isoStr);
  if(formatted) upEl.textContent = '최종 수정: ' + formatted;
}

// 로컬 스토리지 데이터 복원
try{var ls=JSON.parse(localStorage.getItem(K));if(ok(ls))C=ls}catch(e){}

// Supabase DB 저장
function persist(){
  clearTimeout(tmr);
  st('저장 중…');
  tmr=setTimeout(async function(){
    var nowIso = new Date().toISOString();
    var j=JSON.stringify(C);
    try{localStorage.setItem(K,j)}catch(e){}
    
    if(!_supabase){
      st('이 브라우저에만 저장됨 (Supabase 미연동)');
      setUpdateText(nowIso);
      return;
    }
    
    try{
      var res = await _supabase
        .from('pm_progress_status')
        .upsert({ key: 'main_progress', data: C, updated_at: nowIso }, { onConflict: 'key' });
      
      if(res.error) throw res.error;
      st('저장됨 (Supabase 공유)');
      setUpdateText(nowIso);
    }catch(e){
      console.error('Supabase Save Error:', e);
      st('이 브라우저에만 저장됨 (DB 저장 실패)');
    }
  },700);
}

// Supabase DB 데이터 불러오기
async function loadFromSupabase(){
  if(!_supabase) return;
  st('공유 DB 동기화 중…');
  try{
    var res = await _supabase
      .from('pm_progress_status')
      .select('data, updated_at')
      .eq('key', 'main_progress')
      .maybeSingle();
    
    if(res.data && res.data.data && ok(res.data.data)){
      C = res.data.data;
      try{localStorage.setItem(K, JSON.stringify(C))}catch(e){}
      render();
      st('공유 DB 동기화 완료');
      if(res.data.updated_at) setUpdateText(res.data.updated_at);
    } else {
      st('공유 DB 준비 완료');
    }
  }catch(e){
    console.error('Supabase Load Error:', e);
    st('로컬 데이터 사용 중');
  }
}

function rerender(){var y=window.scrollY;render();window.scrollTo(0,y)}
function late(t){return t.u&&t.s!==2&&t.s!==3&&t.u<d0}
function pct(a){a=a.filter(function(t){return t.s!==3});return a.length?Math.round(a.filter(function(t){return t.s===2}).length/a.length*100):0}
function cnt(a,s){return a.filter(function(t){return t.s===s}).length}
function bar(p){var b=el('span','bar'),i=el('i');i.style.width=p+'%';b.appendChild(i);return b}
function sel(list,v,fn){var s=el('select');list.forEach(function(x,i){var o=el('option','',x);o.value=i;s.appendChild(o)});s.value=v;s.onchange=function(){fn(+s.value)};return s}
function inp(v,ph,fn,type){var i=el('input');if(type)i.type=type;i.value=v||'';if(ph)i.placeholder=ph;i.oninput=function(){fn(i.value)};return i}

function render(){
  app.textContent='';
  var all=[];C.forEach(function(c){all=all.concat(c.t)});
  var hold=cnt(all,3),lateN=all.filter(late).length;
  
  var ov=el('div','ov');ov.appendChild(el('b','',pct(all)+'%'));
  var w=el('div');w.style.flex='1';w.appendChild(bar(pct(all)));
  w.appendChild(el('small','','전체 '+all.length+'건 중 완료 '+cnt(all,2)+' · 진행중 '+cnt(all,1)+' · 미착수 '+cnt(all,0)+' · 보류 '+hold+(lateN?' · 기한 지연 '+lateN+'건':'')));
  ov.appendChild(w);app.appendChild(ov);
  
  var ch=el('div','chips');
  [[-1,'전체 '+all.length]].concat(SN.map(function(n,i){return[i,n+' '+cnt(all,i)]})).forEach(function(f){
    var b=el('button','',f[1]);b.type='button';b.setAttribute('aria-pressed',filt===f[0]);b.onclick=function(){filt=f[0];rerender()};ch.appendChild(b)});
  app.appendChild(ch);
  
  var tl=el('div','tiles');
  C.forEach(function(c,i){
    var b=el('button','tile');b.type='button';var n=el('div','n');n.appendChild(el('span','',c.n));n.appendChild(el('span','pr p'+c.p,PN[c.p]));b.appendChild(n);
    b.appendChild(bar(pct(c.t)));b.appendChild(el('small','','완료 '+cnt(c.t,2)+'/'+c.t.length+' · 진행중 '+cnt(c.t,1)+' · '+pct(c.t)+'%'));
    b.onclick=function(){openMap[i]=true;rerender();var e=document.getElementById('c'+i);if(e)e.scrollIntoView()};tl.appendChild(b)});
  app.appendChild(tl);
  
  C.forEach(function(c,i){
    var dt=el('details');dt.id='c'+i;dt.open=!!openMap[i];dt.ontoggle=function(){openMap[i]=dt.open};
    var sm=el('summary');sm.appendChild(el('span','',c.n));sm.appendChild(el('span','pr p'+c.p,PN[c.p]));sm.appendChild(bar(pct(c.t)));
    sm.appendChild(el('small','','완료 '+cnt(c.t,2)+'/'+c.t.length+' · '+pct(c.t)+'%'));dt.appendChild(sm);
    var bd=el('div','bd');bd.appendChild(el('p','',c.d));
    
    c.t.forEach(function(t,j){
      if(filt>=0&&t.s!==filt)return;
      var r=el('div','r s'+t.s),ti=inp(t.t,'할 일',function(v){t.t=v;persist()});ti.className='t';
      r.appendChild(ti);
      r.appendChild(sel(SN,t.s,function(v){t.s=v;persist();rerender()}));
      r.appendChild(sel(PN,t.p,function(v){t.p=v;persist()}));
      r.appendChild(inp(t.o,'담당',function(v){t.o=v;persist()}));
      var du=inp(t.u,'',function(v){t.u=v;persist()},'date');du.title='기한';if(late(t))du.className='late';du.onchange=rerender;r.appendChild(du);
      var x=el('button','x','✕');x.type='button';x.setAttribute('aria-label','삭제');x.onclick=function(){if(!confirm('이 할 일을 삭제할까요?'))return;c.t.splice(j,1);persist();rerender()};r.appendChild(x);
      var nt=inp(t.m,'메모',function(v){t.m=v;persist()});nt.className='nt';r.appendChild(nt);
      bd.appendChild(r);
    });
    
    var ad=el('button','add','+ 할 일 추가');ad.type='button';ad.onclick=function(){c.t.push({t:'새 할 일',s:0,p:1,o:'',u:'',m:''});openMap[i]=true;persist();rerender()};bd.appendChild(ad);
    dt.appendChild(bd);app.appendChild(dt);
  });
  
  var rs=el('button','rs','기본값으로 되돌리기');rs.type='button';rs.onclick=async function(){
    if(!confirm('모든 수정 내용을 지우고 처음 상태로 되돌릴까요?'))return;
    C=JSON.parse(DEF);filt=-1;openMap={};try{localStorage.removeItem(K)}catch(e){}
    if(_supabase){
      try{ await _supabase.from('pm_progress_status').delete().eq('key', 'main_progress'); }catch(e){}
    }
    st('기본값으로 되돌림');upEl.textContent='';rerender()};
  app.appendChild(rs);
}

// 초기화
render();
loadFromSupabase();
</script>
</body>
</html>
