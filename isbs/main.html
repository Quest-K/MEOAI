                priority: "높음",
                tasks: [
                    { title: "상부점 및 통신사 수수료 정산 마스터 시트 연동", status: "done", link: "https://docs.google.com/spreadsheets/d/1AEsbc3F2T6flxJhFIoE5UOEdZHf6RCAatXrckhVyfe8/edit?gid=313134963#gid=313134963", linkText: "정산 시트 열기" },
                    { title: "통신사/상부점 정산표 양식 및 수수료/부가세 산식 정의", status: "done" },
                    { title: "사은품 지급 내역 및 실 집행금액 대조 로직", status: "done" },
                    { title: "세금계산서 발행 및 이익금 산출 서식 체계화", status: "done" },
                    { title: "상부점 정산 내역 및 실정산액 자동 집계 (Supabase 연동중)", status: "doing" }
                ]
            },
            script: {
                title: "외부 > 응대 스크립트",
                sub: "고객 맞춤형 상담 흐름, 거절 대응 및 오프닝/클로징 스크립트",
                icon: "fa-file-lines",
                type: "external",
                priority: "중간",
                tasks: [
                    { title: "도입부(오프닝 인사 및 목적 고지) 스크립트 정립", status: "done" },
                    { title: "고객 니즈 진단 및 맞춤 상품 제안 스크립트", status: "done" },
                    { title: "사은품 비교 및 가격 부담 설득/거절 대응 스크립트", status: "done" },
                    { title: "최종 가입 확인 및 클로징 안내 문구 확정", status: "done" },
                    { title: "비선호 고객/바쁜 고객 대상 단축 스크립트 보완", status: "doing" }
                ]
            }
        };

        // 로컬 스토리지 연동 및 초기 데이터 로드
        let taskData = JSON.parse(localStorage.getItem('isbs_task_data')) || defaultTaskData;
        let lastUpdateTime = localStorage.getItem('isbs_update_time') || "2026-09-28 12:00";

        let currentCategory = 'all';
        let currentStatusFilter = 'all';

        function saveDataAndRefresh() {
            // 현재 시각을 yyyy-mm-dd hh:mm 형태로 갱신
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            lastUpdateTime = `${yyyy}-${mm}-${dd} ${hh}:${min}`;

            localStorage.setItem('isbs_task_data', JSON.stringify(taskData));
            localStorage.setItem('isbs_update_time', lastUpdateTime);

            document.getElementById('last-update-time').innerText = lastUpdateTime;
            renderCards();
            
            if(currentCategory === 'all') {
                showAllDetailList();
            } else {
                selectCategory(currentCategory);
            }
        }

        // 전체 카드 렌더링 및 프로그레스 계산
        function renderCards() {
            const internalGrid = document.getElementById('internal-cards-grid');
            const externalGrid = document.getElementById('external-cards-grid');
            internalGrid.innerHTML = '';
            externalGrid.innerHTML = '';

            let totalCount = 0;

            Object.keys(taskData).forEach(key => {
                const cat = taskData[key];
                const tasks = cat.tasks;
                const total = tasks.length;
                const doneCount = tasks.filter(t => t.status === 'done').length;
                const doingCount = tasks.filter(t => t.status === 'doing').length;
                const percent = total > 0 ? Math.round((doneCount / total) * 100) : 0;
                totalCount += total;

                // 좌측 메뉴 뱃지 업데이트
                const badgeEl = document.getElementById(`badge-${key}`);
                if(badgeEl) {
                    badgeEl.innerText = `${percent}%`;
                    badgeEl.className = `text-[11px] font-semibold px-1.5 py-0.5 rounded ${percent === 100 ? 'text-emerald-600 bg-emerald-50' : percent >= 50 ? 'text-amber-600 bg-amber-50' : 'text-rose-600 bg-rose-50'}`;
                }

                // 우선순위 뱃지 스타일
                let priorityClass = "bg-slate-100 text-slate-600";
                if(cat.priority === '높음') priorityClass = "bg-rose-50 text-rose-600";
                else if(cat.priority === '중간') priorityClass = "bg-amber-50 text-amber-600";

                const cardHtml = `
                    <div onclick="selectCategory('${key}')" class="category-card bg-white p-5 rounded-2xl border border-slate-200 hover:border-blue-400 hover:shadow-md transition-all cursor-pointer relative group">
                        <div class="flex justify-between items-start mb-3">
                            <h4 class="font-bold text-slate-800 text-sm group-hover:text-blue-600 transition-colors">${cat.title.split('>')[1].trim()}</h4>
                            <span class="${priorityClass} text-[11px] font-semibold px-2 py-0.5 rounded-full">우선순위 ${cat.priority}</span>
                        </div>
                        <div class="w-full bg-slate-100 rounded-full h-2 mb-3 overflow-hidden">
                            <div class="bg-blue-600 h-2 rounded-full transition-all" style="width: ${percent}%"></div>
                        </div>
                        <div class="flex justify-between text-xs text-slate-400 font-medium">
                            <span>완료 ${doneCount}/${total} · 진행중 ${doingCount}</span>
                            <span class="font-bold text-slate-600">${percent}%</span>
                        </div>
                    </div>
                `;

                if(cat.type === 'internal') {
                    internalGrid.insertAdjacentHTML('beforeend', cardHtml);
                } else {
                    externalGrid.insertAdjacentHTML('beforeend', cardHtml);
                }
            });

            document.getElementById('nav-badge-all').innerText = totalCount;
            document.getElementById('last-update-time').innerText = lastUpdateTime;
        }

        // 카테고리 선택
        function selectCategory(catKey) {
            currentCategory = catKey;

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-blue-50', 'text-blue-600', 'border', 'border-blue-100', 'shadow-sm');
                btn.classList.add('text-slate-600');
            });

            const activeBtn = document.getElementById(`nav-${catKey}`);
            if(activeBtn) {
                activeBtn.classList.add('bg-blue-50', 'text-blue-600', 'border', 'border-blue-100', 'shadow-sm');
                activeBtn.classList.remove('text-slate-600');
            }

            const headerTitle = document.getElementById('header-title');
            const headerDesc = document.getElementById('header-desc');
            const addTaskBtn = document.getElementById('add-task-btn');

            if(catKey === 'all') {
                headerTitle.innerText = "전체 사업 진척도 현황";
                headerDesc.innerText = "인생비서 사업 전체 카테고리별 진행 상황 모니터링 및 실무 링크 연동";
                addTaskBtn.classList.add('hidden');
                showAllDetailList();
            } else {
                const data = taskData[catKey];
                headerTitle.innerText = data.title;
                headerDesc.innerText = data.sub;
                addTaskBtn.classList.remove('hidden');
                renderDetailList(data.tasks);
            }
        }

        // 전체 세부 리스트 보기
        function showAllDetailList() {
            document.getElementById('detail-title').innerText = "전체 핵심 과제 진행 리스트";
            document.getElementById('detail-sub').innerText = "인생비서 사업 전체 카테고리의 주요 과제 목록입니다. (개별 수정은 각 카테고리에서 가능합니다)";
            
            let allTasks = [];
            Object.keys(taskData).forEach(key => {
                taskData[key].tasks.forEach((t, idx) => {
                    allTasks.push({...t, catKey: key, originalIndex: idx});
                });
            });

            renderTasks(allTasks, true);
        }

        function renderDetailList(tasks) {
            document.getElementById('detail-title').innerText = taskData[currentCategory].title;
            document.getElementById('detail-sub').innerText = taskData[currentCategory].sub;
            
            const mappedTasks = tasks.map((t, idx) => ({...t, originalIndex: idx}));
            renderTasks(mappedTasks, false);
        }

        // 태스크 렌더링 (수정/삭제 버튼 포함)
        function renderTasks(tasks, isAllView) {
            const detailList = document.getElementById('detail-list');
            detailList.innerHTML = '';

            const filtered = tasks.filter(t => currentStatusFilter === 'all' || t.status === currentStatusFilter);

            if(filtered.length === 0) {
                detailList.innerHTML = `<div class="text-center py-6 text-xs text-slate-400">해당 조건에 부합하는 과제가 없습니다.</div>`;
                return;
            }

            filtered.forEach(task => {
                let badge = '';
                if(task.status === 'done') {
                    badge = `<span class="bg-emerald-50 text-emerald-600 border border-emerald-200 text-[11px] px-2 py-0.5 rounded-md font-semibold flex items-center shrink-0"><i class="fa-solid fa-check mr-1"></i> 완료</span>`;
                } else if(task.status === 'doing') {
                    badge = `<span class="bg-amber-50 text-amber-600 border border-amber-200 text-[11px] px-2 py-0.5 rounded-md font-semibold flex items-center shrink-0"><i class="fa-solid fa-spinner fa-spin mr-1"></i> 진행중</span>`;
                } else if(task.status === 'todo') {
                    badge = `<span class="bg-slate-100 text-slate-500 border border-slate-200 text-[11px] px-2 py-0.5 rounded-md font-semibold flex items-center shrink-0"><i class="fa-regular fa-clock mr-1"></i> 미착수</span>`;
                }

                let linkButton = '';
                if(task.link) {
                    linkButton = `
                        <a href="${task.link}" target="_blank" class="inline-flex items-center px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-blue-50 text-blue-600 border border-blue-200 hover:bg-blue-100 transition-all shrink-0">
                            <i class="fa-solid fa-arrow-up-right-from-square mr-1"></i> ${task.linkText || '바로가기'}
                        </a>
                    `;
                }

                // 전체 보기 아닐 때만 수정/삭제 버튼 제공
                let actionButtons = '';
                if(!isAllView) {
                    actionButtons = `
                        <div class="flex items-center space-x-1 pl-2 border-l border-slate-200 ml-2">
                            <button onclick="openTaskModal('edit', ${task.originalIndex})" class="p-1.5 text-slate-400 hover:text-blue-600 text-xs rounded transition-all" title="수정"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteTask(${task.originalIndex})" class="p-1.5 text-slate-400 hover:text-rose-600 text-xs rounded transition-all" title="삭제"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                }

                const itemHtml = `
                    <div class="flex items-center justify-between p-3.5 bg-slate-50 rounded-xl border border-slate-100 hover:border-slate-200 transition-all">
                        <span class="text-xs font-medium text-slate-700 flex items-center mr-2">
                            <i class="fa-regular fa-circle-dot text-slate-400 mr-2.5 shrink-0"></i>
                            ${task.title}
                        </span>
                        <div class="flex items-center space-x-2 shrink-0">
                            ${linkButton}
                            ${badge}
                            ${actionButtons}
                        </div>
                    </div>
                `;
                detailList.insertAdjacentHTML('beforeend', itemHtml);
            });
        }

        // 모달 제어 (추가 / 수정)
        let modalMode = 'add';
        let editingIndex = null;

        function openTaskModal(mode, index = null) {
            modalMode = mode;
            editingIndex = index;
            const modal = document.getElementById('task-modal');
            const modalTitle = document.getElementById('modal-title');

            if(mode === 'add') {
                modalTitle.innerText = "새로운 과제 등록";
                document.getElementById('modal-task-title').value = '';
                document.getElementById('modal-task-status').value = 'todo';
                document.getElementById('modal-link-text').value = '';
                document.getElementById('modal-link-url').value = '';
            } else {
                modalTitle.innerText = "과제 정보 수정";
                const task = taskData[currentCategory].tasks[index];
                document.getElementById('modal-task-title').value = task.title;
                document.getElementById('modal-task-status').value = task.status;
                document.getElementById('modal-link-text').value = task.linkText || '';
                document.getElementById('modal-link-url').value = task.link || '';
            }

            modal.classList.remove('hidden');
        }

        function closeTaskModal() {
            document.getElementById('task-modal').classList.add('hidden');
        }

        function handleTaskFormSubmit(event) {
            event.preventDefault();
            const title = document.getElementById('modal-task-title').value;
            const status = document.getElementById('modal-task-status').value;
            const linkText = document.getElementById('modal-link-text').value;
            const link = document.getElementById('modal-link-url').value;

            const newTaskData = { title, status };
            if(link) {
                newTaskData.link = link;
                newTaskData.linkText = linkText || '바로가기';
            }

            if(modalMode === 'add') {
                taskData[currentCategory].tasks.push(newTaskData);
            } else {
                taskData[currentCategory].tasks[editingIndex] = newTaskData;
            }

            closeTaskModal();
            saveDataAndRefresh();
        }

        // 삭제 기능
        function deleteTask(index) {
            if(confirm("정말 이 과제를 삭제하시겠습니까?")) {
                taskData[currentCategory].tasks.splice(index, 1);
                saveDataAndRefresh();
            }
        }

        // 상태 필터 적용
        function filterStatus(status) {
            currentStatusFilter = status;

            document.querySelectorAll('.status-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white', 'font-semibold', 'shadow-sm');
                btn.classList.add('text-slate-600');
            });

            event.target.classList.add('bg-blue-600', 'text-white', 'font-semibold', 'shadow-sm');
            event.target.classList.remove('text-slate-600');

            if(currentCategory === 'all') {
                showAllDetailList();
            } else {
                renderDetailList(taskData[currentCategory].tasks);
            }
        }

        // 초기 실행
        window.onload = function() {
            renderCards();
            selectCategory('all');
        };
    </script>
</body>
</html>
