<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABCD Scanner</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07090d;
  --surface: #0d1018;
  --surface2: #121620;
  --surface3: #181d28;
  --border: #1c2130;
  --border2: #242b3c;
  --text: #dde4f0;
  --sub: #8896b0;
  --muted: #3d4a60;
  --green: #00e5a0;
  --green2: rgba(0,229,160,0.12);
  --green3: rgba(0,229,160,0.25);
  --yellow: #f5c518;
  --yellow2: rgba(245,197,24,0.1);
  --yellow3: rgba(245,197,24,0.25);
  --red: #ff4d6d;
  --red2: rgba(255,77,109,0.1);
  --blue: #4d9fff;
  --blue2: rgba(77,159,255,0.1);
  --purple: #7c5cfc;
  --purple2: rgba(124,92,252,0.12);
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Syne', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--mono);
  font-size:12px;
  display:flex;
  flex-direction:column;
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

/* ── HEADER ── */
.header{
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  height:52px;
  border-bottom:1px solid var(--border);
  background:var(--surface);
  gap:12px;
}
.logo{
  font-family:var(--sans);
  font-size:16px;
  font-weight:800;
  letter-spacing:-0.3px;
  display:flex;
  align-items:center;
  gap:8px;
  white-space:nowrap;
}
.logo-tag{
  font-family:var(--mono);
  font-size:9px;
  font-weight:600;
  padding:2px 6px;
  border-radius:3px;
  background:var(--purple);
  color:#fff;
  letter-spacing:1px;
}
.header-mid{
  display:flex;
  align-items:center;
  gap:0;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:7px;
  overflow:hidden;
  flex-shrink:0;
}
.tab-btn{
  padding:6px 18px;
  font-family:var(--mono);
  font-size:11px;
  font-weight:500;
  color:var(--sub);
  background:none;
  border:none;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px;
  transition:all 0.15s;
  white-space:nowrap;
}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{
  background:var(--surface3);
  color:var(--text);
}
.tab-count{
  font-size:9px;
  padding:1px 5px;
  border-radius:10px;
  font-weight:600;
  background:var(--border2);
  color:var(--sub);
  min-width:18px;
  text-align:center;
}
.tab-btn.active .tab-count{background:var(--purple);color:#fff;}
.tab-btn.tab-second.active .tab-count{background:var(--green);color:#000;}
.tab-divider{width:1px;background:var(--border);align-self:stretch;}

.header-right{
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0;
}
.live-badge{
  display:flex;
  align-items:center;
  gap:5px;
  color:var(--sub);
  font-size:10px;
}
.dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--muted);
  flex-shrink:0;
}
.dot.scanning{background:var(--yellow);box-shadow:0 0 6px var(--yellow);animation:blink 0.6s infinite;}
.dot.live{background:var(--green);box-shadow:0 0 6px var(--green);animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.25;}}

.tf-toggle{
  display:flex;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:6px;
  overflow:hidden;
  flex-shrink:0;
}
.tf-btn{
  padding:5px 13px;
  font-family:var(--mono);
  font-size:11px;
  font-weight:600;
  color:var(--sub);
  background:none;
  border:none;
  cursor:pointer;
  letter-spacing:0.5px;
  transition:all 0.15s;
}
.tf-btn:hover{color:var(--text);}
.tf-btn.active{
  background:var(--surface3);
  color:var(--text);
}
.tf-btn:first-child{border-right:1px solid var(--border);}

/* stat-cell tf badge */
.tf-badge{
  display:inline-block;
  font-size:9px;
  font-weight:700;
  padding:1px 5px;
  border-radius:3px;
  margin-left:5px;
  vertical-align:middle;
  letter-spacing:0.5px;
}
.tf-badge.h{background:rgba(124,92,252,0.15);color:var(--purple);}
.tf-badge.d{background:rgba(245,197,24,0.15);color:var(--yellow);}

.btn-scan{
  height:32px;
  padding:0 16px;
  background:var(--purple);
  color:#fff;
  border:none;
  border-radius:6px;
  font-family:var(--mono);
  font-size:11px;
  font-weight:600;
  letter-spacing:0.4px;
  cursor:pointer;
  transition:all 0.15s;
  white-space:nowrap;
}
.btn-scan:hover{opacity:0.85;transform:translateY(-1px);}
.btn-scan:active{transform:none;}
.btn-scan:disabled{opacity:0.35;cursor:not-allowed;transform:none;}

/* ── STAT ROW ── */
.stat-row{
  flex-shrink:0;
  display:flex;
  border-bottom:1px solid var(--border);
  overflow-x:auto;
}
.stat-cell{
  padding:8px 20px;
  border-right:1px solid var(--border);
  flex-shrink:0;
}
.sl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.7px;margin-bottom:3px;}
.sv{font-family:var(--sans);font-size:15px;font-weight:700;}
.sv.g{color:var(--green);}
.sv.y{color:var(--yellow);}
.sv.b{color:var(--blue);}
.sv.p{color:var(--purple);}
.sv.m{color:var(--sub);}

/* ── PROGRESS ── */
.prog-bar{
  flex-shrink:0;
  height:3px;
  background:var(--border);
  display:none;
  position:relative;
  overflow:hidden;
}
.prog-bar.active{display:block;}
.prog-fill{
  position:absolute;left:0;top:0;bottom:0;
  background:linear-gradient(90deg,var(--purple),var(--green));
  transition:width 0.4s;
  width:0%;
}
.prog-info{
  flex-shrink:0;
  display:none;
  padding:7px 20px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.prog-info.active{display:flex;}
.prog-info.hidden{display:none !important;}
.prog-label{font-size:10px;color:var(--sub);}
.prog-sym{font-size:10px;color:var(--muted);flex:1;text-align:right;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}

/* ── BODY / TABS ── */
.body{flex:1;overflow:hidden;display:flex;flex-direction:column;}
.tab-panel{display:none;flex:1;flex-direction:column;overflow:hidden;}
.tab-panel.active{display:flex;}

/* ── TABLE PANEL ── */
.tbl-wrap{flex:1;overflow:auto;}
table{width:100%;border-collapse:collapse;}
thead{position:sticky;top:0;z-index:10;background:var(--surface2);}
th{
  padding:9px 14px;
  text-align:left;
  font-size:9px;
  font-weight:600;
  color:var(--muted);
  letter-spacing:0.7px;
  text-transform:uppercase;
  border-bottom:1px solid var(--border);
  white-space:nowrap;
  cursor:pointer;
  user-select:none;
  transition:color 0.1s;
}
th:hover{color:var(--sub);}
th.sort-asc::after{content:' ↑';color:var(--purple);}
th.sort-desc::after{content:' ↓';color:var(--purple);}
td{
  padding:8px 14px;
  border-bottom:1px solid var(--border);
  white-space:nowrap;
}
tbody tr{transition:background 0.1s;cursor:default;}
tbody tr:hover{background:var(--surface2);}
tbody tr:last-child td{border-bottom:none;}
tbody tr.row-2nd td:first-child{
  border-left:2px solid var(--green);
}

.sym-cell{
  font-family:var(--sans);
  font-weight:700;
  font-size:12px;
}
.pct-cell{font-weight:600;}
.up5{color:var(--yellow);}
.up10{color:#ff9500;}
.up20{color:var(--red);}
.badge-pass{
  display:inline-flex;align-items:center;gap:4px;
  background:var(--green2);
  border:1px solid var(--green3);
  color:var(--green);
  font-size:9px;font-weight:600;
  padding:2px 7px;border-radius:3px;
  letter-spacing:0.5px;
}
.badge-wait{
  color:var(--muted);font-size:10px;
}

/* ── CARD PANEL ── */
.card-panel-inner{flex:1;overflow:auto;padding:16px 20px;}
.card-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(360px,1fr));
  gap:12px;
}

.card{
  background:var(--surface);
  border:1px solid var(--green3);
  border-radius:10px;
  overflow:hidden;
  transition:border-color 0.15s,transform 0.15s;
}
.card:hover{border-color:var(--green);transform:translateY(-1px);}

.card-top{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px 10px;
  border-bottom:1px solid var(--border);
}
.card-sym{
  font-family:var(--sans);
  font-size:14px;font-weight:800;
  letter-spacing:0.2px;
}
.card-badge{
  background:var(--green2);
  border:1px solid var(--green3);
  color:var(--green);
  font-size:9px;font-weight:600;
  padding:2px 8px;border-radius:3px;
  letter-spacing:0.6px;
}
.card-body{padding:10px 14px;display:flex;flex-direction:column;gap:8px;}

/* candle blocks */
.c-block{
  background:var(--surface2);
  border-radius:6px;
  padding:9px 11px;
}
.c-head{
  display:flex;align-items:center;gap:6px;
  font-size:9px;color:var(--sub);
  text-transform:uppercase;letter-spacing:0.6px;
  margin-bottom:7px;
}
.c-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.c-dot.y{background:var(--yellow);}
.c-dot.g{background:var(--green);}
.c-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.c-item{}
.c-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:2px;}
.c-val{font-size:11px;font-weight:600;}
.cv-g{color:var(--green);}
.cv-y{color:var(--yellow);}
.cv-b{color:var(--blue);}
.cv-w{color:var(--text);}

/* targets */
.t-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.t-item{
  background:var(--surface2);
  border-radius:6px;
  padding:8px 10px;
  border:1px solid transparent;
}
.t-item.ta{border-color:rgba(124,92,252,0.2);}
.t-item.tb{border-color:rgba(245,197,24,0.2);}
.t-item.tc{border-color:rgba(77,159,255,0.2);}
.t-item.toi{border-color:var(--green3);}
.t-lbl{font-size:9px;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:3px;}
.t-lbl.a{color:var(--purple);}
.t-lbl.b{color:var(--yellow);}
.t-lbl.c{color:var(--blue);}
.t-lbl.oi{color:var(--green);}
.t-val{font-size:12px;font-weight:700;}
.t-sub{font-size:9px;color:var(--muted);margin-top:1px;}

/* cond chips */
.chips{display:flex;gap:4px;flex-wrap:wrap;}
.chip{
  font-size:9px;font-weight:600;
  padding:2px 7px;border-radius:3px;
  letter-spacing:0.4px;
  border:1px solid transparent;
}
.chip.ok{background:var(--green2);border-color:var(--green3);color:var(--green);}
.chip.no{background:var(--red2);border-color:rgba(255,77,109,0.25);color:var(--red);}

/* ── EMPTY ── */
.empty{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  color:var(--muted);gap:8px;
  padding:40px;
}
.empty-icon{font-size:28px;opacity:0.3;}
.empty-title{font-family:var(--sans);font-size:14px;color:var(--border2);}
.empty-sub{font-size:11px;color:var(--muted);text-align:center;}

/* ── MOBILE ── */
@media(max-width:600px){
  .header-mid{display:none;}
  .tab-mobile{
    display:flex!important;
    flex-shrink:0;
    border-bottom:1px solid var(--border);
    background:var(--surface);
  }
  .tab-mobile .tab-btn{flex:1;justify-content:center;border-radius:0;}
  .stat-cell{padding:7px 14px;}
  .card-panel-inner{padding:10px 12px;}
  .card-grid{grid-template-columns:1fr;}
  .c-grid{grid-template-columns:repeat(2,1fr);}
  .t-grid{grid-template-columns:repeat(2,1fr);}
}
@media(min-width:601px){
  .tab-mobile{display:none!important;}
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="logo">
    ABCD<span style="color:var(--sub);font-weight:400;">scan</span>
    <span class="logo-tag">MVP</span>
  </div>

  <!-- desktop tabs -->
  <div class="header-mid">
    <button class="tab-btn tab-second active" id="tabBtn2nd" onclick="switchTab('second')">
      2차 충족
      <span class="tab-count" id="cnt2nd">0</span>
    </button>
    <div class="tab-divider"></div>
    <button class="tab-btn tab-first" id="tabBtn1st" onclick="switchTab('first')">
      1차 통과
      <span class="tab-count" id="cnt1st">0</span>
    </button>
  </div>

  <div class="header-right">
    <div class="live-badge">
      <div class="dot" id="dot"></div>
      <span id="statusTxt">대기</span>
    </div>
    <div class="tf-toggle">
      <button class="tf-btn active" id="tfBtn1h" onclick="setTF('1h')">1H</button>
      <button class="tf-btn" id="tfBtn1d" onclick="setTF('1d')">1D</button>
    </div>
    <button class="btn-scan" id="scanBtn" onclick="startScan()">스캔 시작</button>
  </div>
</header>

<!-- mobile tabs -->
<div class="tab-mobile">
  <button class="tab-btn tab-second active" onclick="switchTab('second')">
    2차 충족 <span class="tab-count" id="cnt2nd_m">0</span>
  </button>
  <div class="tab-divider"></div>
  <button class="tab-btn tab-first" onclick="switchTab('first')">
    1차 통과 <span class="tab-count" id="cnt1st_m">0</span>
  </button>
</div>

<!-- STAT ROW -->
<div class="stat-row">
  <div class="stat-cell"><div class="sl">전체 심볼</div><div class="sv b" id="sTotal">—</div></div>
  <div class="stat-cell"><div class="sl">타임프레임</div><div class="sv" id="sTF"><span class="tf-badge h">1H</span></div></div>
  <div class="stat-cell"><div class="sl">1차 통과</div><div class="sv y" id="s1st">—</div></div>
  <div class="stat-cell"><div class="sl">2차 충족</div><div class="sv g" id="s2nd">—</div></div>
  <div class="stat-cell"><div class="sl">최근 스캔</div><div class="sv m" id="sTime">—</div></div>
</div>

<!-- PROGRESS -->
<div class="prog-bar" id="progBar"><div class="prog-fill" id="progFill"></div></div>
<div class="prog-info hidden" id="progInfo">
  <span class="prog-label" id="progLabel">로딩...</span>
  <span class="prog-sym" id="progSym"></span>
</div>

<!-- BODY -->
<div class="body">

  <!-- 2차 TAB -->
  <div class="tab-panel active" id="panel2nd">
    <div class="empty" id="empty2nd">
      <div class="empty-icon">◈</div>
      <div class="empty-title">스캔 대기 중</div>
      <div class="empty-sub">스캔 시작을 누르면 전체 USDT 무기한 선물을<br>분석하여 ABCD 조건 충족 심볼을 표시합니다</div>
    </div>
    <div class="card-panel-inner" id="cardWrap" style="display:none;">
      <div class="card-grid" id="cardGrid"></div>
    </div>
  </div>

  <!-- 1차 TAB -->
  <div class="tab-panel" id="panel1st">
    <div class="empty" id="empty1st">
      <div class="empty-icon">◈</div>
      <div class="empty-title">스캔 대기 중</div>
      <div class="empty-sub">1차 조건(최근 48봉 내 5%↑ 양봉)을<br>충족하는 심볼이 여기에 표시됩니다</div>
    </div>
    <div class="tbl-wrap" id="tblWrap" style="display:none;">
      <table>
        <thead>
          <tr>
            <th onclick="sortTable('symbol')">심볼</th>
            <th onclick="sortTable('time')">발생 시간</th>
            <th onclick="sortTable('open')">시가</th>
            <th onclick="sortTable('close')">종가</th>
            <th onclick="sortTable('high')">고가</th>
            <th onclick="sortTable('pct')">상승률</th>
            <th onclick="sortTable('oi')">1차 OI</th>
            <th>2차</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
// ── STATE ──
let scanning = false;
let firstResults = [];
let secondResults = [];
let oiMap = {};
let sortKey = 'pct';
let sortDir = 'desc';
let activeTab = 'second';
let activeInterval = '1h'; // '1h' | '1d'

// ── DOM ──
const $ = id => document.getElementById(id);

// ── FORMAT ──
function fPrice(p) {
  if (!p || isNaN(p)) return '—';
  if (p >= 10000) return p.toLocaleString('en', {maximumFractionDigits: 0});
  if (p >= 1000)  return p.toLocaleString('en', {maximumFractionDigits: 1});
  if (p >= 1)     return p.toFixed(4);
  if (p >= 0.01)  return p.toFixed(5);
  return p.toFixed(7);
}
function fOI(v) {
  if (!v || isNaN(v)) return '—';
  if (v >= 1e9) return (v/1e9).toFixed(2)+'B';
  if (v >= 1e6) return (v/1e6).toFixed(2)+'M';
  if (v >= 1e3) return (v/1e3).toFixed(1)+'K';
  return v.toFixed(0);
}
function fTime(ts, interval) {
  const d = new Date(ts);
  const mo = String(d.getMonth()+1).padStart(2,'0');
  const dy = String(d.getDate()).padStart(2,'0');
  if (interval === '1d') return `${d.getFullYear().toString().slice(2)}/${mo}/${dy}`;
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  return `${mo}/${dy} ${hh}:${mm}`;
}
function pctColor(p) {
  if (p >= 20) return 'up20';
  if (p >= 10) return 'up10';
  return 'up5';
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── TIMEFRAME ──
function setTF(tf) {
  if (scanning) return;
  activeInterval = tf;
  $('tfBtn1h').classList.toggle('active', tf === '1h');
  $('tfBtn1d').classList.toggle('active', tf === '1d');
  const badge = $('sTF');
  if (badge) badge.innerHTML = tf === '1h'
    ? '<span class="tf-badge h">1H</span>'
    : '<span class="tf-badge d">1D</span>';
}

// ── STATUS ──
function setStatus(state, txt) {
  $('dot').className = 'dot' + (state ? ' '+state : '');
  $('statusTxt').textContent = txt;
}
function setProgress(pct, label, sym) {
  $('progFill').style.width = pct + '%';
  if (label !== undefined) $('progLabel').textContent = label;
  if (sym !== undefined) $('progSym').textContent = sym;
}

// ── TAB ──
function switchTab(tab) {
  activeTab = tab;
  $('panel2nd').classList.toggle('active', tab === 'second');
  $('panel1st').classList.toggle('active', tab === 'first');
  document.querySelectorAll('.tab-btn.tab-second').forEach(b => b.classList.toggle('active', tab==='second'));
  document.querySelectorAll('.tab-btn.tab-first').forEach(b => b.classList.toggle('active', tab==='first'));
}

// ── COUNTS ──
function updateCounts() {
  const n1 = firstResults.length;
  const n2 = secondResults.length;
  ['cnt1st','cnt1st_m'].forEach(id => { const el=$(id); if(el) el.textContent = n1; });
  ['cnt2nd','cnt2nd_m'].forEach(id => { const el=$(id); if(el) el.textContent = n2; });
  $('s1st').textContent = n1 || '—';
  $('s2nd').textContent = n2 || '—';
}

// ── BINANCE API ──
async function fetchSymbols() {
  const r = await fetch('https://fapi.binance.com/fapi/v1/exchangeInfo');
  if (!r.ok) throw new Error('exchangeInfo 실패');
  const d = await r.json();
  return d.symbols
    .filter(s => s.quoteAsset==='USDT' && s.status==='TRADING' && s.contractType==='PERPETUAL')
    .map(s => s.symbol);
}
async function fetchKlines(sym, interval='1h', limit=200) {
  const r = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${sym}&interval=${interval}&limit=${limit}`);
  if (!r.ok) throw new Error('klines');
  return r.json();
}
async function fetchOI(sym) {
  const r = await fetch(`https://fapi.binance.com/fapi/v1/openInterest?symbol=${sym}`);
  if (!r.ok) return null;
  const d = await r.json();
  return parseFloat(d.openInterest);
}
async function fetchPrice(sym) {
  const r = await fetch(`https://fapi.binance.com/fapi/v1/ticker/price?symbol=${sym}`);
  if (!r.ok) return null;
  return parseFloat((await r.json()).price);
}

// ── INDICATORS ──
function calcMA(arr, p) {
  if (arr.length < p) return null;
  return arr.slice(-p).reduce((a,b)=>a+b,0)/p;
}
function calcBB(arr, p=20, mult=2) {
  if (arr.length < p) return null;
  const sl = arr.slice(-p);
  const mean = sl.reduce((a,b)=>a+b,0)/p;
  const std = Math.sqrt(sl.reduce((a,b)=>a+(b-mean)**2,0)/p);
  return { upper: mean+mult*std, lower: mean-mult*std, mid: mean };
}

// ── 1차 필터 ──
function findFirstCandle(klines) {
  const recent = klines.slice(-48);
  for (let i = recent.length-1; i >= 0; i--) {
    const o = parseFloat(recent[i][1]);
    const h = parseFloat(recent[i][2]);
    const c = parseFloat(recent[i][4]);
    const v = parseFloat(recent[i][5]);
    const pct = (c-o)/o*100;
    if (c > o && pct >= 5) {
      const globalIdx = klines.length - 48 + i;
      return { openTime: klines[globalIdx][0], open:o, high:h, close:c, vol:v, pct, globalIdx };
    }
  }
  return null;
}

// ── 2차 필터 ──
function checkSecond(klines, fc) {
  const afterIdx = fc.globalIdx + 1;
  const windowEnd = Math.min(afterIdx + 48, klines.length);
  const closes = klines.map(k=>parseFloat(k[4]));
  const vols   = klines.map(k=>parseFloat(k[5]));

  for (let i = afterIdx; i < windowEnd; i++) {
    const o = parseFloat(klines[i][1]);
    const h = parseFloat(klines[i][2]);
    const c = parseFloat(klines[i][4]);
    const v = parseFloat(klines[i][5]);
    const pct = (c-o)/o*100;
    if (c <= o || pct < 0.5) continue;

    const cl = closes.slice(0, i+1);
    const vl = vols.slice(0, i+1);

    const cond1 = h > fc.high;

    const ma5  = calcMA(cl, 5);
    const ma20 = calcMA(cl, 20);
    const ma60 = calcMA(cl, 60);
    const ma120= calcMA(cl, 120);
    const cond2 = ma5&&ma20&&ma60&&ma120 && ma5>ma20 && ma20>ma60 && ma60>ma120;

    const bb = calcBB(cl, 20, 2);
    const cond3 = bb && c > bb.upper;

    const vMA5  = calcMA(vl, 5);
    const vMA10 = calcMA(vl, 10);
    const cond4 = vMA5&&vMA10 && v>vMA5 && v>vMA10;

    if (cond1 && cond2 && cond3 && cond4) {
      return {
        candle: { openTime: klines[i][0], open:o, high:h, close:c, vol:v, pct },
        conds: { cond1, cond2, cond3, cond4 }
      };
    }
  }
  return null;
}

// ── RENDER 1차 TABLE ──
let sortedFirst = [];
function renderFirstTable() {
  sortedFirst = [...firstResults];
  sortedFirst.sort((a,b) => {
    let va, vb;
    switch(sortKey) {
      case 'symbol': va=a.symbol; vb=b.symbol; break;
      case 'time':   va=a.fc.openTime; vb=b.fc.openTime; break;
      case 'open':   va=a.fc.open; vb=b.fc.open; break;
      case 'close':  va=a.fc.close; vb=b.fc.close; break;
      case 'high':   va=a.fc.high; vb=b.fc.high; break;
      case 'pct':    va=a.fc.pct; vb=b.fc.pct; break;
      case 'oi':     va=a.oi; vb=b.oi; break;
      default:       va=a.fc.pct; vb=b.fc.pct;
    }
    if (typeof va === 'string') return sortDir==='asc'?va.localeCompare(vb):vb.localeCompare(va);
    return sortDir==='asc' ? va-vb : vb-va;
  });

  // update sort headers
  document.querySelectorAll('th').forEach(th => th.classList.remove('sort-asc','sort-desc'));
  const thMap = {symbol:0,time:1,open:2,close:3,high:4,pct:5,oi:6};
  const thIdx = thMap[sortKey];
  if (thIdx !== undefined) {
    const ths = document.querySelectorAll('th');
    ths[thIdx]?.classList.add(sortDir==='asc'?'sort-asc':'sort-desc');
  }

  const tbody = $('tbody');
  tbody.innerHTML = '';
  sortedFirst.forEach(r => {
    const has2nd = secondResults.some(s => s.symbol === r.symbol);
    const tr = document.createElement('tr');
    if (has2nd) tr.classList.add('row-2nd');
    tr.innerHTML = `
      <td class="sym-cell">${r.symbol}</td>
      <td style="color:var(--sub)">${fTime(r.fc.openTime, r.interval)}</td>
      <td style="color:var(--text)">${fPrice(r.fc.open)}</td>
      <td style="color:var(--yellow)">${fPrice(r.fc.close)}</td>
      <td style="color:var(--sub)">${fPrice(r.fc.high)}</td>
      <td class="pct-cell ${pctColor(r.fc.pct)}">+${r.fc.pct.toFixed(2)}%</td>
      <td style="color:var(--blue)">${fOI(r.oi)}</td>
      <td>${has2nd
        ? '<span class="badge-pass">✓ 2차</span>'
        : '<span class="badge-wait">—</span>'
      }</td>
    `;
    tbody.appendChild(tr);
  });

  const noData = firstResults.length === 0;
  $('empty1st').style.display  = noData ? 'flex' : 'none';
  $('tblWrap').style.display   = noData ? 'none' : 'block';
  updateCounts();
}

function sortTable(key) {
  if (sortKey === key) sortDir = sortDir==='asc'?'desc':'asc';
  else { sortKey=key; sortDir='desc'; }
  renderFirstTable();
}

// ── RENDER 2차 CARDS ──
function renderCards() {
  const grid = $('cardGrid');
  grid.innerHTML = '';
  const noData = secondResults.length === 0;
  $('empty2nd').style.display = noData ? 'flex' : 'none';
  $('cardWrap').style.display = noData ? 'none' : 'block';
  updateCounts();
  if (noData) return;

  secondResults.forEach(r => {
    const fc = r.fc;
    const sc = r.sc;
    const curOI = oiMap[r.symbol] || r.oi;
    const tA = r.oi * 1.40;
    const tB = fc.close * 1.30;
    const tC = curOI * 0.85;

    const condDefs = [
      {key:'cond1', label:'고가 돌파'},
      {key:'cond2', label:'MA 정배열'},
      {key:'cond3', label:'BB 상단 돌파'},
      {key:'cond4', label:'거래량 MA 초과'},
    ];

    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-' + r.symbol;
    card.innerHTML = `
      <div class="card-top">
        <span class="card-sym">${r.symbol}</span>
        <div style="display:flex;align-items:center;gap:6px;">
          <span class="tf-badge ${r.interval==='1d'?'d':'h'}">${r.interval==='1d'?'1D':'1H'}</span>
          <span class="card-badge">2차 충족</span>
        </div>
      </div>
      <div class="card-body">

        <div class="c-block">
          <div class="c-head"><span class="c-dot y"></span>1차 양봉</div>
          <div class="c-grid">
            <div class="c-item"><div class="c-lbl">시간</div><div class="c-val cv-w">${fTime(fc.openTime, r.interval)}</div></div>
            <div class="c-item"><div class="c-lbl">종가</div><div class="c-val cv-y">${fPrice(fc.close)}</div></div>
            <div class="c-item"><div class="c-lbl">상승률</div><div class="c-val cv-y">+${fc.pct.toFixed(2)}%</div></div>
            <div class="c-item"><div class="c-lbl">OI</div><div class="c-val cv-b">${fOI(r.oi)}</div></div>
          </div>
        </div>

        <div class="c-block">
          <div class="c-head"><span class="c-dot g"></span>2차 양봉</div>
          <div class="c-grid">
            <div class="c-item"><div class="c-lbl">시간</div><div class="c-val cv-w">${fTime(sc.openTime, r.interval)}</div></div>
            <div class="c-item"><div class="c-lbl">종가</div><div class="c-val cv-g">${fPrice(sc.close)}</div></div>
            <div class="c-item"><div class="c-lbl">상승률</div><div class="c-val cv-g">+${sc.pct.toFixed(2)}%</div></div>
            <div class="c-item"><div class="c-lbl">조건</div><div class="c-val cv-g">4/4 ✓</div></div>
          </div>
        </div>

        <div class="t-grid">
          <div class="t-item ta">
            <div class="t-lbl a">익절 A</div>
            <div class="t-val" style="color:var(--purple)">${fOI(tA)}</div>
            <div class="t-sub">1차 OI × 1.40</div>
          </div>
          <div class="t-item tb">
            <div class="t-lbl b">익절 B</div>
            <div class="t-val" style="color:var(--yellow)">${fPrice(tB)}</div>
            <div class="t-sub">1차 종가 × 1.30</div>
          </div>
          <div class="t-item tc">
            <div class="t-lbl c">익절 C</div>
            <div class="t-val cv-b" id="tc-${r.symbol}">${fOI(tC)}</div>
            <div class="t-sub">현재 OI × 0.85</div>
          </div>
          <div class="t-item toi" id="toi-${r.symbol}">
            <div class="t-lbl oi">현재 OI</div>
            <div class="t-val cv-g" id="oival-${r.symbol}">${fOI(curOI)}</div>
            <div class="t-sub">실시간</div>
          </div>
        </div>

        <div class="chips">
          ${condDefs.map(c => `<span class="chip ok">${c.label}</span>`).join('')}
        </div>

      </div>
    `;
    grid.appendChild(card);
  });
}

// ── OI 실시간 갱신 ──
let oiRefreshTimer = null;

async function refreshOIs() {
  for (const r of secondResults) {
    try {
      const [oi, price] = await Promise.all([fetchOI(r.symbol), fetchPrice(r.symbol)]);
      if (oi && price) {
        const cur = oi * price;
        oiMap[r.symbol] = cur;
        const oiEl = $('oival-'+r.symbol);
        const tcEl = $('tc-'+r.symbol);
        const toiEl = $('toi-'+r.symbol);
        if (oiEl) oiEl.textContent = fOI(cur);
        if (tcEl) tcEl.textContent = fOI(cur * 0.85);
        if (toiEl) {
          toiEl.style.borderColor = 'var(--green)';
          setTimeout(()=>{ if(toiEl) toiEl.style.borderColor = 'var(--green3)'; }, 800);
        }
      }
    } catch {}
    await sleep(250);
  }
}

function startOILoop() {
  if (oiRefreshTimer) clearInterval(oiRefreshTimer);
  oiRefreshTimer = setInterval(async () => {
    if (!scanning && secondResults.length > 0) {
      await refreshOIs();
    }
  }, 30000); // 30초마다 자동 갱신
}

// ── SCAN ──
async function startScan() {
  if (scanning) return;
  scanning = true;

  // 기존 OI 루프 정지
  if (oiRefreshTimer) { clearInterval(oiRefreshTimer); oiRefreshTimer = null; }

  const btn = $('scanBtn');
  btn.disabled = true;
  btn.textContent = '스캔 중...';
  setStatus('scanning', '스캔 중');

  $('progBar').classList.add('active');
  $('progInfo').classList.remove('hidden');
  $('progInfo').classList.add('active');

  firstResults = [];
  secondResults = [];
  oiMap = {};
  updateCounts();
  $('tbody').innerHTML = '';
  $('cardGrid').innerHTML = '';
  $('empty2nd').style.display = 'flex';
  $('empty1st').style.display = 'flex';
  $('tblWrap').style.display = 'none';
  $('cardWrap').style.display = 'none';

  try {
    setProgress(0, '심볼 목록 불러오는 중...');
    const symbols = await fetchSymbols();
    $('sTotal').textContent = symbols.length;
    setProgress(2, `${symbols.length}개 심볼 스캔 시작 · ${activeInterval.toUpperCase()}`);

    const BATCH = 6;
    for (let i = 0; i < symbols.length; i += BATCH) {
      const batch = symbols.slice(i, i+BATCH);
      await Promise.all(batch.map(sym => scanOne(sym)));
      const pct = 2 + ((i+BATCH)/symbols.length)*86;
      setProgress(Math.min(pct,88),
        `스캔 중 ${Math.min(i+BATCH,symbols.length)} / ${symbols.length}`,
        batch.join('  '));

      if (firstResults.length > 0) renderFirstTable();
      await sleep(60);
    }

    setProgress(90, 'OI 실시간 반영 중...');
    await refreshOIs();
    setProgress(100, '스캔 완료');

    renderFirstTable();
    renderCards();

    const now = new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
    $('sTime').textContent = now;
    setStatus('live', `${activeInterval.toUpperCase()} · 완료 ${now} · OI 30초 갱신`);

    // OI 자동 갱신 루프 시작
    startOILoop();

    if (!firstResults.length) {
      $('empty1st').querySelector('.empty-title').textContent = '1차 조건 없음';
      $('empty1st').querySelector('.empty-sub').textContent = '현재 5% 이상 양봉이 없습니다';
    }
    if (!secondResults.length) {
      $('empty2nd').querySelector('.empty-title').textContent = '2차 조건 없음';
      $('empty2nd').querySelector('.empty-sub').textContent = '1차 조건 충족 심볼 중 2차 조건을\n모두 만족한 심볼이 없습니다';
    }

  } catch(e) {
    console.error(e);
    setStatus('', '오류');
    $('empty2nd').style.display = 'flex';
    $('empty2nd').querySelector('.empty-title').textContent = '오류 발생';
    $('empty2nd').querySelector('.empty-sub').textContent = e.message;
  }

  $('progBar').classList.remove('active');
  $('progInfo').classList.add('hidden');
  $('progInfo').classList.remove('active');
  scanning = false;
  btn.disabled = false;
  btn.textContent = '다시 스캔';
}

async function scanOne(symbol) {
  try {
    const interval = activeInterval;
    // 1H: 최근 200봉(충분히 MA120 커버) / 1D: 200일봉
    const klines = await fetchKlines(symbol, interval, 200);
    if (klines.length < 60) return;

    const fc = findFirstCandle(klines);
    if (!fc) return;

    const [oi, price] = await Promise.all([fetchOI(symbol), fetchPrice(symbol)]);
    const oiVal = (oi && price) ? oi * price : 0;
    oiMap[symbol] = oiVal;

    firstResults.push({ symbol, fc, oi: oiVal, interval });

    const res = checkSecond(klines, fc);
    if (res) {
      secondResults.push({ symbol, fc, oi: oiVal, sc: res.candle, conds: res.conds, interval });
    }
  } catch {}
}
