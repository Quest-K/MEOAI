<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volume Scanner</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #07090d;
  --surface:  #0d1018;
  --surface2: #121620;
  --surface3: #181d28;
  --border:   #1c2130;
  --border2:  #242b3c;
  --text:     #dde4f0;
  --sub:      #8896b0;
  --muted:    #3d4a60;
  --green:    #00e5a0;
  --green2:   rgba(0,229,160,0.10);
  --green3:   rgba(0,229,160,0.25);
  --yellow:   #f5c518;
  --yellow2:  rgba(245,197,24,0.10);
  --yellow3:  rgba(245,197,24,0.28);
  --orange:   #ff8c42;
  --orange2:  rgba(255,140,66,0.10);
  --orange3:  rgba(255,140,66,0.28);
  --red:      #ff4d6d;
  --red2:     rgba(255,77,109,0.10);
  --blue:     #4d9fff;
  --blue2:    rgba(77,159,255,0.10);
  --purple:   #7c5cfc;
  --purple2:  rgba(124,92,252,0.12);
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Syne', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--mono);
  font-size:12px;
  display:flex;
  flex-direction:column;
}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

/* ── HEADER ── */
.header{
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  height:52px;
  border-bottom:1px solid var(--border);
  background:var(--surface);
  gap:12px;
}
.logo{
  font-family:var(--sans);
  font-size:16px;
  font-weight:800;
  letter-spacing:-0.3px;
  display:flex;
  align-items:center;
  gap:8px;
  white-space:nowrap;
}
.logo-tag{
  font-family:var(--mono);
  font-size:9px;
  font-weight:600;
  padding:2px 6px;
  border-radius:3px;
  background:var(--orange);
  color:#000;
  letter-spacing:1px;
}
.header-right{
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0;
}

/* TF 토글 */
.tf-toggle{
  display:flex;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:6px;
  overflow:hidden;
  flex-shrink:0;
}
.tf-btn{
  padding:5px 13px;
  font-family:var(--mono);
  font-size:11px;
  font-weight:600;
  color:var(--sub);
  background:none;
  border:none;
  cursor:pointer;
  letter-spacing:0.5px;
  transition:all 0.15s;
}
.tf-btn:hover{color:var(--text);}
.tf-btn.active{background:var(--surface3);color:var(--text);}
.tf-btn:first-child{border-right:1px solid var(--border);}

/* 조건 토글 */
.cond-toggle{
  display:flex;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:6px;
  overflow:hidden;
  flex-shrink:0;
}
.cond-btn{
  padding:5px 11px;
  font-family:var(--mono);
  font-size:10px;
  font-weight:600;
  color:var(--sub);
  background:none;
  border:none;
  cursor:pointer;
  letter-spacing:0.3px;
  transition:all 0.15s;
  white-space:nowrap;
  line-height:1.3;
}
.cond-btn:hover{color:var(--text);}
.cond-btn.active{background:var(--surface3);color:var(--text);}
.cond-btn:not(:last-child){border-right:1px solid var(--border);}

.live-badge{
  display:flex;align-items:center;gap:5px;
  color:var(--sub);font-size:10px;white-space:nowrap;
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0;}
.dot.scanning{background:var(--yellow);box-shadow:0 0 6px var(--yellow);animation:blink .6s infinite;}
.dot.live{background:var(--green);box-shadow:0 0 6px var(--green);animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.25;}}

.btn-scan{
  height:32px;padding:0 16px;
  background:var(--orange);color:#000;
  border:none;border-radius:6px;
  font-family:var(--mono);font-size:11px;font-weight:700;
  letter-spacing:0.4px;cursor:pointer;
  transition:all 0.15s;white-space:nowrap;
}
.btn-scan:hover{opacity:.85;transform:translateY(-1px);}
.btn-scan:active{transform:none;}
.btn-scan:disabled{opacity:.35;cursor:not-allowed;transform:none;}

/* ── STAT ROW ── */
.stat-row{
  flex-shrink:0;display:flex;
  border-bottom:1px solid var(--border);overflow-x:auto;
}
.stat-cell{padding:8px 20px;border-right:1px solid var(--border);flex-shrink:0;}
.sl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-bottom:3px;}
.sv{font-family:var(--sans);font-size:15px;font-weight:700;}
.sv.g{color:var(--green);}
.sv.y{color:var(--yellow);}
.sv.o{color:var(--orange);}
.sv.b{color:var(--blue);}
.sv.m{color:var(--sub);}

/* ── PROGRESS ── */
.prog-bar{flex-shrink:0;height:3px;background:var(--border);display:none;position:relative;overflow:hidden;}
.prog-bar.active{display:block;}
.prog-fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--orange),var(--yellow));transition:width .4s;width:0%;}
.prog-info{
  flex-shrink:0;display:none;
  padding:7px 20px;background:var(--surface);border-bottom:1px solid var(--border);
  align-items:center;justify-content:space-between;gap:12px;
}
.prog-info.active{display:flex;}
.prog-info.hidden{display:none !important;}
.prog-label{font-size:10px;color:var(--sub);}
.prog-sym{font-size:10px;color:var(--muted);flex:1;text-align:right;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}

/* ── BODY ── */
.body{flex:1;overflow:hidden;display:flex;flex-direction:column;}

/* ── SORT BAR ── */
.sort-bar{
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 20px;
  border-bottom:1px solid var(--border);
  background:var(--surface);
}
.sort-label{font-size:10px;color:var(--muted);letter-spacing:.5px;margin-right:4px;}
.sort-chip{
  padding:3px 10px;border-radius:4px;
  font-size:10px;font-weight:600;
  color:var(--sub);background:var(--surface2);
  border:1px solid var(--border);
  cursor:pointer;transition:all .1s;white-space:nowrap;
}
.sort-chip:hover{color:var(--text);}
.sort-chip.active{background:var(--surface3);color:var(--text);border-color:var(--border2);}
.sort-sep{flex:1;}
.result-summary{font-size:10px;color:var(--muted);}

/* ── TABLE ── */
.tbl-wrap{flex:1;overflow:auto;}
table{width:100%;border-collapse:collapse;}
thead{position:sticky;top:0;z-index:10;background:var(--surface2);}
th{
  padding:9px 14px;text-align:left;
  font-size:9px;font-weight:600;color:var(--muted);
  letter-spacing:.7px;text-transform:uppercase;
  border-bottom:1px solid var(--border);white-space:nowrap;
  cursor:pointer;user-select:none;transition:color .1s;
}
th:hover{color:var(--sub);}
th.asc::after{content:' ↑';color:var(--orange);}
th.desc::after{content:' ↓';color:var(--orange);}
td{
  padding:8px 14px;
  border-bottom:1px solid var(--border);
  white-space:nowrap;vertical-align:middle;
}
tbody tr{transition:background .1s;cursor:default;}
tbody tr:hover{background:var(--surface2);}
tbody tr:last-child td{border-bottom:none;}

/* row accent by trigger type */
tbody tr.t-prev td:first-child{border-left:2px solid var(--orange);}
tbody tr.t-avg  td:first-child{border-left:2px solid var(--yellow);}
tbody tr.t-both td:first-child{border-left:2px solid var(--green);}

.sym-cell{font-family:var(--sans);font-weight:700;font-size:12px;}

/* vol ratio bar */
.ratio-wrap{display:flex;align-items:center;gap:8px;}
.ratio-bar-track{
  width:72px;height:5px;border-radius:3px;
  background:var(--border2);overflow:hidden;flex-shrink:0;
}
.ratio-bar-fill{height:100%;border-radius:3px;transition:width .3s;}
.fill-prev{background:var(--orange);}
.fill-avg{background:var(--yellow);}
.fill-both{background:var(--green);}
.ratio-val{font-weight:600;font-size:11px;min-width:36px;}

/* trigger badges */
.badge{
  display:inline-flex;align-items:center;gap:3px;
  font-size:9px;font-weight:700;padding:2px 7px;border-radius:3px;
  letter-spacing:.5px;border:1px solid transparent;
}
.badge-prev{background:var(--orange2);border-color:var(--orange3);color:var(--orange);}
.badge-avg{background:var(--yellow2);border-color:var(--yellow3);color:var(--yellow);}
.badge-both{background:var(--green2);border-color:var(--green3);color:var(--green);}

.tf-pill{
  font-size:9px;font-weight:600;padding:1px 5px;
  border-radius:3px;
}
.tf-pill.h{background:var(--purple2);color:var(--purple);}
.tf-pill.d{background:var(--yellow2);color:var(--yellow);}

/* ── EMPTY ── */
.empty{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  color:var(--muted);gap:8px;padding:40px;
}
.empty-icon{font-size:30px;opacity:.3;}
.empty-title{font-family:var(--sans);font-size:14px;color:var(--border2);}
.empty-sub{font-size:11px;color:var(--muted);text-align:center;line-height:1.7;}

/* ── MOBILE ── */
@media(max-width:640px){
  .header{padding:0 12px;gap:8px;}
  .cond-toggle{display:none;}
  .sort-bar{padding:7px 12px;overflow-x:auto;}
  .stat-cell{padding:7px 14px;}
  .tbl-wrap td,.tbl-wrap th{padding:7px 10px;}
  .ratio-bar-track{width:48px;}
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="logo">
    Vol<span style="color:var(--sub);font-weight:400;">spike</span>
    <span class="logo-tag">SCAN</span>
  </div>

  <div class="header-right">
    <div class="live-badge">
      <div class="dot" id="dot"></div>
      <span id="statusTxt">대기</span>
    </div>

    <!-- 조건 선택 -->
    <div class="cond-toggle">
      <button class="cond-btn active" id="cBoth"   onclick="setCond('both')">전체</button>
      <button class="cond-btn"        id="cPrev"   onclick="setCond('prev')">이전봉 ×5↑</button>
      <button class="cond-btn"        id="cAvg"    onclick="setCond('avg')">MA10 ×3↑</button>
    </div>

    <!-- TF 선택 -->
    <div class="tf-toggle">
      <button class="tf-btn active" id="tfH" onclick="setTF('1h')">1H</button>
      <button class="tf-btn"        id="tfD" onclick="setTF('1d')">1D</button>
    </div>

    <button class="btn-scan" id="scanBtn" onclick="startScan()">스캔 시작</button>
  </div>
</header>

<!-- STAT ROW -->
<div class="stat-row">
  <div class="stat-cell"><div class="sl">전체 심볼</div><div class="sv b" id="sTotal">—</div></div>
  <div class="stat-cell"><div class="sl">타임프레임</div><div class="sv m" id="sTF">1H</div></div>
  <div class="stat-cell"><div class="sl">이전봉 ×5↑</div><div class="sv o" id="sPrev">—</div></div>
  <div class="stat-cell"><div class="sl">MA10 ×3↑</div><div class="sv y" id="sAvg">—</div></div>
  <div class="stat-cell"><div class="sl">양쪽 충족</div><div class="sv g" id="sBoth">—</div></div>
  <div class="stat-cell"><div class="sl">최근 스캔</div><div class="sv m" id="sTime">—</div></div>
</div>

<!-- PROGRESS -->
<div class="prog-bar" id="progBar"><div class="prog-fill" id="progFill"></div></div>
<div class="prog-info hidden" id="progInfo">
  <span class="prog-label" id="progLabel">로딩...</span>
  <span class="prog-sym" id="progSym"></span>
</div>

<!-- BODY -->
<div class="body">

  <!-- SORT BAR -->
  <div class="sort-bar" id="sortBar" style="display:none;">
    <span class="sort-label">정렬</span>
    <button class="sort-chip active" id="chip-prevRatio" onclick="sortBy('prevRatio')">이전봉 배율</button>
    <button class="sort-chip"        id="chip-avgRatio"  onclick="sortBy('avgRatio')">MA10 배율</button>
    <button class="sort-chip"        id="chip-symbol"    onclick="sortBy('symbol')">심볼</button>
    <button class="sort-chip"        id="chip-vol"       onclick="sortBy('vol')">거래량</button>
    <button class="sort-chip"        id="chip-pct"       onclick="sortBy('pct')">봉 변동률</button>
    <div class="sort-sep"></div>
    <span class="result-summary" id="resultSummary"></span>
  </div>

  <!-- EMPTY -->
  <div class="empty" id="emptyState">
    <div class="empty-icon">⚡</div>
    <div class="empty-title">거래량 급등 스캐너</div>
    <div class="empty-sub">
      전체 USDT 무기한 선물을 스캔하여<br>
      이전 봉 대비 <strong style="color:var(--orange)">5배↑</strong> 또는
      거래량 MA10 대비 <strong style="color:var(--yellow)">3배↑</strong><br>
      발생한 심볼을 찾습니다
    </div>
  </div>

  <!-- TABLE -->
  <div class="tbl-wrap" id="tblWrap" style="display:none;">
    <table>
      <thead>
        <tr>
          <th onclick="sortBy('symbol')">심볼</th>
          <th onclick="sortBy('tf')">TF</th>
          <th onclick="sortBy('time')">발생 시간</th>
          <th onclick="sortBy('prevRatio')">이전봉 배율</th>
          <th onclick="sortBy('avgRatio')">MA10 배율</th>
          <th onclick="sortBy('vol')">급등 거래량</th>
          <th onclick="sortBy('prevVol')">이전봉 거래량</th>
          <th onclick="sortBy('avgVol')">거래량 MA10</th>
          <th onclick="sortBy('pct')">봉 변동률</th>
          <th>트리거</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

</div>

<script>
// ── STATE ──
let scanning   = false;
let allResults = [];   // 전체 결과 (필터 전)
let activeInterval = '1h';
let activeCond     = 'both'; // 'both' | 'prev' | 'avg'
let sortKey  = 'prevRatio';
let sortDir  = 'desc';

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ── FORMAT ──
function fVol(v) {
  if (!v || isNaN(v)) return '—';
  if (v >= 1e9) return (v/1e9).toFixed(2)+'B';
  if (v >= 1e6) return (v/1e6).toFixed(2)+'M';
  if (v >= 1e3) return (v/1e3).toFixed(1)+'K';
  return v.toFixed(0);
}
function fTime(ts, interval) {
  const d = new Date(ts);
  const mo = String(d.getMonth()+1).padStart(2,'0');
  const dy = String(d.getDate()).padStart(2,'0');
  if (interval === '1d') return `${String(d.getFullYear()).slice(2)}/${mo}/${dy}`;
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  return `${mo}/${dy} ${hh}:${mm}`;
}
function fPct(p) {
  if (p === null || isNaN(p)) return '—';
  const sign = p >= 0 ? '+' : '';
  return `${sign}${p.toFixed(2)}%`;
}
function pctColor(p) {
  if (p > 0) return 'color:var(--green)';
  if (p < 0) return 'color:var(--red)';
  return 'color:var(--sub)';
}

// ── STATUS ──
function setStatus(state, txt) {
  $('dot').className = 'dot' + (state ? ' '+state : '');
  $('statusTxt').textContent = txt;
}
function setProgress(pct, label, sym) {
  $('progFill').style.width = pct + '%';
  if (label !== undefined) $('progLabel').textContent = label;
  if (sym   !== undefined) $('progSym').textContent   = sym;
}

// ── TF / COND ──
function setTF(tf) {
  if (scanning) return;
  activeInterval = tf;
  $('tfH').classList.toggle('active', tf === '1h');
  $('tfD').classList.toggle('active', tf === '1d');
  $('sTF').textContent = tf === '1h' ? '1H' : '1D';
}

function setCond(cond) {
  if (scanning) return;
  activeCond = cond;
  ['both','prev','avg'].forEach(c => $('c'+c.charAt(0).toUpperCase()+c.slice(1)).classList.toggle('active', c === cond));
  renderTable();
}

// ── BINANCE API ──
async function fetchSymbols() {
  const r = await fetch('https://fapi.binance.com/fapi/v1/exchangeInfo');
  if (!r.ok) throw new Error('exchangeInfo 실패');
  const d = await r.json();
  return d.symbols
    .filter(s => s.quoteAsset==='USDT' && s.status==='TRADING' && s.contractType==='PERPETUAL')
    .map(s => s.symbol);
}
async function fetchKlines(sym, interval, limit) {
  const r = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${sym}&interval=${interval}&limit=${limit}`);
  if (!r.ok) throw new Error('klines');
  return r.json();
}

// ── CORE ANALYSIS ──
// 최근 20봉 내에서 조건 충족 봉 탐색 (가장 최근 것 기준)
function analyzeVolume(klines) {
  // 최소 11봉 필요 (MA10 계산)
  if (klines.length < 11) return null;

  const recent = klines.slice(-20);          // 최근 20봉
  const allVols = klines.map(k => parseFloat(k[5]));

  // 최근 봉부터 역순으로 탐색해 가장 최근 급등봉 찾기
  for (let ri = recent.length - 1; ri >= 1; ri--) {
    const globalIdx = klines.length - 20 + ri;
    if (globalIdx < 10) continue; // MA10 계산 불가

    const curVol  = parseFloat(recent[ri][5]);
    const prevVol = parseFloat(recent[ri - 1][5]);

    // 이전 10봉 평균 (현재봉 제외)
    const prev10 = allVols.slice(globalIdx - 10, globalIdx);
    const avgVol = prev10.reduce((a,b) => a+b, 0) / prev10.length;

    if (avgVol === 0 || prevVol === 0) continue;

    const prevRatio = curVol / prevVol;   // 이전봉 대비 배율
    const avgRatio  = curVol / avgVol;    // MA10 대비 배율

    const trigPrev = prevRatio >= 5;
    const trigAvg  = avgRatio  >= 3;

    if (!trigPrev && !trigAvg) continue;

    // 봉 변동률
    const open  = parseFloat(recent[ri][1]);
    const close = parseFloat(recent[ri][4]);
    const pct   = open > 0 ? (close - open) / open * 100 : null;

    return {
      openTime: recent[ri][0],
      vol:      curVol,
      prevVol,
      avgVol,
      prevRatio,
      avgRatio,
      trigPrev,
      trigAvg,
      pct,
    };
  }
  return null;
}

// ── RENDER ──
function filteredResults() {
  return allResults.filter(r => {
    if (activeCond === 'prev') return r.trigPrev;
    if (activeCond === 'avg')  return r.trigAvg;
    return true; // 'both' = 전체 (trigPrev OR trigAvg 중 하나 이상 = 이미 포함된 것)
  });
}

function updateStats() {
  const prev = allResults.filter(r => r.trigPrev).length;
  const avg  = allResults.filter(r => r.trigAvg).length;
  const both = allResults.filter(r => r.trigPrev && r.trigAvg).length;
  $('sPrev').textContent = prev || '—';
  $('sAvg').textContent  = avg  || '—';
  $('sBoth').textContent = both || '—';
}

function renderTable() {
  let rows = filteredResults();

  // 정렬
  rows.sort((a, b) => {
    let va, vb;
    switch (sortKey) {
      case 'symbol':    va = a.symbol;    vb = b.symbol;    break;
      case 'tf':        va = a.interval;  vb = b.interval;  break;
      case 'time':      va = a.openTime;  vb = b.openTime;  break;
      case 'prevRatio': va = a.prevRatio; vb = b.prevRatio; break;
      case 'avgRatio':  va = a.avgRatio;  vb = b.avgRatio;  break;
      case 'vol':       va = a.vol;       vb = b.vol;       break;
      case 'prevVol':   va = a.prevVol;   vb = b.prevVol;   break;
      case 'avgVol':    va = a.avgVol;    vb = b.avgVol;    break;
      case 'pct':       va = a.pct ?? -Infinity; vb = b.pct ?? -Infinity; break;
      default:          va = a.prevRatio; vb = b.prevRatio;
    }
    if (typeof va === 'string') return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
    return sortDir === 'asc' ? va - vb : vb - va;
  });

  // 헤더 정렬 표시
  document.querySelectorAll('th').forEach(th => th.classList.remove('asc', 'desc'));
  const thKeys = ['symbol','tf','time','prevRatio','avgRatio','vol','prevVol','avgVol','pct','trigger'];
  const thIdx  = thKeys.indexOf(sortKey);
  if (thIdx >= 0) {
    document.querySelectorAll('th')[thIdx]?.classList.add(sortDir === 'asc' ? 'asc' : 'desc');
  }

  // sort chip 표시
  document.querySelectorAll('.sort-chip').forEach(c => c.classList.remove('active'));
  const sc = $('chip-' + sortKey);
  if (sc) sc.classList.add('active');

  const tbody = $('tbody');
  tbody.innerHTML = '';

  if (!rows.length) {
    $('tblWrap').style.display  = 'none';
    $('sortBar').style.display  = 'none';
    $('emptyState').style.display = 'flex';
    $('emptyState').querySelector('.empty-title').textContent = '조건 충족 없음';
    $('emptyState').querySelector('.empty-sub').innerHTML =
      '현재 필터 조건에 맞는 심볼이 없습니다.<br>타임프레임이나 조건을 변경해보세요.';
    return;
  }

  $('emptyState').style.display = 'none';
  $('tblWrap').style.display    = 'block';
  $('sortBar').style.display    = 'flex';
  $('resultSummary').textContent = `${rows.length}개 심볼`;

  rows.forEach(r => {
    const rowClass = r.trigPrev && r.trigAvg ? 't-both' : r.trigPrev ? 't-prev' : 't-avg';
    const fillClass = r.trigPrev && r.trigAvg ? 'fill-both' : r.trigPrev ? 'fill-prev' : 'fill-avg';

    // 배율 바 (이전봉: 최대 30x 기준, MA10: 최대 15x 기준)
    const prevBarW = Math.min((r.prevRatio / 30) * 100, 100).toFixed(1);
    const avgBarW  = Math.min((r.avgRatio  / 15) * 100, 100).toFixed(1);

    // 트리거 배지
    let badges = '';
    if (r.trigPrev && r.trigAvg)
      badges = '<span class="badge badge-both">이전봉+MA10</span>';
    else if (r.trigPrev)
      badges = '<span class="badge badge-prev">이전봉 ×5↑</span>';
    else
      badges = '<span class="badge badge-avg">MA10 ×3↑</span>';

    const tfClass = r.interval === '1d' ? 'd' : 'h';
    const tfLabel = r.interval === '1d' ? '1D' : '1H';

    const tr = document.createElement('tr');
    tr.className = rowClass;
    tr.innerHTML = `
      <td class="sym-cell">${r.symbol}</td>
      <td><span class="tf-pill ${tfClass}">${tfLabel}</span></td>
      <td style="color:var(--sub)">${fTime(r.openTime, r.interval)}</td>
      <td>
        <div class="ratio-wrap">
          <div class="ratio-bar-track"><div class="ratio-bar-fill ${fillClass}" style="width:${prevBarW}%"></div></div>
          <span class="ratio-val" style="color:var(--orange)">${r.prevRatio.toFixed(1)}×</span>
        </div>
      </td>
      <td>
        <div class="ratio-wrap">
          <div class="ratio-bar-track"><div class="ratio-bar-fill ${r.trigAvg ? 'fill-avg' : ''}" style="width:${avgBarW}%;background:${r.trigAvg?'var(--yellow)':'var(--border2)'}"></div></div>
          <span class="ratio-val" style="color:${r.trigAvg?'var(--yellow)':'var(--muted)'}">${r.avgRatio.toFixed(1)}×</span>
        </div>
      </td>
      <td style="color:var(--text);font-weight:600">${fVol(r.vol)}</td>
      <td style="color:var(--sub)">${fVol(r.prevVol)}</td>
      <td style="color:var(--sub)">${fVol(r.avgVol)}</td>
      <td style="${pctColor(r.pct)}">${fPct(r.pct)}</td>
      <td>${badges}</td>
    `;
    tbody.appendChild(tr);
  });
}

// ── SORT ──
function sortBy(key) {
  if (sortKey === key) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  else { sortKey = key; sortDir = 'desc'; }
  renderTable();
}

// ── SCAN ──
async function startScan() {
  if (scanning) return;
  scanning = true;

  const btn = $('scanBtn');
  btn.disabled = true;
  btn.textContent = '스캔 중...';
  setStatus('scanning', '스캔 중');

  $('progBar').classList.add('active');
  $('progInfo').classList.remove('hidden');
  $('progInfo').classList.add('active');

  allResults = [];
  $('tbody').innerHTML = '';
  $('tblWrap').style.display  = 'none';
  $('sortBar').style.display  = 'none';
  $('emptyState').style.display = 'flex';
  $('emptyState').querySelector('.empty-title').textContent = '스캔 중...';
  $('emptyState').querySelector('.empty-sub').innerHTML = '전체 심볼을 분석하고 있습니다';
  $('sPrev').textContent = '—';
  $('sAvg').textContent  = '—';
  $('sBoth').textContent = '—';

  const interval = activeInterval;
  $('sTF').textContent = interval === '1h' ? '1H' : '1D';

  try {
    setProgress(0, '심볼 목록 불러오는 중...');
    const symbols = await fetchSymbols();
    $('sTotal').textContent = symbols.length;
    setProgress(2, `${symbols.length}개 심볼 · ${interval.toUpperCase()} 스캔 시작`);

    const BATCH = 8;
    for (let i = 0; i < symbols.length; i += BATCH) {
      const batch = symbols.slice(i, i + BATCH);
      await Promise.all(batch.map(sym => scanOne(sym, interval)));

      const pct = 2 + ((i + BATCH) / symbols.length) * 96;
      setProgress(Math.min(pct, 98),
        `${Math.min(i + BATCH, symbols.length)} / ${symbols.length} 스캔 중`,
        batch.join('  '));

      if (allResults.length > 0) {
        updateStats();
        renderTable();
      }
      await sleep(50);
    }

    setProgress(100, '완료');
    updateStats();
    renderTable();

    const now = new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'});
    $('sTime').textContent = now;
    setStatus('live', `${interval.toUpperCase()} · 완료 ${now}`);

  } catch (e) {
    console.error(e);
    setStatus('', '오류');
    $('emptyState').style.display = 'flex';
    $('emptyState').querySelector('.empty-title').textContent = '오류 발생';
    $('emptyState').querySelector('.empty-sub').innerHTML = e.message;
  }

  $('progBar').classList.remove('active');
  $('progInfo').classList.add('hidden');
  $('progInfo').classList.remove('active');
  scanning  = false;
  btn.disabled = false;
  btn.textContent = '다시 스캔';
}

async function scanOne(symbol, interval) {
  try {
    // 최근 20봉 + MA10 계산용 여유분 = 35봉으로 충분
    const klines = await fetchKlines(symbol, interval, 35);
    if (klines.length < 11) return;

    const result = analyzeVolume(klines);
    if (!result) return;

    allResults.push({ symbol, interval, ...result });
  } catch {}
}
</script>
