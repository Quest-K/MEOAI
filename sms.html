<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>온기(On-Gi) | 피싱 생존율 테스트</title>
    <style>
        /* 감성적인 웜 베이지 톤앤매너 디자인 */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #FDFBF7;
            color: #4A3E3D;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 420px; /* 모바일 최적화 레이아웃 */
            background: #FFFFFF;
            padding: 40px 24px;
            box-shadow: 0px 10px 30px rgba(74, 62, 61, 0.05);
            border-radius: 24px;
            text-align: center;
            box-sizing: border-box;
        }
        .brand-name {
            font-size: 14px;
            color: #C08C73;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        h1 {
            font-size: 26px;
            font-weight: 700;
            line-height: 1.4;
            margin: 0 0 16px 0;
        }
        .desc {
            font-size: 15px;
            color: #8A7E7C;
            line-height: 1.6;
            margin-bottom: 40px;
        }
        /* 문자 메시지 시뮬레이션 UI */
        .chat-box {
            background-color: #F4F1EA;
            border-radius: 16px;
            padding: 16px;
            text-align: left;
            margin-bottom: 30px;
            font-size: 14px;
            line-height: 1.5;
            box-shadow: inset 0px 2px 5px rgba(0,0,0,0.03);
        }
        .chat-tag {
            font-size: 11px;
            color: #E74C3C;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .chat-link {
            color: #2980B9;
            text-decoration: underline;
            word-break: break-all;
        }
        /* 버튼 디자인 */
        .btn {
            background-color: #4A3E3D;
            color: #FFFFFF;
            border: none;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            margin-bottom: 12px;
        }
        .btn:hover {
            background-color: #635352;
        }
        .btn-select {
            background-color: #FFFFFF;
            color: #4A3E3D;
            border: 2px solid #EAE5DC;
        }
        .btn-select:hover {
            background-color: #FDFBF7;
            border-color: #C08C73;
        }
        /* 화면 전환용 클래스 */
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <!-- 1. 홈 화면 (시작 페이지) -->
    <div id="start-page" class="container">
        <div class="brand-name">디지털 소도어스 : 온기</div>
        <h1>나와 우리 부모님의<br>피싱 생존율 테스트</h1>
        <p class="desc">더 교묘해진 디지털 범죄 세상,<br>과연 당신은 피싱으로부터 안전할까요?<br>실제 상황처럼 테스트해 보세요.</p>
        <button class="btn" onclick="startTest()">테스트 시작하기</button>
    </div>

    <!-- 2. 문제 화면 (1번 문항 샘플) -->
    <div id="question-page" class="container hidden">
        <div class="brand-name">Q1. 낯선 연락</div>
        <h1>이런 문자가 온다면<br>어떻게 하시겠습니까?</h1>
        
        <!-- 가상 스미싱 문자창 -->
        <div class="chat-box">
            <div class="chat-tag">[국민건강보험]</div>
            [국민건강보험] 일반 검진 대상자 통보서 발송 완료. 미수령 확인 및 상세 내용 조회는 아래 주소에서 확인해 주세요.<br>
            <span class="chat-link">nhis.co.kr.infodetail.net/g/3820</span>
        </div>

        <!-- 선택지 버튼 -->
        <button class="btn btn-select" onclick="nextStep()">"내가 건강검진을 받았었나?" 하고 링크를 눌러본다.</button>
        <button class="btn btn-select" onclick="nextStep()">문자를 무시하고 건보공단 공식 고객센터로 전화해 확인한다.</button>
    </div>

    <script>
        // 화면 전환 함수
        function startTest() {
            document.getElementById('start-page').classList.add('hidden');
            document.getElementById('question-page').classList.remove('hidden');
        }

        function nextStep() {
            alert("데모 페이지입니다. 2번 문항과 [유료 실제 문자 신청] 페이지로 연결되는 로직을 구현할 수 있습니다.");
        }
    </script>
</body>
</html>
