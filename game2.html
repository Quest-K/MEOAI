<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도형 그리기 정확도 게임 MVP</title>
    <style>
        * { box-sizing: border-box; }
        body {
            text-align: center;
            font-family: sans-serif;
            background: #f0f0f0;
            margin: 0;
            padding: 20px 10px 40px;
        }
        .screen { display: none; }
        .screen.active { display: block; }

        /* ---- 홈 화면(난이도 선택) ---- */
        #home-title { font-size: 26px; margin-bottom: 4px; }
        #home-subtitle { color: #666; margin-bottom: 24px; }

        .difficulty-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 420px;
            margin: 0 auto;
        }
        .difficulty-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 20px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            text-align: left;
            font-family: inherit;
            transition: transform 0.12s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        .difficulty-card:active { transform: scale(0.98); }
        .difficulty-icon { font-size: 30px; flex-shrink: 0; }
        .difficulty-text { flex: 1; }
        .difficulty-name { font-size: 18px; font-weight: bold; margin-bottom: 2px; }
        .difficulty-desc { font-size: 13px; opacity: 0.85; }
        .difficulty-badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 20px;
            background: rgba(255,255,255,0.6);
            white-space: nowrap;
        }

        .card-easy   { background: #d7f2df; color: #1c5c33; }
        .card-medium { background: #ffe9c2; color: #7a4d00; }
        .card-hard   { background: #ffd7b3; color: #7a3d00; }
        .card-nukki  { background: #ffd7d7; color: #7a1c1c; }

        /* ---- 공통 상단바 ---- */
        .top-bar {
            max-width: 420px;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }
        .back-btn {
            padding: 8px 14px;
            font-size: 14px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: #fff;
            cursor: pointer;
        }

        /* ---- 도형 선택 화면 ---- */
        .select-title { font-size: 20px; font-weight: bold; margin: 6px 0 18px; }
        .shape-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            max-width: 420px;
            margin: 0 auto 16px;
        }
        .shape-btn {
            padding: 20px 10px;
            border-radius: 12px;
            border: none;
            background: #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            cursor: pointer;
            font-size: 15px;
            font-family: inherit;
            color: #333;
        }
        .shape-btn:active { transform: scale(0.97); }
        .shape-btn .icon { font-size: 28px; display: block; margin-bottom: 6px; }
        .random-btn {
            max-width: 420px;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: #333;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 4px auto 0;
            display: block;
        }
        .random-btn:active { transform: scale(0.98); }

        /* ---- 게임 화면 ---- */
        #game-mode-label { font-size: 14px; color: #777; margin-bottom: 6px; }
        #instruction-text { font-size: 14px; color: #444; margin: 4px 0; }
        #elapsed-label { font-size: 22px; font-weight: bold; color: #333; margin: 8px 0; font-variant-numeric: tabular-nums; }
        #canvas-container { position: relative; display: inline-block; margin-top: 6px; }
        canvas { border: 2px solid #333; background: #fff; cursor: crosshair; touch-action: none; max-width: 90vw; }
        button.primary { padding: 10px 20px; font-size: 16px; cursor: pointer; margin-top: 6px; border: none; border-radius: 8px; background: #333; color: #fff; }
        #shape-label { font-size: 20px; font-weight: bold; color: #333; margin-top: 6px; }

        /* ---- 준비중 화면(어려움 / 누끼) ---- */
        .coming-soon-box {
            max-width: 420px;
            margin: 60px auto 0;
            padding: 40px 20px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        .coming-soon-emoji { font-size: 48px; margin-bottom: 12px; }
        .coming-soon-title { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
        .coming-soon-desc { color: #666; font-size: 14px; line-height: 1.5; }
        .upload-btn {
            margin-top: 20px;
            padding: 12px 22px;
            font-size: 15px;
            border-radius: 8px;
            border: none;
            background: #ccc;
            color: #666;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <!-- ================= 홈 화면: 난이도 선택 ================= -->
    <div id="screen-home" class="screen active">
        <h1 id="home-title">도형 그리기 게임 🎯</h1>
        <p id="home-subtitle">난이도를 선택하세요</p>

        <div class="difficulty-list">
            <button class="difficulty-card card-easy" onclick="showScreen('easy-select')">
                <div class="difficulty-icon">🟢</div>
                <div class="difficulty-text">
                    <div class="difficulty-name">쉬움</div>
                    <div class="difficulty-desc">동그라미, 사각형, 삼각형, 일직선, 곡선</div>
                </div>
                <div class="difficulty-badge">시작 가능</div>
            </button>

            <button class="difficulty-card card-medium" onclick="showScreen('medium-select')">
                <div class="difficulty-icon">🟡</div>
                <div class="difficulty-text">
                    <div class="difficulty-name">보통</div>
                    <div class="difficulty-desc">오각형, 육각형, 팔각형, 12각형, 별모양</div>
                </div>
                <div class="difficulty-badge">시작 가능</div>
            </button>

            <button class="difficulty-card card-hard" onclick="showScreen('hard')">
                <div class="difficulty-icon">🟠</div>
                <div class="difficulty-text">
                    <div class="difficulty-name">어려움</div>
                    <div class="difficulty-desc">기하학 무늬</div>
                </div>
                <div class="difficulty-badge">준비중</div>
            </button>

            <button class="difficulty-card card-nukki" onclick="showScreen('nukki')">
                <div class="difficulty-icon">🔴</div>
                <div class="difficulty-text">
                    <div class="difficulty-name">누끼</div>
                    <div class="difficulty-desc">내 사진으로 실루엣 따기</div>
                </div>
                <div class="difficulty-badge">준비중</div>
            </button>
        </div>
    </div>

    <!-- ================= 쉬움: 도형 선택 ================= -->
    <div id="screen-easy-select" class="screen">
        <div class="top-bar">
            <button class="back-btn" onclick="showScreen('home')">← 난이도 선택</button>
        </div>
        <div class="select-title">쉬움 - 도형 선택</div>
        <div class="shape-grid" id="easy-shape-grid"></div>
        <button class="random-btn" onclick="startWithShape('easy','random')">🎲 랜덤으로 시작</button>
    </div>

    <!-- ================= 보통: 도형 선택 ================= -->
    <div id="screen-medium-select" class="screen">
        <div class="top-bar">
            <button class="back-btn" onclick="showScreen('home')">← 난이도 선택</button>
        </div>
        <div class="select-title">보통 - 도형 선택</div>
        <div class="shape-grid" id="medium-shape-grid"></div>
        <button class="random-btn" onclick="startWithShape('medium','random')">🎲 랜덤으로 시작</button>
    </div>

    <!-- ================= 게임 화면 (쉬움/보통 공용) ================= -->
    <div id="screen-game" class="screen">
        <div class="top-bar">
            <button class="back-btn" onclick="goBackToSelect()">← 도형 다시 선택</button>
        </div>

        <div id="game-mode-label"></div>
        <p id="instruction-text"></p>

        <button id="start-btn" class="primary">도전하기</button>

        <div id="shape-label"></div>
        <div id="elapsed-label">경과 시간: 0.00초</div>

        <div id="canvas-container">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
        </div>

        <h2 id="result-text"></h2>
    </div>

    <!-- ================= 어려움: 기하학 무늬 (준비중) ================= -->
    <div id="screen-hard" class="screen">
        <div class="top-bar">
            <button class="back-btn" onclick="showScreen('home')">← 난이도 선택</button>
        </div>

        <div class="coming-soon-box">
            <div class="coming-soon-emoji">🟠</div>
            <div class="coming-soon-title">기하학 무늬 모드</div>
            <div class="coming-soon-desc">
                만다라, 나선 등 복잡한 기하학 무늬를<br>
                따라 그리는 모드를 준비 중입니다.<br>
                조금만 기다려주세요!
            </div>
        </div>
    </div>

    <!-- ================= 누끼: 사진 실루엣 (준비중) ================= -->
    <div id="screen-nukki" class="screen">
        <div class="top-bar">
            <button class="back-btn" onclick="showScreen('home')">← 난이도 선택</button>
        </div>

        <div class="coming-soon-box">
            <div class="coming-soon-emoji">🔴</div>
            <div class="coming-soon-title">누끼 모드</div>
            <div class="coming-soon-desc">
                본인 사진을 업로드하면 윤곽선(누끼)을 추출해서<br>
                그 실루엣을 따라 그리는 모드를 준비 중입니다.
            </div>
            <button class="upload-btn" disabled>사진 업로드 (준비중)</button>
        </div>
    </div>

    <script>
        // ================= 도형 데이터 정의 =================
        const SHAPE_SETS = {
            easy:   ['circle', 'square', 'triangle', 'line', 'curve'],
            medium: ['pentagon', 'hexagon', 'octagon', 'dodecagon', 'star']
        };

        const SHAPE_INFO = {
            circle:    { label: '동그라미', icon: '⚪' },
            square:    { label: '사각형',   icon: '⬜' },
            triangle:  { label: '삼각형',   icon: '🔺' },
            line:      { label: '일직선',   icon: '➖' },
            curve:     { label: '곡선',     icon: '〰️' },
            pentagon:  { label: '오각형',   icon: '⬟' },
            hexagon:   { label: '육각형',   icon: '⬡' },
            octagon:   { label: '팔각형',   icon: '🛑' },
            dodecagon: { label: '12각형',   icon: '⚙️' },
            star:      { label: '별모양',   icon: '⭐' }
        };

        // 열린 도형(선/곡선) 목록 - 빨간점->파란점 방식
        const OPEN_SHAPES = ['line', 'curve'];

        const DIFFICULTY_LABEL = { easy: '쉬움', medium: '보통' };

        // ================= 화면 전환 =================
        function showScreen(name) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById('screen-' + name).classList.add('active');

            if (name !== 'game') {
                stopGameCleanup();
            }
        }

        function goBackToSelect() {
            showScreen(selectedDifficulty === 'medium' ? 'medium-select' : 'easy-select');
        }

        // ================= 도형 선택 그리드 생성 =================
        function buildShapeGrid(difficulty) {
            const grid = document.getElementById(difficulty + '-shape-grid');
            grid.innerHTML = '';
            SHAPE_SETS[difficulty].forEach(shapeKey => {
                const info = SHAPE_INFO[shapeKey];
                const btn = document.createElement('button');
                btn.className = 'shape-btn';
                btn.innerHTML = `<span class="icon">${info.icon}</span>${info.label}`;
                btn.onclick = () => startWithShape(difficulty, shapeKey);
                grid.appendChild(btn);
            });
        }
        buildShapeGrid('easy');
        buildShapeGrid('medium');

        // ================= 게임 상태 =================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const resultText = document.getElementById('result-text');
        const shapeLabel = document.getElementById('shape-label');
        const gameModeLabel = document.getElementById('game-mode-label');
        const instructionText = document.getElementById('instruction-text');
        const elapsedLabel = document.getElementById('elapsed-label');

        let isDrawing = false;   // 손가락/마우스가 눌려있는 상태
        let armed = false;       // '도전하기'를 눌러 대기 중인 상태
        let gameActive = false;  // 빨간점을 찍고 실제로 타이밍 측정 중인 상태
        let hasLeftStart = false; // 닫힌 도형에서 시작점을 벗어났는지 여부

        let userPoints = [];
        let guidePoints = [];
        let guideVertices = [];
        let guideStart = null;
        let guideEnd = null;     // 열린 도형에서만 사용
        let currentShape = 'circle';
        let shapeRenderType = 'polygon'; // 'circle' | 'polygon' | 'open'
        let selectedDifficulty = 'easy';
        let selectedShapeChoice = 'random';

        let startTimestamp = 0;
        let elapsedInterval;

        const HIT_RADIUS = 26;      // 시작/종료점 인식 반경(px, 캔버스 내부 좌표 기준)
        const LEAVE_THRESHOLD = 45; // 닫힌 도형에서 "시작점을 벗어났다"고 볼 거리

        const centerX = 200;
        const centerY = 200;

        function dist(a, b) {
            return Math.sqrt(Math.pow(a.x - b.x, 2) + Math.pow(a.y - b.y, 2));
        }

        // ---- 도형 정점/좌표 생성 헬퍼 ----
        function polygonVertices(sides, rx, ry, startAngleDeg) {
            const verts = [];
            for (let i = 0; i < sides; i++) {
                const angle = (startAngleDeg + i * 360 / sides) * Math.PI / 180;
                verts.push({
                    x: centerX + rx * Math.cos(angle),
                    y: centerY + ry * Math.sin(angle)
                });
            }
            return verts;
        }

        function starVertices(outerR, innerR, points, startAngleDeg) {
            const verts = [];
            const totalPoints = points * 2;
            for (let i = 0; i < totalPoints; i++) {
                const r = (i % 2 === 0) ? outerR : innerR;
                const angle = (startAngleDeg + i * 360 / totalPoints) * Math.PI / 180;
                verts.push({
                    x: centerX + r * Math.cos(angle),
                    y: centerY + r * Math.sin(angle)
                });
            }
            return verts;
        }

        function interpolateClosedPath(verts, pointsPerEdge) {
            const pts = [];
            for (let i = 0; i < verts.length; i++) {
                const a = verts[i];
                const b = verts[(i + 1) % verts.length];
                for (let t = 0; t < pointsPerEdge; t++) {
                    const f = t / pointsPerEdge;
                    pts.push({ x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f });
                }
            }
            return pts;
        }

        function interpolateOpenPath(verts, pointsPerEdge) {
            const pts = [];
            for (let i = 0; i < verts.length - 1; i++) {
                const a = verts[i];
                const b = verts[i + 1];
                for (let t = 0; t < pointsPerEdge; t++) {
                    const f = t / pointsPerEdge;
                    pts.push({ x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f });
                }
            }
            pts.push(verts[verts.length - 1]);
            return pts;
        }

        function circlePoints(rx, ry) {
            const pts = [];
            for (let i = 0; i < 360; i += 5) {
                const angle = (i * Math.PI) / 180;
                pts.push({ x: centerX + rx * Math.cos(angle), y: centerY + ry * Math.sin(angle) });
            }
            return pts;
        }

        function curvePoints() {
            const pts = [];
            for (let x = 60; x <= 340; x += 4) {
                const y = centerY + 60 * Math.sin(((x - 60) / 280) * Math.PI * 2);
                pts.push({ x: x, y: y });
            }
            return pts;
        }

        // ================= 가이드 도형 생성 =================
        function generateGuide(shape) {
            currentShape = shape;
            guideVertices = [];
            guideStart = null;
            guideEnd = null;

            switch (shape) {
                case 'circle':
                    guidePoints = circlePoints(120, 120);
                    shapeRenderType = 'circle';
                    guideStart = guidePoints[0];
                    break;
                case 'square':
                    guideVertices = polygonVertices(4, 120, 120, 45);
                    guidePoints = interpolateClosedPath(guideVertices, 30);
                    shapeRenderType = 'polygon';
                    guideStart = guideVertices[0];
                    break;
                case 'triangle':
                    guideVertices = polygonVertices(3, 130, 130, -90);
                    guidePoints = interpolateClosedPath(guideVertices, 30);
                    shapeRenderType = 'polygon';
                    guideStart = guideVertices[0];
                    break;
                case 'line':
                    guideVertices = [{ x: 70, y: 200 }, { x: 330, y: 200 }];
                    guidePoints = interpolateOpenPath(guideVertices, 60);
                    shapeRenderType = 'open';
                    guideStart = guideVertices[0];
                    guideEnd = guideVertices[guideVertices.length - 1];
                    break;
                case 'curve':
                    guidePoints = curvePoints();
                    guideVertices = guidePoints;
                    shapeRenderType = 'open';
                    guideStart = guidePoints[0];
                    guideEnd = guidePoints[guidePoints.length - 1];
                    break;
                case 'pentagon':
                    guideVertices = polygonVertices(5, 125, 125, -90);
                    guidePoints = interpolateClosedPath(guideVertices, 25);
                    shapeRenderType = 'polygon';
                    guideStart = guideVertices[0];
                    break;
                case 'hexagon':
                    guideVertices = polygonVertices(6, 125, 125, -90);
                    guidePoints = interpolateClosedPath(guideVertices, 22);
                    shapeRenderType = 'polygon';
                    guideStart = guideVertices[0];
                    break;
                case 'octagon':
                    guideVertices = polygonVertices(8, 125, 125, -67.5);
                    guidePoints = interpolateClosedPath(guideVertices, 18);
                    shapeRenderType = 'polygon';
                    guideStart = guideVertices[0];
                    break;
                case 'dodecagon':
                    guideVertices = polygonVertices(12, 130, 130, -90);
                    guidePoints = interpolateClosedPath(guideVertices, 12);
                    shapeRenderType = 'polygon';
                    guideStart = guideVertices[0];
                    break;
                case 'star':
                    guideVertices = starVertices(135, 55, 5, -90);
                    guidePoints = interpolateClosedPath(guideVertices, 12);
                    shapeRenderType = 'polygon';
                    guideStart = guideVertices[0];
                    break;
                default:
                    guidePoints = circlePoints(120, 120);
                    shapeRenderType = 'circle';
                    guideStart = guidePoints[0];
            }
        }

        function isOpenShape(shape) {
            return OPEN_SHAPES.indexOf(shape) !== -1;
        }

        // ================= 그리기 =================
        function drawGuide() {
            ctx.strokeStyle = '#aaa';
            ctx.lineWidth = 3;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();

            if (shapeRenderType === 'circle') {
                ctx.arc(centerX, centerY, 120, 0, Math.PI * 2);
            } else if (guideVertices.length > 0) {
                ctx.moveTo(guideVertices[0].x, guideVertices[0].y);
                for (let i = 1; i < guideVertices.length; i++) {
                    ctx.lineTo(guideVertices[i].x, guideVertices[i].y);
                }
                if (shapeRenderType === 'polygon') {
                    ctx.closePath();
                }
            }

            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawDot(point, color) {
            if (!point) return;
            ctx.beginPath();
            ctx.arc(point.x, point.y, 9, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#fff';
            ctx.stroke();
        }

        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (guidePoints.length > 0 || guideVertices.length > 0) {
                drawGuide();
                drawDot(guideStart, '#e53935'); // 빨간점: 시작
                if (guideEnd) {
                    drawDot(guideEnd, '#1e88e5'); // 파란점: 종료 (열린 도형만)
                }
            }

            if (userPoints.length > 1) {
                ctx.strokeStyle = '#222';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(userPoints[0].x, userPoints[0].y);
                for (let i = 1; i < userPoints.length; i++) {
                    ctx.lineTo(userPoints[i].x, userPoints[i].y);
                }
                ctx.stroke();
            }
        }

        // ================= 도형/난이도 선택 -> 게임 진입 =================
        function startWithShape(difficulty, shapeKey) {
            selectedDifficulty = difficulty;
            selectedShapeChoice = shapeKey;

            userPoints = [];
            guidePoints = [];
            guideVertices = [];
            guideStart = null;
            guideEnd = null;
            resultText.innerText = '';
            shapeLabel.innerText = '';
            instructionText.innerText = '';
            elapsedLabel.innerText = '경과 시간: 0.00초';
            armed = false;
            gameActive = false;
            drawCanvas();

            const shapeText = shapeKey === 'random' ? '랜덤' : SHAPE_INFO[shapeKey].label;
            gameModeLabel.innerText = `${DIFFICULTY_LABEL[difficulty]} · ${shapeText}`;

            showScreen('game');
        }

        // ================= 도전하기 (새 시도 준비) =================
        startBtn.addEventListener('click', () => {
            let shapeToUse;
            if (selectedShapeChoice === 'random') {
                const pool = SHAPE_SETS[selectedDifficulty];
                shapeToUse = pool[Math.floor(Math.random() * pool.length)];
            } else {
                shapeToUse = selectedShapeChoice;
            }

            generateGuide(shapeToUse);
            shapeLabel.innerText = `그려야 할 도형: ${SHAPE_INFO[shapeToUse].label}`;
            instructionText.innerText = isOpenShape(shapeToUse)
                ? '🔴 빨간점에서 시작해서 🔵 파란점까지 그리세요!'
                : '🔴 빨간점에서 시작해서 한 바퀴 돌아 다시 빨간점으로 돌아오세요!';

            userPoints = [];
            hasLeftStart = false;
            gameActive = false;
            armed = true;
            resultText.innerText = '';
            elapsedLabel.innerText = '경과 시간: 0.00초';
            clearInterval(elapsedInterval);

            drawCanvas();
        });

        // ================= 완주 판정 =================
        function checkCompletion(pos) {
            if (isOpenShape(currentShape)) {
                if (guideEnd && dist(pos, guideEnd) <= HIT_RADIUS) {
                    completeAttempt();
                }
            } else {
                const d = dist(pos, guideStart);
                if (d > LEAVE_THRESHOLD) {
                    hasLeftStart = true;
                }
                if (hasLeftStart && d <= HIT_RADIUS) {
                    completeAttempt();
                }
            }
        }

        function completeAttempt() {
            gameActive = false;
            armed = false;
            isDrawing = false;
            clearInterval(elapsedInterval);

            const elapsedSec = (Date.now() - startTimestamp) / 1000;
            elapsedLabel.innerText = `경과 시간: ${elapsedSec.toFixed(2)}초`;

            let totalError = 0;
            userPoints.forEach(uPt => {
                let minDst = Infinity;
                guidePoints.forEach(gPt => {
                    const dst = Math.pow(uPt.x - gPt.x, 2) + Math.pow(uPt.y - gPt.y, 2);
                    if (dst < minDst) minDst = dst;
                });
                totalError += Math.sqrt(minDst);
            });
            const avgError = totalError / userPoints.length;
            const accuracy = Math.max(0, 100 - (avgError * 2));

            resultText.innerText = `⏱ ${elapsedSec.toFixed(2)}초 · 정확도 ${accuracy.toFixed(1)}% ✨`;
        }

        function abortAttempt() {
            gameActive = false;
            armed = false;
            clearInterval(elapsedInterval);
            resultText.innerText = '완주하지 못했어요 🙁 다시 도전해보세요!';
        }

        function stopGameCleanup() {
            clearInterval(elapsedInterval);
            gameActive = false;
            armed = false;
            isDrawing = false;
        }

        // ================= 드로잉 이벤트 =================
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            // 캔버스 표시 크기(rect)와 내부 해상도(canvas.width/height)가 다를 수 있으므로 비율 보정
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function startElapsedTimer() {
            clearInterval(elapsedInterval);
            elapsedInterval = setInterval(() => {
                const sec = (Date.now() - startTimestamp) / 1000;
                elapsedLabel.innerText = `경과 시간: ${sec.toFixed(2)}초`;
            }, 100);
        }

        function startDraw(e) {
            if (!armed) return;
            const pos = getPos(e);

            if (!gameActive) {
                // 아직 타이밍이 시작되지 않음: 빨간점을 정확히 눌러야 시작
                if (dist(pos, guideStart) > HIT_RADIUS) return;
                gameActive = true;
                hasLeftStart = false;
                startTimestamp = Date.now();
                userPoints = [pos];
                startElapsedTimer();
            } else {
                userPoints.push(pos);
            }

            isDrawing = true;
            drawCanvas();
            checkCompletion(pos);
        }

        function moveDraw(e) {
            if (!isDrawing || !gameActive) return;
            const pos = getPos(e);
            userPoints.push(pos);
            drawCanvas();
            checkCompletion(pos);
        }

        function stopDraw() {
            isDrawing = false;
            if (gameActive) {
                // 완주 전에 손을 뗀 경우 시도 중단
                abortAttempt();
            }
        }

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', moveDraw);
        window.addEventListener('mouseup', stopDraw);

        canvas.addEventListener('touchstart', startDraw);
        canvas.addEventListener('touchmove', moveDraw);
        window.addEventListener('touchend', stopDraw);
    </script>
</body>
</html>
