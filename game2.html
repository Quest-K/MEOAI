<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도형 그리기 정확도 게임 MVP</title>
    <style>
        * { box-sizing: border-box; }
        body {
            text-align: center;
            font-family: sans-serif;
            background: #f0f0f0;
            margin: 0;
            padding: 20px 10px 40px;
        }
        .screen { display: none; }
        .screen.active { display: block; }

        /* ---- 홈 화면(난이도 선택) ---- */
        #home-title { font-size: 26px; margin-bottom: 4px; }
        #home-subtitle { color: #666; margin-bottom: 24px; }

        .difficulty-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 420px;
            margin: 0 auto;
        }
        .difficulty-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 20px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            text-align: left;
            font-family: inherit;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        .difficulty-card:active { transform: scale(0.98); }
        .difficulty-icon { font-size: 30px; flex-shrink: 0; }
        .difficulty-text { flex: 1; }
        .difficulty-name { font-size: 18px; font-weight: bold; margin-bottom: 2px; }
        .difficulty-desc { font-size: 13px; opacity: 0.85; }
        .difficulty-badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 20px;
            background: rgba(255,255,255,0.6);
            white-space: nowrap;
        }

        .card-easy { background: #d7f2df; color: #1c5c33; }
        .card-medium { background: #ffe9c2; color: #7a4d00; }
        .card-hard { background: #ffd7d7; color: #7a1c1c; }

        /* ---- 공통 상단바 ---- */
        .top-bar {
            max-width: 420px;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }
        .back-btn {
            padding: 8px 14px;
            font-size: 14px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: #fff;
            cursor: pointer;
        }

        /* ---- 게임 공통 ---- */
        #canvas-container { position: relative; display: inline-block; margin-top: 10px; }
        canvas { border: 2px solid #333; background: #fff; cursor: crosshair; touch-action: none; max-width: 90vw; }
        #timer-bar { width: 400px; max-width: 90vw; height: 10px; background: #ddd; margin: 10px auto; position: relative; }
        #timer-progress { width: 100%; height: 100%; background: red; transition: width 0.1s linear; }
        button.primary { padding: 10px 20px; font-size: 16px; cursor: pointer; margin-top: 10px; border: none; border-radius: 8px; background: #333; color: #fff; }
        #shape-label { font-size: 20px; font-weight: bold; color: #333; margin-top: 10px; }

        /* ---- 준비중 화면(보통/어려움) ---- */
        .coming-soon-box {
            max-width: 420px;
            margin: 60px auto 0;
            padding: 40px 20px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        .coming-soon-emoji { font-size: 48px; margin-bottom: 12px; }
        .coming-soon-title { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
        .coming-soon-desc { color: #666; font-size: 14px; line-height: 1.5; }
        .upload-btn {
            margin-top: 20px;
            padding: 12px 22px;
            font-size: 15px;
            border-radius: 8px;
            border: none;
            background: #ccc;
            color: #666;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <!-- ================= 홈 화면: 난이도 선택 ================= -->
    <div id="screen-home" class="screen active">
        <h1 id="home-title">도형 그리기 게임 🎯</h1>
        <p id="home-subtitle">난이도를 선택하세요</p>

        <div class="difficulty-list">
            <button class="difficulty-card card-easy" onclick="showScreen('easy')">
                <div class="difficulty-icon">🟢</div>
                <div class="difficulty-text">
                    <div class="difficulty-name">쉬움</div>
                    <div class="difficulty-desc">기본 도형을 따라 그려보세요</div>
                </div>
                <div class="difficulty-badge">시작 가능</div>
            </button>

            <button class="difficulty-card card-medium" onclick="showScreen('medium')">
                <div class="difficulty-icon">🟡</div>
                <div class="difficulty-text">
                    <div class="difficulty-name">보통</div>
                    <div class="difficulty-desc">복잡한 기하학 무늬에 도전</div>
                </div>
                <div class="difficulty-badge">준비중</div>
            </button>

            <button class="difficulty-card card-hard" onclick="showScreen('hard')">
                <div class="difficulty-icon">🔴</div>
                <div class="difficulty-text">
                    <div class="difficulty-name">어려움</div>
                    <div class="difficulty-desc">내 사진으로 실루엣 그리기</div>
                </div>
                <div class="difficulty-badge">준비중</div>
            </button>
        </div>
    </div>

    <!-- ================= 쉬움: 도형 그리기 게임 ================= -->
    <div id="screen-easy" class="screen">
        <div class="top-bar">
            <button class="back-btn" onclick="showScreen('home')">← 난이도 선택</button>
        </div>

        <p>가이드 점선을 따라 도형을 최대한 정확하게 그리세요! (제한시간 10초)</p>

        <button id="start-btn" class="primary">도전하기</button>

        <div id="shape-label"></div>

        <div id="timer-bar">
            <div id="timer-progress"></div>
        </div>

        <div id="canvas-container">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
        </div>

        <h2 id="result-text"></h2>
    </div>

    <!-- ================= 보통: 기하학 무늬 (준비중) ================= -->
    <div id="screen-medium" class="screen">
        <div class="top-bar">
            <button class="back-btn" onclick="showScreen('home')">← 난이도 선택</button>
        </div>

        <div class="coming-soon-box">
            <div class="coming-soon-emoji">🟡</div>
            <div class="coming-soon-title">기하학 무늬 모드</div>
            <div class="coming-soon-desc">
                별, 나선, 만다라 같은 복잡한 기하학 무늬를<br>
                따라 그리는 모드를 준비 중입니다.<br>
                조금만 기다려주세요!
            </div>
        </div>
    </div>

    <!-- ================= 어려움: 사진 실루엣 (준비중) ================= -->
    <div id="screen-hard" class="screen">
        <div class="top-bar">
            <button class="back-btn" onclick="showScreen('home')">← 난이도 선택</button>
        </div>

        <div class="coming-soon-box">
            <div class="coming-soon-emoji">🔴</div>
            <div class="coming-soon-title">사진 실루엣 모드</div>
            <div class="coming-soon-desc">
                본인 사진을 업로드하면 윤곽선(누끼)을 추출해서<br>
                그 실루엣을 따라 그리는 모드를 준비 중입니다.
            </div>
            <button class="upload-btn" disabled>사진 업로드 (준비중)</button>
        </div>
    </div>

    <script>
        // ================= 화면 전환 =================
        function showScreen(name) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById('screen-' + name).classList.add('active');

            // 쉬움 화면을 벗어나면 진행 중이던 게임/타이머 정리
            if (name !== 'easy') {
                stopGameCleanup();
            }
        }

        // ================= 쉬움 모드: 도형 그리기 게임 =================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const timerProgress = document.getElementById('timer-progress');
        const resultText = document.getElementById('result-text');
        const shapeLabel = document.getElementById('shape-label');

        let isDrawing = false;
        let gameActive = false;
        let userPoints = []; // 유저가 그린 좌표 저장
        let guidePoints = []; // 채점용 가이드 도형 좌표 (조밀)
        let guideVertices = []; // 렌더링용 가이드 도형 꼭짓점
        let currentShape = 'circle';
        let limitTime = 10000; // 10초
        let timeLeft = limitTime;
        let timerInterval;

        const centerX = 200;
        const centerY = 200;

        const SHAPE_INFO = {
            circle:   { label: '원' },
            ellipse:  { label: '타원' },
            square:   { label: '사각형' },
            triangle: { label: '삼각형' },
            pentagon: { label: '오각형' },
            hexagon:  { label: '육각형' },
            octagon:  { label: '팔각형' },
            rhombus:  { label: '마름모' },
            star:     { label: '별표' }
        };
        const SHAPE_KEYS = Object.keys(SHAPE_INFO);

        function polygonVertices(sides, rx, ry, startAngleDeg) {
            const verts = [];
            for (let i = 0; i < sides; i++) {
                const angle = (startAngleDeg + i * 360 / sides) * Math.PI / 180;
                verts.push({
                    x: centerX + rx * Math.cos(angle),
                    y: centerY + ry * Math.sin(angle)
                });
            }
            return verts;
        }

        function starVertices(outerR, innerR, points, startAngleDeg) {
            const verts = [];
            const totalPoints = points * 2;
            for (let i = 0; i < totalPoints; i++) {
                const r = (i % 2 === 0) ? outerR : innerR;
                const angle = (startAngleDeg + i * 360 / totalPoints) * Math.PI / 180;
                verts.push({
                    x: centerX + r * Math.cos(angle),
                    y: centerY + r * Math.sin(angle)
                });
            }
            return verts;
        }

        function interpolateEdges(verts, pointsPerEdge) {
            const pts = [];
            for (let i = 0; i < verts.length; i++) {
                const a = verts[i];
                const b = verts[(i + 1) % verts.length];
                for (let t = 0; t < pointsPerEdge; t++) {
                    const f = t / pointsPerEdge;
                    pts.push({ x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f });
                }
            }
            return pts;
        }

        function circlePoints(rx, ry) {
            const pts = [];
            for (let i = 0; i < 360; i += 5) {
                const angle = (i * Math.PI) / 180;
                pts.push({ x: centerX + rx * Math.cos(angle), y: centerY + ry * Math.sin(angle) });
            }
            return pts;
        }

        function generateGuide(shape) {
            currentShape = shape;
            guideVertices = [];

            switch (shape) {
                case 'circle':
                    guidePoints = circlePoints(120, 120);
                    break;
                case 'ellipse':
                    guidePoints = circlePoints(150, 95);
                    break;
                case 'square':
                    guideVertices = polygonVertices(4, 120, 120, 45);
                    guidePoints = interpolateEdges(guideVertices, 30);
                    break;
                case 'triangle':
                    guideVertices = polygonVertices(3, 130, 130, -90);
                    guidePoints = interpolateEdges(guideVertices, 30);
                    break;
                case 'pentagon':
                    guideVertices = polygonVertices(5, 125, 125, -90);
                    guidePoints = interpolateEdges(guideVertices, 25);
                    break;
                case 'hexagon':
                    guideVertices = polygonVertices(6, 125, 125, -90);
                    guidePoints = interpolateEdges(guideVertices, 22);
                    break;
                case 'octagon':
                    guideVertices = polygonVertices(8, 125, 125, -67.5);
                    guidePoints = interpolateEdges(guideVertices, 18);
                    break;
                case 'rhombus':
                    guideVertices = polygonVertices(4, 90, 130, 0);
                    guidePoints = interpolateEdges(guideVertices, 30);
                    break;
                case 'star':
                    guideVertices = starVertices(135, 55, 5, -90);
                    guidePoints = interpolateEdges(guideVertices, 12);
                    break;
                default:
                    guidePoints = circlePoints(120, 120);
            }
        }

        function drawGuide() {
            ctx.strokeStyle = '#aaa';
            ctx.lineWidth = 3;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();

            if (currentShape === 'circle') {
                ctx.arc(centerX, centerY, 120, 0, Math.PI * 2);
            } else if (currentShape === 'ellipse') {
                ctx.ellipse(centerX, centerY, 150, 95, 0, 0, Math.PI * 2);
            } else if (guideVertices.length > 0) {
                ctx.moveTo(guideVertices[0].x, guideVertices[0].y);
                for (let i = 1; i < guideVertices.length; i++) {
                    ctx.lineTo(guideVertices[i].x, guideVertices[i].y);
                }
                ctx.closePath();
            }

            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (guidePoints.length > 0 || guideVertices.length > 0) {
                drawGuide();
            }

            if (userPoints.length > 1) {
                ctx.strokeStyle = '#222';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(userPoints[0].x, userPoints[0].y);
                for (let i = 1; i < userPoints.length; i++) {
                    ctx.lineTo(userPoints[i].x, userPoints[i].y);
                }
                ctx.stroke();
            }
        }

        startBtn.addEventListener('click', () => {
            gameActive = true;
            userPoints = [];
            timeLeft = limitTime;
            resultText.innerText = "";

            const randomShape = SHAPE_KEYS[Math.floor(Math.random() * SHAPE_KEYS.length)];
            generateGuide(randomShape);
            shapeLabel.innerText = `그려야 할 도형: ${SHAPE_INFO[randomShape].label}`;
            drawCanvas();

            startBtn.disabled = true;

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft -= 100;
                timerProgress.style.width = (timeLeft / limitTime) * 100 + "%";

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 100);
        });

        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);
            startBtn.disabled = false;
            timerProgress.style.width = "0%";

            if (userPoints.length === 0) {
                resultText.innerText = "그림을 그리지 않았습니다! 😢";
                return;
            }

            let totalError = 0;
            userPoints.forEach(uPt => {
                let minDst = Infinity;
                guidePoints.forEach(gPt => {
                    let dst = Math.pow(uPt.x - gPt.x, 2) + Math.pow(uPt.y - gPt.y, 2);
                    if (dst < minDst) minDst = dst;
                });
                totalError += Math.sqrt(minDst);
            });

            let avgError = totalError / userPoints.length;
            let accuracy = Math.max(0, 100 - (avgError * 2));

            resultText.innerText = `정확도: ${accuracy.toFixed(1)}% ✨`;
        }

        // 다른 화면으로 이동 시 타이머/상태 정리
        function stopGameCleanup() {
            clearInterval(timerInterval);
            gameActive = false;
            isDrawing = false;
            startBtn.disabled = false;
            timerProgress.style.width = "0%";
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function startDraw(e) {
            if (!gameActive) return;
            isDrawing = true;
            userPoints.push(getPos(e));
            drawCanvas();
        }

        function moveDraw(e) {
            if (!isDrawing || !gameActive) return;
            userPoints.push(getPos(e));
            drawCanvas();
        }

        function stopDraw() {
            isDrawing = false;
        }

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', moveDraw);
        window.addEventListener('mouseup', stopDraw);

        canvas.addEventListener('touchstart', startDraw);
        canvas.addEventListener('touchmove', moveDraw);
        window.addEventListener('touchend', stopDraw);
    </script>
</body>
</html>
