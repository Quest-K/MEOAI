<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>통신사 결합 요금 계산기</title>
    <!-- Supabase 클라이언트 라이브러리를 CDN을 통해 불러옵니다 (데이터베이스 연동용) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Arial', sans-serif; margin: 40px; background-color: #faf8f5; color: #333; }
        .container { max-width: 600px; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { margin-bottom: 20px; color: #111; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, input[type="checkbox"] { padding: 8px; width: 100%; font-size: 14px; border: 1px solid #ddd; border-radius: 4px; }
        .checkbox-group { display: flex; align-items: center; }
        .checkbox-group input { width: auto; margin-right: 10px; }
        .result-box { margin-top: 30px; padding: 20px; background: #f1f3f5; border-radius: 6px; font-size: 18px; font-weight: bold; text-align: right; }
    </style>
</head>
<body>

<div class="container">
    <h2>통신사 결합 요금 계산기</h2>
    
    <!-- 1. 통신사 선택 영역 -->
    <div class="form-group">
        <label for="carrierSelect">통신사 선택</label>
        <select id="carrierSelect" onchange="loadOptions()">
            <option value="">통신사를 선택하세요</option>
            <option value="sk">SK브로드밴드</option>
            <option value="kt">KT</option>
            <option value="lg">LG유플러스</option>
            <option value="hello">LG헬로비전</option>
            <option value="skylife">스카이라이프</option>
            <option value="dlive">딜라이브</option>
        </select>
    </div>

    <!-- 2. 인터넷 상품 선택 영역 -->
    <div class="form-group">
        <label for="internetSelect">인터넷 상품</label>
        <select id="internetSelect" onchange="calculateTotal()"></select>
    </div>

    <!-- 3. 공유기 추가 체크박스 영역 -->
    <div class="form-group checkbox-group">
        <input type="checkbox" id="routerCheck" onchange="calculateTotal()">
        <label for="routerCheck" style="margin-bottom:0;">공유기 추가 (월 요금 적용)</label>
    </div>

    <!-- 4. TV 채널 상품 선택 영역 -->
    <div class="form-group">
        <label for="tvSelect">TV 채널 상품</label>
        <select id="tvSelect" onchange="calculateTotal()"></select>
    </div>

    <!-- 5. 셋톱박스 선택 영역 -->
    <div class="form-group">
        <label for="settopSelect">셋톱박스</label>
        <select id="settopSelect" onchange="calculateTotal()"></select>
    </div>

    <!-- 6. 최종 요금 출력 영역 -->
    <div class="result-box" id="resultDisplay">
        총 예상 월요금: 0원
    </div>
</div>

<script>
    // 전달해주신 Supabase 프로젝트 URL 및 Anon Key 설정
    const SUPABASE_URL = 'https://jhfhpumhifyhauuoinxc.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpoZmhwdW1oaWZ5aGF1dW9pbnhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MDE2NTMsImV4cCI6MjEwMzk3NzY1M30.euXk3eXtUVvEQRDGgcLhvX3JhVlpv9D7fZUEDr0i8yA';
    
    // Supabase 클라이언트 객체 생성 (데이터베이스 조회용)
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 통신사가 변경될 때마다 Supabase에서 해당 통신사의 인터넷, TV, 셋톱박스 데이터를 비동기로 불러오는 함수
    async function loadOptions() {
        const carrier = document.getElementById('carrierSelect').value;
        if (!carrier) return;

        // [인터넷 상품 데이터 조회] 선택한 통신사에 해당하는 인터넷 요금 및 속도 데이터를 가져옵니다.
        const { data: internetData, error: internetError } = await _supabase
            .from('internet_plans')
            .select('*')
            .eq('carrier', carrier);

        let internetHtml = '<option value="">인터넷 속도를 선택하세요</option>';
        if (internetData) {
            internetData.forEach(item => {
                // 속도와 월요금을 표시하고, data-router 속성에 공유기 추가 요금을 숨겨서 저장합니다.
                internetHtml += `<option value="${item.monthly_fee}" data-router="${item.router_fee}">${item.speed}메가 (월 ${item.monthly_fee.toLocaleString()}원)</option>`;
            });
        }
        document.getElementById('internetSelect').innerHTML = internetHtml;

        // [TV 채널 상품 데이터 조회] 선택한 통신사의 TV 상품 목록을 가져옵니다.
        const { data: tvData, error: tvError } = await _supabase
            .from('tv_plans')
            .select('*')
            .eq('carrier', carrier);

        let tvHtml = '<option value="0">TV 선택 안 함</option>';
        if (tvData) {
            tvData.forEach(item => {
                tvHtml += `<option value="${item.monthly_fee}">${item.plan_name} - 채널 ${item.channel_count}개 (월 ${item.monthly_fee.toLocaleString()}원)</option>`;
            });
        }
        document.getElementById('tvSelect').innerHTML = tvHtml;

        // [셋톱박스 데이터 조회] 선택한 통신사의 셋톱박스 모델 및 임대료 목록을 가져옵니다.
        const { data: settopData, error: settopError } = await _supabase
            .from('settop_boxes')
            .select('*')
            .eq('carrier', carrier);

        let settopHtml = '<option value="0">셋톱박스 선택 안 함</option>';
        if (settopData) {
            settopData.forEach(item => {
                settopHtml += `<option value="${item.monthly_fee}">${item.model_name} (월 ${item.monthly_fee.toLocaleString()}원)</option>`;
            });
        }
        document.getElementById('settopSelect').innerHTML = settopHtml;

        // 데이터 로딩 후 요금을 다시 계산합니다.
        calculateTotal();
    }

    // 선택된 항목들의 요금을 모두 합산하여 화면에 실시간으로 반영하는 함수
    function calculateTotal() {
        const internetSelect = document.getElementById('internetSelect');
        const internetFee = internetSelect.value ? parseInt(internetSelect.value) : 0;
        
        // 공유기 추가 체크박스가 켜져있고 인터넷이 선택된 경우 공유기 요금을 합산에 포함합니다.
        let routerFee = 0;
        const routerCheck = document.getElementById('routerCheck');
        if (routerCheck.checked && internetSelect.selectedIndex > 0) {
            const selectedOption = internetSelect.options[internetSelect.selectedIndex];
            routerFee = parseInt(selectedOption.getAttribute('data-router')) || 0;
        }

        // TV 및 셋톱박스 요금 가져오기 (선택되지 않았으면 0원 처리)
        const tvFee = parseInt(document.getElementById('tvSelect').value) || 0;
        const settopFee = parseInt(document.getElementById('settopSelect').value) || 0;

        // 모든 요금 합산 계산
        const total = internetFee + routerFee + tvFee + settopFee;

        // 결과 화면에 포맷팅하여 출력
        document.getElementById('resultDisplay').innerHTML = `총 예상 월요금: <span style="color: #2b8a3e;">${total.toLocaleString()}원</span>`;
    }
</script>

</body>
</html>
