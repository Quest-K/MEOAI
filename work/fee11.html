<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인터넷+TV 결합 요금 및 수수료 비교</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2C2E35;
    --ink-dim:#6B6E76;
    --bg:#F4F2EB;
    --bg-raised:#FFFFFF;
    --paper:#FFFFFF;
    --paper-line:#E6E2D6;
    --line-on-dark:#D8D3C5;
    --gold:#C88A2B;
    --kt:#C4763B;
    --lg:#2F8F7E;
    --sk:#B84A5E;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Pretendard', -apple-system, sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:1080px;
    margin:0 auto;
    padding:56px 24px 96px;
  }

  /* ---------- Header ---------- */
  header{
    margin-bottom:48px;
    padding-bottom:32px;
    border-bottom:1px solid var(--line-on-dark);
    position:relative;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--ink-dim);
    letter-spacing:0.02em;
    margin:0 0 14px;
  }
  h1{
    font-family:'Newsreader', serif;
    font-weight:600;
    font-size:clamp(30px, 4.4vw, 44px);
    margin:0 0 14px;
    color:#1C1E24;
  }
  header p{
    max-width:56ch;
    color:var(--ink-dim);
    font-size:15.5px;
    margin:0;
  }

  /* ---------- Controls ---------- */
  .controls{
    display:flex;
    flex-direction:column;
    gap:26px;
    margin-bottom:52px;
    background:var(--bg-raised);
    padding:28px;
    border-radius:var(--radius);
    box-shadow:0 4px 20px rgba(0,0,0,0.03);
    border:1px solid var(--paper-line);
  }
  .control-group label.group-label{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-dim);
    margin-bottom:10px;
    font-weight: 600;
  }
  .seg{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .seg button{
    appearance:none;
    border:1px solid var(--paper-line);
    background:#FAFAF7;
    color:var(--ink);
    padding:10px 18px;
    font-family:'Pretendard', sans-serif;
    font-size:14.5px;
    font-weight:500;
    border-radius:var(--radius);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease, color .15s ease;
  }
  .seg button:hover{ border-color:var(--gold); background:#FFFDF9; }
  .seg button:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .seg button.active{
    background:var(--gold);
    border-color:var(--gold);
    color:#FFFFFF;
    font-weight:600;
  }

  /* ---------- Results ---------- */
  .results{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:20px;
  }
  @media (max-width: 820px){
    .results{ grid-template-columns:1fr; }
  }

  .card{
    background:var(--paper);
    color:#20211D;
    border-radius:var(--radius);
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow:0 10px 30px -10px rgba(0,0,0,.08);
    border:1px solid var(--paper-line);
  }
  .card.best{ transform:translateY(-6px); box-shadow:0 16px 36px -12px rgba(200,138,43,.25); border-color:var(--gold); }

  .card-head{
    padding:22px 22px 18px;
    color:#fff;
    position:relative;
  }
  .card-head .brand{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    letter-spacing:0.05em;
    opacity:.9;
    margin:0 0 4px;
  }
  .card-head .plan-name{
    font-family:'Newsreader', serif;
    font-weight:600;
    font-size:22px;
    margin:0;
  }
  .card[data-brand="KT"] .card-head{ background:var(--kt); }
  .card[data-brand="LG"] .card-head{ background:var(--lg); }
  .card[data-brand="SK"] .card-head{ background:var(--sk); }

  .best-tag{
    position:absolute;
    top:14px;
    right:-2px;
    background:var(--gold);
    color:#FFFFFF;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    font-weight:600;
    padding:5px 12px 5px 14px;
    letter-spacing:.03em;
  }
  .best-tag::before{
    content:"";
    position:absolute;
    left:-8px; top:0;
    border-style:solid;
    border-width:0 8px 20px 0;
    border-color:transparent var(--gold) transparent transparent;
    filter: brightness(0.85);
  }

  .price-block{
    padding:22px 22px 16px;
    border-bottom:1px dashed var(--paper-line);
  }
  .price-block .amount{
    font-family:'IBM Plex Mono', monospace;
    font-size:28px;
    font-weight:600;
    letter-spacing:-0.01em;
    color:#1C1E24;
  }
  .price-block .amount span{ font-size:14px; font-weight:500; color:#6B6C64; margin-left:4px;}
  .price-block .note{
    margin-top:8px;
    font-size:12px;
    color:#8A6A20;
    background:#FDF5E2;
    display:inline-block;
    padding:4px 8px;
    border-radius:2px;
    border:1px solid #F3E2B8;
  }
  .price-block .unavailable{
    font-size:14px;
    color:#8C877A;
    padding:6px 0 2px;
  }

  .items{
    padding:16px 22px 20px;
    flex:1;
  }
  .item-row{
    display:flex;
    align-items:baseline;
    gap:6px;
    font-size:13.5px;
    padding:6px 0;
    color:#4B4C45;
  }
  .item-row .label{ white-space:nowrap; color:#8C877A; }
  .item-row .dots{
    flex:1;
    border-bottom:1px dotted #C9C4B2;
    transform:translateY(-4px);
  }
  .item-row .value{ white-space:nowrap; font-weight:500; color:#20211D; }

  /* ---------- Commission / Margin Section ---------- */
  .commission-section{
    border-top:1px solid var(--paper-line);
    background:#FAFAF7;
    padding:18px 22px;
    font-size:13px;
  }
  .comm-title{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    font-weight:600;
    color:var(--ink-dim);
    margin-bottom:10px;
    letter-spacing:0.03em;
    text-transform:uppercase;
  }
  .comm-group{
    margin-bottom:8px;
  }
  .comm-subhead{
    font-weight:600;
    color:#3A3C42;
    margin-bottom:3px;
    display:flex;
    justify-content:space-between;
  }
  .comm-row{
    display:flex;
    justify-content:space-between;
    padding:2px 0 2px 8px;
    color:#5C5E66;
    font-size:12.5px;
  }
  .comm-divider{
    height:1px;
    background:var(--paper-line);
    margin:10px 0;
  }
  .margin-row{
    display:flex;
    justify-content:space-between;
    font-weight:600;
    color:var(--gold);
    font-size:14px;
    font-family:'IBM Plex Mono', monospace;
  }

  footer{
    margin-top:52px;
    font-size:12.5px;
    color:var(--ink-dim);
    border-top:1px solid var(--line-on-dark);
    padding-top:20px;
  }
  footer p{ margin:0 0 6px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="eyebrow">GIGA COMPARE / 01</p>
    <h1>인터넷 + TV, 세 통신사 요금을 한눈에</h1>
    <p>속도와 TV 요금제, 공유기 여부를 고르면 KT · LG · SK 결합 상품 가격 및 수수료 구조를 바로 비교해드려요.</p>
  </header>

  <div class="controls">
    <div class="control-group">
      <label class="group-label">인터넷 속도</label>
      <div class="seg" id="seg-speed">
        <button data-value="100">100M</button>
        <button data-value="500">500M</button>
        <button data-value="1000">1기가</button>
      </div>
    </div>

    <div class="control-group">
      <label class="group-label">TV 요금제</label>
      <div class="seg" id="seg-tv">
        <button data-value="none">인터넷 단독 (TV 미가입)</button>
        <button data-value="low">저가형</button>
        <button data-value="basic">기본형</button>
        <button data-value="premium">고급형</button>
      </div>
    </div>

    <div class="control-group">
      <label class="group-label">공유기 (Wi-Fi)</label>
      <div class="seg" id="seg-router">
        <button data-value="N">미포함</button>
        <button data-value="Y">포함</button>
      </div>
    </div>
  </div>

  <div class="results" id="results"></div>

  <footer>
    <p>* 상품리스트.xlsx 기준 월 요금이며, 부가세·약정 조건 등에 따라 실제 청구 금액은 달라질 수 있습니다.</p>
    <p>* KT는 저가형(에센스) 상품이 없어 기본형·고급형만 제공됩니다. LG는 전 구간 공유기 포함형만 판매합니다.</p>
  </footer>

</div>

<script>
const DATA = {
  KT: {
    order: 1,
    tvNames: { none:'인터넷 단독', basic:'베이직', premium:'모든G' },
    stb: { basic:'기가지니A', premium:'기가지니A' },
    prices: {
      100:  { none:{N:22000,Y:23100}, basic:{N:38500,Y:39600}, premium:{N:46200,Y:47300} },
      500:  { none:{N:33000,Y:34100}, basic:{N:44000,Y:45100}, premium:{N:51700,Y:52800} },
      1000: { none:{N:38500,Y:38500}, basic:{Y:49500},         premium:{Y:57200} }
    }
  },
  LG: {
    order: 2,
    tvNames: { none:'인터넷 단독', low:'실속형', basic:'기본형', premium:'프리미엄' },
    stb: { low:'UHD4', basic:'UHD4', premium:'UHD4' },
    prices: {
      100:  { none:{Y:22000}, low:{Y:39600}, basic:{Y:40700}, premium:{Y:42900} },
      500:  { none:{Y:33000}, low:{Y:45100}, basic:{Y:46200}, premium:{Y:48400} },
      1000: { none:{Y:38500}, low:{Y:50600}, basic:{Y:51700}, premium:{Y:53900} }
    }
  },
  SK: {
    order: 3,
    tvNames: { none:'인터넷 단독', low:'이코노미', basic:'스탠다드', premium:'올' },
    stb: { low:'스마트3', basic:'스마트3', premium:'스마트3' },
    prices: {
      100:  { none:{N:22000,Y:23100}, low:{N:34100,Y:36300}, basic:{N:37400,Y:39600}, premium:{N:40700,Y:42900} },
      500:  { none:{N:33000,Y:34100}, low:{N:41800,Y:42900}, basic:{N:45100,Y:46200}, premium:{N:48400,Y:49500} },
      1000: { none:{N:38500,Y:39600}, low:{N:47300,Y:48400}, basic:{N:50600,Y:51700}, premium:{N:53900,Y:55000} }
    }
  }
};

const SPEED_LABEL = { 100:'100M', 500:'500M', 1000:'1기가' };
const ROUTER_LABEL = { N:'미포함', Y:'포함' };

// 임시 수수료 및 경품고시 데이터 매핑 예시 (필요시 수정 가능)
function getCommissionData(brand, speed, tv) {
  // 예시 데이터 로직 (추후 실제 수치로 변경 가능)
  let baseGiftCard = speed === '100' ? 100000 : speed === '500' ? 200000 : 250000;
  let baseCash = speed === '100' ? 50000 : speed === '500' ? 150000 : 200000;
  if(tv !== 'none') {
    baseGiftCard += 50000;
    baseCash += 50000;
  }
  
  const notice = { giftCard: 450000, cash: 50000 }; // 경품고시제 상한 예시
  const customer = { giftCard: baseGiftCard, cash: baseCash };
  const maxCommission = { giftCard: 500000, cash: 300000 }; // 본사 최대 수수료 예시
  
  const totalCustomer = customer.giftCard + customer.cash;
  const totalMaxComm = maxCommission.giftCard + maxCommission.cash;
  const totalMargin = totalMaxComm - totalCustomer;

  return { notice, customer, maxCommission, totalMargin };
}

let state = { speed:'100', tv:'low', router:'N' };

function setupSeg(id, key){
  const el = document.getElementById(id);
  el.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state[key] = btn.dataset.value;
      render();
    });
  });
}
setupSeg('seg-speed','speed');
setupSeg('seg-tv','tv');
setupSeg('seg-router','router');

function resolvePrice(brand, speed, tv, router){
  const entry = DATA[brand].prices[speed][tv];
  if(!entry) return { available:false };
  if(entry[router] !== undefined){
    return { available:true, price:entry[router], substituted:false };
  }
  const fallbackKey = router === 'N' ? 'Y' : 'N';
  if(entry[fallbackKey] !== undefined){
    return { available:true, price:entry[fallbackKey], substituted:true, actualRouter:fallbackKey };
  }
  return { available:false };
}

function render(){
  document.querySelectorAll('#seg-speed button').forEach(b=>b.classList.toggle('active', b.dataset.value===state.speed));
  document.querySelectorAll('#seg-tv button').forEach(b=>b.classList.toggle('active', b.dataset.value===state.tv));
  document.querySelectorAll('#seg-router button').forEach(b=>b.classList.toggle('active', b.dataset.value===state.router));

  const brands = Object.keys(DATA).sort((a,b)=>DATA[a].order-DATA[b].order);
  const results = brands.map(brand=>{
    const tvName = DATA[brand].tvNames[state.tv];
    if(!tvName){
      return { brand, available:false };
    }
    const r = resolvePrice(brand, state.speed, state.tv, state.router);
    const comm = getCommissionData(brand, state.speed, state.tv);
    return { brand, tvName, ...r, comm };
  });

  const availablePrices = results.filter(r=>r.available).map(r=>r.price);
  const minPrice = availablePrices.length ? Math.min(...availablePrices) : null;

  const container = document.getElementById('results');
  container.innerHTML = results.map(r=>{
    const isBest = r.available && r.price === minPrice;
    const stbName = (state.tv !== 'none' && DATA[r.brand].stb[state.tv]) ? DATA[r.brand].stb[state.tv] : null;

    let priceBlock;
    if(!r.tvName){
      priceBlock = `<div class="unavailable">이 통신사는 해당 요금제를 제공하지 않아요.</div>`;
    } else if(!r.available){
      priceBlock = `<div class="unavailable">선택하신 조합의 상품이 없어요.</div>`;
    } else {
      const noteHtml = r.substituted
        ? `<div class="note">${r.brand === 'LG' ? '전 상품 공유기 포함형만 판매' : '이 상품은 공유기 포함형만 제공돼요'}</div>`
        : '';
      priceBlock = `
        <div class="amount">${r.price.toLocaleString()}<span>원 / 월</span></div>
        ${noteHtml}
      `;
    }

    const itemsHtml = r.tvName ? `
      <div class="item-row"><span class="label">인터넷</span><span class="dots"></span><span class="value">${SPEED_LABEL[state.speed]}</span></div>
      <div class="item-row"><span class="label">TV 요금제</span><span class="dots"></span><span class="value">${r.tvName}</span></div>
      ${stbName ? `<div class="item-row"><span class="label">셋톱박스</span><span class="dots"></span><span class="value">${stbName}</span></div>` : ''}
      <div class="item-row"><span class="label">공유기</span><span class="dots"></span><span class="value">${r.substituted ? ROUTER_LABEL[r.actualRouter] : ROUTER_LABEL[state.router]}</span></div>
    ` : '';

    const commHtml = r.tvName ? `
      <div class="commission-section">
        <div class="comm-title">수익 및 경품 구조</div>
        
        <div class="comm-group">
          <div class="comm-subhead"><span>0. 경품고시제</span></div>
          <div class="comm-row"><span>· 상품권</span><span>${r.comm.notice.giftCard.toLocaleString()}원</span></div>
          <div class="comm-row"><span>· 현금</span><span>${r.comm.notice.cash.toLocaleString()}원</span></div>
        </div>

        <div class="comm-group">
          <div class="comm-subhead"><span>1. 고객 지급액</span></div>
          <div class="comm-row"><span>· 상품권</span><span>${r.comm.customer.giftCard.toLocaleString()}원</span></div>
          <div class="comm-row"><span>· 현금</span><span>${r.comm.customer.cash.toLocaleString()}원</span></div>
        </div>

        <div class="comm-group">
          <div class="comm-subhead"><span>2. 최대 수수료</span></div>
          <div class="comm-row"><span>· 상품권</span><span>${r.comm.maxCommission.giftCard.toLocaleString()}원</span></div>
          <div class="comm-row"><span>· 현금</span><span>${r.comm.maxCommission.cash.toLocaleString()}원</span></div>
        </div>

        <div class="comm-divider"></div>

        <div class="margin-row">
          <span>총 마진</span>
          <span>${r.comm.totalMargin.toLocaleString()}원</span>
        </div>
      </div>
    ` : '';

    return `
      <div class="card ${isBest ? 'best' : ''}" data-brand="${r.brand}">
        <div class="card-head">
          ${isBest ? '<div class="best-tag">최저가</div>' : ''}
          <p class="brand">${r.brand}</p>
          <p class="plan-name">${r.tvName || '미제공'}</p>
        </div>
        <div class="price-block">${priceBlock}</div>
        <div class="items">${itemsHtml}</div>
        ${commHtml}
      </div>
    `;
  }).join('');
}

render();
</script>
</body>
</html>
