<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인터넷+TV 결합 요금 및 수수료 비교</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --ink:#2C2E35;
    --ink-dim:#6B6E76;
    --bg:#F4F2EB;
    --bg-raised:#FFFFFF;
    --paper:#FFFFFF;
    --paper-line:#E6E2D6;
    --line-on-dark:#D8D3C5;
    --gold:#C88A2B;
    --kt:#C4763B;
    --lg:#2F8F7E;
    --sk:#5D52A3;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Pretendard', -apple-system, sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:1080px;
    margin:0 auto;
    padding:56px 24px 96px;
  }

  header{
    margin-bottom:48px;
    padding-bottom:32px;
    border-bottom:1px solid var(--line-on-dark);
    position:relative;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--ink-dim);
    letter-spacing:0.02em;
    margin:0 0 14px;
  }
  h1{
    font-family:'Newsreader', serif;
    font-weight:600;
    font-size:clamp(30px, 4.4vw, 44px);
    margin:0 0 14px;
    color:#1C1E24;
  }
  header p{
    max-width:60ch;
    color:var(--ink-dim);
    font-size:15.5px;
    margin:0;
  }

  #status-banner{
    display:none;
    margin-bottom:32px;
    padding:14px 18px;
    border-radius:var(--radius);
    font-size:13.5px;
    line-height:1.6;
  }
  #status-banner.error{
    display:block;
    background:#FBEAEA;
    border:1px solid #E8B9B9;
    color:#8A2E2E;
  }
  #status-banner.loading{
    display:block;
    background:#EFEDE4;
    border:1px solid var(--paper-line);
    color:var(--ink-dim);
  }

  .controls{
    display:flex;
    flex-direction:column;
    gap:26px;
    margin-bottom:52px;
    background:var(--bg-raised);
    padding:28px;
    border-radius:var(--radius);
    box-shadow:0 4px 20px rgba(0,0,0,0.03);
    border:1px solid var(--paper-line);
  }
  .control-group label.group-label{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-dim);
    margin-bottom:10px;
    font-weight:600;
  }
  .seg{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .seg button{
    appearance:none;
    border:1px solid var(--paper-line);
    background:#FAFAF7;
    color:var(--ink);
    padding:10px 18px;
    font-family:'Pretendard', sans-serif;
    font-size:14.5px;
    font-weight:500;
    border-radius:var(--radius);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease, color .15s ease;
  }
  .seg button:hover{ border-color:var(--gold); background:#FFFDF9; }
  .seg button:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .seg button.active{
    background:var(--gold);
    border-color:var(--gold);
    color:#FFFFFF;
    font-weight:600;
  }
  .seg button:disabled{
    opacity:.4;
    cursor:not-allowed;
  }

  .results{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:18px;
  }
  @media (max-width: 820px){
    .results{ grid-template-columns:1fr; }
  }

  .card{
    background:var(--paper);
    color:#20211D;
    border-radius:var(--radius);
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow:0 10px 30px -10px rgba(0,0,0,.08);
    border:1px solid var(--paper-line);
  }
  .card.best{ transform:translateY(-6px); box-shadow:0 16px 36px -12px rgba(200,138,43,.25); border-color:var(--gold); }

  .card-head{
    padding:18px 18px 14px;
    color:#fff;
    position:relative;
  }
  .card-head .brand{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.05em;
    opacity:.9;
    margin:0 0 4px;
  }
  .card-head .plan-name{
    font-family:'Newsreader', serif;
    font-weight:600;
    font-size:20px;
    margin:0;
  }
  .card[data-brand="kt"] .card-head{ background:var(--kt); }
  .card[data-brand="lg"] .card-head{ background:var(--lg); }
  .card[data-brand="sk"] .card-head{ background:var(--sk); }

  .best-tag{
    position:absolute;
    top:12px;
    right:-2px;
    background:var(--gold);
    color:#FFFFFF;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    font-weight:600;
    padding:4px 10px 4px 12px;
    letter-spacing:.03em;
  }
  .best-tag::before{
    content:"";
    position:absolute;
    left:-6px; top:0;
    border-style:solid;
    border-width:0 6px 18px 0;
    border-color:transparent var(--gold) transparent transparent;
    filter:brightness(0.85);
  }

  .price-block{
    padding:18px 18px 14px;
    border-bottom:1px dashed var(--paper-line);
  }
  .price-block .amount{
    font-family:'IBM Plex Mono', monospace;
    font-size:24px;
    font-weight:600;
    letter-spacing:-0.01em;
    color:#1C1E24;
  }
  .price-block .amount span{ font-size:13px; font-weight:500; color:#6B6C64; margin-left:4px;}
  .price-block .unavailable{
    font-size:13.5px;
    color:#8C877A;
    padding:4px 0 2px;
  }

  .items{
    padding:14px 18px 16px;
    flex:1;
  }
  .item-row{
    display:flex;
    align-items:baseline;
    gap:6px;
    font-size:13px;
    padding:5px 0;
    color:#4B4C45;
  }
  .item-row .label{ white-space:nowrap; color:#8C877A; }
  .item-row .dots{
    flex:1;
    border-bottom:1px dotted #C9C4B2;
    transform:translateY(-4px);
  }
  .item-row .value{ white-space:nowrap; font-weight:500; color:#20211D; }

  .commission-section{
    border-top:1px solid var(--paper-line);
    background:#FAFAF7;
    padding:16px 18px;
    font-size:12.5px;
  }
  .comm-title{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    font-weight:600;
    color:var(--ink-dim);
    margin-bottom:8px;
    letter-spacing:0.03em;
    text-transform:uppercase;
  }
  .comm-group{ margin-bottom:6px; }
  .comm-subhead{
    font-weight:600;
    color:#3A3C42;
    margin-bottom:2px;
  }
  .comm-row{
    display:flex;
    justify-content:space-between;
    padding:1px 0 1px 6px;
    color:#5C5E66;
    font-size:12px;
  }

  footer{
    margin-top:52px;
    font-size:12.5px;
    color:var(--ink-dim);
    border-top:1px solid var(--line-on-dark);
    padding-top:20px;
  }
  footer p{ margin:0 0 6px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="eyebrow">GIGA COMPARE / 01</p>
    <h1>인터넷 + TV, 세 통신사 요금을 한눈에</h1>
    <p>속도와 TV 요금제, 공유기 여부를 고르면 KT · LG · SK 결합 상품 가격을 실시간 데이터로 비교해드려요.</p>
  </header>

  <div id="status-banner"></div>

  <div class="controls">
    <div class="control-group">
      <label class="group-label">인터넷 속도</label>
      <div class="seg" id="seg-speed">
        <button data-value="100">100M</button>
        <button data-value="500">500M</button>
        <button data-value="1000">1기가</button>
      </div>
    </div>

    <div class="control-group">
      <label class="group-label">공유기 (Wi-Fi)</label>
      <div class="seg" id="seg-router">
        <button data-value="N">미포함</button>
        <button data-value="Y">포함</button>
      </div>
    </div>

    <div class="control-group">
      <label class="group-label">TV 요금제</label>
      <div class="seg" id="seg-tv">
        <button data-value="none">인터넷 단독 (TV 미가입)</button>
        <button data-value="low">저가형</button>
        <button data-value="basic">기본형</button>
        <button data-value="premium">고급형</button>
      </div>
    </div>
  </div>

  <div class="results" id="results"></div>

  <footer>
    <p>* 요금은 Supabase에 등록된 데이터를 실시간으로 불러온 값이며, 부가세·약정 조건 등에 따라 실제 청구 금액은 달라질 수 있습니다.</p>
    <p>* 경품고시·수수료·마진 수치는 아직 데이터베이스화되지 않아 임시로 고정된 값입니다.</p>
  </footer>

</div>

<script>
// ---------- Supabase 연결 ----------
const SUPABASE_URL = 'https://jhfhpumhifyhauuoinxc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpoZmhwdW1oaWZ5aGF1dW9pbnhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MDE2NTMsImV4cCI6MjEwMzk3NzY1M30.euXk3eXtUVvEQRDGgcLhvX3JhVlpv9D7fZUEDr0i8yA';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CARRIERS = ['kt', 'lg', 'sk'];
const BRAND_LABEL = { kt:'KT', lg:'LG', sk:'SK' };

// 요청하신 이름 그대로 매칭한 TV 요금제 (DB에 동일 계열 이름의 다른 상품이 더 있어도 아래 이름만 사용)
const TV_TIER_MAP = {
  kt: { low:'베이직', basic:'에센스', premium:'모든G' },
  lg: { low:'실속형', basic:'기본형', premium:'프리미엄' },
  sk: { low:'Btv 이코노미', basic:'Btv 스탠다드', premium:'Btv All' }
};
const SETTOP_MAP = { kt:'셋톱박스3', lg:'UHD4셋탑', sk:'스마트3' };

const SPEED_LABEL = { 100:'100M', 500:'500M', 1000:'1기가' };
const ROUTER_LABEL = { N:'미포함', Y:'포함' };

// ---------- 경품고시 (임시 하드코딩, 데이터베이스화 전) ----------
function getNoticeData(brand, speed, tv) {
  if (tv === 'none') {
    if (brand === 'kt') {
      if (speed === '100') return { giftCard:40000, cash:40000 };
      if (speed === '500') return { giftCard:40000, cash:80000 };
      if (speed === '1000') return { giftCard:50000, cash:70000 };
    } else if (brand === 'lg') {
      if (speed === '100') return { giftCard:0, cash:200000 };
      if (speed === '500') return { giftCard:0, cash:170000 };
      if (speed === '1000') return { giftCard:0, cash:170000 };
    } else if (brand === 'sk') {
      if (speed === '100') return { giftCard:0, cash:100000 };
      if (speed === '500') return { giftCard:0, cash:170000 };
      if (speed === '1000') return { giftCard:0, cash:170000 };
    }
  } else {
    if (brand === 'kt') {
      if (speed === '100') return { giftCard:60000, cash:240000 };
      if (speed === '500') return { giftCard:60000, cash:340000 };
      if (speed === '1000') return { giftCard:90000, cash:310000 };
    } else if (brand === 'lg') {
      if (speed === '100') return { giftCard:0, cash:330000 };
      if (speed === '500') return { giftCard:0, cash:470000 };
      if (speed === '1000') return { giftCard:0, cash:470000 };
    } else if (brand === 'sk') {
      if (speed === '100') return { giftCard:70000, cash:320000 };
      if (speed === '500') return { giftCard:70000, cash:420000 };
      if (speed === '1000') return { giftCard:70000, cash:420000 };
    }
  }
  return { giftCard:0, cash:0 };
}

let DATA = null; // Supabase에서 불러온 뒤 채워짐
let state = { speed:'100', tv:'low', router:'N' };

function showBanner(type, message){
  const el = document.getElementById('status-banner');
  el.className = type;
  el.textContent = message;
}
function hideBanner(){
  const el = document.getElementById('status-banner');
  el.className = '';
  el.textContent = '';
}

async function loadData(){
  showBanner('loading', '요금 데이터를 불러오는 중이에요...');

  const [internetRes, tvRes, settopRes] = await Promise.all([
    sb.from('internet_plans').select('*').in('carrier', CARRIERS),
    sb.from('tv_plans').select('*').in('carrier', CARRIERS),
    sb.from('settop_boxes').select('*').in('carrier', CARRIERS)
  ]);

  if (internetRes.error || tvRes.error || settopRes.error) {
    const err = internetRes.error || tvRes.error || settopRes.error;
    showBanner('error', `요금 데이터를 불러오지 못했어요 (${err.message}). Supabase 테이블에 anon 역할의 SELECT 정책(RLS)이 열려있는지 확인해주세요.`);
    return false;
  }

  DATA = {};
  CARRIERS.forEach(c => { DATA[c] = { internet:{}, tv:{}, settop:null }; });

  internetRes.data.forEach(row => {
    if (DATA[row.carrier]) {
      DATA[row.carrier].internet[row.speed] = { fee: row.monthly_fee, routerFee: row.router_fee };
    }
  });

  CARRIERS.forEach(carrier => {
    const tiers = TV_TIER_MAP[carrier];
    Object.entries(tiers).forEach(([tierKey, planName]) => {
      const match = tvRes.data.find(r => r.carrier === carrier && r.plan_name === planName);
      if (match) {
        DATA[carrier].tv[tierKey] = { name: match.plan_name, fee: match.monthly_fee };
      }
    });
  });

  CARRIERS.forEach(carrier => {
    const stbName = SETTOP_MAP[carrier];
    const match = settopRes.data.find(r => r.carrier === carrier && r.model_name === stbName);
    if (match) {
      DATA[carrier].settop = { name: match.model_name, fee: match.monthly_fee };
    }
  });

  hideBanner();
  return true;
}

function setupSeg(id, key){
  const el = document.getElementById(id);
  el.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state[key] = btn.dataset.value;
      render();
    });
  });
}
setupSeg('seg-speed','speed');
setupSeg('seg-tv','tv');
setupSeg('seg-router','router');

function computePrice(carrier){
  const speedData = DATA[carrier].internet[state.speed];
  if (!speedData) return { available:false };

  let total = speedData.fee;
  if (state.router === 'Y') total += speedData.routerFee;

  let tvInfo = null, settopInfo = null;
  if (state.tv !== 'none') {
    tvInfo = DATA[carrier].tv[state.tv];
    if (!tvInfo) return { available:false, noTier:true };
    total += tvInfo.fee;
    settopInfo = DATA[carrier].settop;
    if (settopInfo) total += settopInfo.fee;
  }

  return { available:true, total, tvInfo, settopInfo };
}

function render(){
  if (!DATA) return;

  document.querySelectorAll('#seg-speed button').forEach(b=>b.classList.toggle('active', b.dataset.value===state.speed));
  document.querySelectorAll('#seg-tv button').forEach(b=>b.classList.toggle('active', b.dataset.value===state.tv));
  document.querySelectorAll('#seg-router button').forEach(b=>b.classList.toggle('active', b.dataset.value===state.router));

  const results = CARRIERS.map(carrier=>{
    const r = computePrice(carrier);
    const notice = getNoticeData(carrier, state.speed, state.tv);
    return { carrier, ...r, notice };
  });

  const availableTotals = results.filter(r=>r.available).map(r=>r.total);
  const minTotal = availableTotals.length ? Math.min(...availableTotals) : null;

  const container = document.getElementById('results');
  container.innerHTML = results.map(r=>{
    const isBest = r.available && r.total === minTotal;
    const tvLabel = state.tv === 'none' ? '인터넷 단독' : (r.tvInfo ? r.tvInfo.name : null);

    let priceBlock;
    if (r.noTier) {
      priceBlock = `<div class="unavailable">이 통신사는 해당 등급의 TV 요금제가 없어요.</div>`;
    } else if (!r.available) {
      priceBlock = `<div class="unavailable">선택하신 조합의 데이터가 없어요.</div>`;
    } else {
      priceBlock = `<div class="amount">${r.total.toLocaleString()}<span>원 / 월</span></div>`;
    }

    const itemsHtml = r.available ? `
      <div class="item-row"><span class="label">인터넷</span><span class="dots"></span><span class="value">${SPEED_LABEL[state.speed]}</span></div>
      <div class="item-row"><span class="label">공유기</span><span class="dots"></span><span class="value">${ROUTER_LABEL[state.router]}</span></div>
      <div class="item-row"><span class="label">TV 요금제</span><span class="dots"></span><span class="value">${tvLabel}</span></div>
      ${r.settopInfo ? `<div class="item-row"><span class="label">셋톱박스</span><span class="dots"></span><span class="value">${r.settopInfo.name}</span></div>` : ''}
    ` : '';

    const commHtml = r.available ? `
      <div class="commission-section">
        <div class="comm-title">경품고시 (임시 데이터)</div>
        <div class="comm-group">
          <div class="comm-subhead">경품고시제</div>
          <div class="comm-row"><span>· 상품권</span><span>${r.notice.giftCard.toLocaleString()}원</span></div>
          <div class="comm-row"><span>· 현금</span><span>${r.notice.cash.toLocaleString()}원</span></div>
        </div>
      </div>
    ` : '';

    return `
      <div class="card ${isBest ? 'best' : ''}" data-brand="${r.carrier}">
        <div class="card-head">
          ${isBest ? '<div class="best-tag">최저가</div>' : ''}
          <p class="brand">${BRAND_LABEL[r.carrier]}</p>
          <p class="plan-name">${tvLabel || '미제공'}</p>
        </div>
        <div class="price-block">${priceBlock}</div>
        <div class="items">${itemsHtml}</div>
        ${commHtml}
      </div>
    `;
  }).join('');
}

(async function init(){
  const ok = await loadData();
  if (ok) render();
})();
</script>
</body>
</html>
