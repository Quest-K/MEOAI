<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인터넷+TV 결합 요금 및 수수료 비교</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --ink:#2C2E35;
    --ink-dim:#6B6E76;
    --bg:#F4F2EB;
    --bg-raised:#FFFFFF;
    --paper:#FFFFFF;
    --paper-line:#E6E2D6;
    --line-on-dark:#D8D3C5;
    --gold:#C88A2B;
    --kt:#C4763B;
    --lg:#2F8F7E;
    --sk:#5D52A3;
    --skylife:#337AB7;
    --hellovision:#D9534F;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Pretendard', -apple-system, sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:1080px;
    margin:0 auto;
    padding:56px 24px 96px;
  }

  header{
    margin-bottom:32px;
    padding-bottom:24px;
    border-bottom:1px solid var(--line-on-dark);
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--ink-dim);
    letter-spacing:0.02em;
    margin:0 0 14px;
  }
  h1{
    font-family:'Newsreader', serif;
    font-weight:600;
    font-size:clamp(30px, 4.4vw, 44px);
    margin:0 0 14px;
    color:#1C1E24;
  }
  header p{
    max-width:60ch;
    color:var(--ink-dim);
    font-size:15.5px;
    margin:0;
  }

  #status-banner{
    display:block;
    margin-bottom:32px;
    padding:16px 20px;
    border-radius:var(--radius);
    font-size:13.5px;
    line-height:1.6;
    background:#EFEDE4;
    border:1px solid var(--paper-line);
    color:var(--ink);
  }
  .banner-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
  }
  #status-banner .title{
    font-weight:700;
    font-size:14px;
  }
  .last-modified{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-dim);
  }
  #status-banner .log-item{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    margin:2px 0;
  }
  #status-banner .success{ color:#1E7E34; }
  #status-banner .error{ color:#D9534F; font-weight:600; }

  .controls{
    display:flex;
    flex-direction:column;
    gap:26px;
    margin-bottom:52px;
    background:var(--bg-raised);
    padding:28px;
    border-radius:var(--radius);
    box-shadow:0 4px 20px rgba(0,0,0,0.03);
    border:1px solid var(--paper-line);
  }
  .control-group label.group-label{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-dim);
    margin-bottom:10px;
    font-weight:600;
  }
  .seg{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .seg button{
    appearance:none;
    border:1px solid var(--paper-line);
    background:#FAFAF7;
    color:var(--ink);
    padding:10px 18px;
    font-family:'Pretendard', sans-serif;
    font-size:14.5px;
    font-weight:500;
    border-radius:var(--radius);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease, color .15s ease;
  }
  .seg button:hover:not(:disabled){ border-color:var(--gold); background:#FFFDF9; }
  .seg button.active{
    background:var(--gold);
    border-color:var(--gold);
    color:#FFFFFF;
    font-weight:600;
  }
  .seg button:disabled{
    opacity:0.4;
    cursor:not-allowed;
    background:#EAE8E1;
  }

  .results{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:18px;
  }
  @media (max-width: 820px){
    .results{ grid-template-columns:1fr; }
  }

  .card{
    background:var(--paper);
    color:#20211D;
    border-radius:var(--radius);
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow:0 10px 30px -10px rgba(0,0,0,.08);
    border:1px solid var(--paper-line);
  }
  .card.best{ transform:translateY(-6px); box-shadow:0 16px 36px -12px rgba(200,138,43,.25); border-color:var(--gold); }

  .card-head{
    padding:18px 18px 14px;
    color:#fff;
    position:relative;
  }
  .card-head .brand{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.05em;
    opacity:.9;
    margin:0 0 4px;
  }
  .card-head .plan-name{
    font-family:'Newsreader', serif;
    font-weight:600;
    font-size:20px;
    margin:0;
  }
  .card[data-brand="kt"] .card-head{ background:var(--kt); }
  .card[data-brand="lg"] .card-head{ background:var(--lg); }
  .card[data-brand="sk"] .card-head{ background:var(--sk); }
  .card[data-brand="skylife"] .card-head{ background:var(--skylife); }
  .card[data-brand="hellovision"] .card-head{ background:var(--hellovision); }

  .best-tag{
    position:absolute;
    top:12px;
    right:-2px;
    background:var(--gold);
    color:#FFFFFF;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    font-weight:600;
    padding:4px 10px 4px 12px;
    letter-spacing:.03em;
  }

  .price-block{
    padding:18px 18px 14px;
    border-bottom:1px dashed var(--paper-line);
  }
  .price-block .amount{
    font-family:'IBM Plex Mono', monospace;
    font-size:24px;
    font-weight:600;
    color:#1C1E24;
  }
  .price-block .amount span{ font-size:13px; font-weight:500; color:#6B6C64; margin-left:4px;}

  .items{
    padding:14px 18px 16px;
    flex:1;
  }
  .item-row{
    display:flex;
    align-items:baseline;
    gap:6px;
    font-size:13px;
    padding:5px 0;
    color:#4B4C45;
  }
  .item-row .label{ white-space:nowrap; color:#8C877A; }
  .item-row .dots{ flex:1; border-bottom:1px dotted #C9C4B2; transform:translateY(-4px); }
  .item-row .value{ white-space:nowrap; font-weight:500; color:#20211D; }

  .commission-section{
    border-top:1px solid var(--paper-line);
    background:#FAFAF7;
    padding:16px 18px;
    font-size:12.5px;
  }
  .comm-title{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    font-weight:600;
    color:var(--ink-dim);
    margin-bottom:8px;
    text-transform:uppercase;
  }
  .comm-group{ margin-bottom:6px; }
  .comm-subhead{ font-weight:600; color:#3A3C42; margin-bottom:4px; }
  .comm-subhead.large{ font-size:13px; color:#1C1E24; }
  .comm-row{ display:flex; justify-content:space-between; align-items:center; padding:2px 0 2px 6px; color:#5C5E66; font-size:12px; }
  .comm-row.large{ font-size:13px; }
  .comm-row.highlight{ font-weight:600; color:var(--ink); }

  .gift-input{
    width:125px;
    text-align:right;
    padding:4px 8px;
    font-size:14px;
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    border:1px solid var(--paper-line);
    border-radius:4px;
    background:#FFFFFF;
    color:#1C1E24;
  }
  .gift-input:focus{ outline:none; border-color:var(--gold); }
  .margin-text{ font-size:15px; font-weight:700; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="eyebrow">GIGA COMPARE / 02</p>
    <h1>통신사별 요금 및 경품고시 비교</h1>
    <p>속도와 TV 요금제 옵션에 따른 월 요금과 경품고시 가이드 기준 혜택을 실시간 확인하세요.</p>
  </header>

  <div id="status-banner">
    <div class="banner-header">
      <div class="title">🔍 Supabase 테이블 연동 현황 (2개 테이블 구조)</div>
      <div class="last-modified" id="last-updated">최종 수정: -</div>
    </div>

  <div class="controls">
    <div class="control-group">
      <label class="group-label">인터넷 속도</label>

      <label class="group-label">공유기 (Wi-Fi)</label>

      <label class="group-label">TV 요금제</label>

    <div class="control-group">
      <label class="group-label">TV 셋톱박스</label>

</div>

<script>
const SUPABASE_URL = 'https://jhfhpumhifyhauuoinxc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpoZmhwdW1oaWZ5aGF1dW9pbnhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MDE2NTMsImV4cCI6MjEwMzk3NzY1M30.euXk3eXtUVvEQRDGgcLhvX3JhVlpv9D7fZUEDr0i8yA';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CARRIERS = ['kt', 'lg', 'sk', 'skylife', 'hellovision'];
const BRAND_LABEL = { kt:'KT', lg:'LG', sk:'SK', skylife:'스카이라이프', hellovision:'헬로비전' };

const TV_TIER_MAP = {
  kt: { low:'베이직', basic:'에센스', premium:'모든G' },
  lg: { low:'실속형', basic:'기본형', premium:'프리미엄' },
  sk: { low:'Btv 이코노미', basic:'Btv 스탠다드', premium:'Btv All' },
  skylife: { low:'수신기', basic:'수신기', premium:'수신기' },
  hellovision: { low:'HD셋탑', basic:'UHD셋탑', premium:'UHD셋탑' }
};

const SPEED_LABEL = { 100:'100M', 500:'500M', 1000:'1기가' };
const ROUTER_LABEL = { N:'미포함', Y:'포함' };

let DATA = null;
let COMMISSION_DATA = {};
let PROMOTION_DATA = {};
let customGiftValues = {};
let state = { speed:'1000', tv:'basic', settopTier:'basic', router:'Y' };
let logs = [];

function displayLastModified() {
  const modDate = new Date(document.lastModified);
  if (!isNaN(modDate.getTime())) {
    document.getElementById('last-updated').textContent = `최종 수정: ${modDate.toISOString().slice(0, 16).replace('T', ' ')}`;
  }
}

function addLog(tableName, isSuccess, message) {
  const statusClass = isSuccess ? 'success' : 'error';
  logs.push(`<div class="log-item ${statusClass}">${isSuccess ? '✅' : '❌'} [${tableName}] : ${message}</div>`);
  document.getElementById('banner-logs').innerHTML = logs.join('');
}

async function loadData(){
  logs = [];
  const [internetRes, tvRes, settopRes] = await Promise.all([
    sb.from('internet_plans').select('*').in('carrier', CARRIERS),
    sb.from('tv_plans').select('*').in('carrier', CARRIERS),
    sb.from('settop_boxes').select('*').in('carrier', CARRIERS)
  ]);

  addLog('internet_plans', !internetRes.error, internetRes.error ? internetRes.error.message : `${internetRes.data.length}건`);
  addLog('tv_plans', !tvRes.error, tvRes.error ? tvRes.error.message : `${tvRes.data.length}건`);
  addLog('settop_boxes', !settopRes.error, settopRes.error ? settopRes.error.message : `${settopRes.data.length}건`);

  if (internetRes.error || tvRes.error || settopRes.error) return false;

  DATA = {};
  CARRIERS.forEach(c => { DATA[c] = { internet:{}, tv:{}, settopList:[] }; });

  internetRes.data.forEach(row => {
    if (DATA[row.carrier]) DATA[row.carrier].internet[row.speed] = { fee: row.monthly_fee, routerFee: row.router_fee };
  });

  CARRIERS.forEach(carrier => {
    Object.entries(TV_TIER_MAP[carrier] || {}).forEach(([tierKey, planName]) => {
      const match = tvRes.data.find(r => r.carrier === carrier && r.plan_name === planName);
      if (match) DATA[carrier].tv[tierKey] = { name: match.plan_name, fee: match.monthly_fee };
    });
  });

  settopRes.data.forEach(row => {
    if (DATA[row.carrier]) DATA[row.carrier].settopList.push({ name: row.model_name, fee: row.monthly_fee });
  });

  return true;
}

async function loadFinanceData() {
  const speedStr = String(state.speed);
  const tvTierForComm = state.tv;
  const tvTierForPromo = state.tv === 'none' ? 'none' : 'all'; // 경품고시는 단품(none)과 결합(all) 구조

  const [commRes, promoRes] = await Promise.all([
    sb.from('carrier_commissions').select('*').eq('speed', speedStr),
    sb.from('carrier_promotions').select('*').eq('speed', speedStr).eq('tv_tier', tvTierForPromo)
  ]);

  addLog('carrier_commissions', !commRes.error, commRes.error ? commRes.error.message : `${commRes.data?.length || 0}건 조회`);
  addLog('carrier_promotions', !promoRes.error, promoRes.error ? promoRes.error.message : `${promoRes.data?.length || 0}건 조회`);

  COMMISSION_DATA = {};
  PROMOTION_DATA = {};
  customGiftValues = {};

  CARRIERS.forEach(carrier => {
    // 수수료 매핑
    const commRows = commRes.data ? commRes.data.filter(r => r.carrier === carrier) : [];
    const internetComm = commRows.find(r => String(r.tv_tier) === 'none')?.commission_amount || 0;
    const tvComm = tvTierForComm !== 'none' ? (commRows.find(r => String(r.tv_tier) === tvTierForComm)?.commission_amount || 0) : 0;
    
    COMMISSION_DATA[carrier] = { internetComm, tvComm, totalComm: internetComm + tvComm };

    // 프로모션/경품고시 매핑
    const promoRow = promoRes.data ? promoRes.data.find(r => r.carrier === carrier) : null;
    if (promoRow) {
      PROMOTION_DATA[carrier] = {
        giftCard: promoRow.gift_card,
        cash: promoRow.cash_amount,
        maxLimit: promoRow.max_promo_limit || (promoRow.gift_card + promoRow.cash_amount)
      };
    } else {
      PROMOTION_DATA[carrier] = null;
    }
  });
}

function setupSeg(id, key){
  document.getElementById(id).querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      state[key] = btn.dataset.value;
      if (key === 'tv') {
        document.querySelectorAll('#seg-settop button').forEach(b => b.disabled = state.tv === 'none');
      }
      if (key === 'speed' || key === 'tv') {
        logs = logs.slice(0, 3);
        await loadFinanceData();
      }
      render();
    });
  });
}

function getSettopByTier(carrier, tier) {
  const list = DATA[carrier]?.settopList || [];
  if (!list.length) return null;
  if (tier === 'basic') return list.find(s => s.fee <= 4400) || list[0];
  if (tier === 'advanced') return list.find(s => s.fee > 4400 && s.fee <= 7700) || list[1] || list[0];
  return list.find(s => s.fee >= 8800) || list[list.length - 1];
}

function computePrice(carrier){
  const speedData = DATA[carrier]?.internet[state.speed];
  if (!speedData) return { available:false };

  let total = speedData.fee;
  if (state.router === 'Y') total += speedData.routerFee;

  let tvInfo = null, settopInfo = null, bundleDiscount = 0;

  if (state.tv !== 'none') {
    tvInfo = DATA[carrier].tv[state.tv];
    if (!tvInfo) return { available:false, noTier:true };
    total += tvInfo.fee;
    
    settopInfo = getSettopByTier(carrier, state.settopTier);
    if (settopInfo) total += settopInfo.fee;

    bundleDiscount = (carrier === 'sk' && String(state.speed) === '100') ? 2200 : 5500;
    total -= bundleDiscount;
  }

  return { available:true, total, tvInfo, settopInfo, bundleDiscount };
}

function handleGiftInputChange(carrier, rawVal) {
  const numVal = parseInt(rawVal.replace(/[^0-9]/g, ''), 10);
  customGiftValues[carrier] = !isNaN(numVal) ? numVal : 0;
  render();
}

function render(){
  if (!DATA) return;

  document.querySelectorAll('#seg-speed button').forEach(b=>b.classList.toggle('active', b.dataset.value===state.speed));
  document.querySelectorAll('#seg-tv button').forEach(b=>b.classList.toggle('active', b.dataset.value===state.tv));
  document.querySelectorAll('#seg-settop button').forEach(b=>b.classList.toggle('active', b.dataset.value===state.settopTier));
  document.querySelectorAll('#seg-router button').forEach(b=>b.classList.toggle('active', b.dataset.value===state.router));

  const results = CARRIERS.map(carrier => ({ carrier, ...computePrice(carrier) }));
  const availableTotals = results.filter(r=>r.available).map(r=>r.total);
  const minTotal = availableTotals.length ? Math.min(...availableTotals) : null;

  document.getElementById('results').innerHTML = results.map(r=>{
    const isBest = r.available && r.total === minTotal;
    const tvLabel = state.tv === 'none' ? '인터넷 단독' : (r.tvInfo ? r.tvInfo.name : null);
    const comm = COMMISSION_DATA[r.carrier];
    const promo = PROMOTION_DATA[r.carrier];

    let commHtml = '';
    if (r.available && comm && promo) {
      const userGiftVal = customGiftValues[r.carrier] !== undefined ? customGiftValues[r.carrier] : promo.maxLimit;
      const calcCash = Math.max(0, userGiftVal - promo.giftCard);
      const calcMargin = comm.totalComm - userGiftVal;

      commHtml = `
        <div class="commission-section">
          <div class="comm-title">정산 및 혜택 상세</div>
          <div class="comm-group">
            <div class="comm-subhead">🎁 고객 지급 혜택 (경품고시 가이드)</div>
            <div class="comm-row"><span>· 상품권</span><span>${promo.giftCard.toLocaleString()}원</span></div>
            <div class="comm-row"><span>· 현금 가이드</span><span>${promo.cash.toLocaleString()}원</span></div>
            <div class="comm-row highlight" style="margin-top: 2px; padding-top: 2px; border-top: 1px dashed var(--paper-line);">
              <span>· 경품고시 한도 총액</span><span>${promo.maxLimit.toLocaleString()}원</span></div>
          </div>
          
          <div class="comm-group" style="margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--paper-line);">
            <div class="comm-subhead">💼 대리점 판매 수수료 (정산금)</div>
            <div class="comm-row"><span>· 인터넷 수수료</span><span>${comm.internetComm.toLocaleString()}원</span></div>
            ${state.tv !== 'none' ? `<div class="comm-row"><span>· TV 수수료</span><span>${comm.tvComm.toLocaleString()}원</span></div>` : ''}
            <div class="comm-row highlight" style="margin-top: 4px; padding-top: 4px; border-top: 1px solid var(--paper-line);">
              <span>· 총 수수료</span><span>${comm.totalComm.toLocaleString()}원</span></div>
          </div>

          <div class="comm-group" style="margin-top: 12px; padding-top: 10px; border-top: 2px solid var(--paper-line);">
            <div class="comm-subhead large">💵 실제 지급 사은품 조정</div>
            <div class="comm-row highlight large" style="margin-bottom: 4px;">
              <span>· 고객 지급 사은품</span>
              <div>
                <input type="text" class="gift-input" value="${userGiftVal.toLocaleString()}" 
                       onchange="handleGiftInputChange('${r.carrier}', this.value)" onfocus="this.select()"> 원
              </div>
            </div>
            <div class="comm-row large"><span>└ 상품권</span><span>${promo.giftCard.toLocaleString()}원</span></div>
            <div class="comm-row large"><span>└ 현금</span><span>${calcCash.toLocaleString()}원</span></div>
          </div>

          <div class="comm-group" style="margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--paper-line);">
            <div class="comm-row highlight margin-text" style="color:${calcMargin >= 0 ? '#1E7E34' : '#D9534F'};">
              <span>📊 대리점 최종 마진</span><span>${calcMargin.toLocaleString()}원</span>
            </div>
          </div>
        </div>
      `;
    }

    return `
      <div class="card ${isBest ? 'best' : ''}" data-brand="${r.carrier}">
        <div class="card-head">
          ${isBest ? '<div class="best-tag">최저가</div>' : ''}
          <p class="brand">${BRAND_LABEL[r.carrier]}</p>
          <p class="plan-name">${tvLabel || '미제공'}</p>
        </div>
        <div class="price-block">
          ${r.available ? `<div class="amount">${r.total.toLocaleString()}<span>원 / 월</span></div>` : `<div class="unavailable">조합 정보 없음</div>`}
        </div>
        <div class="items">
          ${r.available ? `
            <div class="item-row"><span class="label">인터넷</span><span class="dots"></span><span class="value">${SPEED_LABEL[state.speed]}</span></div>
            <div class="item-row"><span class="label">공유기</span><span class="dots"></span><span class="value">${ROUTER_LABEL[state.router]}</span></div>
            <div class="item-row"><span class="label">TV 요금제</span><span class="dots"></span><span class="value">${tvLabel}</span></div>
            ${r.settopInfo ? `<div class="item-row"><span class="label">셋톱박스</span><span class="dots"></span><span class="value">${r.settopInfo.name}</span></div>` : ''}
          ` : ''}
        </div>
        ${commHtml}
      </div>
    `;
  }).join('');
}

(async function init(){
  displayLastModified();
  setupSeg('seg-speed','speed');
  setupSeg('seg-tv','tv');
  setupSeg('seg-settop','settopTier');
  setupSeg('seg-router','router');

  if (await loadData()) {
    await loadFinanceData();
    render();
  }
})();
</script>
</body>
</html>
