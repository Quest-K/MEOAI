<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>인터넷+TV 결합 요금 및 수수료 비교</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=Inconsolata:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    color-scheme: light only;
    --ink:#2C2E35;
    --ink-dim:#6B6E76;
    --bg:#F4F2EB;
    --bg-raised:#FFFFFF;
    --paper:#FFFFFF;
    --paper-line:#E6E2D6;
    --line-on-dark:#D8D3C5;
    --gold:#C88A2B;
    --kt:#C4763B;
    --lg:#2F8F7E;
    --skb:#5D52A3;
    --skt:#3F4493;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Pretendard', -apple-system, sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:1440px;
    margin:0 auto;
    padding:56px 24px 96px;
  }

  .top-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:32px;
    align-items:stretch;
    margin-bottom:32px;
    padding-bottom:24px;
    border-bottom:1px solid var(--line-on-dark);
  }
  @media (max-width: 900px){
    .top-grid{ grid-template-columns:1fr; }
  }

  header{
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .eyebrow{
    font-family:'Inconsolata', monospace;
    font-size:12.5px;
    color:var(--ink-dim);
    letter-spacing:0.02em;
    margin:0 0 14px;
  }
  h1{
    font-family:'Newsreader', serif;
    font-weight:600;
    font-size:clamp(30px, 4.4vw, 44px);
    margin:0 0 14px;
    color:#1C1E24;
  }
  header p{
    max-width:60ch;
    color:var(--ink-dim);
    font-size:15.5px;
    margin:0;
  }

  #status-banner{
    display:block;
    padding:16px 20px;
    border-radius:var(--radius);
    font-size:13.5px;
    line-height:1.6;
    background:#EFEDE4;
    border:1px solid var(--paper-line);
    color:var(--ink);
  }
  .banner-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
  }
  #status-banner .title{
    font-weight:700;
    font-size:14px;
  }
  .last-modified{
    font-family:'Inconsolata', monospace;
    font-size:12px;
    color:var(--ink-dim);
  }
  #status-banner .log-item{
    font-family:'Inconsolata', monospace;
    font-size:12.5px;
    margin:2px 0;
  }
  #status-banner .success{ color:#1E7E34; }
  #status-banner .error{ color:#D9534F; font-weight:600; }

  /* ---- 컨트롤 패널 (3분할) ---- */
  .controls{
    margin-bottom:52px;
  }
  .controls-grid.three{
    display:grid;
    grid-template-columns:1.1fr 1fr 1fr;
    gap:20px;
    align-items:start;
  }
  @media (max-width: 1180px){
    .controls-grid.three{ grid-template-columns:1fr; }
  }
  .controls-col{
    display:flex;
    flex-direction:column;
    gap:18px;
    background:var(--bg-raised);
    padding:22px;
    border-radius:var(--radius);
    box-shadow:0 4px 20px rgba(0,0,0,0.03);
    border:1px solid var(--paper-line);
  }
  .col-title{
    font-family:'Newsreader', serif;
    font-weight:600;
    font-size:20px;
    color:#1C1E24;
    margin:0 0 4px;
    padding-bottom:10px;
    border-bottom:2px solid var(--gold);
  }
  .group-box{
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:16px 16px 18px;
    background:#FAFAF7;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .group-subtitle{
    font-family:'Inconsolata', monospace;
    font-size:11px;
    font-weight:700;
    color:var(--gold);
    letter-spacing:.04em;
    text-transform:uppercase;
    margin:0;
  }
  .row-flex{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
  }
  .row-flex > div{ flex:1; min-width:150px; }

  .control-group label.group-label{
    display:block;
    font-family:'Inconsolata', monospace;
    font-size:12px;
    color:var(--ink-dim);
    margin-bottom:10px;
    font-weight:600;
  }
  .seg{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .seg button{
    appearance:none;
    -webkit-appearance:none;
    -moz-appearance:none;
    border:1px solid var(--paper-line);
    background:#FAFAF7;
    color:var(--ink);
    padding:10px 18px;
    font-family:'Pretendard', sans-serif;
    font-size:14.5px;
    font-weight:500;
    border-radius:var(--radius);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease, color .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .seg button:hover:not(:disabled){ border-color:var(--gold); background:#FFFDF9; }
  .seg button.active{
    background:var(--gold);
    border-color:var(--gold);
    color:#FFFFFF;
    font-weight:600;
  }
  .seg button:disabled{
    opacity:0.4;
    cursor:not-allowed;
    background:#EAE8E1;
  }
  .seg.nowrap{
    flex-wrap:nowrap;
  }
  .seg.nowrap button{
    flex:1;
    padding:10px 6px;
    font-size:13px;
    white-space:nowrap;
    text-align:center;
  }
  #seg-tv{
    flex-wrap:nowrap;
  }
  #seg-tv button{
    flex:1;
    padding:10px 8px;
    font-size:13px;
    white-space:nowrap;
    text-align:center;
  }
  @media (max-width: 520px){
    #seg-tv{ flex-wrap:wrap; }
    #seg-tv button{ flex:1 1 45%; }
    .seg.nowrap{ flex-wrap:wrap; }
    .seg.nowrap button{ flex:1 1 30%; }
  }

  .results{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:16px;
  }
  @media (max-width: 1280px){
    .results{ grid-template-columns:repeat(2, 1fr); }
  }
  @media (max-width: 640px){
    .results{ grid-template-columns:1fr; }
  }

  .card{
    background:var(--paper);
    color:#20211D;
    border-radius:var(--radius);
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow:0 10px 30px -10px rgba(0,0,0,.08);
    border:1px solid var(--paper-line);
  }
  .card.best{ transform:translateY(-6px); box-shadow:0 16px 36px -12px rgba(200,138,43,.25); border-color:var(--gold); }

  .card-head{
    padding:18px 18px 14px;
    color:#fff;
    position:relative;
  }
  .card-head .brand{
    font-family:'Inconsolata', monospace;
    font-size:12px;
    letter-spacing:0.05em;
    opacity:.9;
    margin:0 0 4px;
  }
  .card-head .brand .comm-date{
    font-weight:600;
    letter-spacing:0;
    opacity:.85;
  }
  .card-head .plan-name{
    font-family:'Newsreader', serif;
    font-weight:600;
    font-size:20px;
    margin:0;
  }
  .card[data-brand="kt"] .card-head{ background:var(--kt); }
  .card[data-brand="lg"] .card-head{ background:var(--lg); }
  .card[data-brand="skb"] .card-head{ background:var(--skb); }
  .card[data-brand="skt"] .card-head{ background:var(--skt); }

  .best-tag{
    position:absolute;
    top:12px;
    right:-2px;
    background:var(--gold);
    color:#FFFFFF;
    font-family:'Inconsolata', monospace;
    font-size:11px;
    font-weight:600;
    padding:4px 10px 4px 12px;
    letter-spacing:.03em;
  }

  .price-block{
    padding:18px 18px 14px;
    border-bottom:1px dashed var(--paper-line);
  }
  .price-block .amount{
    font-family:'Inconsolata', monospace;
    font-size:22px;
    font-weight:600;
    color:#1C1E24;
  }
  .price-block .amount span{ font-size:13px; font-weight:500; color:#6B6C64; margin-left:4px;}

  .items{
    padding:14px 18px 16px;
    flex:1;
  }
  .item-row{
    display:flex;
    align-items:baseline;
    gap:6px;
    font-size:13px;
    padding:5px 0;
    color:#4B4C45;
  }
  .item-row .label{ white-space:nowrap; color:#8C877A; }
  .item-row .dots{ flex:1; border-bottom:1px dotted #C9C4B2; transform:translateY(-4px); }
  .item-row .value{ white-space:nowrap; font-weight:500; color:#20211D; }
  .item-row .value.discount{ color:#D9534F; font-weight:600; }

  .commission-section{
    border-top:1px solid var(--paper-line);
    background:#FAFAF7;
    padding:16px 14px;
    font-size:12px;
  }
  .comm-title{
    font-family:'Inconsolata', monospace;
    font-size:11px;
    font-weight:600;
    color:var(--ink-dim);
    margin-bottom:8px;
    text-transform:uppercase;
  }
  .comm-group{ margin-bottom:6px; }
  .comm-subhead{ font-weight:600; color:#3A3C42; margin-bottom:4px; }
  .comm-subhead.large{ font-size:12.5px; color:#1C1E24; }
  .comm-subhead-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:4px;
  }
  .comm-subhead-row .comm-subhead{ margin-bottom:0; }
  .comm-subhead-row .subtotal{ font-weight:700; color:var(--ink); font-size:12px; }
  .comm-row{ display:flex; justify-content:space-between; align-items:center; padding:2px 0; color:#5C5E66; font-size:11.5px; }
  .comm-row.large{ font-size:12.5px; }
  .comm-row.highlight{ font-weight:600; color:var(--ink); }

  .gift-input{
    width:120px;
    text-align:right;
    padding:5px 8px;
    font-size:18px;
    font-family:'Inconsolata', monospace;
    font-weight:700;
    border:1px solid var(--paper-line);
    border-radius:4px;
    background:#FFFFFF;
    color:#1C1E24;
  }
  .gift-input:focus{ outline:none; border-color:var(--gold); }
  .margin-text{ font-size:14px; font-weight:700; }

  .phone-line{
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:10px 12px;
    margin-bottom:8px;
    background:#FAFAF7;
  }
  .mode-toggle{
    display:flex;
    gap:6px;
    margin-bottom:8px;
  }
  .mode-toggle button{
    appearance:none;
    -webkit-appearance:none;
    -moz-appearance:none;
    border:1px solid var(--paper-line);
    background:#FFFFFF;
    color:var(--ink-dim);
    padding:4px 11px;
    font-size:11.5px;
    font-weight:600;
    border-radius:4px;
    cursor:pointer;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .mode-toggle button.active{
    background:var(--gold);
    border-color:var(--gold);
    color:#fff;
  }
  .mode-toggle button:hover:not(.active){ border-color:var(--gold); }
  .phone-row{
    display:flex;
    gap:6px;
    align-items:center;
    flex-wrap:nowrap;
  }
  .new-block{
    display:flex;
    align-items:center;
    gap:6px;
    padding-left:10px;
    border-left:2px dashed var(--gold);
    flex-shrink:0;
  }
  .new-block .arrow{
    font-size:12.5px;
    color:var(--gold);
    font-weight:700;
    margin-right:1px;
  }
  .new-block-label{
    font-family:'Inconsolata', monospace;
    font-size:10.5px;
    color:var(--gold);
    font-weight:700;
    margin-right:1px;
    white-space:nowrap;
  }
  .phone-select{
    appearance:none;
    -webkit-appearance:none;
    -moz-appearance:none;
    padding:8px 8px;
    font-family:'Pretendard', sans-serif;
    font-size:13px;
    border:1px solid var(--paper-line);
    border-radius:4px;
    background:#FAFAF7;
    color:var(--ink);
    width:82px;
    flex-shrink:0;
  }
  .fee-range-select{
    appearance:none;
    -webkit-appearance:none;
    -moz-appearance:none;
    padding:8px 8px;
    font-family:'Pretendard', sans-serif;
    font-size:13px;
    border:1px solid var(--paper-line);
    border-radius:4px;
    background:#FFFFFF;
    color:var(--ink);
    width:86px;
    flex-shrink:0;
  }
  .phone-fee-input{
    width:90px;
    text-align:right;
    padding:8px 8px;
    font-size:13px;
    font-family:'Inconsolata', monospace;
    border:1px solid var(--paper-line);
    border-radius:4px;
    background:#FFFFFF;
    color:#1C1E24;
    flex-shrink:0;
  }
  .phone-line{
    overflow-x:auto;
  }
  .phone-fee-input:focus, .phone-select:focus, .fee-range-select:focus{ outline:none; border-color:var(--gold); }
  .phone-unit{ font-size:12.5px; color:var(--ink-dim); }
  .phone-remove-btn{
    appearance:none;
    -webkit-appearance:none;
    -moz-appearance:none;
    border:1px solid var(--paper-line);
    background:#FAFAF7;
    color:#D9534F;
    padding:7px 10px;
    font-size:12.5px;
    border-radius:4px;
    cursor:pointer;
    margin-left:auto;
    -webkit-tap-highlight-color:transparent;
  }
  .phone-remove-btn:hover{ background:#FDEDEC; }
  .add-phone-btn{
    appearance:none;
    -webkit-appearance:none;
    -moz-appearance:none;
    border:1px dashed var(--gold);
    background:#FFFDF9;
    color:var(--gold);
    padding:9px 14px;
    font-size:13.5px;
    font-weight:600;
    border-radius:var(--radius);
    cursor:pointer;
    margin-top:4px;
    -webkit-tap-highlight-color:transparent;
  }
  .add-phone-btn:hover{ background:#FFF6E8; }
  .phone-empty{
    color:var(--ink-dim);
    font-size:13px;
    padding:8px 0;
  }

  .item-row.sub{
    padding-left:16px;
    color:#9C9890;
    font-size:12px;
  }
  .item-row.sub .label{ color:#A6A296; }

  .fam-table{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
  }
  .fam-table th, .fam-table td{
    padding:8px 5px;
    text-align:right;
    border-bottom:1px solid var(--paper-line);
    white-space:nowrap;
  }
  .fam-table th:first-child, .fam-table td:first-child{ text-align:left; }
  .fam-table thead th{
    font-family:'Inconsolata', monospace;
    font-size:12px;
    color:var(--ink-dim);
    font-weight:600;
    border-bottom:2px solid var(--paper-line);
  }
  .fam-table td.brand-cell{ font-weight:700; color:#1C1E24; }
  .fam-table td.total-cell{ font-weight:700; color:var(--gold); }
  .fam-table-note{
    font-size:12.5px;
    color:var(--ink-dim);
    margin-top:10px;
    line-height:1.55;
  }

  .phone-teen-toggle{
    display:flex;
    align-items:center;
    gap:4px;
    font-size:12px;
    color:var(--ink-dim);
    white-space:nowrap;
    flex-shrink:0;
    cursor:pointer;
    margin-left:auto;
  }
  .phone-teen-toggle input{ cursor:pointer; }

  .fam-accordion-group{
    margin-bottom:10px;
  }
  .fam-accordion-group:last-child{ margin-bottom:0; }
  .fam-accordion-carrier{
    font-family:'Inconsolata', monospace;
    font-size:11px;
    font-weight:700;
    color:var(--ink-dim);
    letter-spacing:.03em;
    margin-bottom:4px;
    text-transform:uppercase;
  }
  .fam-accordion-item{
    border:1px solid var(--paper-line);
    border-radius:6px;
    background:#FFFFFF;
    margin-bottom:4px;
    overflow:hidden;
  }
  .fam-accordion-item.disabled{ opacity:.55; }
  .fam-accordion-header{
    display:flex;
    flex-direction:column;
    gap:2px;
    padding:7px 10px;
    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .fam-accordion-item.disabled .fam-accordion-header{ cursor:default; }
  .fam-accordion-header:hover:not(.disabled *){ background:#FAFAF7; }
  .fam-accordion-row1{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .fam-accordion-row2{
    font-size:10.5px;
    color:var(--ink-dim);
    line-height:1.4;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .fam-accordion-name{
    font-size:12px;
    font-weight:600;
    color:#1C1E24;
    flex:1;
  }
  .fam-badge{
    font-family:'Inconsolata', monospace;
    font-size:10px;
    font-weight:600;
    padding:2px 7px;
    border-radius:10px;
    white-space:nowrap;
  }
  .fam-badge.badge-avail{ background:#E7F5EF; color:#1E7E34; }
  .fam-badge.badge-unavail{ background:#F2F1EB; color:#8C877A; }
  .fam-accordion-total{
    font-family:'Inconsolata', monospace;
    font-size:12.5px;
    font-weight:700;
    color:var(--gold);
    white-space:nowrap;
    min-width:62px;
    text-align:right;
  }
  .fam-accordion-chevron{
    color:var(--ink-dim);
    font-size:11px;
    width:10px;
    text-align:center;
  }
  .fam-detail-panel{
    border-top:1px dashed var(--paper-line);
    background:#FAFAF7;
    padding:8px 10px 10px;
  }
  .fam-detail-desc{
    font-size:11px;
    color:#5C5E66;
    line-height:1.5;
    margin-bottom:8px;
  }
  .fam-detail-distmode{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:8px;
  }
  .fam-detail-distmode label{
    font-family:'Inconsolata', monospace;
    font-size:10px;
    color:var(--ink-dim);
    font-weight:600;
    white-space:nowrap;
  }
  .fam-detail-distmode select{
    appearance:none;
    -webkit-appearance:none;
    -moz-appearance:none;
    flex:1;
    padding:4px 6px;
    font-size:11.5px;
    border:1px solid var(--paper-line);
    border-radius:4px;
    background:#FFFFFF;
    color:var(--ink);
  }
  .fam-detail-line-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:2px 0;
    font-size:11.5px;
    color:#4B4C45;
    border-bottom:1px dotted #E0DCCF;
  }
  .fam-detail-line-row:last-child{ border-bottom:none; }
  .fam-detail-line-row.fam-detail-header{
    font-weight:700;
    color:#1C1E24;
    border-bottom:1px solid var(--paper-line);
    margin-bottom:2px;
  }

  #login-gate{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
  }
  .login-box{
    width:100%;
    max-width:360px;
    background:var(--bg-raised);
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:32px 28px;
    box-shadow:0 4px 20px rgba(0,0,0,0.05);
  }
  .login-box h2{
    font-family:'Newsreader', serif;
    font-size:22px;
    margin:0 0 6px;
  }
  .login-box .sub{
    font-size:13px;
    color:var(--ink-dim);
    margin:0 0 22px;
  }
  .login-box label{
    display:block;
    font-family:'Inconsolata', monospace;
    font-size:11.5px;
    color:var(--ink-dim);
    margin:14px 0 6px;
    font-weight:600;
  }
  .login-box input{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--paper-line);
    border-radius:4px;
    font-size:14px;
    background:#FAFAF7;
    box-sizing:border-box;
  }
  .login-box input:focus{ outline:none; border-color:var(--gold); }
  .login-box button{
    appearance:none;
    -webkit-appearance:none;
    -moz-appearance:none;
    width:100%;
    margin-top:20px;
    padding:11px;
    border:none;
    border-radius:var(--radius);
    background:var(--ink);
    color:#fff;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .login-box button:hover{ background:#40424B; }
  .login-error{
    margin-top:12px;
    font-size:12.5px;
    color:#D9534F;
    min-height:16px;
  }
  .logout-btn{
    appearance:none;
    -webkit-appearance:none;
    -moz-appearance:none;

  });

}

function normalizeSpeedValue(v){
  if (v === null || v === undefined) return null;
  const s = String(v).trim();
  const num = parseFloat(s.replace(/,/g, ''));
  if (isNaN(num)) return null;
  if (/(g|기가)/i.test(s) && !/m/i.test(s)) return num * 1000;
  return num;
}

async function loadFinanceData() {
  const targetSpeed = Number(state.speed);
  const tvIncluded = state.tvIncluded === 'Y';
  const tvTierForComm = tvIncluded ? state.tv : 'none';
  const tvTierForPromo = tvIncluded ? 'all' : 'none';

  const [commRes, promoRes] = await Promise.all([
    sb.rpc('get_admin_commissions'),
    sb.from('carrier_promotions').select('*').eq('tv_tier', tvTierForPromo)
  ]);

  addLog('get_admin_commissions (RPC)', !commRes.error, commRes.error ? commRes.error.message : `${commRes.data?.length || 0}건 조회`);
  addLog('carrier_promotions', !promoRes.error, promoRes.error ? promoRes.error.message : `${promoRes.data?.length || 0}건 조회`);

  COMMISSION_DATA = {};
  PROMOTION_DATA = {};

  CARRIERS.forEach(carrier => {
    const commRows = commRes.data
      ? commRes.data.filter(r => String(r.carrier).toLowerCase() === carrier && normalizeSpeedValue(r.speed) === targetSpeed)
      : [];
    const internetComm = commRows.find(r => String(r.tv_tier) === 'none')?.commission_amount || 0;
    const tvComm = tvTierForComm !== 'none' ? (commRows.find(r => String(r.tv_tier) === tvTierForComm)?.commission_amount || 0) : 0;

    const startAtTimes = commRows.map(r => r.start_at).filter(Boolean).map(v => new Date(v)).filter(d => !isNaN(d.getTime()));
    const startAt = startAtTimes.length ? new Date(Math.max(...startAtTimes.map(d => d.getTime()))) : null;

    COMMISSION_DATA[carrier] = { internetComm, tvComm, totalComm: internetComm + tvComm, startAt };

    const promoRow = promoRes.data
      ? promoRes.data.find(r => String(r.carrier).toLowerCase() === carrier && normalizeSpeedValue(r.speed) === targetSpeed)
      : null;
    if (promoRow) {
      PROMOTION_DATA[carrier] = {
        giftCard: promoRow.gift_card,
        cash: promoRow.cash_amount,
        maxLimit: promoRow.max_promo_limit || (promoRow.gift_card + promoRow.cash_amount)
      };
    } else {
      PROMOTION_DATA[carrier] = null;
    }
  });
}

// TV 포함 여부에 따라 TV 요금제 / 셋톱박스 버튼의 활성화 상태를 동기화

function getSettopByTier(carrier, tier) {
  const list = DATA[carrier]?.settopList || [];
  if (!list.length) return null;
  if (tier === 'basic') return list.find(s => s.fee <= 4400) || list[0];
  if (tier === 'advanced') return list.find(s => s.fee > 4400 && s.fee <= 7700) || list[1] || list[0];
  return list.find(s => s.fee >= 8800) || list[list.length - 1];
}

function computePrice(carrier){
  const speedData = DATA[carrier]?.internet[state.speed];
  if (!speedData) return { available:false };

  let internetFee = speedData.fee;
  let total = internetFee;
  
  let actualRouterFee = speedData.routerFee;
  if (state.router === 'Y') {
    if (carrier === 'lg') {
      actualRouterFee = 0;
    } else if (carrier === 'kt' && Number(state.speed) >= 1000) {
      actualRouterFee = 0;
    }
    total += actualRouterFee;
  } else {
    actualRouterFee = 0;
  }

  let tvInfo = null, settopInfo = null, bundleDiscount = 0, tvBundleDiscount = 0;
  let tvFee = 0, settopFee = 0;

  if (state.tvIncluded === 'Y') {
    tvInfo = DATA[carrier].tv[state.tv];
    if (!tvInfo) return { available:false, noTier:true };
    tvFee = tvInfo.fee;
    total += tvFee;
    
    settopInfo = getSettopByTier(carrier, state.settopTier);
    if (settopInfo) {
      settopFee = settopInfo.fee;
      total += settopFee;
    }

    const speedNum = Number(state.speed);
    if (carrier === 'kt' || carrier === 'lg') {
      if (speedNum === 100) bundleDiscount = 0;
      else if (speedNum === 500 || speedNum === 1000) bundleDiscount = 5500;
    } else if (carrier === 'skb' || carrier === 'skt') {
      if (speedNum === 100) bundleDiscount = 1100;
      else if (speedNum === 500) bundleDiscount = 5500;
      else if (speedNum === 1000) bundleDiscount = 5500;
    }

    total -= bundleDiscount;

    tvBundleDiscount = TV_BUNDLE_DISCOUNT[carrier]?.[state.tv] || 0;
    total -= tvBundleDiscount;
  }

  return { available:true, total, internetFee, routerFee: actualRouterFee, tvFee, settopFee, bundleDiscount, tvBundleDiscount, tvInfo, settopInfo };
}

// ---- 공통 유틸 ----

function distributeAmount(lines, totalAmount, mode){
  const n = lines.length;
  let shares = new Array(n).fill(0);
  if (totalAmount <= 0 || n === 0) return shares;
  const feeSum = lines.reduce((a,p)=>a+(Number(p.fee)||0),0);
  if (mode === 'concentrate') {
    shares[0] = totalAmount;
  } else if (mode === 'contribution' && feeSum > 0) {
    let remaining = totalAmount;
    lines.forEach((p, i) => {
      if (i === n - 1) { shares[i] = remaining; }
      else {
        const share = Math.round((totalAmount * (Number(p.fee)||0) / feeSum) / 10) * 10;
        shares[i] = share;
        remaining -= share;
      }
    });
  } else { // equal
    let remaining = totalAmount;
    lines.forEach((p, i) => {
      if (i === n - 1) { shares[i] = remaining; }
      else {
        const share = Math.round((totalAmount / n) / 10) * 10;
        shares[i] = share;
        remaining -= share;
      }
    });
  }
  return shares;
}

function tcInternetDiscountByTotal(total, is100){
  if (total < 22000) return is100 ? 1650 : 2200;
  if (total < 64900) return is100 ? 3300 : 5500;
  return 5500;
}

function tcMobileDiscountByTotal(total, is100){
  if (total < 64900) return 0;
  if (total < 108900) return is100 ? 3300 : 5500;
  if (total < 141900) return is100 ? 14300 : 16610;
  if (total < 174900) return is100 ? 18700 : 22110;
  return is100 ? 23100 : 27610;
}

function dcMobileDiscountByFee(fee){
  if (fee >= 77000) return 7000;
  if (fee >= 61000) return 5000;
  if (fee >= 37000) return 3000;
  return 0;
}

function ktPremiumFamily(lines, speedNum){
  const count77kPlus = lines.filter(p => (Number(p.fee)||0) >= 77000).length;
  const avail = (speedNum >= 500 && count77kPlus >= 2 && lines.length >= 2);
  if (!avail) return { avail:false, internetDiscount:0, lineShares: lines.map(()=>0) };

  const is100 = speedNum === 100;
  let shares = new Array(lines.length).fill(0);
  let poolIdx = [], poolFeeSum = 0;

  lines.forEach((line, idx) => {
    const fee = Number(line.fee) || 0;
    const is25Eligible = (idx >= 1 && idx <= 6 && fee >= 77000);
    if (is25Eligible) {
      let d = Math.round(fee * 0.25 / 10) * 10;
      if (line.teen && fee >= 80000) {
        const hasGuardian80k = lines.some((l2, idx2) => idx2 !== idx && (Number(l2.fee)||0) >= 80000);
        if (hasGuardian80k) d += 5500;
      }
      shares[idx] = d;
    } else {
      poolIdx.push(idx);
      poolFeeSum += fee;
    }
  });

  const poolMobileTotal = poolFeeSum > 0 ? tcMobileDiscountByTotal(poolFeeSum, is100) : 0;
  if (poolMobileTotal > 0 && poolIdx.length > 0) {
    let remaining = poolMobileTotal;
    poolIdx.forEach((idx, i) => {
      if (i === poolIdx.length - 1) {
        shares[idx] = remaining;
      } else {
        const share = Math.round((poolMobileTotal * (lines[idx].fee / poolFeeSum)) / 10) * 10;
        shares[idx] = share;
        remaining -= share;
      }
    });
  }

  return { avail:true, internetDiscount:5500, lineShares:shares };
}

function ktPremiumSingle(lines, speedNum){
  const count77kPlus = lines.filter(p => (Number(p.fee)||0) >= 77000).length;
  const avail = (speedNum >= 500 && count77kPlus >= 1 && lines.length === 1);
  if (!avail) return { avail:false, internetDiscount:0, lineShares: lines.map(()=>0) };

  const lineShares = lines.map(line => {
    const fee = Number(line.fee) || 0;
    return fee >= 77000 ? Math.round(fee * 0.25 / 10) * 10 : 0;
  });
  return { avail:true, internetDiscount:5500, lineShares };
}

function computeKTOptions(lines, speedNum, tcDistMode){
  const is100 = speedNum === 100;
  const count = lines.length;
  const sum = lines.reduce((a,p)=>a+(Number(p.fee)||0),0);

  const tcInternet = count > 0 ? tcInternetDiscountByTotal(sum, is100) : 0;
  const tcMobileTotal = count > 0 ? tcMobileDiscountByTotal(sum, is100) : 0;
  const tcShares = distributeAmount(lines, tcMobileTotal, tcDistMode);

  const dcInternet = count > 0 ? 5500 : 0;
  const dcShares = lines.map(p => dcMobileDiscountByFee(Number(p.fee)||0));
  const dcMobileTotal = dcShares.reduce((a,b)=>a+b,0);

  const pf = ktPremiumFamily(lines, speedNum);
  const ps = ktPremiumSingle(lines, speedNum);

  return [
    {
      key:'kt-total', name:'총액 결합할인', avail: count > 0,
      availText: count > 0 ? '가입 가능' : '매칭 회선 없음',
      internetDiscount: tcInternet, lineShares: tcShares,
      total: tcInternet + tcMobileTotal, hasDistMode: true,
      desc: 'KT 매칭 회선의 요금제 합산액 구간에 따라 인터넷 할인과 모바일 할인 총액이 정해지고, 모바일 할인 총액은 아래 배분 방식대로 회선별로 나눠집니다.'
    },
    {
      key:'kt-flat', name:'정액 결합할인', avail: count > 0,
      availText: count > 0 ? '가입 가능' : '매칭 회선 없음',
      internetDiscount: dcInternet, lineShares: dcShares,
      total: dcInternet + dcMobileTotal,
      desc: '인터넷 할인 5,500원 고정, 회선별 요금제 구간(37,000/61,000/77,000원 이상)에 따라 회선마다 개별 할인이 적용됩니다.'
    },
    {
      key:'kt-premium-family', name:'프리미엄 가족결합', avail: pf.avail,
      availText: pf.avail ? '가입 가능' : '조건 미달',
      reason: pf.avail ? null : '500M↑, 77,000원↑ 요금제 2회선 필요',
      internetDiscount: pf.internetDiscount, lineShares: pf.lineShares,
      total: pf.internetDiscount + pf.lineShares.reduce((a,b)=>a+b,0),
      desc: '인터넷 500M 이상 + 77,000원 이상 요금제 2회선 이상일 때 가능. 2~7번째 회선 중 77,000원 이상 회선은 25% 할인(청소년 조건 충족 시 5,500원 추가), 나머지 회선은 총액결합 모바일 할인 풀을 요금 비율로 배분받습니다.'
    },
    {
      key:'kt-premium-single', name:'프리미엄 싱글결합', avail: ps.avail,
      availText: ps.avail ? '가입 가능' : '조건 미달',
      reason: ps.avail ? null : '500M↑, 77,000원↑ 요금제 1회선 전용',
      internetDiscount: ps.internetDiscount, lineShares: ps.lineShares,
      total: ps.internetDiscount + ps.lineShares.reduce((a,b)=>a+b,0),
      desc: '인터넷 500M 이상 + 77,000원 이상 요금제 1회선만 있을 때 가능. 인터넷 5,500원 할인 + 해당 회선 25% 할인이 적용됩니다.'
    }
  ];
}

// ---- LG ----

function computeLGOptions(lines, speedNum){
  const count = lines.length;
  const internetMap = { 100:5500, 500:9900, 1000:13200 };
  const internetDiscount = count > 0 ? (internetMap[speedNum] || 0) : 0;

  let countBucket;
  if (count === 1) countBucket = 1;
  else if (count === 2) countBucket = 2;
  else if (count === 3) countBucket = 3;
  else countBucket = 4;

  const matrix = {
    1: { low:0, mid:0, high:0 },
    2: { low:2200, mid:3300, high:4400 },
    3: { low:3300, mid:5500, high:6600 },
    4: { low:4400, mid:6600, high:8800 }
  };
  const lineShares = lines.map(p => {
    const fee = Number(p.fee) || 0;
    let tier = 'low';
    if (fee >= 88000) tier = 'high';
    else if (fee >= 69000) tier = 'mid';
    return count > 0 ? matrix[countBucket][tier] : 0;
  });
  const mobileTotal = lineShares.reduce((a,b)=>a+b,0);

  return [
    {
      key:'lg-easy-family', name:'참쉬운가족결합할인', avail: count > 0,
      availText: count > 0 ? '가입 가능' : '매칭 회선 없음',
      internetDiscount, lineShares, total: internetDiscount + mobileTotal,
      desc: 'LG 매칭 회선 수와 인터넷 속도 구간에 따라 인터넷 할인이 정해지고, 회선별 요금제 구간(저가/중가/고가)에 따라 개별 모바일 할인이 적용됩니다.'
    },
    {
      key:'lg-together', name:'투게더결합할인', avail:false, availText:'준비중',
      internetDiscount:0, lineShares: lines.map(()=>0), total:0,
      desc:'계산 방식이 추가되는 대로 반영될 예정입니다.', disabled:true
    }
  ];
}

// ---- SKB / SKT ----

function computeSKOptions(lines, speedNum, groupKey){
  const count = lines.length;
  const internetMap = { 100:4400, 500:11000, 1000:13200 };
  const internetDiscount = count > 0 ? (internetMap[speedNum] || 0) : 0;

  let mobileTotal = 0;
  if (count === 1) mobileTotal = 3500;
  else if (count === 2) mobileTotal = 3500 * 2;
  else if (count > 2) mobileTotal = 6000 * count;

  const lineShares = distributeAmount(lines, mobileTotal, 'equal');

  return [
    {
      key:`sk-${groupKey}`, name:'요즘가족결합할인', avail: count > 0,
      availText: count > 0 ? '가입 가능' : '매칭 회선 없음',
      internetDiscount, lineShares, total: internetDiscount + mobileTotal,
      desc: 'SKT 매칭 회선 수와 인터넷 속도 구간에 따라 인터넷 할인이 정해지고, 모바일 할인 총액은 회선 수 기준으로 산정됩니다(회선별 금액은 이해를 돕기 위한 균등 배분 표시입니다).'
    }
  ];
}

// ---- 아코디언 렌더링 ----

function toggleDiscountItem(key){
  if (openDiscountItems.has(key)) openDiscountItems.delete(key);
  else openDiscountItems.add(key);
  renderFamilyDiscountAccordion();
}

function updateTcDistMode(mode){
  state.tcDistMode = mode;
  renderFamilyDiscountAccordion();
}

function renderAccordionItem(opt, lines){
  const isOpen = openDiscountItems.has(opt.key);
  const badgeClass = opt.avail ? 'badge-avail' : 'badge-unavail';
  const totalDisplay = opt.avail ? `${opt.total.toLocaleString()}원` : '-';

  let detailHtml = '';
  if (isOpen) {
    const lineRows = lines.length ? lines.map((p, i) => `
        <div class="fam-detail-line-row">
          <span>회선 ${p.idx + 1}${p.teen ? ' (청소년)' : ''} · ${p.fee.toLocaleString()}원</span>
          <span>${(opt.lineShares[i] || 0).toLocaleString()}원</span>
        </div>
      `).join('') : `<div class="fam-detail-line-row"><span>매칭되는 회선이 없습니다</span><span>-</span></div>`;

    const distModeSelect = opt.hasDistMode ? `
      <div class="fam-detail-distmode">
        <label>모바일 할인 배분 방식</label>
        <select onchange="updateTcDistMode(this.value)">
          <option value="equal" ${state.tcDistMode==='equal'?'selected':''}>1/N 균등 배분</option>
          <option value="contribution" ${state.tcDistMode==='contribution'?'selected':''}>기여도별 배분 (요금 비율)</option>
          <option value="concentrate" ${state.tcDistMode==='concentrate'?'selected':''}>대표 회선에 몰아주기</option>
        </select>
      </div>
    ` : '';

    detailHtml = `
      <div class="fam-detail-panel">
        <div class="fam-detail-desc">${opt.desc}</div>
        ${distModeSelect}
        <div class="fam-detail-line-row fam-detail-header">
          <span>인터넷 할인</span><span>${opt.internetDiscount.toLocaleString()}원</span>
        </div>
        ${lineRows}
      </div>
    `;
  }

  return `
    <div class="fam-accordion-item${opt.disabled ? ' disabled' : ''}">
      <div class="fam-accordion-header" ${opt.disabled ? '' : `onclick="toggleDiscountItem('${opt.key}')"`}>
        <div class="fam-accordion-row1">
          <span class="fam-accordion-name">${opt.name}</span>
          <span class="fam-badge ${badgeClass}">${opt.availText}</span>
          <span class="fam-accordion-total">${totalDisplay}</span>
          ${opt.disabled ? '' : `<span class="fam-accordion-chevron">${isOpen ? '▾' : '▸'}</span>`}
        </div>
        ${opt.reason ? `<div class="fam-accordion-row2">${opt.reason}</div>` : ''}
      </div>
      ${detailHtml}
    </div>
  `;
}

function renderFamilyDiscountAccordion(){
  const container = document.getElementById('family-discount-table');
  if (!container) return;

  const effectivePhones = familyPhones.map((p, idx) => ({ ...getEffectivePhone(p), idx }));
  const speedNum = Number(state.speed);

  const groups = [
    { key:'kt', label:'KT', matchLabel:'KT' },
    { key:'lg', label:'LG', matchLabel:'LGU+' },
    { key:'sk', label:'SKB / SKT', matchLabel:'SKT' }
  ];

  const changedCount = familyPhones.filter(p => p.mode === 'change').length;

  container.innerHTML = groups.map(g => {
    const lines = effectivePhones.filter(p => p.carrier === g.matchLabel);
    let options;
    if (g.key === 'kt') options = computeKTOptions(lines, speedNum, state.tcDistMode);
    else if (g.key === 'lg') options = computeLGOptions(lines, speedNum);
    else options = computeSKOptions(lines, speedNum, g.key);

    return `
      <div class="fam-accordion-group">
        <div class="fam-accordion-carrier">${g.label}</div>
        ${options.map(opt => renderAccordionItem(opt, lines)).join('')}
      </div>
    `;
  }).join('') + `
    <div class="fam-table-note">
      · "통신사 변경" 회선은 변경 예정 통신사·요금제 기준으로, "기존 유지" 회선은 기존 통신사·요금제 기준으로 계산됩니다.
      ${changedCount > 0 ? `<br>· 현재 ${changedCount}개 회선이 "통신사 변경" 상태로, 변경 예정 값 기준 계산 중입니다.` : ''}
      <br>· 위 금액은 참고용이며 현재 카드의 "총 요금"에는 반영되지 않습니다.
    </div>
  `;
}

function handleGiftInputChange(carrier, rawVal) {
  const numVal = parseInt(rawVal.replace(/[^0-9]/g, ''), 10);
  customGiftValues[carrier] = !isNaN(numVal) ? numVal : 0;
  render();
}

function render(){
  if (!DATA) return;

  document.querySelectorAll('#seg-speed button').forEach(b=>b.classList.toggle('active', b.dataset.value===state.speed));
  document.querySelectorAll('#seg-tv-include button').forEach(b=>b.classList.toggle('active', b.dataset.value===state.tvIncluded));
  document.querySelectorAll('#seg-tv button').forEach(b=>b.classList.toggle('active', b.dataset.value===state.tv));
  document.querySelectorAll('#seg-settop button').forEach(b=>b.classList.toggle('active', b.dataset.value===state.settopTier));
  document.querySelectorAll('#seg-router button').forEach(b=>b.classList.toggle('active', b.dataset.value===state.router));

  const results = CARRIERS.map(carrier => ({ carrier, ...computePrice(carrier) }));
  const availableTotals = results.filter(r=>r.available).map(r=>r.total);
  const minTotal = availableTotals.length ? Math.min(...availableTotals) : null;

  document.getElementById('results').innerHTML = results.map(r=>{
    const isBest = r.available && r.total === minTotal;
    
    let tvLabel = '인터넷 단독';
    if (state.tvIncluded === 'Y') {
      if (r.tvInfo) {
        const channelText = r.tvInfo.channels ? `(${r.tvInfo.channels}채널)` : '';
        tvLabel = `${r.tvInfo.name}${channelText}`;
      } else {
        tvLabel = null;
      }
    }

    const comm = COMMISSION_DATA[r.carrier];
    const promo = PROMOTION_DATA[r.carrier];

    let commHtml = '';
    if (r.available && comm && promo) {
      const userGiftVal = customGiftValues[r.carrier] !== undefined ? customGiftValues[r.carrier] : promo.maxLimit;
      const calcCash = Math.max(0, userGiftVal - promo.giftCard);
      const calcMargin = comm.totalComm - userGiftVal;

      commHtml = `
        <div class="commission-section">
          <div class="comm-title">정산 및 혜택 상세</div>
          <div class="comm-group">
            <div class="comm-subhead-row large" style="margin-bottom: 4px;">
              <div class="comm-subhead large">💵 실제 지급 사은품 조정</div>
              <div>
                <input type="text" inputmode="numeric" pattern="[0-9]*" class="gift-input" value="${userGiftVal.toLocaleString()}" 
                       onchange="handleGiftInputChange('${r.carrier}', this.value)" onfocus="this.select()"> 원
              </div>
            </div>
            <div class="comm-row large"><span>└ 상품권</span><span>${promo.giftCard.toLocaleString()}원</span></div>
            <div class="comm-row large"><span>└ 현금</span><span>${calcCash.toLocaleString()}원</span></div>
          </div>

          <div class="comm-group" style="margin-top: 10px; padding-top: 8px; border-top: 2px solid var(--paper-line);">
            <div class="comm-subhead-row">
              <div class="comm-subhead">🎁 고객 지급 혜택 (경품고시 가이드)</div>
              <div class="subtotal">${promo.maxLimit.toLocaleString()}원</div>
            </div>
            <div class="comm-row"><span>· 상품권</span><span>${promo.giftCard.toLocaleString()}원</span></div>
            <div class="comm-row"><span>· 현금 가이드</span><span>${promo.cash.toLocaleString()}원</span></div>
          </div>

          <div class="comm-group" style="margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--paper-line);">
            <div class="comm-subhead-row">
              <div class="comm-subhead">💼 대리점 판매 수수료 (정산금)</div>
              <div class="subtotal">${comm.totalComm.toLocaleString()}원</div>
            </div>
            <div class="comm-row"><span>· 인터넷 수수료</span><span>${comm.internetComm.toLocaleString()}원</span></div>
            ${state.tvIncluded === 'Y' ? `<div class="comm-row"><span>· TV 수수료</span><span>${comm.tvComm.toLocaleString()}원</span></div>` : ''}
          </div>

          <div class="comm-group" style="margin-top: 8px; padding-top: 6px; border-top: 1px dashed var(--paper-line);">
            <div class="comm-row highlight margin-text" style="color:${calcMargin >= 0 ? '#1E7E34' : '#D9534F'};">
              <span>📊 대리점 최종 마진</span><span>${calcMargin.toLocaleString()}원</span>
            </div>
          </div>
        </div>
      `;
    }

    return `
      <div class="card ${isBest ? 'best' : ''}" data-brand="${r.carrier}">
        <div class="card-head">
          ${isBest ? '<div class="best-tag">최저가</div>' : ''}
          <p class="brand">${comm && comm.startAt ? formatStartAt(comm.startAt) : ''}</p>
          <p class="plan-name">${BRAND_LABEL[r.carrier]} / ${tvLabel || '미제공'}</p>
        </div>
        <div class="price-block">
          ${r.available ? `<div class="amount">${r.total.toLocaleString()}<span>원 / 월</span></div>` : `<div class="unavailable">조합 정보 없음</div>`}
        </div>
        <div class="items">
          ${r.available ? `
            <div class="item-row"><span class="label">인터넷</span><span class="dots"></span><span class="value">${SPEED_LABEL[state.speed]} (${r.internetFee.toLocaleString()}원)</span></div>
            <div class="item-row sub"><span class="label">└ 공유기</span><span class="dots"></span><span class="value">${ROUTER_LABEL[state.router]} (${r.routerFee.toLocaleString()}원)</span></div>
            ${state.tvIncluded === 'Y' ? `
              <div class="item-row sub"><span class="label">└ 인터넷 결합할인</span><span class="dots"></span><span class="value discount">-${r.bundleDiscount.toLocaleString()}원</span></div>
              <div class="item-row"><span class="label">TV 요금제</span><span class="dots"></span><span class="value">${tvLabel} (${r.tvFee.toLocaleString()}원)</span></div>
              ${r.settopInfo ? `<div class="item-row sub"><span class="label">└ 셋톱박스</span><span class="dots"></span><span class="value">${r.settopInfo.name} (${r.settopFee.toLocaleString()}원)</span></div>` : ''}
              <div class="item-row sub"><span class="label">└ TV 결합할인</span><span class="dots"></span><span class="value discount">-${r.tvBundleDiscount.toLocaleString()}원</span></div>
            ` : ''}
          ` : ''}
        </div>
        ${commHtml}
      </div>
    `;
  }).join('');

  renderFamilyDiscountAccordion();
}

async function startApp(session){
  document.getElementById('login-gate').style.display = 'none';
  document.getElementById('main-content').style.display = '';
  document.getElementById('whoami').textContent = session.user.email;

  displayLastModified();
  setupSeg('seg-speed','speed');
  setupSeg('seg-tv-include','tvIncluded');
  setupSeg('seg-tv','tv');
  setupSeg('seg-settop','settopTier');
  setupSeg('seg-router','router');
  syncTvEnabledUI();
  renderFamilyPhones();

  if (await loadData()) {
    await loadFinanceData();
    render();
  }
}

function showLoginGate(){
  document.getElementById('login-gate').style.display = 'flex';
  document.getElementById('main-content').style.display = 'none';
}

async function handleLogin(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';

  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    errEl.textContent = '로그인 실패: ' + error.message;
    return;
  }
  await startApp(data.session);
}

async function handleLogout(){
  await sb.auth.signOut();
  location.reload();
}

(async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    await startApp(session);
  } else {
    showLoginGate();
  }
})();
</script>
