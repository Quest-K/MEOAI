<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>RPC 권한 체크 테스트</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  body{ font-family: -apple-system, sans-serif; max-width:560px; margin:40px auto; padding:0 16px; color:#222; }
  h1{ font-size:20px; }
  section{ border:1px solid #ddd; border-radius:8px; padding:16px; margin-bottom:16px; }
  label{ display:block; font-size:13px; color:#666; margin-bottom:4px; margin-top:10px; }
  input{ width:100%; padding:8px; box-sizing:border-box; border:1px solid #ccc; border-radius:4px; font-size:14px; }
  button{ margin-top:12px; padding:9px 16px; border:none; border-radius:4px; background:#2C2E35; color:#fff; font-size:14px; cursor:pointer; }
  button:hover{ background:#444; }
  button.secondary{ background:#eee; color:#222; }
  #status{ font-family:monospace; font-size:13px; padding:10px; background:#f6f6f6; border-radius:4px; white-space:pre-wrap; word-break:break-all; }
  #result{ font-family:monospace; font-size:12.5px; padding:10px; background:#f6f6f6; border-radius:4px; white-space:pre-wrap; word-break:break-all; max-height:300px; overflow:auto; }
  .ok{ color:#1E7E34; } .err{ color:#D9534F; }
</style>
</head>
<body>

<h1>RPC 권한 체크 테스트 (get_admin_commissions)</h1>

<section>
  <label>Email</label>
  <input id="email" type="email" placeholder="meo0623@naver.com">
  <label>Password</label>
  <input id="password" type="password">
  <button onclick="login()">로그인</button>
  <button class="secondary" onclick="logout()">로그아웃</button>
</section>

<section>
  <strong>현재 세션 상태</strong>
  <div id="status" style="margin-top:8px;">확인 전</div>
  <button class="secondary" onclick="checkSession()">세션 확인</button>
</section>

<section>
  <strong>RPC 호출 테스트</strong>
  <div style="margin:8px 0; font-size:13px; color:#666;">
    로그인 전 / 후 두 상태 모두에서 눌러보고 결과를 비교하세요.
  </div>
  <button onclick="callRpc()">get_admin_commissions() 호출</button>
  <div id="result" style="margin-top:10px;">결과 없음</div>
</section>

<script>
// 기존 프로젝트와 동일한 URL / anon key 사용 (anon key는 원래 클라이언트 노출용 값입니다)
const SUPABASE_URL = 'https://jhfhpumhifyhauuoinxc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpoZmhwdW1oaWZ5aGF1dW9pbnhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MDE2NTMsImV4cCI6MjEwMzk3NzY1M30.euXk3eXtUVvEQRDGgcLhvX3JhVlpv9D7fZUEDr0i8yA';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function login(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    document.getElementById('status').innerHTML = `<span class="err">로그인 실패: ${error.message}</span>`;
    return;
  }
  await checkSession();
}

async function logout(){
  await sb.auth.signOut();
  await checkSession();
}

async function checkSession(){
  const { data: { session } } = await sb.auth.getSession();
  const el = document.getElementById('status');
  if (session) {
    el.innerHTML =
      `<span class="ok">로그인됨</span>\nemail: ${session.user.email}\nuid: ${session.user.id}`;
  } else {
    el.innerHTML = `<span class="err">비로그인 상태 (anon)</span>`;
  }
}

async function callRpc(){
  const el = document.getElementById('result');
  el.textContent = '호출 중...';
  const { data, error } = await sb.rpc('get_admin_commissions');
  if (error) {
    el.innerHTML = `<span class="err">에러 (차단됨 또는 미배포 상태)\n\ncode: ${error.code || '-'}\nmessage: ${error.message}</span>`;
    return;
  }
  el.innerHTML = `<span class="ok">성공 (${data ? data.length : 0}건)</span>\n\n` + JSON.stringify(data, null, 2);
}

// 페이지 진입 시 현재 세션 자동 표시
checkSession();
</script>

</body>
</html>
