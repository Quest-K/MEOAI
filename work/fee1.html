<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>통신사 통합 상담, 수수료 계산 및 접수 시스템</title>
    <style>
        :root {
            --primary-color: #2b4c7e;
            --secondary-color: #52796f;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dcdcdc;
        }
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 10px auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 25px;
        }
        
        /* 상단 고객 상담 정보 입력 영역 스타일 */
        .consult-box {
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .consult-box h3 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 17px;
            border-bottom: 2px solid #cbd5e1;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .consult-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 900px) {
            .consult-grid {
                grid-template-columns: 1fr;
            }
        }
        .consult-sub-box {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 15px;
        }
        .consult-sub-box h4 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 14px;
            color: #334155;
            border-left: 3px solid var(--primary-color);
            padding-left: 8px;
        }
        .input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            align-items: center;
        }
        .input-row label {
            min-width: 85px;
            font-size: 12px;
            font-weight: bold;
            color: #475569;
            margin-bottom: 0;
        }
        .input-row input, .input-row select {
            flex: 1;
            padding: 7px 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 13px;
        }

        /* 3분할 레이아웃 스타일 */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1.2fr;
            gap: 20px;
        }
        @media (max-width: 1200px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .section-box {
            background-color: #fafbfc;
            border: 1px solid #e1e8ed;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .section-box h3 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 17px;
            border-bottom: 2px solid #e1e8ed;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #444;
            font-size: 13px;
        }
        select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            background-color: #fff;
            box-sizing: border-box;
            font-family: 'Malgun Gothic', sans-serif;
        }
        textarea {
            resize: vertical;
            line-height: 1.5;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .result-row.total {
            font-weight: bold;
            font-size: 17px;
            color: #d90429;
            border-top: 1px dashed var(--border-color);
            padding-top: 12px;
            margin-top: 12px;
        }
        .result-row.monthly {
            font-weight: bold;
            font-size: 15px;
            color: #2b4c7e;
            background-color: #eef3f9;
            padding: 8px;
            border-radius: 4px;
        }
        .result-row.gift {
            font-weight: bold;
            color: #2f3e46;
            background-color: #e8f4f8;
            padding: 8px;
            border-radius: 4px;
        }
        .memo-info {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }
    </style>
</head>

<div class="container">
    <h2>통신사 통합 상담, 수수료 및 사은품 계산 시스템</h2>
    
    <!-- 상단: 고객 상담 정보 입력 영역 (희망상품 및 기존상품 파악) -->
    <div class="consult-box">
        <h3>고객 상담 정보 파악</h3>
        <div class="consult-grid">
            <!-- 희망 상품 -->
            <div class="consult-sub-box">
                <h4>희망 상품</h4>
                <div class="input-row">
                    <label>통신사</label>
                    <input type="text" id="wishCarrier" placeholder="예: KT">
                </div>
                <div class="input-row">
                    <label>인터넷 속도</label>
                    <input type="text" id="wishSpeed" placeholder="예: 500M">
                </div>
                <div class="input-row">
                    <label>와이파이</label>
                    <input type="text" id="wishWifi" placeholder="예: 임대 Y">
                </div>
                <div class="input-row">
                    <label>TV채널 / 셋탑</label>
                    <input type="text" id="wishTv" placeholder="예: 에센스 / 지니AI">
                </div>
                <div class="input-row">
                    <label>TV 갯수</label>
                    <input type="text" id="wishTvCount" placeholder="예: 2대">
                </div>
                <div class="input-row">
                    <label>월요금 / 사은품</label>
                    <input type="text" id="wishPriceGift" placeholder="예: 48,400원 / 40만원">
                </div>
            </div>

            <!-- 기존 상품 -->
            <div class="consult-sub-box">
                <h4>기존 상품</h4>
                <div class="input-row">
                    <label>[인터넷] 통신사</label>
                    <input type="text" id="oldNetCarrier" placeholder="예: SKB">
                </div>
                <div class="input-row">
                    <label>[인터넷] 스펙</label>
                    <input type="text" id="oldNetSpec" placeholder="속도/와이파이/TV채널/셋탑/갯수">
                </div>
                <div class="input-row">
                    <label>[인터넷] 약정/위약</label>
                    <input type="text" id="oldNetContract" placeholder="예: 3년만기 / 위약금 0원">
                </div>
                <div class="input-row">
                    <label>[휴대폰] 통신사</label>
                    <input type="text" id="oldPhoneCarrier" placeholder="예: KT">
                </div>
                <div class="input-row">
                    <label>[휴대폰] 요금/약정</label>
                    <input type="text" id="oldPhoneSpec" placeholder="요금제 / 약정기간 / 위약금">
                </div>
            </div>
        </div>
    </div>

    <!-- 3분할 본문 영역 (왼쪽: 상품선택, 중앙: 결과요약, 오른쪽: 접수양식메모장) -->
    <div class="main-grid">
        <!-- 왼쪽: 상품 선택 -->
        <div class="section-box">
            <h3>1 & 2) 상품 선택</h3>
            
            <div class="form-group">
                <label for="carrierSelect">1) 통신사 선택</label>
                <select id="carrierSelect" onchange="onCarrierChange()">
                    <option value="">통신사를 선택하세요</option>
                    <option value="SKB">SKB (브로드밴드)</option>
                    <option value="SKT">SKT (유선)</option>
                    <option value="KT">KT (소매)</option>
                    <option value="LG">LG (유플러스)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="internetSelect">2-1) 인터넷 상품 선택</label>
                <select id="internetSelect" onchange="onInternetChange()">
                    <option value="">통신사를 먼저 선택하세요</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tvSelect">2-2) TV 상품 선택 (요금표 연동)</label>
                <select id="tvSelect" onchange="calculateAll()">
                    <option value="">인터넷 상품을 먼저 선택하세요</option>
                </select>
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <label for="wifiSelect">2-3) 와이파이(공유기) 선택</label>
                <select id="wifiSelect" onchange="calculateAll()">
                    <option value="N">미사용 (N)</option>
                    <option value="Y">사용 (Y)</option>
                </select>
            </div>
        </div>

        <!-- 중앙: 결과 요약 -->
        <div class="section-box">
            <h3>3) 결과 요약</h3>
            
            <div class="result-row" style="margin-top: 10px;">
                <span>ㅇ 인터넷 수수료</span>
                <span id="internetFee">0 원</span>
            </div>
            <div class="result-row">
                <span>ㅇ TV 수수료</span>
                <span id="tvFee">0 원</span>
            </div>
            <div class="result-row total">
                <span>ㅇ 합계 수수료</span>
                <span id="totalFee">0 원</span>
            </div>
            <div class="result-row monthly" style="margin-top: 20px;">
                <span>월 청구 요금 (VAT 포함)</span>
                <span id="monthlyPrice">0 원</span>
            </div>
            <div class="result-row gift" style="margin-top: 15px;">
                <span>기본 사은품 (경품공시)</span>
                <span id="baseGift">0 원</span>
            </div>
        </div>

        <!-- 오른쪽: 접수 양식 메모 화면 -->
        <div class="section-box">
            <h3>4) 접수 양식 메모장</h3>
            <div class="memo-info">선택한 통신사 양식이 자동 적용됩니다. 수정 및 편집이 가능합니다.</div>
            <div class="form-group" style="flex-grow: 1; display: flex; flex-direction: column; margin-bottom: 0;">
                <textarea id="memoTextarea" style="flex-grow: 1; height: 360px;" placeholder="통신사를 선택하면 해당 양식이 여기에 표시됩니다."></textarea>
            </div>
        </div>
    </div>
</div>

                    { name: "1G_TV실속형", fee: 305000, priceN: 50600, priceY: 50600 },
                    { name: "1G_TV프리미엄", fee: 335000, priceN: 53900, priceY: 53900 }
                ]
            }
        }
    };

    function onCarrierChange() {
        const carrier = document.getElementById("carrierSelect").value;
        const internetSelect = document.getElementById("internetSelect");
        const tvSelect = document.getElementById("tvSelect");
        const memoTextarea = document.getElementById("memoTextarea");

        internetSelect.innerHTML = '<option value="">인터넷 상품을 선택하세요</option>';
        tvSelect.innerHTML = '<option value="">인터넷 상품을 먼저 선택하세요</option>';
        resetResult();

        if (!carrier || !policyData[carrier]) {
            memoTextarea.value = "";
            return;
        }

        memoTextarea.value = templateData[carrier] || "";

        policyData[carrier].internet.forEach((item) => {
            let opt = document.createElement("option");
            opt.value = item.speed; 
            opt.dataset.fee = item.fee;
            opt.dataset.baseGift = item.baseGift;
            opt.textContent = `${item.name} (수수료/사은품기준: ${item.fee.toLocaleString()}원)`;
            internetSelect.appendChild(opt);
        });
    }

    function onInternetChange() {
        const carrier = document.getElementById("carrierSelect").value;
        const internetSelect = document.getElementById("internetSelect");
        const selectedOption = internetSelect.options[internetSelect.selectedIndex];
        const tvSelect = document.getElementById("tvSelect");

        tvSelect.innerHTML = '<option value="">TV 상품을 선택하세요</option>';
        resetResult();

        if (!carrier || !selectedOption.value) return;

        const speed = selectedOption.value;
        const tvList = policyData[carrier].tv[speed];

        if (tvList) {
            tvList.forEach((item) => {
                let opt = document.createElement("option");
                opt.value = item.fee;
                opt.dataset.priceN = item.priceN;
                opt.dataset.priceY = item.priceY;
                opt.textContent = `${item.name} (수수료: ${item.fee.toLocaleString()}원 / 요금: ${item.priceN.toLocaleString()}원~)`;
                tvSelect.appendChild(opt);
            });
        }

        calculateAll();
    }

    function calculateAll() {
        const internetSelect = document.getElementById("internetSelect");
        const selectedInternetOpt = internetSelect.options[internetSelect.selectedIndex];
        const internetFee = selectedInternetOpt && selectedInternetOpt.dataset.fee ? parseInt(selectedInternetOpt.dataset.fee) : 0;
        const baseGift = selectedInternetOpt && selectedInternetOpt.dataset.baseGift ? parseInt(selectedInternetOpt.dataset.baseGift) : 0;
        
        const tvSelect = document.getElementById("tvSelect");
        const selectedTvOpt = tvSelect.options[tvSelect.selectedIndex];
        const tvFee = parseInt(tvSelect.value) || 0;

        const wifi = document.getElementById("wifiSelect").value;
        let monthlyPrice = 0;

        if (selectedTvOpt && selectedTvOpt.dataset.priceN) {
            monthlyPrice = (wifi === "Y") ? parseInt(selectedTvOpt.dataset.priceY) : parseInt(selectedTvOpt.dataset.priceN);
        }

        const totalFee = internetFee + tvFee;

        document.getElementById("internetFee").textContent = internetFee.toLocaleString() + " 원";
        document.getElementById("tvFee").textContent = tvFee.toLocaleString() + " 원";
        document.getElementById("totalFee").textContent = totalFee.toLocaleString() + " 원";
        document.getElementById("monthlyPrice").textContent = monthlyPrice.toLocaleString() + " 원";
        document.getElementById("baseGift").textContent = baseGift.toLocaleString() + " 원";
    }

    function resetResult() {
        document.getElementById("internetFee").textContent = "0 원";
        document.getElementById("tvFee").textContent = "0 원";
        document.getElementById("totalFee").textContent = "0 원";
        document.getElementById("monthlyPrice").textContent = "0 원";
        document.getElementById("baseGift").textContent = "0 원";
    }
</script>
