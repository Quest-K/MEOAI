<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>통신사 통합 상담, 수수료 계산 및 접수 시스템</title>
    <style>
        :root {
            --primary-color: #2b4c7e;
            --secondary-color: #52796f;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dcdcdc;
        }
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 10px auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 25px;
        }
        
        /* 상단 고객 상담 정보 입력 영역 스타일 */
        .consult-box {
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .consult-box h3 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 17px;
            border-bottom: 2px solid #cbd5e1;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .consult-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 900px) {
            .consult-grid {
                grid-template-columns: 1fr;
            }
        }
        .consult-sub-box {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 15px;
        }
        .consult-sub-box h4 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 14px;
            color: #334155;
            border-left: 3px solid var(--primary-color);
            padding-left: 8px;
        }
        .input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            align-items: center;
        }
        .input-row label {
            min-width: 85px;
            font-size: 12px;
            font-weight: bold;
            color: #475569;
            margin-bottom: 0;
        }
        .input-row input, .input-row select {
            flex: 1;
            padding: 7px 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 13px;
        }

        /* 3분할 레이아웃 스타일 */
        .main-grid {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr 1.3fr;
            gap: 20px;
        }
        @media (max-width: 1200px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .section-box {
            background-color: #fafbfc;
            border: 1px solid #e1e8ed;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .section-box h3 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 17px;
            border-bottom: 2px solid #e1e8ed;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #444;
            font-size: 13px;
        }
        select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            background-color: #fff;
            box-sizing: border-box;
            font-family: 'Malgun Gothic', sans-serif;
        }
        textarea {
            resize: vertical;
            line-height: 1.5;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .result-row.total {
            font-weight: bold;
            font-size: 17px;
            color: #d90429;
            border-top: 1px dashed var(--border-color);
            padding-top: 12px;
            margin-top: 12px;
        }
        .result-row.monthly {
            font-weight: bold;
            font-size: 15px;
            color: #2b4c7e;
            background-color: #eef3f9;
            padding: 8px;
            border-radius: 4px;
        }
        .result-row.gift {
            font-weight: bold;
            color: #2f3e46;
            background-color: #e8f4f8;
            padding: 8px;
            border-radius: 4px;
        }
        .memo-info {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>통신사 통합 상담, 수수료 및 사은품 계산 시스템</h2>
    
    <!-- 상단: 고객 상담 정보 입력 영역 -->
    <div class="consult-box">
        <h3>고객 상담 정보 파악</h3>
        <div class="consult-grid">
            <!-- 희망 상품 -->
            <div class="consult-sub-box">
                <h4>희망 상품 (자동 연동)</h4>
                <div class="input-row">
                    <label>통신사</label>
                    <input type="text" id="wishCarrier" placeholder="선택 시 자동 입력">
                </div>
                <div class="input-row">
                    <label>인터넷 속도</label>
                    <input type="text" id="wishSpeed" placeholder="선택 시 자동 입력">
                </div>
                <div class="input-row">
                    <label>와이파이</label>
                    <input type="text" id="wishWifi" placeholder="선택 시 자동 입력">
                </div>
                <div class="input-row">
                    <label>TV채널 / 셋탑</label>
                    <input type="text" id="wishTv" placeholder="선택 시 자동 입력">
                </div>
                <div class="input-row">
                    <label>TV 갯수</label>
                    <input type="text" id="wishTvCount" placeholder="기본 1대 (수정 가능)">
                </div>
                <div class="input-row">
                    <label>월요금 / 사은품</label>
                    <input type="text" id="wishPriceGift" placeholder="계산 시 자동 입력">
                </div>
            </div>

            <!-- 기존 상품 -->
            <div class="consult-sub-box">
                <h4>기존 상품</h4>
                <div class="input-row">
                    <label>[인터넷] 통신사</label>
                    <input type="text" id="oldNetCarrier" placeholder="예: SKB">
                </div>
                <div class="input-row">
                    <label>[인터넷] 스펙</label>
                    <input type="text" id="oldNetSpec" placeholder="속도/와이파이/TV채널/셋탑/갯수">
                </div>
                <div class="input-row">
                    <label>[인터넷] 약정/위약</label>
                    <input type="text" id="oldNetContract" placeholder="예: 3년만기 / 위약금 0원">
                </div>
                <div class="input-row">
                    <label>[휴대폰] 통신사</label>
                    <input type="text" id="oldPhoneCarrier" placeholder="예: KT">
                </div>
                <div class="input-row">
                    <label>[휴대폰] 요금/약정</label>
                    <input type="text" id="oldPhoneSpec" placeholder="요금제 / 약정기간 / 위약금">
                </div>
            </div>
        </div>
    </div>

    <!-- 3분할 본문 영역 -->
    <div class="main-grid">
        <!-- 왼쪽: 상품 선택 -->
        <div class="section-box">
            <h3>1 & 2) 상품 선택</h3>
            
            <div class="form-group">
                <label for="carrierSelect">1. 통신사 선택</label>
                <select id="carrierSelect" onchange="onCarrierChange()">
                    <option value="">통신사를 선택하세요</option>
                    <option value="SKB">SKB (브로드밴드)</option>
                    <option value="SKT">SKT (유선)</option>
                    <option value="KT">KT (소매)</option>
                    <option value="LG">LG (유플러스)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="internetSelect">2. 인터넷 선택 (100/500/1기가)</label>
                <select id="internetSelect" onchange="onInternetChange()">
                    <option value="">통신사를 먼저 선택하세요</option>
                </select>
            </div>

            <div class="form-group">
                <label for="wifiSelect">와이파이 추가 여부</label>
                <select id="wifiSelect" onchange="calculateAll()">
                    <option value="N">미사용 (N)</option>
                    <option value="Y">사용 (Y)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tvSelect">3. TV 선택 (요금제)</label>
                <select id="tvSelect" onchange="calculateAll()">
                    <option value="">인터넷 상품을 먼저 선택하세요</option>
                </select>
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <label for="settopSelect">셋탑박스 선택</label>
                <select id="settopSelect" onchange="calculateAll()">
                    <option value="">통신사별 기본 셋탑박스</option>
                </select>
            </div>
        </div>

        <!-- 중앙: 결과 요약 -->
        <div class="section-box">
            <h3>3) 결과 요약</h3>
            
            <div class="result-row" style="margin-top: 10px;">
                <span>ㅇ 인터넷 수수료</span>
                <span id="internetFee">0 원</span>
            </div>
            <div class="result-row">
                <span>ㅇ TV 수수료</span>
                <span id="tvFee">0 원</span>
            </div>
            <div class="result-row total">
                <span>ㅇ 합계 수수료</span>
                <span id="totalFee">0 원</span>
            </div>
            <div class="result-row monthly" style="margin-top: 20px;">
                <span>월 청구 요금 (VAT 포함)</span>
                <span id="monthlyPrice">0 원</span>
            </div>
            <div class="result-row gift" style="margin-top: 15px;">
                <span>기본 사은품 (경품공시)</span>
                <span id="baseGift">0 원</span>
            </div>
        </div>

        <!-- 오른쪽: 고객 안내 문자 -->
        <div class="section-box">
            <h3>4) 고객 안내 문자</h3>
            <div class="memo-info">상품 선택 시 내용이 자동으로 반영됩니다. 수정 및 편집 가능합니다.</div>
            <div class="form-group" style="flex-grow: 1; display: flex; flex-direction: column; margin-bottom: 0;">
                <textarea id="memoTextarea" style="flex-grow: 1; height: 380px;" placeholder="통신사 및 상품을 선택하면 안내 문자가 자동으로 생성됩니다."></textarea>
            </div>
        </div>
    </div>
</div>

                ],
                "500M": [

                    { name: "500M_TV(스탠다드)", fee: 410000, priceN: 45100, priceY: 46200 },

                ],

                ]

        },

                { speed: "100M", name: "인터넷슬림(100M)", fee: 300000, baseGift: 300000 },

    function updateCustomerSms(carrierStr = "", internetNameStr = "", wifiStr = "미사용", tvNameStr = "", settopStr = "", monthlyStr = "0", giftStr = "00,000") {
        const memoTextarea = document.getElementById("memoTextarea");
        memoTextarea.value = `안녕하세요. 인생비서입니다.
인터넷 상품 안내 문자 전달 드립니다. 

1. 요금 및 사은품 안내
통신사: ${carrierStr}
상품명: 
  [인터넷] ${internetNameStr}
  [와이파이여부] ${wifiStr}
  [TV상품명] ${tvNameStr}
  [셋탑박스] ${settopStr}

총 월 요금: ${monthlyStr}원 (부가가치세 포함)
총 사은품 혜택: ${giftStr}원

2. 사은품 지급 안내
- 현금: 설치 완료 후 연락 주시면 당일 또는 다음 영업일 내로 즉시 지급됩니다.
- 상품권: 설치 후 통신사에서 직접 발송하며 2~3일 정도 소요될 수 있습니다.

3. 약정 및 유지 기간 안내
- 약정 기간: 모든 통신사 공통 3년(36개월)이며, 기간 내 해지 시 위약금이 발생합니다.
- 사은품 유지 조건: 가입 상품은 1년 내 정지, 명의 변경, 해지 등이 발생할 경우 사은품이 환수됩니다.
- 본인 및 가족 명의의 기존 인터넷 상품을 이용 중이셨던 경우에도 신규 설치일 기준 1년은 필수로 유지하셔야 사은품이 보존됩니다.

궁금하신 점이 있으시면 언제든지 편하게 연락 주세요. 감사합니다!`;
    }

    function onCarrierChange() {
        const carrierSelect = document.getElementById("carrierSelect");
        const carrier = carrierSelect.value;
        const internetSelect = document.getElementById("internetSelect");
        const tvSelect = document.getElementById("tvSelect");
        const settopSelect = document.getElementById("settopSelect");

        document.getElementById("wishCarrier").value = carrierSelect.options[carrierSelect.selectedIndex].text;

        internetSelect.innerHTML = '<option value="">인터넷 상품을 선택하세요</option>';
        tvSelect.innerHTML = '<option value="">인터넷 상품을 먼저 선택하세요</option>';
        settopSelect.innerHTML = '<option value="">통신사별 기본 셋탑박스</option>';
        resetResult();

        if (!carrier || !policyData[carrier]) {
            document.getElementById("wishCarrier").value = "";
            updateCustomerSms();
            return;
        }

        policyData[carrier].internet.forEach((item) => {
            let opt = document.createElement("option");
            opt.value = item.speed; 
            opt.dataset.fee = item.fee;
            opt.dataset.baseGift = item.baseGift;
            opt.dataset.name = item.name;
            opt.textContent = `${item.name} (사은품기준: ${item.fee.toLocaleString()}원)`;
            internetSelect.appendChild(opt);
        });

        policyData[carrier].settops.forEach((st) => {
            let opt = document.createElement("option");
            opt.value = st.name;
            opt.textContent = st.name;
            settopSelect.appendChild(opt);
        });

        updateCustomerSms(carrierSelect.options[carrierSelect.selectedIndex].text);
    }

    function onInternetChange() {
        const carrier = document.getElementById("carrierSelect").value;
        const internetSelect = document.getElementById("internetSelect");
        const selectedOption = internetSelect.options[internetSelect.selectedIndex];
        const tvSelect = document.getElementById("tvSelect");

        document.getElementById("wishSpeed").value = selectedOption.value ? selectedOption.text : "";

        tvSelect.innerHTML = '<option value="">TV 상품을 선택하세요</option>';
        resetResult();

        if (!carrier || !selectedOption.value) return;

        const speed = selectedOption.value;
        const tvList = policyData[carrier].tv[speed];

        if (tvList) {
            tvList.forEach((item) => {
                let opt = document.createElement("option");
                opt.value = item.fee;
                opt.dataset.priceN = item.priceN;
                opt.dataset.priceY = item.priceY;
                opt.dataset.name = item.name;
                opt.textContent = `${item.name} (수수료: ${item.fee.toLocaleString()}원 / 요금: ${item.priceN.toLocaleString()}원~)`;
                tvSelect.appendChild(opt);
            });
        }

        calculateAll();
    }

    function calculateAll() {
        const carrierSelect = document.getElementById("carrierSelect");
        const carrierText = carrierSelect.selectedIndex > 0 ? carrierSelect.options[carrierSelect.selectedIndex].text : "";

        const internetSelect = document.getElementById("internetSelect");
        const selectedInternetOpt = internetSelect.options[internetSelect.selectedIndex];
        const internetFee = selectedInternetOpt && selectedInternetOpt.dataset.fee ? parseInt(selectedInternetOpt.dataset.fee) : 0;
        const baseGift = selectedInternetOpt && selectedInternetOpt.dataset.baseGift ? parseInt(selectedInternetOpt.dataset.baseGift) : 0;
        const internetName = selectedInternetOpt && selectedInternetOpt.dataset.name ? selectedInternetOpt.dataset.name : "";
        
        const tvSelect = document.getElementById("tvSelect");
        const selectedTvOpt = tvSelect.options[tvSelect.selectedIndex];
        const tvFee = parseInt(tvSelect.value) || 0;
        const tvName = selectedTvOpt && selectedTvOpt.dataset.name ? selectedTvOpt.dataset.name : "";

        const wifiSelect = document.getElementById("wifiSelect");
        const wifi = wifiSelect.value;
        const wifiText = (wifi === "Y") ? "사용 (Y)" : "미사용 (N)";
        
        document.getElementById("wishWifi").value = wifiSelect.options[wifiSelect.selectedIndex].text;
        document.getElementById("wishTv").value = selectedTvOpt && selectedTvOpt.value ? selectedTvOpt.text : "";

        const settopSelect = document.getElementById("settopSelect");
        const settopText = settopSelect.selectedIndex >= 0 ? settopSelect.value : "";

        let monthlyPrice = 0;

        if (selectedTvOpt && selectedTvOpt.dataset.priceN) {
            monthlyPrice = (wifi === "Y") ? parseInt(selectedTvOpt.dataset.priceY) : parseInt(selectedTvOpt.dataset.priceN);
        }

        const totalFee = internetFee + tvFee;

        document.getElementById("internetFee").textContent = internetFee.toLocaleString() + " 원";
        document.getElementById("tvFee").textContent = tvFee.toLocaleString() + " 원";
        document.getElementById("totalFee").textContent = totalFee.toLocaleString() + " 원";
        document.getElementById("monthlyPrice").textContent = monthlyPrice.toLocaleString() + " 원";
        document.getElementById("baseGift").textContent = baseGift.toLocaleString() + " 원";

        if (monthlyPrice > 0 || baseGift > 0) {
            document.getElementById("wishPriceGift").value = `${monthlyPrice.toLocaleString()}원 / ${baseGift.toLocaleString()}원`;
            
            updateCustomerSms(
                carrierText,
                internetName,
                wifiText,
                tvName,
                settopText,
                monthlyPrice.toLocaleString(),
                baseGift.toLocaleString()
            );
        } else {
            document.getElementById("wishPriceGift").value = "";
            updateCustomerSms(carrierText, internetName, wifiText, tvName, settopText);
        }
    }

    function resetResult() {
        document.getElementById("internetFee").textContent = "0 원";
        document.getElementById("tvFee").textContent = "0 원";
        document.getElementById("totalFee").textContent = "0 원";
        document.getElementById("monthlyPrice").textContent = "0 원";
        document.getElementById("baseGift").textContent = "0 원";
        document.getElementById("wishSpeed").value = "";
        document.getElementById("wishTv").value = "";
        document.getElementById("wishPriceGift").value = "";
        
        const carrierSelect = document.getElementById("carrierSelect");
        const carrierText = carrierSelect.selectedIndex > 0 ? carrierSelect.options[carrierSelect.selectedIndex].text : "";
        updateCustomerSms(carrierText);
    }

    window.onload = function() {
        updateCustomerSms();
    };
</script>

</body>
</html>
