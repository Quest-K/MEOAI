<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>통신사 사은품 환수 & 설치비 계산기</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        body { background-color: #f4f6f9; color: #333; line-height: 1.6; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: #1a365d; margin-bottom: 25px; font-size: 24px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; }
        .section { margin-bottom: 30px; background: #f8fafc; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0; }
        h2 { font-size: 18px; color: #2b6cb0; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px; color: #4a5568; }
        select, input[type="date"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 14px; background: #fff; }
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 5px; }
        .checkbox-label { display: flex; align-items: center; gap: 6px; font-weight: normal; cursor: pointer; font-size: 14px; }
        .qty-control { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
        .qty-control input { width: 80px; text-align: center; }
        button { display: block; width: 100%; background: #3182ce; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        button:hover { background: #2b6cb0; }
        .result-box { margin-top: 20px; background: #fff; padding: 15px; border-radius: 6px; border-left: 4px solid #3182ce; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .result-title { font-weight: bold; color: #2d3748; margin-bottom: 8px; font-size: 15px; }
        .result-content { font-size: 14px; color: #4a5568; white-space: pre-line; }
        .highlight { color: #e53e3e; font-weight: bold; }
        .safe { color: #38a169; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>통신사 사은품 환수 & 설치비 계산기</h1>

    <!-- 1. 사은품 환수 계산기 -->
    <div class="section">
        <h2>📌 사은품 환수 기간 계산기 (의무사용 1년 기준)</h2>
        <div class="form-group">
            <label for="telecom">통신사 선택</label>
            <select id="telecom">
                <option value="kt">KT / SKT / SKB / 스카이라이프 (의무 1년 / 365일)</option>
                <option value="lg">LG유플러스 (의무 만 3개월 / 94일)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="installDate">설치일 (개통일)</label>
            <input type="date" id="installDate">
        </div>
        <div class="form-group">
            <label for="cancelDate">해지 예정일</label>
            <input type="date" id="cancelDate">
        </div>
        <button onclick="calculateRefund()">환수 여부 확인하기</button>
        <div id="refundResult" class="result-box" style="display: none;">
            <div class="result-title">환수 계산 결과</div>
            <div id="refundContent" class="result-content"></div>
        </div>
    </div>

    <!-- 2. 설치비 계산기 -->
    <div class="section">
        <h2>📌 설치비 (출동비) 계산기</h2>
        <div class="form-group">
            <label>가입 상품 선택 (복수 선택 및 수량 지정 가능)</label>
            <div class="checkbox-group">
                <label class="checkbox-label"><input type="checkbox" id="chkInternet" onchange="toggleQty('Internet')"> 인터넷</label>
                <label class="checkbox-label"><input type="checkbox" id="chkTv" onchange="toggleQty('Tv')"> TV (복수 가능)</label>
                <label class="checkbox-label"><input type="checkbox" id="chkPhone" onchange="toggleQty('Phone')"> 전화 (복수 가능)</label>
            </div>
        </div>

        <div class="form-group" id="qtyTvGroup" style="display: none;">
            <label for="qtyTv">TV 대수</label>
            <input type="number" id="qtyTv" value="1" min="1" max="5">
        </div>

        <div class="form-group" id="qtyPhoneGroup" style="display: none;">
            <label for="qtyPhone">전화 회선 수</label>
            <input type="number" id="qtyPhone" value="1" min="1" max="5">
        </div>

        <div class="form-group">
            <label for="installTime">방문 시간 및 조건</label>
            <select id="installTime">
                <option value="weekday">평일 주간</option>
                <option value="nightWeekend">평일 야간 / 주말 / 공휴일 (25% 할증)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="installType">동시/단독 설치 여부</label>
            <select id="installType">
                <option value="simultaneous">인터넷 + TV 등 동시 설치 (기본 적용)</option>
                <option value="single">단독 설치 (인터넷 단독 또는 기타 단독)</option>
            </select>
        </div>

        <button onclick="calculateInstallCost()">설치비 계산하기</button>
        <div id="installResult" class="result-box" style="display: none;">
            <div class="result-title">설치비 예상 결과</div>
            <div id="installContent" class="result-content"></div>
        </div>
    </div>
</div>

<script>
    // 날짜 입력 기본값 세팅 (오늘 날짜)
    document.getElementById('installDate').valueAsDate = new Date();
    document.getElementById('cancelDate').valueAsDate = new Date();

    function toggleQty(type) {
        if (type === 'Tv') {
            const chk = document.getElementById('chkTv').checked;
            document.getElementById('qtyTvGroup').style.display = chk ? 'block' : 'none';
        }
        if (type === 'Phone') {
            const chk = document.getElementById('chkPhone').checked;
            document.getElementById('qtyPhoneGroup').style.display = chk ? 'block' : 'none';
        }
    }

    function calculateRefund() {
        const telecom = document.getElementById('telecom').value;
        const installStr = document.getElementById('installDate').value;
        const cancelStr = document.getElementById('cancelDate').value;

        if (!installStr || !cancelStr) {
            alert('설치일과 해지예정일을 모두 입력해주세요.');
            return;
        }

        const installDate = new Date(installStr);
        const cancelDate = new Date(cancelStr);

        const diffTime = cancelDate - installDate;
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

        if (diffDays < 0) {
            alert('해지예정일이 설치일보다 빠를 수 없습니다.');
            return;
        }

        let requiredDays = 365; // 기본 1년 (365일)
        let policyName = "1년 (365일)";
        if (telecom === 'lg') {
            requiredDays = 94; // LG 만 3개월 (94일)
            policyName = "만 3개월 (94일)";
        }

        const resultBox = document.getElementById('refundResult');
        const contentBox = document.getElementById('refundContent');
        resultBox.style.display = 'block';

        let html = `선택하신 통신사 규정 의무사용기간: <span style="font-weight:bold; color:#2b6cb0;">${policyName}</span><br>`;
        html += `실제 사용 기간: <span style="font-weight:bold;">${diffDays}일</span> 경과<br><br>`;

        if (diffDays < requiredDays) {
            const remainDays = requiredDays - diffDays;
            html += `<span class="highlight">⚠️ [사은품 환수 대상입니다!]</span><br>`;
            html += `의무사용 기간까지 <span class="highlight">${remainDays}일</span>이 부족합니다. 해지 시 지급받으신 현금 및 상품권이 전액 환수됩니다.`;
        } else {
            html += `<span class="safe">✔ [사은품 환수 면제 구간입니다.]</span><br>`;
            html += `의무사용 기간(${policyName})을 충족하여 사은품 환수 대상이 아닙니다. (단, 약정 잔여기간에 따른 할인반환금은 발생할 수 있습니다.)`;
        }

        contentBox.innerHTML = html;
    }

    function calculateInstallCost() {
        const internet = document.getElementById('chkInternet').checked;
        const tv = document.getElementById('chkTv').checked;
        const phone = document.getElementById('chkPhone').checked;
        const isNightWeekend = document.getElementById('installTime').value === 'nightWeekend';
        const isSingle = document.getElementById('installType').value === 'single';

        if (!internet && !tv && !phone) {
            alert('최소 1개 이상의 상품을 선택해주세요.');
            return;
        }

        let tvQty = tv ? parseInt(document.getElementById('qtyTv').value) || 1 : 0;
        let phoneQty = phone ? parseInt(document.getElementById('qtyPhone').value) || 1 : 0;

        // 표준 출동비 기준 (LG/KT 등 일반적인 유통망 기준 적용)
        // 인터넷 단독 신규: 약 36,300원 (주간) / 45,375원 (야간주말)
        // IPTV 단독 신규: 약 34,100원 (주간) / 42,625원 (야간주말)
        // 동시 설치 시 대표 상품 기준으로 산정되며 추가 대수당 비용 합산
        
        let baseCost = 0;
        let descText = "";

        if (internet && !tv && !phone) {
            // 인터넷 단독
            baseCost = isNightWeekend ? 45375 : 36300;
            descText = "인터넷 단독 설치";
        } else if (!internet && tv && !phone) {
            // TV 단독 (대수별)
            let perTv = isNightWeekend ? 42625 : 34100;
            baseCost = perTv * tvQty;
            descText = `TV 단독 설치 (${tvQty}대)`;
        } else {
            // 동시 설치 (인터넷 + TV 및/또는 전화)
            baseCost = isNightWeekend ? 45375 : 36300; // 기본 인터넷/동시 기준
            descText = `인터넷 포함 동시 설치`;
            if (tvQty > 1) {
                // 추가 TV 대수당 비용 추가 (보통 추가 TV당 소정의 비용 추가)
                baseCost += (tvQty - 1) * (isNightWeekend ? 27500 : 22000);
                descText += ` (TV 총 ${tvQty}대)`;
            }
            if (phoneQty > 0) {
                descText += ` (전화 ${phoneQty}회선 포함)`;
            }
        }

        // 할증 요금 반영 안내
        const resultBox = document.getElementById('installResult');
        const contentBox = document.getElementById('installContent');
        resultBox.style.display = 'block';

        let html = `선택 상품: <span style="font-weight:bold;">${descText}</span><br>`;
        html += `방문 시간: <span style="font-weight:bold;">${isNightWeekend ? '평일 야간 / 주말·공휴일 (25% 할증 적용)' : '평일 주간'}</span><br><br>`;
        html += `예상 총 설치비 (출동비): <span style="font-size:18px; color:#e53e3e; font-weight:bold;">${baseCost.toLocaleString()} 원</span> (부가세 포함)<br>`;
        html += `<span style="font-size:12px; color:#718096;">※ 첫 달 요금 고지서에 설치비가 합산되어 청구됩니다. 통신사 및 현장 상황에 따라 실청구액은 미세하게 차이가 날 수 있습니다.</span>`;

        contentBox.innerHTML = html;
    }
</script>

</body>
</html>
