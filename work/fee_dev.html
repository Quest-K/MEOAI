<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{

    --ink-dim:#6B6E76;
    --bg:#F4F2EB;

  #status-banner{

  .card-head .brand{

  .card-head .brand .comm-date{

  .comm-row.large{ font-size:12.5px; }

    flex-direction:column;

  .phone-remove-btn:hover{ background:#FDEDEC; }

    color:var(--gold);

    font-weight:600;

  .add-phone-btn:hover{ background:#FFF6E8; }

    background:#F6F5EF;

    padding-left:16px;

  }

  .controls-grid.three{
    grid-template-columns:1fr 1fr 1.1fr;
  }
  @media (max-width: 1180px){
    .controls-grid.three{ grid-template-columns:1fr; }

  .fam-table{
    width:100%;
    border-collapse:collapse;
    font-size:12px;
  }
  .fam-table th, .fam-table td{
    padding:7px 6px;
    text-align:right;
    border-bottom:1px solid var(--paper-line);

    font-family:'Inconsolata', monospace;

  }
  .fam-table td.brand-cell{ font-weight:700; color:#1C1E24; }

  .fam-table-note{
    font-size:11.5px;
    color:var(--ink-dim);
    margin-top:8px;
    line-height:1.5;
  }
</style>

<body>

<script>
const SUPABASE_URL = 'https://jhfhpumhifyhauuoinxc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpoZmhwdW1oaWZ5aGF1dW9pbnhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MDE2NTMsImV4cCI6MjEwMzk3NzY1M30.euXk3eXtUVvEQRDGgcLhvX3JhVlpv9D7fZUEDr0i8yA';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CARRIERS = ['kt', 'lg', 'skb', 'skt'];
const BRAND_LABEL = { kt:'KT', lg:'LG', skb:'SKB', skt:'SKT' };

const TV_TIER_MAP = {
  kt: { low:'베이직', basic:'에센스', premium:'모든G' },
  lg: { low:'실속형', basic:'기본형', premium:'프리미엄' },
  skb: { low:'Btv 이코노미', basic:'Btv 스탠다드', premium:'Btv All' },
  skt: { low:'Btv 이코노미', basic:'Btv 스탠다드', premium:'Btv All' }
};

const SPEED_LABEL = { 100:'100M', 500:'500M', 1000:'1기가' };
const ROUTER_LABEL = { N:'미포함', Y:'포함' };

let DATA = null;
let COMMISSION_DATA = {};
let PROMOTION_DATA = {};
let customGiftValues = {};
let state = { speed:'500', tv:'basic', settopTier:'basic', router:'Y' };
let familyPhones = [];
let logs = [];

function formatStartAt(date){
  if (!date) return null;
  const mm = String(date.getMonth() + 1).padStart(2, '0');
  const dd = String(date.getDate()).padStart(2, '0');
  const hh = String(date.getHours()).padStart(2, '0');
  return `${mm}.${dd}.${hh}시`;
}

function displayLastModified() {
  const modDate = new Date(document.lastModified);
  if (!isNaN(modDate.getTime())) {
    document.getElementById('last-updated').textContent = `최종 수정: ${modDate.toISOString().slice(0, 16).replace('T', ' ')}`;
  }
}

function addLog(tableName, isSuccess, message) {
  const statusClass = isSuccess ? 'success' : 'error';
  logs.push(`<div class="log-item ${statusClass}">${isSuccess ? '✅' : '❌'} [${tableName}] : ${message}</div>`);
  document.getElementById('banner-logs').innerHTML = logs.join('');
}

async function loadData(){
  logs = [];
  const [internetRes, tvRes, settopRes] = await Promise.all([
    sb.from('internet_plans').select('*').in('carrier', CARRIERS),
    sb.from('tv_plans').select('*').in('carrier', CARRIERS),
    sb.from('settop_boxes').select('*').in('carrier', CARRIERS)
  ]);

  addLog('internet_plans', !internetRes.error, internetRes.error ? internetRes.error.message : `${internetRes.data.length}건`);
  addLog('tv_plans', !tvRes.error, tvRes.error ? tvRes.error.message : `${tvRes.data.length}건`);
  addLog('settop_boxes', !settopRes.error, settopRes.error ? settopRes.error.message : `${settopRes.data.length}건`);

  if (internetRes.error || tvRes.error || settopRes.error) return false;

  DATA = {};
  CARRIERS.forEach(c => { DATA[c] = { internet:{}, tv:{}, settopList:[] }; });

  internetRes.data.forEach(row => {
    if (DATA[row.carrier]) DATA[row.carrier].internet[row.speed] = { fee: row.monthly_fee, routerFee: row.router_fee };
  });

  CARRIERS.forEach(carrier => {
    Object.entries(TV_TIER_MAP[carrier] || {}).forEach(([tierKey, planName]) => {
      const match = tvRes.data.find(r => r.carrier === carrier && r.plan_name === planName);
      if (match) {
        DATA[carrier].tv[tierKey] = { 
          name: match.plan_name, 
          fee: match.monthly_fee,
          channels: match.channel_count || null 
        };
      }
    });
  });

  settopRes.data.forEach(row => {
    if (DATA[row.carrier]) DATA[row.carrier].settopList.push({ name: row.model_name, fee: row.monthly_fee });
  });

  return true;
}

function normalizeSpeedValue(v){
  if (v === null || v === undefined) return null;
  const s = String(v).trim();
  const num = parseFloat(s.replace(/,/g, ''));
  if (isNaN(num)) return null;
  // "1G", "1기가" 처럼 G/기가 단위이면서 M이 없는 경우만 ×1000 처리 (1G -> 1000)
  if (/(g|기가)/i.test(s) && !/m/i.test(s)) return num * 1000;
  return num; // "500M", "500", 500(number) 등은 그대로
}

async function loadFinanceData() {
  const targetSpeed = Number(state.speed);
  const tvTierForComm = state.tv;
  const tvTierForPromo = state.tv === 'none' ? 'none' : 'all';

  const [commRes, promoRes] = await Promise.all([
    sb.from('carrier_commissions').select('*'),
    sb.from('carrier_promotions').select('*').eq('tv_tier', tvTierForPromo)
  ]);

  addLog('carrier_commissions', !commRes.error, commRes.error ? commRes.error.message : `${commRes.data?.length || 0}건 조회`);
  addLog('carrier_promotions', !promoRes.error, promoRes.error ? promoRes.error.message : `${promoRes.data?.length || 0}건 조회`);

  COMMISSION_DATA = {};
  PROMOTION_DATA = {};

  CARRIERS.forEach(carrier => {
    const commRows = commRes.data
      ? commRes.data.filter(r => String(r.carrier).toLowerCase() === carrier && normalizeSpeedValue(r.speed) === targetSpeed)
      : [];
    const internetComm = commRows.find(r => String(r.tv_tier) === 'none')?.commission_amount || 0;
    const tvComm = tvTierForComm !== 'none' ? (commRows.find(r => String(r.tv_tier) === tvTierForComm)?.commission_amount || 0) : 0;

    const startAtTimes = commRows.map(r => r.start_at).filter(Boolean).map(v => new Date(v)).filter(d => !isNaN(d.getTime()));
    const startAt = startAtTimes.length ? new Date(Math.max(...startAtTimes.map(d => d.getTime()))) : null;

    COMMISSION_DATA[carrier] = { internetComm, tvComm, totalComm: internetComm + tvComm, startAt };

    const promoRow = promoRes.data
      ? promoRes.data.find(r => String(r.carrier).toLowerCase() === carrier && normalizeSpeedValue(r.speed) === targetSpeed)
      : null;
    if (promoRow) {
      PROMOTION_DATA[carrier] = {
        giftCard: promoRow.gift_card,
        cash: promoRow.cash_amount,
        maxLimit: promoRow.max_promo_limit || (promoRow.gift_card + promoRow.cash_amount)
      };
    } else {
      PROMOTION_DATA[carrier] = null;
    }
  });
}

function setupSeg(id, key){
  document.getElementById(id).querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      state[key] = btn.dataset.value;
      if (key === 'tv') {
        document.querySelectorAll('#seg-settop button').forEach(b => b.disabled = state.tv === 'none');
      }
      if (key === 'speed' || key === 'tv') {
        logs = logs.slice(0, 3);
        await loadFinanceData();
      }
      render();
    });
  });
}

function getSettopByTier(carrier, tier) {
  const list = DATA[carrier]?.settopList || [];
  if (!list.length) return null;
  if (tier === 'basic') return list.find(s => s.fee <= 4400) || list[0];
  if (tier === 'advanced') return list.find(s => s.fee > 4400 && s.fee <= 7700) || list[1] || list[0];
  return list.find(s => s.fee >= 8800) || list[list.length - 1];
}

function computePrice(carrier){
  const speedData = DATA[carrier]?.internet[state.speed];
  if (!speedData) return { available:false };

  let internetFee = speedData.fee;
  let total = internetFee;
  
  let actualRouterFee = speedData.routerFee;
  if (state.router === 'Y') {
    if (carrier === 'lg') {
      actualRouterFee = 0;
    } else if (carrier === 'kt' && Number(state.speed) >= 1000) {
      actualRouterFee = 0;
    }
    total += actualRouterFee;
  } else {
    actualRouterFee = 0;
  }

  let tvInfo = null, settopInfo = null, bundleDiscount = 0;
  let tvFee = 0, settopFee = 0;

  if (state.tv !== 'none') {
    tvInfo = DATA[carrier].tv[state.tv];
    if (!tvInfo) return { available:false, noTier:true };
    tvFee = tvInfo.fee;
    total += tvFee;
    
    settopInfo = getSettopByTier(carrier, state.settopTier);
    if (settopInfo) {
      settopFee = settopInfo.fee;
      total += settopFee;
    }

    const speedNum = Number(state.speed);
    if (carrier === 'kt' || carrier === 'lg') {
      if (speedNum === 100) bundleDiscount = 0;
      else if (speedNum === 500 || speedNum === 1000) bundleDiscount = 5500;
    } else if (carrier === 'skb' || carrier === 'skt') {
      if (speedNum === 100) bundleDiscount = 1100;
      else if (speedNum === 500) bundleDiscount = 4400;
      else if (speedNum === 1000) bundleDiscount = 5500;
    }

    total -= bundleDiscount;
  }

  return { available:true, total, internetFee, routerFee: actualRouterFee, tvFee, settopFee, bundleDiscount, tvInfo, settopInfo };
}

function renderFamilyPhones(){
  const container = document.getElementById('family-phone-list');
  if (!container) return;
  if (!familyPhones.length) {
    container.innerHTML = `<div class="phone-empty">등록된 휴대폰이 없습니다. 회선을 추가해주세요.</div>`;
    return;
  }
  container.innerHTML = familyPhones.map((p, idx) => `
    <div class="phone-row">
      <select class="phone-select" onchange="updatePhoneLine(${idx}, 'carrier', this.value)">
        <option value="SKT" ${p.carrier==='SKT'?'selected':''}>SKT</option>
        <option value="KT" ${p.carrier==='KT'?'selected':''}>KT</option>
        <option value="LGU+" ${p.carrier==='LGU+'?'selected':''}>LG U+</option>
      </select>
      <input type="text" class="phone-fee-input" value="${(p.fee||0).toLocaleString()}"
             onchange="updatePhoneLine(${idx}, 'fee', this.value)" onfocus="this.select()">
      <span class="phone-unit">원</span>
      <button type="button" class="phone-remove-btn" onclick="removePhoneLine(${idx})">삭제</button>
    </div>
  `).join('');
}

function addPhoneLine(){
  familyPhones.push({ carrier:'SKT', fee:69000 });
  renderFamilyPhones();
  render();
}

function removePhoneLine(idx){
  familyPhones.splice(idx, 1);
  renderFamilyPhones();
  render();
}

function updatePhoneLine(idx, field, value){
  if (field === 'fee') {
    const num = parseInt(String(value).replace(/[^0-9]/g, ''), 10);
    familyPhones[idx].fee = isNaN(num) ? 0 : num;
  } else {
    familyPhones[idx].carrier = value;
  }
  renderFamilyPhones();
  render();
}

function getMatchingMobileCarrier(ispCarrier){
  if (ispCarrier === 'kt') return 'KT';
  if (ispCarrier === 'lg') return 'LGU+';
  if (ispCarrier === 'skb' || ispCarrier === 'skt') return 'SKT';
  return null;
}

function computeFamilyDiscount(ispCarrier){
  const matchCarrier = getMatchingMobileCarrier(ispCarrier);
  const lines = familyPhones.filter(p => p.carrier === matchCarrier);
  const count = lines.length;
  const speedNum = Number(state.speed);

  if (count === 0) {
    return { matchCarrier, count:0, internetDiscount:0, mobileDiscount:0, total:0 };
  }

  if (matchCarrier === 'KT') {
    const sum = lines.reduce((acc, p) => acc + (Number(p.fee) || 0), 0);
    const isSlim = speedNum === 100; // 인터넷 슬림(100M) vs 베이직/에센스/프리미엄급(500M·1G)

    const upperBounds = [22000, 64900, 108900, 141900, 174900, Infinity];
    const internetVals = isSlim
      ? [1650, 3300, 5500, 5500, 5500, 5500]
      : [2200, 5500, 5500, 5500, 5500, 5500];
    const mobileVals = isSlim
      ? [0, 0, 3300, 14300, 18700, 23100]
      : [0, 0, 5500, 16610, 22110, 27610];

    let idx = upperBounds.findIndex(bound => sum < bound);
    if (idx === -1) idx = upperBounds.length - 1;

    const internetDiscount = internetVals[idx];
    const mobileDiscount = mobileVals[idx];
    return { matchCarrier, count, sum, internetDiscount, mobileDiscount, total: internetDiscount + mobileDiscount };
  }

  if (matchCarrier === 'LGU+') {
    const internetMap = { 100:5500, 500:9900, 1000:13200 };
    const internetDiscount = internetMap[speedNum] || 0;
    let countBucket;
    if (count === 1) countBucket = 1;
    else if (count === 2) countBucket = 2;
    else if (count === 3) countBucket = 3;
    else countBucket = 4; // 4~10회선

    const matrix = {
      1: { low:0, mid:0, high:0 },
      2: { low:2200, mid:3300, high:4400 },
      3: { low:3300, mid:5500, high:6600 },
      4: { low:4400, mid:6600, high:8800 }
    };
    let mobileDiscount = 0;
    lines.forEach(p => {
      const fee = Number(p.fee) || 0;
      let tier = 'low';
      if (fee >= 88000) tier = 'high';
      else if (fee >= 69000) tier = 'mid';
      mobileDiscount += matrix[countBucket][tier];
    });
    return { matchCarrier, count, internetDiscount, mobileDiscount, total: internetDiscount + mobileDiscount };
  }

  if (matchCarrier === 'SKT') {
    const internetMap = { 100:4400, 500:11000, 1000:13200 };
    const internetDiscount = internetMap[speedNum] || 0;
    let mobileDiscount;
    if (count === 1) mobileDiscount = 3500;
    else if (count === 2) mobileDiscount = 3500 * 2;
    else mobileDiscount = 6000 * count; // 3회선 이상
    return { matchCarrier, count, internetDiscount, mobileDiscount, total: internetDiscount + mobileDiscount };
  }

  return { matchCarrier, count:0, internetDiscount:0, mobileDiscount:0, total:0 };
}

function renderFamilyDiscountTable(){
  const container = document.getElementById('family-discount-table');
  if (!container) return;

  const rows = CARRIERS.map(carrier => {
    const fam = computeFamilyDiscount(carrier);
    return { carrier, ...fam };
  });

  container.innerHTML = `
    <table class="fam-table">
      <thead>
        <tr>
          <th>통신사</th>
          <th>매칭 회선</th>
          <th>인터넷 할인</th>
          <th>휴대폰 할인</th>
          <th>합계</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map(r => `
          <tr>
            <td class="brand-cell">${BRAND_LABEL[r.carrier]}</td>
            <td>${r.count}회선</td>
            <td>${r.internetDiscount.toLocaleString()}원</td>
            <td>${r.mobileDiscount.toLocaleString()}원</td>
            <td class="total-cell">${r.total.toLocaleString()}원</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    <div class="fam-table-note">
      · KT는 매칭 KT 회선 요금제 합산액, LG U+는 회선 수+요금제 구간, SKB/SKT는 매칭 SKT 회선 수 기준으로 계산됩니다.<br>
      · 위 금액은 참고용이며 현재 카드의 "총 요금"에는 반영되지 않습니다.
    </div>
  `;
}

function handleGiftInputChange(carrier, rawVal) {
  const numVal = parseInt(rawVal.replace(/[^0-9]/g, ''), 10);
  customGiftValues[carrier] = !isNaN(numVal) ? numVal : 0;
  render();
}

function render(){
  if (!DATA) return;

  document.querySelectorAll('#seg-speed button').forEach(b=>b.classList.toggle('active', b.dataset.value===state.speed));
  document.querySelectorAll('#seg-tv button').forEach(b=>b.classList.toggle('active', b.dataset.value===state.tv));
  document.querySelectorAll('#seg-settop button').forEach(b=>b.classList.toggle('active', b.dataset.value===state.settopTier));
  document.querySelectorAll('#seg-router button').forEach(b=>b.classList.toggle('active', b.dataset.value===state.router));

  const results = CARRIERS.map(carrier => ({ carrier, ...computePrice(carrier) }));
  const availableTotals = results.filter(r=>r.available).map(r=>r.total);
  const minTotal = availableTotals.length ? Math.min(...availableTotals) : null;

  document.getElementById('results').innerHTML = results.map(r=>{
    const isBest = r.available && r.total === minTotal;
    
    let tvLabel = '인터넷 단독';
    if (state.tv !== 'none') {
      if (r.tvInfo) {
        const channelText = r.tvInfo.channels ? `(${r.tvInfo.channels}채널)` : '';
        tvLabel = `${r.tvInfo.name}${channelText}`;
      } else {
        tvLabel = null;
      }
    }

    const comm = COMMISSION_DATA[r.carrier];
    const promo = PROMOTION_DATA[r.carrier];

    let commHtml = '';
    if (r.available && comm && promo) {
      const userGiftVal = customGiftValues[r.carrier] !== undefined ? customGiftValues[r.carrier] : promo.maxLimit;
      const calcCash = Math.max(0, userGiftVal - promo.giftCard);
      const calcMargin = comm.totalComm - userGiftVal;

      commHtml = `
        <div class="commission-section">
          <div class="comm-title">정산 및 혜택 상세</div>
          <div class="comm-group">
            <div class="comm-subhead large">💵 실제 지급 사은품 조정</div>
            <div class="comm-row highlight large" style="margin-bottom: 4px;">
              <span>· 고객 지급 사은품</span>
              <div>
                <input type="text" class="gift-input" value="${userGiftVal.toLocaleString()}" 
                       onchange="handleGiftInputChange('${r.carrier}', this.value)" onfocus="this.select()"> 원
              </div>
            </div>
            <div class="comm-row large"><span>└ 상품권</span><span>${promo.giftCard.toLocaleString()}원</span></div>
            <div class="comm-row large"><span>└ 현금</span><span>${calcCash.toLocaleString()}원</span></div>
          </div>

          <div class="comm-group" style="margin-top: 10px; padding-top: 8px; border-top: 2px solid var(--paper-line);">
            <div class="comm-subhead-row">
              <div class="comm-subhead">🎁 고객 지급 혜택 (경품고시 가이드)</div>
              <div class="subtotal">${promo.maxLimit.toLocaleString()}원</div>
            </div>
            <div class="comm-row"><span>· 상품권</span><span>${promo.giftCard.toLocaleString()}원</span></div>
            <div class="comm-row"><span>· 현금 가이드</span><span>${promo.cash.toLocaleString()}원</span></div>
          </div>

          <div class="comm-group" style="margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--paper-line);">
            <div class="comm-subhead-row">
              <div class="comm-subhead">💼 대리점 판매 수수료 (정산금)</div>
              <div class="subtotal">${comm.totalComm.toLocaleString()}원</div>
            </div>
            <div class="comm-row"><span>· 인터넷 수수료</span><span>${comm.internetComm.toLocaleString()}원</span></div>
            ${state.tv !== 'none' ? `<div class="comm-row"><span>· TV 수수료</span><span>${comm.tvComm.toLocaleString()}원</span></div>` : ''}
          </div>

          <div class="comm-group" style="margin-top: 8px; padding-top: 6px; border-top: 1px dashed var(--paper-line);">
            <div class="comm-row highlight margin-text" style="color:${calcMargin >= 0 ? '#1E7E34' : '#D9534F'};">
              <span>📊 대리점 최종 마진</span><span>${calcMargin.toLocaleString()}원</span>
            </div>
          </div>
        </div>
      `;
    }

    return `
      <div class="card ${isBest ? 'best' : ''}" data-brand="${r.carrier}">
        <div class="card-head">
          ${isBest ? '<div class="best-tag">최저가</div>' : ''}
          <p class="brand">${comm && comm.startAt ? `${formatStartAt(comm.startAt)} 적용` : ''}</p>
          <p class="plan-name">${BRAND_LABEL[r.carrier]} / ${tvLabel || '미제공'}</p>
        </div>
        <div class="price-block">
          ${r.available ? `<div class="amount">${r.total.toLocaleString()}<span>원 / 월</span></div>` : `<div class="unavailable">조합 정보 없음</div>`}
        </div>
        <div class="items">
          ${r.available ? `
            <div class="item-row"><span class="label">인터넷</span><span class="dots"></span><span class="value">${SPEED_LABEL[state.speed]} (${r.internetFee.toLocaleString()}원)</span></div>
            <div class="item-row sub"><span class="label">└ 공유기</span><span class="dots"></span><span class="value">${ROUTER_LABEL[state.router]} (${r.routerFee.toLocaleString()}원)</span></div>
            ${state.tv !== 'none' ? `
              <div class="item-row"><span class="label">TV 요금제</span><span class="dots"></span><span class="value">${tvLabel} (${r.tvFee.toLocaleString()}원)</span></div>
              ${r.settopInfo ? `<div class="item-row sub"><span class="label">└ 셋톱박스</span><span class="dots"></span><span class="value">${r.settopInfo.name} (${r.settopFee.toLocaleString()}원)</span></div>` : ''}
              <div class="item-row"><span class="label">결합할인</span><span class="dots"></span><span class="value discount">-${r.bundleDiscount.toLocaleString()}원</span></div>
            ` : ''}
          ` : ''}
        </div>
        ${commHtml}
      </div>
    `;
  }).join('');

  renderFamilyDiscountTable();
}

(async function init(){
  displayLastModified();
  setupSeg('seg-speed','speed');
  setupSeg('seg-tv','tv');
  setupSeg('seg-settop','settopTier');
  setupSeg('seg-router','router');
  renderFamilyPhones();

  if (await loadData()) {
    await loadFinanceData();
    render();
  }
})();
</script>
