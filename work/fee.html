<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>통신사 상품 수수료, 요금 및 경품공시금액 계산기</title>
    <style>
        :root {
            --primary-color: #2b4c7e;
            --secondary-color: #52796f;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dcdcdc;
        }
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 30px;
        }
        /* 좌우 2분할 레이아웃 스타일 */
        .calculator-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        @media (max-width: 768px) {
            .calculator-grid {
                grid-template-columns: 1fr;
            }
        }
        .section-box {
            background-color: #fafbfc;
            border: 1px solid #e1e8ed;
            border-radius: 8px;
            padding: 20px;
        }
        .section-box h3 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 18px;
            border-bottom: 2px solid #e1e8ed;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #444;
            font-size: 14px;
        }
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 15px;
            background-color: #fff;
            box-sizing: border-box;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 14px;
            font-size: 15px;
        }
        .result-row.total {
            font-weight: bold;
            font-size: 18px;
            color: #d90429;
            border-top: 1px dashed var(--border-color);
            padding-top: 15px;
            margin-top: 15px;
        }
        .result-row.monthly {
            font-weight: bold;
            font-size: 16px;
            color: #2b4c7e;
            background-color: #eef3f9;
            padding: 10px;
            border-radius: 4px;
        }
        .result-row.gift {
            font-weight: bold;
            color: #2f3e46;
            background-color: #e8f4f8;
            padding: 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>통신사 통합 수수료, 요금 및 경품 계산기</h2>
    
    <div class="calculator-grid">
        <!-- 왼쪽 영역: 선택사항 1, 2번 -->
        <div class="section-box">
            <h3>1 & 2) 상품 선택</h3>
            
            <!-- 1) 통신사 선택 -->
            <div class="form-group">
                <label for="carrierSelect">1) 통신사 선택</label>
                <select id="carrierSelect" onchange="onCarrierChange()">
                    <option value="">통신사를 선택하세요</option>
                    <option value="SKB">SKB (브로드밴드)</option>
                    <option value="SKT">SKT (유선)</option>
                    <option value="KT">KT (소매)</option>
                    <option value="LG">LG (유플러스)</option>
                </select>
            </div>

            <!-- 2-1) 인터넷 상품 선택 -->
            <div class="form-group">
                <label for="internetSelect">2-1) 인터넷 상품 선택</label>
                <select id="internetSelect" onchange="onInternetChange()">
                    <option value="">통신사를 먼저 선택하세요</option>
                </select>
            </div>

            <!-- 2-2) TV 상품 선택 -->
            <div class="form-group">
                <label for="tvSelect">2-2) TV 상품 선택 (요금표 연동)</label>
                <select id="tvSelect" onchange="calculateAll()">
                    <option value="">인터넷 상품을 먼저 선택하세요</option>
                </select>
            </div>

            <!-- 2-3) 와이파이(공유기) 선택 -->
            <div class="form-group" style="margin-bottom: 0;">
                <label for="wifiSelect">2-3) 와이파이(공유기) 선택</label>
                <select id="wifiSelect" onchange="calculateAll()">
                    <option value="N">미사용 (N)</option>
                    <option value="Y">사용 (Y)</option>
                </select>
            </div>
        </div>

        <!-- 오른쪽 영역: 결과값 3번 항목 -->
        <div class="section-box">
            <h3>3) 결과 요약</h3>
            
            <div class="result-row" style="margin-top: 15px;">
                <span>인터넷 수수료</span>
                <span id="internetFee">0 원</span>
            </div>
            <div class="result-row">
                <span>TV 수수료</span>
                <span id="tvFee">0 원</span>
            </div>
            <div class="result-row total">
                <span>수수료 합계</span>
                <span id="totalFee">0 원</span>
            </div>
            <div class="result-row monthly" style="margin-top: 25px;">
                <span>월 청구 요금 (VAT 포함)</span>
                <span id="monthlyPrice">0 원</span>
            </div>
            <div class="result-row gift" style="margin-top: 15px;">
                <span>기본 사은품 (경품공시)</span>
                <span id="baseGift">0 원</span>
            </div>
        </div>
    </div>
</div>

<script>
    const policyData = {
        "SKB": {
            internet: [
                { speed: "100M", name: "B우리집(100M)", fee: 345000, baseGift: 390000 },
                { speed: "500M", name: "B우리집(500M)", fee: 435000, baseGift: 490000 },
                { speed: "1G", name: "B우리집(1G)", fee: 435000, baseGift: 490000 }
            ],
            tv: {
                "100M": [
                    { name: "100M_TV(이코노미 / 스탠다드)", fee: 360000, priceN: 34100, priceY: 36300 },
                    { name: "100M_TV(올 / MAX)", fee: 400000, priceN: 37400, priceY: 39600 }
                ],
                "500M": [
                    { name: "500M_TV(이코노미 / 스탠다드)", fee: 360000, priceN: 41800, priceY: 42900 },
                    { name: "500M_TV(올 / MAX)", fee: 400000, priceN: 45100, priceY: 46200 }
                ],
                "1G": [
                    { name: "1G_TV(이코노미 / 스탠다드)", fee: 410000, priceN: 47300, priceY: 48400 },
                    { name: "1G_TV(올 / MAX)", fee: 450000, priceN: 50600, priceY: 51700 }
                ]
            }
        },
        "SKT": {
            internet: [
                { speed: "100M", name: "T우리집(100M)", fee: 230000, baseGift: 400000 },
                { speed: "500M", name: "T우리집(500M)", fee: 380000, baseGift: 430000 },
                { speed: "1G", name: "T우리집(1G)", fee: 430000, baseGift: 520000 }
            ],
            tv: {
                "100M": [
                    { name: "100M_TV(이코노미)", fee: 290000, priceN: 34100, priceY: 36300 },
                    { name: "100M_TV(스탠다드/올 등)", fee: 420000, priceN: 37400, priceY: 39600 }
                ],
                "500M": [
                    { name: "500M_TV(이코노미)", fee: 270000, priceN: 41800, priceY: 42900 },
                    { name: "500M_TV(스탠다드/올 등)", fee: 410000, priceN: 45100, priceY: 46200 }
                ],
                "1G": [
                    { name: "1G_TV(이코노미)", fee: 270000, priceN: 47300, priceY: 48400 },
                    { name: "1G_TV(스탠다드/올 등)", fee: 410000, priceN: 50600, priceY: 51700 }
                ]
            }
        },
        "KT": {
            internet: [
                { speed: "100M", name: "인터넷슬림(100M)", fee: 300000, baseGift: 300000 },
                { speed: "500M", name: "인터넷베이직(500M)", fee: 400000, baseGift: 400000 },
                { speed: "1G", name: "인터넷에센스(1G)", fee: 420000, baseGift: 400000 }
            ],
            tv: {
                "100M": [
                    { name: "100M_TV(베이직/라이트/에센스)", fee: 325000, priceN: 37400, priceY: 38500 },
                    { name: "100M_TV(모든G)", fee: 445000, priceN: 42900, priceY: 44000 }
                ],
                "500M": [
                    { name: "500M_TV(베이직/라이트/에센스)", fee: 335000, priceN: 42900, priceY: 44000 },
                    { name: "500M_TV(모든G)", fee: 455000, priceN: 48400, priceY: 49500 }
                ],
                "1G": [
                    { name: "1G_TV(베이직/라이트/에센스)", fee: 335000, priceN: 48400, priceY: 48400 },
                    { name: "1G_TV(모든G)", fee: 455000, priceN: 53900, priceY: 53900 }
                ]
            }
        },
        "LG": {
            internet: [
                { speed: "100M", name: "U+와이파이기본(100M)", fee: 380000, baseGift: 330000 },
                { speed: "500M", name: "U+와이파이기본(500M)", fee: 470000, baseGift: 470000 },
                { speed: "1G", name: "U+와이파이기본_1G", fee: 520000, baseGift: 470000 }
            ],
            tv: {
                "100M": [
                    { name: "100M_TV실속형", fee: 325000, priceN: 39600, priceY: 39600 },
                    { name: "100M_TV프리미엄", fee: 355000, priceN: 42900, priceY: 42900 }
                ],
                "500M": [
                    { name: "500M_TV실속형", fee: 315000, priceN: 45100, priceY: 45100 },
                    { name: "500M_TV프리미엄", fee: 345000, priceN: 48400, priceY: 48400 }
                ],
                "1G": [
                    { name: "1G_TV실속형", fee: 305000, priceN: 50600, priceY: 50600 },
                    { name: "1G_TV프리미엄", fee: 335000, priceN: 53900, priceY: 53900 }
                ]
            }
        }
    };

    function onCarrierChange() {
        const carrier = document.getElementById("carrierSelect").value;
        const internetSelect = document.getElementById("internetSelect");
        const tvSelect = document.getElementById("tvSelect");

        internetSelect.innerHTML = '<option value="">인터넷 상품을 선택하세요</option>';
        tvSelect.innerHTML = '<option value="">인터넷 상품을 먼저 선택하세요</option>';
        resetResult();

        if (!carrier || !policyData[carrier]) return;

        policyData[carrier].internet.forEach((item) => {
            let opt = document.createElement("option");
            opt.value = item.speed; 
            opt.dataset.fee = item.fee;
            opt.dataset.baseGift = item.baseGift;
            opt.textContent = `${item.name} (${item.fee.toLocaleString()}원)`;
            internetSelect.appendChild(opt);
        });
    }

    function onInternetChange() {
        const carrier = document.getElementById("carrierSelect").value;
        const internetSelect = document.getElementById("internetSelect");
        const selectedOption = internetSelect.options[internetSelect.selectedIndex];
        const tvSelect = document.getElementById("tvSelect");

        tvSelect.innerHTML = '<option value="">TV 상품을 선택하세요</option>';
        resetResult();

        if (!carrier || !selectedOption.value) return;

        const speed = selectedOption.value;
        const tvList = policyData[carrier].tv[speed];

        if (tvList) {
            tvList.forEach((item) => {
                let opt = document.createElement("option");
                opt.value = item.fee;
                opt.dataset.priceN = item.priceN;
                opt.dataset.priceY = item.priceY;
                opt.textContent = `${item.name} (수수료: ${item.fee.toLocaleString()}원 / 요금: ${item.priceN.toLocaleString()}원~)`;
                tvSelect.appendChild(opt);
            });
        }

        calculateAll();
    }

    function calculateAll() {
        const internetSelect = document.getElementById("internetSelect");
        const selectedInternetOpt = internetSelect.options[internetSelect.selectedIndex];
        const internetFee = selectedInternetOpt && selectedInternetOpt.dataset.fee ? parseInt(selectedInternetOpt.dataset.fee) : 0;
        const baseGift = selectedInternetOpt && selectedInternetOpt.dataset.baseGift ? parseInt(selectedInternetOpt.dataset.baseGift) : 0;
        
        const tvSelect = document.getElementById("tvSelect");
        const selectedTvOpt = tvSelect.options[tvSelect.selectedIndex];
        const tvFee = parseInt(tvSelect.value) || 0;

        const wifi = document.getElementById("wifiSelect").value;
        let monthlyPrice = 0;

        if (selectedTvOpt && selectedTvOpt.dataset.priceN) {
            monthlyPrice = (wifi === "Y") ? parseInt(selectedTvOpt.dataset.priceY) : parseInt(selectedTvOpt.dataset.priceN);
        }

        const totalFee = internetFee + tvFee;

        document.getElementById("internetFee").textContent = internetFee.toLocaleString() + " 원";
        document.getElementById("tvFee").textContent = tvFee.toLocaleString() + " 원";
        document.getElementById("totalFee").textContent = totalFee.toLocaleString() + " 원";
        document.getElementById("monthlyPrice").textContent = monthlyPrice.toLocaleString() + " 원";
        document.getElementById("baseGift").textContent = baseGift.toLocaleString() + " 원";
    }

    function resetResult() {
        document.getElementById("internetFee").textContent = "0 원";
        document.getElementById("tvFee").textContent = "0 원";
        document.getElementById("totalFee").textContent = "0 원";
        document.getElementById("monthlyPrice").textContent = "0 원";
        document.getElementById("baseGift").textContent = "0 원";
    }
</script>

</body>
</html>
