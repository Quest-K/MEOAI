<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>통신사 통합 상담, 수수료 계산 및 접수 시스템</title>
    <style>
        :root {
            --primary-color: #2b4c7e;
            --secondary-color: #52796f;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dcdcdc;
        }
        /* 기본 문서 본문 스타일 설정 */
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        /* 전체 콘텐츠를 감싸는 메인 컨테이너 박스 스타일 */
        .container {
            max-width: 1400px;
            margin: 10px auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        /* 상단 메인 타이틀 제목 스타일 */
        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 25px;
        }

        /* 3분할 레이아웃 스타일 설정 */
        .main-grid {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr 1.3fr;
            gap: 20px;
        }
        @media (max-width: 1200px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
        
        /* 각 기능별 카드 섹션 박스 스타일 */
        .section-box {
            background-color: #fafbfc;
            border: 1px solid #e1e8ed;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .section-box h3 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 17px;
            border-bottom: 2px solid #e1e8ed;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #444;
            font-size: 13px;
        }
        select, textarea, input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            background-color: #fff;
            box-sizing: border-box;
            font-family: 'Malgun Gothic', sans-serif;
        }
        textarea {
            resize: vertical;
            line-height: 1.5;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .result-row.sub-item {
            font-size: 13px;
            color: #555;
            padding-left: 15px;
            margin-bottom: 6px;
        }
        .result-row.total {
            font-weight: bold;
            font-size: 15px;
            color: #d90429;
            border-top: 1px dashed var(--border-color);
            padding-top: 12px;
            margin-top: 12px;
            white-space: nowrap;
        }
        .result-row.monthly {
            font-weight: bold;
            font-size: 15px;
            color: #2b4c7e;
            background-color: #eef3f9;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .result-row.gift-total {
            font-weight: bold;
            font-size: 14.5px;
            color: #d90429;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 10px;
            border-radius: 6px;
            margin-top: 15px;
            margin-bottom: 10px;
            white-space: nowrap;
        }
        .result-row.gift-sub {
            font-size: 13px;
            color: #555;
            padding-left: 15px;
            margin-bottom: 8px;
        }
        .result-row.margin {
            font-weight: bold;
            font-size: 16px;
            color: #0d9488;
            background-color: #f0fdf4;
            border: 1px solid #ccfbf1;
            padding: 10px;
            border-radius: 6px;
            margin-top: 15px;
        }
        .gift-input-wrap {
            display: flex;
            align-items: center;
            gap: 5px;
            width: 125px;
        }
        .gift-input-wrap input {
            text-align: right;
            padding: 4px 6px;
            font-size: 13px;
            font-weight: bold;
            color: #d90429;
        }
        .memo-info {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>통신사 통합 상담, 수수료 및 사은품 계산 시스템</h2>

    <!-- 3분할 본문 영역 (상품 선택, 결과 요약, 고객 안내 문자) -->
    <div class="main-grid">
        <!-- 왼쪽: 상품 선택 영역 -->
        <div class="section-box">
            <h3>1) 상품 선택</h3>
            
            <div class="form-group">
                <label for="carrierSelect">1. 통신사 선택</label>
                <select id="carrierSelect" onchange="onCarrierChange()">
                    <option value="">통신사를 선택하세요</option>
                    <option value="SKB(08/24~)">SKB(08/24~)</option>
                    <option value="SKB(09/03~)">SKB(09/03~)</option>
                    <option value="SKT">SKT</option>
                    <option value="KT">KT</option>
                    <option value="LG홈">LG홈</option>
                    <option value="LG소호">LG소호</option>
                </select>
            </div>

            <div class="form-group">
                <label for="internetSelect">2. 인터넷 속도 선택</label>
                <select id="internetSelect" onchange="onInternetChange()">
                    <option value="">통신사를 먼저 선택하세요</option>
                </select>
            </div>

            <div class="form-group">
                <label for="wifiSelect">와이파이(공유기) 여부</label>
                <select id="wifiSelect" onchange="onWifiChange()">
                    <option value="N">미사용 (N)</option>
                    <option value="Y">사용 (Y)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tvSelect">3. TV 상품 선택 (선택사항)</label>
                <select id="tvSelect" onchange="calculateAll()">
                    <option value="">인터넷 단독 적용됨 (TV 추가 시 선택)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="settopSelect">셋탑박스 선택</label>
                <select id="settopSelect" disabled>
                    <option value="">자동 선택됩니다</option>
                </select>
            </div>

            <!-- 하단 할인 정보 선택 공간 -->
            <div class="form-group" style="margin-bottom: 0; border-top: 1px dashed #cbd5e1; padding-top: 15px;">
                <label for="discountSelect">4. 할인 정보 선택</label>
                <select id="discountSelect" onchange="onDiscountChange()">
                    <option value="">통신사를 먼저 선택하세요</option>
                </select>
            </div>
        </div>

        <!-- 중앙: 결과 요약 영역 -->
        <div class="section-box">
            <h3>2) 결과 요약</h3>
            
            <!-- 월 청구 요금 최상단 배치 -->
            <div class="result-row monthly" style="margin-top: 5px;">
                <span>월 청구 요금 (VAT 포함)</span>
                <span id="monthlyPrice">0 원</span>
            </div>

            <!-- 합계 수수료 및 하단 세부 수수료 -->
            <div class="result-row total" style="margin-top: 5px;">
                <span>ㅇ 합계 수수료</span>
                <span id="totalFee">0 원</span>
            </div>
            <div class="result-row sub-item">
                <span>- 인터넷 수수료</span>
                <span id="internetFee">0 원</span>
            </div>
            <div class="result-row sub-item" style="margin-bottom: 15px;">
                <span>- TV 수수료</span>
                <span id="tvFee">0 원</span>
            </div>

            <!-- 총 사은품 및 하단 세부 항목 -->
            <div class="result-row gift-total">
                <span>ㅇ 총 사은품 (실제 지급)</span>
                <div class="gift-input-wrap">
                    <input type="text" id="totalGiftInput" value="0" oninput="onTotalGiftInput(this)">
                    <span>원</span>
                </div>
            </div>
            <div class="result-row gift-sub">
                <span>- 기본 사은품 (경품공시)</span>
                <span id="baseGift">0 원</span>
            </div>
            <div class="result-row gift-sub" style="margin-bottom: 15px;">
                <span>- 추가 사은품 (추가지급)</span>
                <span id="extraGift">0 원</span>
            </div>

            <div class="result-row margin">
                <span>인생비서 마진</span>
                <span id="netMargin">0 원</span>
            </div>
        </div>

        <div class="section-box">

            </div>
        </div>
    </div>
</div>

    // 통신사 선택 변경 시 하위 셀렉트박스 및 할인 항목을 갱신하는 함수
    function onCarrierChange() {
        const carrierSelect = document.getElementById("carrierSelect");
        const carrier = carrierSelect.value;
        const internetSelect = document.getElementById("internetSelect");
        const wifiSelect = document.getElementById("wifiSelect");
        const tvSelect = document.getElementById("tvSelect");
        const settopSelect = document.getElementById("settopSelect");
        const discountSelect = document.getElementById("discountSelect");

        internetSelect.innerHTML = '<option value="">인터넷 속도를 선택하세요</option>';
        tvSelect.innerHTML = '<option value="">인터넷 단독 적용됨 (TV 추가 시 선택)</option>';
        settopSelect.innerHTML = '<option value="">자동 선택됩니다</option>';
        
        // 통신사별 할인 목록 갱신 처리
        discountSelect.innerHTML = '<option value="">할인 항목을 선택하세요</option>';
        if (carrier && discountData[carrier]) {
            discountData[carrier].forEach((disc) => {
                let opt = document.createElement("option");
                opt.value = disc;
                opt.textContent = disc;
                discountSelect.appendChild(opt);
            });
        } else {
            discountSelect.innerHTML = '<option value="">통신사를 먼저 선택하세요</option>';
        }

        resetResult();

        if (!carrier || !policyData[carrier]) {
            updateCustomerSms();
            return;
        }

        const speeds = Object.keys(policyData[carrier]);
        speeds.forEach((speed) => {
            let opt = document.createElement("option");
            opt.value = speed;
            opt.textContent = speed;
            internetSelect.appendChild(opt);
        });

        updateCustomerSms(carrierSelect.options[carrierSelect.selectedIndex].text);
    }

    // 인터넷 속도 선택 변경 시 와이파이 고정 및 TV 옵션을 갱신하는 함수
    function onInternetChange() {
        const carrier = document.getElementById("carrierSelect").value;
        const internetSelect = document.getElementById("internetSelect");
        const speed = internetSelect.value;
        const wifiSelect = document.getElementById("wifiSelect");

        if (!carrier || !speed) return;

        if (carrier === "LG홈" || carrier === "LG소호") {
            wifiSelect.value = "Y";
            wifiSelect.disabled = true;
        } else {
            wifiSelect.disabled = false;
        }

        updateTvOptions();
        calculateAll();
    }

    // 와이파이 여부 변경 시 TV 옵션과 요금을 재계산하는 함수
    function onWifiChange() {
        updateTvOptions();
        calculateAll();
    }

    // 할인 항목 변경 시 전체 요금 및 수수료를 재계산하는 함수
    function onDiscountChange() {
        calculateAll();
    }

    // 선택된 통신사/속도/와이파이에 맞는 TV 상품 리스트를 동적으로 구성하는 함수
    function updateTvOptions() {
        const carrier = document.getElementById("carrierSelect").value;
        const internetSelect = document.getElementById("internetSelect");
        const speed = internetSelect.value;
        const wifiSelect = document.getElementById("wifiSelect");
        const wifi = wifiSelect.value;
        const tvSelect = document.getElementById("tvSelect");

        tvSelect.innerHTML = '<option value="">인터넷 단독 적용됨 (TV 추가 시 선택)</option>';

        if (!carrier || !speed) return;

        const netData = policyData[carrier][speed];
        if (!netData || !netData.wifiOptions[wifi]) {
            const availableWifi = Object.keys(netData.wifiOptions)[0];
            wifiSelect.value = availableWifi;
        }

        const currentWifiData = netData.wifiOptions[wifiSelect.value];
        if (!currentWifiData) return;

        const tvs = currentWifiData.tvs;
        for (let tvKey in tvs) {
            let tvObj = tvs[tvKey];
            let opt = document.createElement("option");
            opt.value = tvKey;
            opt.dataset.price = tvObj.price;
            opt.dataset.fee = tvObj.fee;
            opt.dataset.gift = tvObj.gift;
            opt.dataset.tvName = tvObj.tvName;
            opt.dataset.settop = tvObj.settop;
            
            opt.textContent = `TV 결합 (${tvObj.tvName} / 셋탑: ${tvObj.settop}) - 월 ${tvObj.price.toLocaleString()}원`;
            tvSelect.appendChild(opt);
        }
    }

    // 선택된 상품 정보에 따라 요금, 수수료, 사은품 합계를 계산하여 화면에 반영하는 함수
    function calculateAll() {
        const carrierSelect = document.getElementById("carrierSelect");
        const carrierText = carrierSelect.selectedIndex > 0 ? carrierSelect.options[carrierSelect.selectedIndex].text : "";

        const internetSelect = document.getElementById("internetSelect");
        const speed = internetSelect.value;
        const wifiSelect = document.getElementById("wifiSelect");
        const wifi = wifiSelect.value;
        const wifiText = (wifi === "Y") ? "사용 (Y)" : "미사용 (N)";

        const tvSelect = document.getElementById("tvSelect");
        const selectedTvOpt = tvSelect.options[tvSelect.selectedIndex];

        const discountSelect = document.getElementById("discountSelect");
        const discountText = discountSelect.selectedIndex > 0 && discountSelect.value ? discountSelect.value : "";

        if (!carrierText || !speed) {
            resetResult();
            return;
        }

        const netData = policyData[carrierText][speed].wifiOptions[wifi];
        
        let monthlyPrice = 0;
        let totalFee = 0;
        let baseGift = 0;
        let tvName = "";
        let settopName = "";

        if (!tvSelect.value || tvSelect.selectedIndex === 0) {
            monthlyPrice = netData.standalone.price;
            totalFee = netData.standalone.fee;
            baseGift = netData.standalone.gift;
        } else {
            monthlyPrice = parseInt(selectedTvOpt.dataset.price) || 0;
            totalFee = parseInt(selectedTvOpt.dataset.fee) || 0;
            baseGift = parseInt(selectedTvOpt.dataset.gift) || 0;
            tvName = selectedTvOpt.dataset.tvName || "";
            settopName = selectedTvOpt.dataset.settop || "";
        }

        document.getElementById("baseGift").textContent = baseGift.toLocaleString() + " 원";
        const totalGiftInput = document.getElementById("totalGiftInput");
        totalGiftInput.value = baseGift.toLocaleString();

        let internetFee = Math.round(totalFee * 0.55 / 10000) * 10000;
        let tvFee = totalFee - internetFee;

        document.getElementById("internetFee").textContent = internetFee.toLocaleString() + " 원";
        document.getElementById("tvFee").textContent = tvFee.toLocaleString() + " 원";
        document.getElementById("totalFee").textContent = totalFee.toLocaleString() + " 원";
        document.getElementById("monthlyPrice").textContent = monthlyPrice.toLocaleString() + " 원";

        computeMarginAndExtra(totalFee, baseGift);

        let internetFullName = `${carrierText} ${speed} (${wifi === "Y" ? "와이파이포함" : "단독"})`;
        updateCustomerSms(
            carrierText,
            internetFullName,
            wifiText,
            tvName,
            settopName,
            discountText,
            monthlyPrice.toLocaleString(),
            baseGift.toLocaleString()
        );
    }

    // 총 사은품 금액을 사용자가 직접 수정할 때 추가 사은품과 마진을 실시간 계산하는 함수
    function onTotalGiftInput(inputElement) {
        let rawVal = inputElement.value.replace(/[^0-9]/g, "");
        let numVal = rawVal ? parseInt(rawVal, 10) : 0;
        inputElement.value = numVal.toLocaleString();

        const totalFeeText = document.getElementById("totalFee").textContent.replace(/[^0-9]/g, "");
        const totalFee = totalFeeText ? parseInt(totalFeeText, 10) : 0;
        const baseGiftText = document.getElementById("baseGift").textContent.replace(/[^0-9]/g, "");
        const baseGift = baseGiftText ? parseInt(baseGiftText, 10) : 0;

        let extraGift = numVal - baseGift;
        document.getElementById("extraGift").textContent = extraGift.toLocaleString() + " 원";

        let netMargin = totalFee - numVal;
        const marginEl = document.getElementById("netMargin");
        marginEl.textContent = netMargin.toLocaleString() + " 원";
        
        if (netMargin < 0) {
            marginEl.style.color = "#d90429";
        } else {
            marginEl.style.color = "#0d9488";
        }

        // 고객 안내 문자 내 총 사은품 금액 실시간 연동 업데이트
        const carrierSelect = document.getElementById("carrierSelect");
        const carrierText = carrierSelect.selectedIndex > 0 ? carrierSelect.options[carrierSelect.selectedIndex].text : "";
        const internetSelect = document.getElementById("internetSelect");
        const speed = internetSelect.value;
        const wifiSelect = document.getElementById("wifiSelect");
        const wifi = wifiSelect.value;
        const wifiText = (wifi === "Y") ? "사용 (Y)" : "미사용 (N)";
        const tvSelect = document.getElementById("tvSelect");
        const selectedTvOpt = tvSelect.options[tvSelect.selectedIndex];
        const tvName = tvSelect.value && tvSelect.selectedIndex > 0 ? selectedTvOpt.dataset.tvName : "";
        const settopName = tvSelect.value && tvSelect.selectedIndex > 0 ? selectedTvOpt.dataset.settop : "";
        const discountSelect = document.getElementById("discountSelect");
        const discountText = discountSelect.selectedIndex > 0 && discountSelect.value ? discountSelect.value : "";
        const monthlyPrice = document.getElementById("monthlyPrice").textContent;

        let internetFullName = `${carrierText} ${speed} (${wifi === "Y" ? "와이파이포함" : "단독"})`;
        updateCustomerSms(
            carrierText,
            internetFullName,
            wifiText,
            tvName,
            settopName,
            discountText,
            monthlyPrice.replace(" 원", ""),
            numVal.toLocaleString()
        );
    }

    // 마진 및 추가 사은품 수치를 계산하여 화면에 표시하는 공통 함수
    function computeMarginAndExtra(totalFee, baseGift) {
        let totalGift = baseGift;
        let extraGift = totalGift - baseGift;
        let netMargin = totalFee - totalGift;

        document.getElementById("extraGift").textContent = extraGift.toLocaleString() + " 원";
        
        const marginEl = document.getElementById("netMargin");
        marginEl.textContent = netMargin.toLocaleString() + " 원";
        if (netMargin < 0) {
            marginEl.style.color = "#d90429";
        } else {
            marginEl.style.color = "#0d9488";
        }
    }

    // 결과 요약 패널의 데이터를 초기값(0원)으로 리셋하는 함수
    function resetResult() {
        document.getElementById("internetFee").textContent = "0 원";
        document.getElementById("tvFee").textContent = "0 원";
        document.getElementById("totalFee").textContent = "0 원";
        document.getElementById("monthlyPrice").textContent = "0 원";
        document.getElementById("baseGift").textContent = "0 원";
        document.getElementById("totalGiftInput").value = "0";
        document.getElementById("extraGift").textContent = "0 원";
        document.getElementById("netMargin").textContent = "0 원";
        
        const carrierSelect = document.getElementById("carrierSelect");
        const carrierText = carrierSelect.selectedIndex > 0 ? carrierSelect.options[carrierSelect.selectedIndex].text : "";
        const wifiSelect = document.getElementById("wifiSelect");
        const wifiText = wifiSelect.options[wifiSelect.selectedIndex] ? wifiSelect.options[wifiSelect.selectedIndex].text : "미사용 (N)";
        const discountSelect = document.getElementById("discountSelect");
        const discountText = discountSelect.selectedIndex > 0 && discountSelect.value ? discountSelect.value : "";
        
        updateCustomerSms(carrierText, "", wifiText, "", "", discountText, "0", "00,000");
    }

    // 웹페이지 로드가 완료될 때 초기 안내 문자를 세팅하는 이벤트 함수
    window.onload = function() {
        updateCustomerSms();
    };
</script>
