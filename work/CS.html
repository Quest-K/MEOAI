<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고객 상담 및 안내 기록 시스템</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
        }
        /* Custom Scrollbar for smooth experience */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-white/10 p-2.5 rounded-xl backdrop-blur-sm">
                    <i class="fa-solid fa-headset text-2xl text-indigo-100"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">통신 상담 기록 & 안내 시스템</h1>
                    <p class="text-xs text-indigo-200">고객 현황 분석 및 맞춤형 상품 제안 요약 툴</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="loadCurrentTime()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-xs font-medium rounded-lg transition shadow-sm border border-indigo-500">
                    <i class="fa-regular fa-clock mr-1"></i> 현재 시간 입력
                </button>
                <button onclick="clearForm()" class="px-3 py-1.5 bg-rose-600 hover:bg-rose-500 text-xs font-medium rounded-lg transition shadow-sm">
                    <i class="fa-solid fa-rotate-right mr-1"></i> 전체 초기화
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8 w-full grid grid-cols-1 lg:grid-cols-12 gap-6 flex-grow">
        
        <!-- Left Form Column (7 Cols on LG) -->
        <div class="lg:col-span-7 space-y-6">
            
            <!-- 1. Basic Customer Info -->
            <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
                <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-100">
                    <h2 class="text-base font-bold text-slate-900 flex items-center">
                        <span class="w-7 h-7 rounded-lg bg-indigo-50 text-indigo-600 inline-flex items-center justify-center mr-2 text-sm font-semibold">1</span>
                        기본 고객 정보
                    </h2>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">고객명</label>
                        <input type="text" id="custName" placeholder="홍길동" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">연락처</label>
                        <input type="text" id="custPhone" placeholder="010-1234-5678" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">상담 일시</label>
                        <input type="datetime-local" id="consultDate" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                    </div>
                </div>
            </section>

            <!-- 2. Customer Current Status (고객 탐색 사항) -->
            <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
                <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-100">
                    <h2 class="text-base font-bold text-slate-900 flex items-center">
                        <span class="w-7 h-7 rounded-lg bg-indigo-50 text-indigo-600 inline-flex items-center justify-center mr-2 text-sm font-semibold">2</span>
                        고객 현황 탐색 (현재 이용 상태)
                    </h2>
                </div>
                
                <div class="space-y-4">
                    <!-- 휴대폰 통신사 (Dropdown) -->
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1.5">개인 휴대폰 통신사</label>
                        <select id="mobileCarrier" onchange="updateSummary()" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                            <option value="선택안함">선택하세요</option>
                            <option value="SKT">SKT</option>
                            <option value="KT">KT</option>
                            <option value="LGU+">LGU+</option>
                            <option value="알뜰폰">알뜰폰</option>
                            <option value="기타">기타</option>
                        </select>
                    </div>

                    <!-- 기존 인터넷 통신사 ([없음], [KT], [LG], [SK], [기타]) -->
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1.5">기존 인터넷 통신사</label>
                        <div class="grid grid-cols-5 gap-2">
                            <label class="flex items-center justify-center py-2 px-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium cursor-pointer hover:bg-slate-100 transition has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-500 has-[:checked]:text-indigo-700">
                                <input type="radio" name="currInternetCarrier" value="없음" class="sr-only" onchange="handleCarrierRadioChange(); updateSummary();"> 없음
                            </label>
                            <label class="flex items-center justify-center py-2 px-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium cursor-pointer hover:bg-slate-100 transition has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-500 has-[:checked]:text-indigo-700">
                                <input type="radio" name="currInternetCarrier" value="KT" class="sr-only" onchange="handleCarrierRadioChange(); updateSummary();"> KT
                            </label>
                            <label class="flex items-center justify-center py-2 px-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium cursor-pointer hover:bg-slate-100 transition has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-500 has-[:checked]:text-indigo-700">
                                <input type="radio" name="currInternetCarrier" value="LG" class="sr-only" onchange="handleCarrierRadioChange(); updateSummary();"> LG
                            </label>
                            <label class="flex items-center justify-center py-2 px-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium cursor-pointer hover:bg-slate-100 transition has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-500 has-[:checked]:text-indigo-700">
                                <input type="radio" name="currInternetCarrier" value="SK" class="sr-only" onchange="handleCarrierRadioChange(); updateSummary();"> SK
                            </label>
                            <label class="flex items-center justify-center py-2 px-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium cursor-pointer hover:bg-slate-100 transition has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-500 has-[:checked]:text-indigo-700">
                                <input type="radio" name="currInternetCarrier" value="기타" class="sr-only" onchange="handleCarrierRadioChange(); updateSummary();"> 기타
                            </label>
                        </div>
                        <input type="text" id="currCarrierCustom" placeholder="기타 통신사명 직접 입력" oninput="updateSummary()" class="w-full mt-2 px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition hidden">
                    </div>

                    <!-- 기존 사용 상품 (체크박스 기준) -->
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1.5">기존 사용 상품 (복수 선택 가능)</label>
                        <div class="flex flex-wrap gap-4 p-3 bg-slate-50 border border-slate-200 rounded-xl">
                            <label class="flex items-center space-x-2 text-xs font-medium cursor-pointer">
                                <input type="checkbox" id="prodInternet" value="인터넷" onchange="updateSummary()" class="w-4 h-4 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500">
                                <span>인터넷</span>
                            </label>
                            <label class="flex items-center space-x-2 text-xs font-medium cursor-pointer">
                                <input type="checkbox" id="prodTv" value="TV" onchange="updateSummary()" class="w-4 h-4 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500">
                                <span>TV</span>
                            </label>
                            <label class="flex items-center space-x-2 text-xs font-medium cursor-pointer">
                                <input type="checkbox" id="prodPhone" value="전화" onchange="updateSummary()" class="w-4 h-4 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500">
                                <span>전화</span>
                            </label>
                            <label class="flex items-center space-x-2 text-xs font-medium cursor-pointer">
                                <input type="checkbox" id="prodWifi" value="와이파이" onchange="updateSummary()" class="w-4 h-4 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500">
                                <span>와이파이</span>
                            </label>
                        </div>
                    </div>

                    <!-- 월 요금 & 가족 휴대폰 통신사 -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">기존 납부 월 요금 (원)</label>
                            <div class="relative">
                                <input type="text" id="currFee" placeholder="예: 33,000" oninput="formatCurrency(this); updateSummary()" class="w-full pl-3 pr-8 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition text-right">
                                <span class="absolute right-3 top-2 text-xs text-slate-400 font-medium">원</span>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">가족 휴대폰 통신사 (결합 타진용)</label>
                            <input type="text" id="familyCarriers" placeholder="예: 아버지 SKT, 어머니 SKT (총 2대)" oninput="updateSummary()" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                        </div>
                    </div>
                </div>
            </section>

            <!-- 3. Offered Products (안내한 상품 제안) -->
            <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
                <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-100">
                    <h2 class="text-base font-bold text-slate-900 flex items-center">
                        <span class="w-7 h-7 rounded-lg bg-indigo-50 text-indigo-600 inline-flex items-center justify-center mr-2 text-sm font-semibold">3</span>
                        안내한 상품 및 조건 (제안 내용)
                    </h2>
                </div>

                <div class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">제안 통신사</label>
                            <select id="sugCarrier" onchange="updateSummary()" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                                <option value="KT">KT</option>
                                <option value="SK브로드밴드">SK브로드밴드</option>
                                <option value="LG유플러스">LG유플러스</option>
                                <option value="기타">기타</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">인터넷 속도/상품</label>
                            <select id="sugInternet" onchange="updateSummary()" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                                <option value="100메가 (와이파이포함)">100메가 (와이파이포함)</option>
                                <option value="500메가 (기가인터넷)">500메가 (기가인터넷)</option>
                                <option value="1기가 (울트라속도)">1기가 (울트라속도)</option>
                                <option value="인터넷 제외">인터넷 제외</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">TV 상품</label>
                            <select id="sugTv" onchange="updateSummary()" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                                <option value="베이직 (일반 채널형)">베이직 (보급형)</option>
                                <option value="스탠다드 / 프라임">스탠다드 / 프라임</option>
                                <option value="넷플릭스 / OTT 패키지">넷플릭스 / OTT 패키지</option>
                                <option value="TV 미포함 (단독)">TV 미포함 (단독)</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">안내 월 요금 (부가세/장비 포함)</label>
                            <div class="relative">
                                <input type="text" id="sugFee" placeholder="예: 38,500" oninput="formatCurrency(this); updateSummary()" class="w-full pl-3 pr-8 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition text-right">
                                <span class="absolute right-3 top-2 text-xs text-slate-400 font-medium">원</span>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">안내 사은품 (현금/상품권/가전 등)</label>
                            <input type="text" id="sugGift" placeholder="예: 현금 40만원 + 신세계상품권 5만원" oninput="updateSummary()" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                        </div>
                    </div>
                </div>
            </section>

            <!-- 4. Additional Memos -->
            <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
                <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-100">
                    <h2 class="text-base font-bold text-slate-900 flex items-center">
                        <span class="w-7 h-7 rounded-lg bg-indigo-50 text-indigo-600 inline-flex items-center justify-center mr-2 text-sm font-semibold">4</span>
                        추가 상담 메모 및 특이사항
                    </h2>
                </div>
                <textarea id="consultMemo" rows="3" placeholder="고객 요청사항, 위약금 대납 여부, 설치 희망일, 재연락 요청 시간 등을 입력하세요." oninput="updateSummary()" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition resize-none"></textarea>
            </section>

        </div>

        <!-- Right Summary Preview Column (5 Cols on LG) -->
        <div class="lg:col-span-5 flex flex-col">
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 sticky top-6 flex flex-col h-full">
                <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-100">
                    <h2 class="text-base font-bold text-slate-900 flex items-center">
                        <i class="fa-solid fa-clipboard-check text-indigo-600 mr-2"></i>
                        상담 요약 미리보기
                    </h2>
                    <span class="text-xs bg-emerald-50 text-emerald-600 px-2.5 py-1 rounded-full font-medium border border-emerald-200">실시간 생성</span>
                </div>

                <!-- Preview Box Content -->
                <div class="bg-slate-900 text-slate-100 rounded-xl p-4 font-mono text-xs leading-relaxed whitespace-pre-wrap h-[420px] overflow-y-auto mb-4 border border-slate-800 shadow-inner" id="summaryText">
                    [상담 요약 내용이 실시간으로 여기에 작성됩니다]
                </div>

                <!-- Action Buttons -->
                <div class="grid grid-cols-2 gap-3 mt-auto">
                    <button onclick="copySummary()" class="flex items-center justify-center py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-xl transition shadow-md shadow-indigo-100">
                        <i class="fa-regular fa-copy mr-2"></i> 복사하기
                    </button>
                    <button onclick="saveToLocalStorage()" class="flex items-center justify-center py-2.5 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-sm rounded-xl transition border border-slate-200">
                        <i class="fa-regular fa-floppy-disk mr-2"></i> 임시저장
                    </button>
                </div>
                
                <!-- Saved Records Trigger / Quick History Status -->
                <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
                    <span id="saveStatus">저장된 기록 없음</span>
                    <button onclick="loadFromLocalStorage()" class="text-indigo-600 hover:underline font-medium">최근 저장 불러오기</button>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 text-center text-xs text-slate-400">
        &copy; 상담 기록 관리 어시스턴트. 안전한 브라우저 로컬 스토리지를 활용하여 정보가 보호됩니다.
    </footer>

    <!-- JavaScript Code -->
    <script>
        // Initialize current date and time on load
        window.onload = function() {
            loadCurrentTime();
            updateSummary();
            checkSavedStatus();
        };

        function loadCurrentTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            const localDatetime = `${year}-${month}-${day}T${hours}:${minutes}`;
            document.getElementById('consultDate').value = localDatetime;
            updateSummary();
        }

        function getSelectedRadioValue(name) {
            const radios = document.getElementsByName(name);
            for (const radio of radios) {
                if (radio.checked) return radio.value;
            }
            return '';
        }

        function handleCarrierRadioChange() {
            const carrierVal = getSelectedRadioValue('currInternetCarrier');
            const customInput = document.getElementById('currCarrierCustom');
            const prodInternet = document.getElementById('prodInternet');
            const prodTv = document.getElementById('prodTv');

            if (carrierVal === '기타') {
                customInput.classList.remove('hidden');
                customInput.focus();
            } else {
                customInput.classList.add('hidden');
                customInput.value = '';
            }

            // [기존인터넷 통신사]를 선택하면 (없음이 아닌 경우) 자동으로 인터넷은 체크, TV는 미체크 유지
            if (carrierVal && carrierVal !== '없음') {
                prodInternet.checked = true;
            } else if (carrierVal === '없음') {
                prodInternet.checked = false;
                prodTv.checked = false;
            }
        }

        function formatCurrency(input) {
            let value = input.value.replace(/[^0-9]/g, '');
            if (value) {
                value = Number(value).toLocaleString();
            }
            input.value = value;
        }

        function updateSummary() {
            const name = document.getElementById('custName').value || '미입력';
            const phone = document.getElementById('custPhone').value || '미입력';
            const date = document.getElementById('consultDate').value.replace('T', ' ') || '미입력';
            
            const mobileCarrier = document.getElementById('mobileCarrier').value;
            
            let internetCarrier = getSelectedRadioValue('currInternetCarrier');
            if (internetCarrier === '기타') {
                const customVal = document.getElementById('currCarrierCustom').value;
                internetCarrier = customVal ? `기타(${customVal})` : '기타';
            }
            internetCarrier = internetCarrier || '선택안함';

            // Gather checked products
            let productList = [];
            if (document.getElementById('prodInternet').checked) productList.push('인터넷');
            if (document.getElementById('prodTv').checked) productList.push('TV');
            if (document.getElementById('prodPhone').checked) productList.push('전화');
            if (document.getElementById('prodWifi').checked) productList.push('와이파이');
            const productType = productList.length > 0 ? productList.join(', ') : '선택없음';

            const currFee = document.getElementById('currFee').value || '0';
            const familyCarriers = document.getElementById('familyCarriers').value || '없음';

            const sugCarrier = document.getElementById('sugCarrier').value;
            const sugInternet = document.getElementById('sugInternet').value;
            const sugTv = document.getElementById('sugTv').value;
            const sugFee = document.getElementById('sugFee').value || '0';
            const sugGift = document.getElementById('sugGift').value || '없음';
            const consultMemo = document.getElementById('consultMemo').value || '없음';

            const summaryString = 
`[통신 상담 기록 및 안내 요약]
■ 기본 정보
- 고객명: ${name}
- 연락처: ${phone}
- 상담일시: ${date}

■ 고객 현재 상태
- 휴대폰 통신사: ${mobileCarrier}
- 기존 인터넷: ${internetCarrier} (사용 상품: ${productType})
- 기존 월 요금: ${currFee}원
- 가족 휴대폰 결합 대상: ${familyCarriers}

■ 안내한 상품 및 제안
- 제안 통신사: ${sugCarrier}
- 인터넷 상품: ${sugInternet}
- TV 상품: ${sugTv}
- 안내 월요금: ${sugFee}원 (부가세/장비 포함)
- 안내 사은품: ${sugGift}

■ 상담 메모 및 특이사항
${consultMemo}
`;

            document.getElementById('summaryText').innerText = summaryString;
        }

        function copySummary() {
            const summaryText = document.getElementById('summaryText').innerText;
            
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(summaryText).then(() => {
                    showToast('요약 내용이 클립보드에 복사되었습니다.');
                }).catch(err => {
                    fallbackCopyText(summaryText);
                });
            } else {
                fallbackCopyText(summaryText);
            }
        }

        function fallbackCopyText(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast('요약 내용이 클립보드에 복사되었습니다.');
                } else {
                    showToast('복사에 실패했습니다.');
                }
            } catch (err) {
                showToast('클립보드 복사 지원 안함');
            }
            document.body.removeChild(textarea);
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-2.5 rounded-xl text-xs font-medium shadow-lg z-50 transition transform duration-300 translate-y-2 opacity-0 flex items-center space-x-2';
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i><span>${message}</span>`;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        function clearForm() {
            if (confirm('작성 중인 모든 내용이 초기화됩니다. 진행하시겠습니까?')) {
                document.getElementById('custName').value = '';
                document.getElementById('custPhone').value = '';
                loadCurrentTime();
                
                document.getElementById('mobileCarrier').value = '선택안함';

                // Clear radios
                const radios = document.getElementsByName('currInternetCarrier');
                radios.forEach(r => r.checked = false);
                document.getElementById('currCarrierCustom').classList.add('hidden');
                document.getElementById('currCarrierCustom').value = '';

                // Uncheck products
                document.getElementById('prodInternet').checked = false;
                document.getElementById('prodTv').checked = false;
                document.getElementById('prodPhone').checked = false;
                document.getElementById('prodWifi').checked = false;

                document.getElementById('currFee').value = '';
                document.getElementById('familyCarriers').value = '';

                document.getElementById('sugCarrier').value = 'KT';
                document.getElementById('sugInternet').value = '100메가 (와이파이포함)';
                document.getElementById('sugTv').value = '베이직 (일반 채널형)';
                document.getElementById('sugFee').value = '';
                document.getElementById('sugGift').value = '';
                document.getElementById('consultMemo').value = '';

                updateSummary();
                showToast('초기화되었습니다.');
            }
        }

        function saveToLocalStorage() {
            const formData = {
                custName: document.getElementById('custName').value,
                custPhone: document.getElementById('custPhone').value,
                consultDate: document.getElementById('consultDate').value,
                mobileCarrier: document.getElementById('mobileCarrier').value,
                currInternetCarrier: getSelectedRadioValue('currInternetCarrier'),
                currCarrierCustom: document.getElementById('currCarrierCustom').value,
                prodInternet: document.getElementById('prodInternet').checked,
                prodTv: document.getElementById('prodTv').checked,
                prodPhone: document.getElementById('prodPhone').checked,
                prodWifi: document.getElementById('prodWifi').checked,
                currFee: document.getElementById('currFee').value,
                familyCarriers: document.getElementById('familyCarriers').value,
                sugCarrier: document.getElementById('sugCarrier').value,
                sugInternet: document.getElementById('sugInternet').value,
                sugTv: document.getElementById('sugTv').value,
                sugFee: document.getElementById('sugFee').value,
                sugGift: document.getElementById('sugGift').value,
                consultMemo: document.getElementById('consultMemo').value,
                savedAt: new Date().toLocaleString()
            };

            localStorage.setItem('last_consultation', JSON.stringify(formData));
            checkSavedStatus();
            showToast('브라우저에 임시 저장되었습니다.');
        }

        function loadFromLocalStorage() {
            const savedData = localStorage.getItem('last_consultation');
            if (!savedData) {
                showToast('저장된 상담 기록이 없습니다.');
                return;
            }

            const data = JSON.parse(savedData);
            document.getElementById('custName').value = data.custName || '';
            document.getElementById('custPhone').value = data.custPhone || '';
            if (data.consultDate) document.getElementById('consultDate').value = data.consultDate;

            document.getElementById('mobileCarrier').value = data.mobileCarrier || '선택안함';

            // Set radio for internet carrier
            const radios = document.getElementsByName('currInternetCarrier');
            radios.forEach(r => {
                if (r.value === data.currInternetCarrier) r.checked = true;
            });
            handleCarrierRadioChange();
            if (data.currCarrierCustom) document.getElementById('currCarrierCustom').value = data.currCarrierCustom;

            // Set checkboxes
            document.getElementById('prodInternet').checked = !!data.prodInternet;
            document.getElementById('prodTv').checked = !!data.prodTv;
            document.getElementById('prodPhone').checked = !!data.prodPhone;
            document.getElementById('prodWifi').checked = !!data.prodWifi;

            document.getElementById('currFee').value = data.currFee || '';
            document.getElementById('familyCarriers').value = data.familyCarriers || '';

            document.getElementById('sugCarrier').value = data.sugCarrier || 'KT';
            document.getElementById('sugInternet').value = data.sugInternet || '100메가 (와이파이포함)';
            document.getElementById('sugTv').value = data.sugTv || '베이직 (일반 채널형)';
            document.getElementById('sugFee').value = data.sugFee || '';
            document.getElementById('sugGift').value = data.sugGift || '';
            document.getElementById('consultMemo').value = data.consultMemo || '';

            updateSummary();
            showToast('저장된 기록을 불러왔습니다.');
        }

        function checkSavedStatus() {
            const savedData = localStorage.getItem('last_consultation');
            const statusElem = document.getElementById('saveStatus');
            if (savedData) {
                try {
                    const data = JSON.parse(savedData);
                    statusElem.innerText = `최근 저장: ${data.savedAt || '기록 있음'}`;
                } catch(e) {
                    statusElem.innerText = '저장된 기록 있음';
                }
            } else {
                statusElem.innerText = '저장된 기록 없음';
            }
        }
    </script>
</body>
</html>
