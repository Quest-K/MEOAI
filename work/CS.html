<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>통신 상담 기록 & 안내 시스템 (컴팩트 대시보드)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Pretendard -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            font-size: 13px; /* 전체 폰트 사이즈 살짝 컴팩트하게 조정 */
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-full flex flex-col justify-between overflow-hidden">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-sm shrink-0">
        <div class="max-w-[1600px] mx-auto px-4 py-2.5 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="bg-white/10 p-1.5 rounded-lg">
                    <i class="fa-solid fa-headset text-lg text-indigo-100"></i>
                </div>
                <div>
                    <h1 class="text-sm font-bold tracking-tight">통신 상담 기록 & 안내 시스템 (1-Page 대시보드)</h1>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="loadAdminData()" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-xs font-medium rounded transition shadow-sm flex items-center">
                    <i class="fa-solid fa-link mr-1"></i> 어드민 상품연동
                </button>
                <button onclick="loadCurrentTime()" class="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-500 text-xs font-medium rounded transition shadow-sm">
                    <i class="fa-regular fa-clock mr-1"></i> 현재시간
                </button>
                <button onclick="clearForm()" class="px-2.5 py-1 bg-rose-600 hover:bg-rose-500 text-xs font-medium rounded transition shadow-sm">
                    <i class="fa-solid fa-rotate-right mr-1"></i> 초기화
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container (Fits 100vh without page scroll) -->
    <main class="max-w-[1600px] mx-auto px-3 py-2 w-full grid grid-cols-1 lg:grid-cols-12 gap-3 flex-grow overflow-hidden">
        
        <!-- Left Form Column (7 Cols on LG) -->
        <div class="lg:col-span-7 flex flex-col gap-2.5 overflow-y-auto pr-1">
            
            <!-- 1. Basic Customer Info -->
            <section class="bg-white rounded-xl p-3 shadow-sm border border-slate-200">
                <div class="flex items-center justify-between mb-2 pb-1.5 border-b border-slate-100">
                    <h2 class="text-xs font-bold text-slate-900 flex items-center">
                        <span class="w-5 h-5 rounded bg-indigo-50 text-indigo-600 inline-flex items-center justify-center mr-1.5 text-xs font-semibold">1</span>
                        기본 고객 정보
                    </h2>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-[11px] font-medium text-slate-600 mb-0.5">고객명</label>
                        <input type="text" id="custName" placeholder="홍길동" oninput="updateSummary()" class="w-full px-2.5 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium text-slate-600 mb-0.5">연락처</label>
                        <input type="text" id="custPhone" placeholder="010-1234-5678" oninput="updateSummary()" class="w-full px-2.5 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium text-slate-600 mb-0.5">상담 일시</label>
                        <input type="datetime-local" id="consultDate" oninput="updateSummary()" class="w-full px-2.5 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500">
                    </div>
                </div>
            </section>

            <!-- 2. Customer Current Status -->
            <section class="bg-white rounded-xl p-3 shadow-sm border border-slate-200">
                <div class="flex items-center justify-between mb-2 pb-1.5 border-b border-slate-100">
                    <h2 class="text-xs font-bold text-slate-900 flex items-center">
                        <span class="w-5 h-5 rounded bg-indigo-50 text-indigo-600 inline-flex items-center justify-center mr-1.5 text-xs font-semibold">2</span>
                        고객 현황 탐색
                    </h2>
                </div>
                
                <div class="space-y-2.5">
                    <!-- 명의자 휴대폰 통신사 (6 Buttons) -->
                    <div>
                        <label class="block text-[11px] font-medium text-slate-600 mb-1">명의자휴대폰통신사</label>
                        <div class="grid grid-cols-6 gap-1.5">
                            <label class="flex items-center justify-center py-1.5 px-1 bg-slate-50 border border-slate-200 rounded-lg text-[11px] font-medium cursor-pointer hover:bg-slate-100 transition has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-500 has-[:checked]:text-indigo-700">
                                <input type="radio" name="mobileCarrier" value="KT" class="sr-only" onchange="updateSummary()"> KT
                            </label>
                            <label class="flex items-center justify-center py-1.5 px-1 bg-slate-50 border border-slate-200 rounded-lg text-[11px] font-medium cursor-pointer hover:bg-slate-100 transition has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-500 has-[:checked]:text-indigo-700">
                                <input type="radio" name="mobileCarrier" value="LG" class="sr-only" onchange="updateSummary()"> LG
                            </label>
                            <label class="flex items-center justify-center py-1.5 px-1 bg-slate-50 border border-slate-200 rounded-lg text-[11px] font-medium cursor-pointer hover:bg-slate-100 transition has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-500 has-[:checked]:text-indigo-700">
                                <input type="radio" name="mobileCarrier" value="SK" class="sr-only" onchange="updateSummary()"> SK
                            </label>
                            <label class="flex items-center justify-center py-1.5 px-1 bg-slate-50 border border-slate-200 rounded-lg text-[11px] font-medium cursor-pointer hover:bg-slate-100 transition has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-500 has-[:checked]:text-indigo-700">
                                <input type="radio" name="mobileCarrier" value="KT알뜰" class="sr-only" onchange="updateSummary()"> KT알뜰
                            </label>
                            <label class="flex items-center justify-center py-1.5 px-1 bg-slate-50 border border-slate-200 rounded-lg text-[11px] font-medium cursor-pointer hover:bg-slate-100 transition has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-500 has-[:checked]:text-indigo-700">
                                <input type="radio" name="mobileCarrier" value="LG알뜰" class="sr-only" onchange="updateSummary()"> LG알뜰
                            </label>
                            <label class="flex items-center justify-center py-1.5 px-1 bg-slate-50 border border-slate-200 rounded-lg text-[11px] font-medium cursor-pointer hover:bg-slate-100 transition has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-500 has-[:checked]:text-indigo-700">
                                <input type="radio" name="mobileCarrier" value="SK알뜰" class="sr-only" onchange="updateSummary()"> SK알뜰
                            </label>
                        </div>
                    </div>

                    <!-- 기존 인터넷 통신사 -->
                    <div>
                        <label class="block text-[11px] font-medium text-slate-600 mb-1">기존 인터넷 통신사</label>
                        <div class="grid grid-cols-5 gap-1.5">
                            <label class="flex items-center justify-center py-1.5 px-1 bg-slate-50 border border-slate-200 rounded-lg text-[11px] font-medium cursor-pointer hover:bg-slate-100 transition has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-500 has-[:checked]:text-indigo-700">
                                <input type="radio" name="currInternetCarrier" value="없음" class="sr-only" onchange="handleCarrierRadioChange(); updateSummary();"> 없음
                            </label>
                            <label class="flex items-center justify-center py-1.5 px-1 bg-slate-50 border border-slate-200 rounded-lg text-[11px] font-medium cursor-pointer hover:bg-slate-100 transition has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-500 has-[:checked]:text-indigo-700">
                                <input type="radio" name="currInternetCarrier" value="KT" class="sr-only" onchange="handleCarrierRadioChange(); updateSummary();"> KT
                            </label>
                            <label class="flex items-center justify-center py-1.5 px-1 bg-slate-50 border border-slate-200 rounded-lg text-[11px] font-medium cursor-pointer hover:bg-slate-100 transition has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-500 has-[:checked]:text-indigo-700">
                                <input type="radio" name="currInternetCarrier" value="LG" class="sr-only" onchange="handleCarrierRadioChange(); updateSummary();"> LG
                            </label>
                            <label class="flex items-center justify-center py-1.5 px-1 bg-slate-50 border border-slate-200 rounded-lg text-[11px] font-medium cursor-pointer hover:bg-slate-100 transition has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-500 has-[:checked]:text-indigo-700">
                                <input type="radio" name="currInternetCarrier" value="SK" class="sr-only" onchange="handleCarrierRadioChange(); updateSummary();"> SK
                            </label>
                            <label class="flex items-center justify-center py-1.5 px-1 bg-slate-50 border border-slate-200 rounded-lg text-[11px] font-medium cursor-pointer hover:bg-slate-100 transition has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-500 has-[:checked]:text-indigo-700">
                                <input type="radio" name="currInternetCarrier" value="기타" class="sr-only" onchange="handleCarrierRadioChange(); updateSummary();"> 기타
                            </label>
                        </div>
                        <input type="text" id="currCarrierCustom" placeholder="기타 통신사명 직접 입력" oninput="updateSummary()" class="w-full mt-1.5 px-2.5 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500 hidden">
                    </div>

                    <!-- 기존 사용 상품 & 월요금 -->
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[11px] font-medium text-slate-600 mb-1">기존 사용 상품</label>
                            <div class="flex flex-wrap gap-2.5 px-2 py-1.5 bg-slate-50 border border-slate-200 rounded-lg">
                                <label class="flex items-center space-x-1 text-[11px] font-medium cursor-pointer">
                                    <input type="checkbox" id="prodInternet" value="인터넷" onchange="updateSummary()" class="w-3.5 h-3.5 text-indigo-600 rounded">
                                    <span>인터넷</span>
                                </label>
                                <label class="flex items-center space-x-1 text-[11px] font-medium cursor-pointer">
                                    <input type="checkbox" id="prodTv" value="TV" onchange="updateSummary()" class="w-3.5 h-3.5 text-indigo-600 rounded">
                                    <span>TV</span>
                                </label>
                                <label class="flex items-center space-x-1 text-[11px] font-medium cursor-pointer">
                                    <input type="checkbox" id="prodPhone" value="전화" onchange="updateSummary()" class="w-3.5 h-3.5 text-indigo-600 rounded">
                                    <span>전화</span>
                                </label>
                                <label class="flex items-center space-x-1 text-[11px] font-medium cursor-pointer">
                                    <input type="checkbox" id="prodWifi" value="와이파이" onchange="updateSummary()" class="w-3.5 h-3.5 text-indigo-600 rounded">
                                    <span>와이파이</span>
                                </label>
                            </div>
                        </div>
                        <div>
                            <label class="block text-[11px] font-medium text-slate-600 mb-1">기존 납부 월 요금</label>
                            <div class="relative">
                                <input type="text" id="currFee" placeholder="예: 33,000" oninput="formatCurrency(this); updateSummary()" class="w-full pl-2.5 pr-6 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none text-right">
                                <span class="absolute right-2.5 top-1.5 text-[11px] text-slate-400">원</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 3. Dynamic Offered Products -->
            <section class="bg-white rounded-xl p-3 shadow-sm border border-slate-200">
                <div class="flex items-center justify-between mb-2 pb-1.5 border-b border-slate-100">
                    <h2 class="text-xs font-bold text-slate-900 flex items-center">
                        <span class="w-5 h-5 rounded bg-indigo-50 text-indigo-600 inline-flex items-center justify-center mr-1.5 text-xs font-semibold">3</span>
                        안내한 상품 및 조건 (다중 제안)
                    </h2>
                    <button onclick="addOfferedProductRow()" class="px-2 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-[11px] font-semibold rounded transition flex items-center border border-indigo-200">
                        <i class="fa-solid fa-plus mr-1"></i> 상품 추가
                    </button>
                </div>

                <!-- Container for Multiple Offered Products -->
                <div id="offeredProductsContainer" class="space-y-2">
                    <!-- Dynamic Rows will be inserted here -->
                </div>
            </section>

            <!-- 4. Additional Memos -->
            <section class="bg-white rounded-xl p-3 shadow-sm border border-slate-200">
                <div class="flex items-center justify-between mb-1.5 pb-1 border-b border-slate-100">
                    <h2 class="text-xs font-bold text-slate-900 flex items-center">
                        <span class="w-5 h-5 rounded bg-indigo-50 text-indigo-600 inline-flex items-center justify-center mr-1.5 text-xs font-semibold">4</span>
                        상담 메모 및 특이사항
                    </h2>
                </div>
                <textarea id="consultMemo" rows="2" placeholder="고객 요청사항, 위약금 대납 여부, 설치 희망일 등" oninput="updateSummary()" class="w-full px-2.5 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none resize-none"></textarea>
            </section>

        </div>

        <!-- Right Summary Preview Column (5 Cols on LG) -->
        <div class="lg:col-span-5 flex flex-col h-full overflow-hidden">
            <div class="bg-white rounded-xl p-3 shadow-sm border border-slate-200 flex flex-col h-full">
                <div class="flex items-center justify-between mb-2 pb-1.5 border-b border-slate-100 shrink-0">
                    <h2 class="text-xs font-bold text-slate-900 flex items-center">
                        <i class="fa-solid fa-clipboard-check text-indigo-600 mr-1.5"></i>
                        상담 요약 미리보기
                    </h2>
                    <span class="text-[10px] bg-emerald-50 text-emerald-600 px-2 py-0.5 rounded-full font-medium border border-emerald-200">실시간 생성</span>
                </div>

                <!-- Preview Box Content -->
                <div class="bg-slate-900 text-slate-100 rounded-lg p-3 font-mono text-[11px] leading-relaxed whitespace-pre-wrap flex-grow overflow-y-auto mb-2.5 border border-slate-800 shadow-inner" id="summaryText">
                    [상담 요약 내용이 실시간으로 여기에 작성됩니다]
                </div>

                <!-- Action Buttons -->
                <div class="grid grid-cols-2 gap-2 shrink-0">
                    <button onclick="copySummary()" class="flex items-center justify-center py-2 px-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-xs rounded-lg transition shadow-sm">
                        <i class="fa-regular fa-copy mr-1.5"></i> 복사하기
                    </button>
                    <button onclick="saveToLocalStorage()" class="flex items-center justify-center py-2 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-xs rounded-lg transition border border-slate-200">
                        <i class="fa-regular fa-floppy-disk mr-1.5"></i> 임시저장
                    </button>
                </div>
                
                <div class="mt-2 pt-2 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-500 shrink-0">
                    <span id="saveStatus">저장된 기록 없음</span>
                    <button onclick="loadFromLocalStorage()" class="text-indigo-600 hover:underline font-medium">최근 저장 불러오기</button>
                </div>
            </div>
        </div>

    </main>

    <!-- JavaScript Code -->
    <script>
        window.onload = function() {
            loadCurrentTime();
            // 기본 제안 상품 1개 생성
            addOfferedProductRow();
            // URL 파라미터나 로컬스토리지에 전달된 어드민 데이터가 있는지 확인
            checkAdminParamOrStorage();
            updateSummary();
            checkSavedStatus();
        };

        function loadCurrentTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            document.getElementById('consultDate').value = `${year}-${month}-${day}T${hours}:${minutes}`;
            updateSummary();
        }

        function getSelectedRadioValue(name) {
            const radios = document.getElementsByName(name);
            for (const radio of radios) {
                if (radio.checked) return radio.value;
            }
            return '';
        }

        function handleCarrierRadioChange() {
            const carrierVal = getSelectedRadioValue('currInternetCarrier');
            const customInput = document.getElementById('currCarrierCustom');
            const prodInternet = document.getElementById('prodInternet');
            const prodTv = document.getElementById('prodTv');

            if (carrierVal === '기타') {
                customInput.classList.remove('hidden');
                customInput.focus();
            } else {
                customInput.classList.add('hidden');
                customInput.value = '';
            }

            if (carrierVal && carrierVal !== '없음') {
                prodInternet.checked = true;
            } else if (carrierVal === '없음') {
                prodInternet.checked = false;
                prodTv.checked = false;
            }
        }

        function formatCurrency(input) {
            let value = input.value.replace(/[^0-9]/g, '');
            if (value) {
                value = Number(value).toLocaleString();
            }
            input.value = value;
        }

        // 동적 제안 상품 추가/삭제 함수
        let productRowIdCounter = 0;

        function addOfferedProductRow(data = null) {
            productRowIdCounter++;
            const rowId = `offeredRow_${productRowIdCounter}`;
            const container = document.getElementById('offeredProductsContainer');
            
            const div = document.createElement('div');
            div.id = rowId;
            div.className = "p-2.5 bg-slate-50 border border-slate-200 rounded-lg relative space-y-2 offered-row";
            
            div.innerHTML = `
                <div class="flex items-center justify-between">
                    <span class="text-[11px] font-bold text-indigo-600 product-index-label">제안 상품</span>
                    <button type="button" onclick="removeOfferedProductRow('${rowId}')" class="text-rose-500 hover:text-rose-700 text-xs px-1.5 py-0.5 rounded hover:bg-rose-50 transition">
                        <i class="fa-solid fa-trash-can"></i> 삭제
                    </button>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-[10px] text-slate-500 mb-0.5">제안 통신사</label>
                        <select class="sugCarrier w-full px-2 py-1 text-xs bg-white border border-slate-200 rounded-md focus:outline-none" onchange="updateSummary()">
                            <option value="KT" ${data && data.carrier === 'KT' ? 'selected' : ''}>KT</option>
                            <option value="SK브로드밴드" ${data && data.carrier === 'SK브로드밴드' ? 'selected' : ''}>SK브로드밴드</option>
                            <option value="LG유플러스" ${data && data.carrier === 'LG유플러스' ? 'selected' : ''}>LG유플러스</option>
                            <option value="기타" ${data && data.carrier === '기타' ? 'selected' : ''}>기타</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-500 mb-0.5">인터넷 속도</label>
                        <select class="sugInternet w-full px-2 py-1 text-xs bg-white border border-slate-200 rounded-md focus:outline-none" onchange="updateSummary()">
                            <option value="100메가 (와이파이포함)" ${data && data.internet === '100메가 (와이파이포함)' ? 'selected' : ''}>100메가 (와이파이포함)</option>
                            <option value="500메가 (기가인터넷)" ${data && data.internet === '500메가 (기가인터넷)' ? 'selected' : ''}>500메가 (기가인터넷)</option>
                            <option value="1기가 (울트라속도)" ${data && data.internet === '1기가 (울트라속도)' ? 'selected' : ''}>1기가 (울트라속도)</option>
                            <option value="인터넷 제외" ${data && data.internet === '인터넷 제외' ? 'selected' : ''}>인터넷 제외</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-500 mb-0.5">TV 요금제</label>
                        <select class="sugTv w-full px-2 py-1 text-xs bg-white border border-slate-200 rounded-md focus:outline-none" onchange="updateSummary()">
                            <option value="베이직 (일반 채널형)" ${data && data.tv === '베이직 (일반 채널형)' ? 'selected' : ''}>베이직 (일반 채널형)</option>
                            <option value="스탠다드 / 프라임" ${data && data.tv === '스탠다드 / 프라임' ? 'selected' : ''}>스탠다드 / 프라임</option>
                            <option value="넷플릭스 / OTT 패키지" ${data && data.tv === '넷플릭스 / OTT 패키지' ? 'selected' : ''}>넷플릭스 / OTT 패키지</option>
                            <option value="TV 미포함 (단독)" ${data && data.tv === 'TV 미포함 (단독)' ? 'selected' : ''}>TV 미포함 (단독)</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] text-slate-500 mb-0.5">월 요금 (원)</label>
                        <input type="text" class="sugFee w-full px-2 py-1 text-xs bg-white border border-slate-200 rounded-md focus:outline-none text-right" placeholder="예: 38,500" value="${data && data.fee ? data.fee : ''}" oninput="formatCurrency(this); updateSummary()">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-500 mb-0.5">사은품 안내</label>
                        <input type="text" class="sugGift w-full px-2 py-1 text-xs bg-white border border-slate-200 rounded-md focus:outline-none" placeholder="예: 현금 40만원" value="${data && data.gift ? data.gift : ''}" oninput="updateSummary()">
                    </div>
                </div>
            `;
            
            container.appendChild(div);
            updateProductRowLabels();
            updateSummary();
        }

        function removeOfferedProductRow(rowId) {
            const rows = document.querySelectorAll('.offered-row');
            if (rows.length <= 1) {
                showToast('최소 1개의 제안 상품은 유지되어야 합니다.');
                return;
            }
            const rowElem = document.getElementById(rowId);
            if (rowElem) {
                rowElem.remove();
                updateProductRowLabels();
                updateSummary();
            }
        }

        function updateProductRowLabels() {
            const rows = document.querySelectorAll('.offered-row');
            rows.forEach((row, idx) => {
                const label = row.querySelector('.product-index-label');
                if (label) {
                    label.innerText = `제안 상품 #${idx + 1}`;
                }
            });
        }

        // 어드민 연동 수신 로직 (localStorage 또는 URL parameter)
        function checkAdminParamOrStorage() {
            // URL 파라미터 확인 (예: ?admin_data=...)
            const urlParams = new URLSearchParams(window.location.search);
            const adminParam = urlParams.get('admin_data');
            if (adminParam) {
                try {
                    const parsed = JSON.parse(decodeURIComponent(adminParam));
                    applyAdminData(parsed);
                    showToast('어드민 연동 데이터를 URL에서 불러왔습니다.');
                    return;
                } catch(e) {}
            }

            // localStorage 확인 ('isbs_admin_selected_product' 키 가정)
            const adminStorage = localStorage.getItem('isbs_admin_selected_product');
            if (adminStorage) {
                try {
                    const parsed = JSON.parse(adminStorage);
                    // 자동 적용 또는 버튼 클릭 시 적용 가능하도록 준비
                } catch(e) {}
            }
        }

        function loadAdminData() {
            const adminStorage = localStorage.getItem('isbs_admin_selected_product');
            if (!adminStorage) {
                // 샘플 어드민 데이터 생성 시연용 연동
                const sampleData = {
                    carrier: 'KT',
                    internet: '500메가 (기가인터넷)',
                    tv: '베이직 (일반 채널형)',
                    fee: '41,800',
                    gift: '현금 45만원 + 상품권 5만원'
                };
                addOfferedProductRow(sampleData);
                showToast('어드민 연동 샘플 상품이 추가되었습니다.');
                return;
            }

            try {
                const data = JSON.parse(adminStorage);
                addOfferedProductRow(data);
                showToast('어드민 페이지 상품 정보를 불러왔습니다.');
            } catch(e) {
                showToast('어드민 데이터 파싱에 실패했습니다.');
            }
        }

        function applyAdminData(data) {
            addOfferedProductRow(data);
        }

        function updateSummary() {
            const name = document.getElementById('custName').value || '미입력';
            const phone = document.getElementById('custPhone').value || '미입력';
            const date = document.getElementById('consultDate').value.replace('T', ' ') || '미입력';
            
            const mobileCarrier = getSelectedRadioValue('mobileCarrier') || '선택안함';
            
            let internetCarrier = getSelectedRadioValue('currInternetCarrier');
            if (internetCarrier === '기타') {
                const customVal = document.getElementById('currCarrierCustom').value;
                internetCarrier = customVal ? `기타(${customVal})` : '기타';
            }
            internetCarrier = internetCarrier || '선택안함';

            let productList = [];
            if (document.getElementById('prodInternet').checked) productList.push('인터넷');
            if (document.getElementById('prodTv').checked) productList.push('TV');
            if (document.getElementById('prodPhone').checked) productList.push('전화');
            if (document.getElementById('prodWifi').checked) productList.push('와이파이');
            const productType = productList.length > 0 ? productList.join(', ') : '선택없음';

            const currFee = document.getElementById('currFee').value || '0';
            const consultMemo = document.getElementById('consultMemo').value || '없음';

            // Gather all offered products dynamically
            const rows = document.querySelectorAll('.offered-row');
            let offeredSummaryStr = '';
            
            rows.forEach((row, idx) => {
                const sCarrier = row.querySelector('.sugCarrier').value;
                const sInternet = row.querySelector('.sugInternet').value;
                const sTv = row.querySelector('.sugTv').value;
                const sFee = row.querySelector('.sugFee').value || '0';
                const sGift = row.querySelector('.sugGift').value || '없음';
                
                offeredSummaryStr += `[제안 #${idx + 1}]\n`;
                offeredSummaryStr += `- 제안 통신사: ${sCarrier}\n`;
                offeredSummaryStr += `- 인터넷 상품: ${sInternet}\n`;
                offeredSummaryStr += `- TV 상품: ${sTv}\n`;
                offeredSummaryStr += `- 안내 월요금: ${sFee}원\n`;
                offeredSummaryStr += `- 안내 사은품: ${sGift}\n\n`;
            });

            const summaryString = 
`[통신 상담 기록 및 안내 요약]
■ 기본 정보
- 고객명: ${name}
- 연락처: ${phone}
- 상담일시: ${date}

■ 고객 현재 상태
- 명의자휴대폰통신사: ${mobileCarrier}
- 기존 인터넷: ${internetCarrier} (사용 상품: ${productType})
- 기존 월 요금: ${currFee}원

■ 안내한 상품 및 제안 (${rows.length}건)
${offeredSummaryStr.trim()}

■ 상담 메모 및 특이사항
${consultMemo}
`;

            document.getElementById('summaryText').innerText = summaryString;
        }

        function copySummary() {
            const summaryText = document.getElementById('summaryText').innerText;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(summaryText).then(() => {
                    showToast('요약 내용이 클립보드에 복사되었습니다.');
                }).catch(() => fallbackCopyText(summaryText));
            } else {
                fallbackCopyText(summaryText);
            }
        }

        function fallbackCopyText(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('요약 내용이 클립보드에 복사되었습니다.');
            } catch (err) {
                showToast('클립보드 복사 실패');
            }
            document.body.removeChild(textarea);
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-4 right-4 bg-slate-900 text-white px-3 py-2 rounded-lg text-xs font-medium shadow-lg z-50 flex items-center space-x-2';
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i><span>${message}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2200);
        }

        function clearForm() {
            document.getElementById('custName').value = '';
            document.getElementById('custPhone').value = '';
            loadCurrentTime();
            
            document.querySelectorAll('input[name="mobileCarrier"]').forEach(r => r.checked = false);
            document.querySelectorAll('input[name="currInternetCarrier"]').forEach(r => r.checked = false);
            document.getElementById('currCarrierCustom').classList.add('hidden');
            document.getElementById('currCarrierCustom').value = '';

            document.getElementById('prodInternet').checked = false;
            document.getElementById('prodTv').checked = false;
            document.getElementById('prodPhone').checked = false;
            document.getElementById('prodWifi').checked = false;

            document.getElementById('currFee').value = '';
            document.getElementById('consultMemo').value = '';

            // Reset offered products to 1 default row
            const container = document.getElementById('offeredProductsContainer');
            container.innerHTML = '';
            productRowIdCounter = 0;
            addOfferedProductRow();

            updateSummary();
            showToast('초기화되었습니다.');
        }

        function saveToLocalStorage() {
            const formData = {
                custName: document.getElementById('custName').value,
                custPhone: document.getElementById('custPhone').value,
                consultDate: document.getElementById('consultDate').value,
                mobileCarrier: getSelectedRadioValue('mobileCarrier'),
                currInternetCarrier: getSelectedRadioValue('currInternetCarrier'),
                currCarrierCustom: document.getElementById('currCarrierCustom').value,
                prodInternet: document.getElementById('prodInternet').checked,
                prodTv: document.getElementById('prodTv').checked,
                prodPhone: document.getElementById('prodPhone').checked,
                prodWifi: document.getElementById('prodWifi').checked,
                currFee: document.getElementById('currFee').value,
                consultMemo: document.getElementById('consultMemo').value,
                savedAt: new Date().toLocaleString()
            };
            localStorage.setItem('last_consultation', JSON.stringify(formData));
            document.getElementById('saveStatus').innerText = `최근 저장: ${formData.savedAt}`;
            showToast('임시 저장되었습니다.');
        }

        function loadFromLocalStorage() {
            const savedData = localStorage.getItem('last_consultation');
            if (!savedData) {
                showToast('저장된 상담 기록이 없습니다.');
                return;
            }
            const data = JSON.parse(savedData);
            document.getElementById('custName').value = data.custName || '';
            document.getElementById('custPhone').value = data.custPhone || '';
            if (data.consultDate) document.getElementById('consultDate').value = data.consultDate;

            document.querySelectorAll('input[name="mobileCarrier"]').forEach(r => {
                if (r.value === data.mobileCarrier) r.checked = true;
            });

            document.querySelectorAll('input[name="currInternetCarrier"]').forEach(r => {
                if (r.value === data.currInternetCarrier) r.checked = true;
            });
            handleCarrierRadioChange();
            if (data.currCarrierCustom) document.getElementById('currCarrierCustom').value = data.currCarrierCustom;

            document.getElementById('prodInternet').checked = !!data.prodInternet;
            document.getElementById('prodTv').checked = !!data.prodTv;
            document.getElementById('prodPhone').checked = !!data.prodPhone;
            document.getElementById('prodWifi').checked = !!data.prodWifi;

            document.getElementById('currFee').value = data.currFee || '';
            document.getElementById('consultMemo').value = data.consultMemo || '';

            updateSummary();
            showToast('저장된 기록을 불러왔습니다.');
        }

        function checkSavedStatus() {
            const savedData = localStorage.getItem('last_consultation');
            if (savedData) {
                try {
                    const data = JSON.parse(savedData);
                    document.getElementById('saveStatus').innerText = `최근 저장: ${data.savedAt || '기록 있음'}`;
                } catch(e) {}
            }
        }
    </script>
</body>
</html>
